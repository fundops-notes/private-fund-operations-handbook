,"checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"9d626b20177ed7e491933ea771ca57ed5ddde1a5e37ac27fd02928615a3b6e32"},{"id":"datasecurity","title":"中华人民共和国数据安全法","level":"法律","issuer":"全国人大常委会","version":"2021年通过","effective":"2021-09-01","scope":"通用","topics":["数据治理","安全","事件处置"],"overview":"数据安全不限于个人信息，也覆盖业务与交易数据。分类分级、全流程安全、风险监测及事件处置需要落实到运营数据链。","practice":"将数据分类、权限、备份、供应商交付、异常报告嵌入日常SOP；重要数据识别和跨境安排还需结合配套规则。","priority":[2,21,27,29,30,31],"articles":[{"n":1,"label":"第一条","chapter":"第一章　总　　则","text":"为了规范数据处理活动，保障数据安全，促进数据开发利用，保护个人、组织的合法权益，维护国家主权、安全和发展利益，制定本法。"},{"n":2,"label":"第二条","chapter":"第一章　总　　则","text":"在中华人民共和国境内开展数据处理活动及其安全监管，适用本法。\n\n在中华人民共和国境外开展数据处理活动，损害中华人民共和国国家安全、公共利益或者公民、组织合法权益的，依法追究法律责任。"},{"n":3,"label":"第三条","chapter":"第一章　总　　则","text":"本法所称数据，是指任何以电子或者其他方式对信息的记录。\n\n数据处理，包括数据的收集、存储、使用、加工、传输、提供、公开等。\n数据安全，是指通过采取必要措施，确保数据处于有效保护和合法利用的状态，以及具备保障持续安全状态的能力。"},{"n":4,"label":"第四条","chapter":"第一章　总　　则","text":"维护数据安全，应当坚持总体国家安全观，建立健全数据安全治理体系，提高数据安全保障能力。"},{"n":5,"label":"第五条","chapter":"第一章　总　　则","text":"中央国家安全领导机构负责国家数据安全工作的决策和议事协调，研究制定、指导实施国家数据安全战略和有关重大方针政策，统筹协调国家数据安全的重大事项和重要工作，建立国家数据安全工作协调机制。"},{"n":6,"label":"第六条","chapter":"第一章　总　　则","text":"各地区、各部门对本地区、本部门工作中收集和产生的数据及数据安全负责。\n\n工业、电信、交通、金融、自然资源、卫生健康、教育、科技等主管部门承担本行业、本领域数据安全监管职责。\n\n公安机关、国家安全机关等依照本法和有关法律、行政法规的规定，在各自职责范围内承担数据安全监管职责。\n\n国家网信部门依照本法和有关法律、行政法规的规定，负责统筹协调网络数据安全和相关监管工作。"},{"n":7,"label":"第七条","chapter":"第一章　总　　则","text":"国家保护个人、组织与数据有关的权益，鼓励数据依法合理有效利用，保障数据依法有序自由流动，促进以数据为关键要素的数字经济发展。"},{"n":8,"label":"第八条","chapter":"第一章　总　　则","text":"开展数据处理活动，应当遵守法律、法规，尊重社会公德和伦理，遵守商业道德和职业道德，诚实守信，履行数据安全保护义务，承担社会责任，不得危害国家安全、公共利益，不得损害个人、组织的合法权益。"},{"n":9,"label":"第九条","chapter":"第一章　总　　则","text":"国家支持开展数据安全知识宣传普及，提高全社会的数据安全保护意识和水平，推动有关部门、行业组织、科研机构、企业、个人等共同参与数据安全保护工作，形成全社会共同维护数据安全和促进发展的良好环境。"},{"n":10,"label":"第十条","chapter":"第一章　总　　则","text":"相关行业组织按照章程，依法制定数据安全行为规范和团体标准，加强行业自律，指导会员加强数据安全保护，提高数据安全保护水平，促进行业健康发展。"},{"n":11,"label":"第十一条","chapter":"第一章　总　　则","text":"国家积极开展数据安全治理、数据开发利用等领域的国际交流与合作，参与数据安全相关国际规则和标准的制定，促进数据跨境安全、自由流动。"},{"n":12,"label":"第十二条","chapter":"第一章　总　　则","text":"任何个人、组织都有权对违反本法规定的行为向有关主管部门投诉、举报。收到投诉、举报的部门应当及时依法处理。\n\n有关主管部门应当对投诉、举报人的相关信息予以保密，保护投诉、举报人的合法权益。"},{"n":13,"label":"第十三条","chapter":"第二章　数据安全与发展","text":"国家统筹发展和安全，坚持以数据开发利用和产业发展促进数据安全，以数据安全保障数据开发利用和产业发展。"},{"n":14,"label":"第十四条","chapter":"第二章　数据安全与发展","text":"国家实施大数据战略，推进数据基础设施建设，鼓励和支持数据在各行业、各领域的创新应用。\n\n省级以上人民政府应当将数字经济发展纳入本级国民经济和社会发展规划，并根据需要制定数字经济发展规划。"},{"n":15,"label":"第十五条","chapter":"第二章　数据安全与发展","text":"国家支持开发利用数据提升公共服务的智能化水平。提供智能化公共服务，应当充分考虑老年人、残疾人的需求，避免对老年人、残疾人的日常生活造成障碍。"},{"n":16,"label":"第十六条","chapter":"第二章　数据安全与发展","text":"国家支持数据开发利用和数据安全技术研究，鼓励数据开发利用和数据安全等领域的技术推广和商业创新，培育、发展数据开发利用和数据安全产品、产业体系。"},{"n":17,"label":"第十七条","chapter":"第二章　数据安全与发展","text":"国家推进数据开发利用技术和数据安全标准体系建设。国务院标准化行政主管部门和国务院有关部门根据各自的职责，组织制定并适时修订有关数据开发利用技术、产品和数据安全相关标准。国家支持企业、社会团体和教育、科研机构等参与标准制定。"},{"n":18,"label":"第十八条","chapter":"第二章　数据安全与发展","text":"国家促进数据安全检测评估、认证等服务的发展，支持数据安全检测评估、认证等专业机构依法开展服务活动。\n国家支持有关部门、行业组织、企业、教育和科研机构、有关专业机构等在数据安全风险评估、防范、处置等方面开展协作。"},{"n":19,"label":"第十九条","chapter":"第二章　数据安全与发展","text":"国家建立健全数据交易管理制度，规范数据交易行为，培育数据交易市场。"},{"n":20,"label":"第二十条","chapter":"第二章　数据安全与发展","text":"国家支持教育、科研机构和企业等开展数据开发利用技术和数据安全相关教育和培训，采取多种方式培养数据开发利用技术和数据安全专业人才，促进人才交流。"},{"n":21,"label":"第二十一条","chapter":"第三章　数据安全制度","text":"国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。国家数据安全工作协调机制统筹协调有关部门制定重要数据目录，加强对重要数据的保护。\n\n关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。\n\n各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门以及相关行业、领域的重要数据具体目录，对列入目录的数据进行重点保护。"},{"n":22,"label":"第二十二条","chapter":"第三章　数据安全制度","text":"国家建立集中统一、高效权威的数据安全风险评估、报告、信息共享、监测预警机制。国家数据安全工作协调机制统筹协调有关部门加强数据安全风险信息的获取、分析、研判、预警工作。"},{"n":23,"label":"第二十三条","chapter":"第三章　数据安全制度","text":"国家建立数据安全应急处置机制。发生数据安全事件，有关主管部门应当依法启动应急预案，采取相应的应急处置措施，防止危害扩大，消除安全隐患，并及时向社会发布与公众有关的警示信息。"},{"n":24,"label":"第二十四条","chapter":"第三章　数据安全制度","text":"国家建立数据安全审查制度，对影响或者可能影响国家安全的数据处理活动进行国家安全审查。\n\n依法作出的安全审查决定为最终决定。"},{"n":25,"label":"第二十五条","chapter":"第三章　数据安全制度","text":"国家对与维护国家安全和利益、履行国际义务相关的属于管制物项的数据依法实施出口管制。"},{"n":26,"label":"第二十六条","chapter":"第三章　数据安全制度","text":"任何国家或者地区在与数据和数据开发利用技术等有关的投资、贸易等方面对中华人民共和国采取歧视性的禁止、限制或者其他类似措施的，中华人民共和国可以根据实际情况对该国家或者地区对等采取措施。"},{"n":27,"label":"第二十七条","chapter":"第四章　数据安全保护义务","text":"开展数据处理活动应当依照法律、法规的规定，建立健全全流程数据安全管理制度，组织开展数据安全教育培训，采取相应的技术措施和其他必要措施，保障数据安全。利用互联网等信息网络开展数据处理活动，应当在网络安全等级保护制度的基础上，履行上述数据安全保护义务。\n\n重要数据的处理者应当明确数据安全负责人和管理机构，落实数据安全保护责任。"},{"n":28,"label":"第二十八条","chapter":"第四章　数据安全保护义务","text":"开展数据处理活动以及研究开发数据新技术，应当有利于促进经济社会发展，增进人民福祉，符合社会公德和伦理。"},{"n":29,"label":"第二十九条","chapter":"第四章　数据安全保护义务","text":"开展数据处理活动应当加强风险监测，发现数据安全缺陷、漏洞等风险时，应当立即采取补救措施；发生数据安全事件时，应当立即采取处置措施，按照规定及时告知用户并向有关主管部门报告。"},{"n":30,"label":"第三十条","chapter":"第四章　数据安全保护义务","text":"重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送风险评估报告。\n\n风险评估报告应当包括处理的重要数据的种类、数量，开展数据处理活动的情况，面临的数据安全风险及其应对措施等。"},{"n":31,"label":"第三十一条","chapter":"第四章　数据安全保护义务","text":"关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理，适用《中华人民共和国网络安全法》的规定；其他数据处理者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理办法，由国家网信部门会同国务院有关部门制定。"},{"n":32,"label":"第三十二条","chapter":"第四章　数据安全保护义务","text":"任何组织、个人收集数据，应当采取合法、正当的方式，不得窃取或者以其他非法方式获取数据。\n\n法律、行政法规对收集、使用数据的目的、范围有规定的，应当在法律、行政法规规定的目的和范围内收集、使用数据。"},{"n":33,"label":"第三十三条","chapter":"第四章　数据安全保护义务","text":"从事数据交易中介服务的机构提供服务，应当要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交易记录。"},{"n":34,"label":"第三十四条","chapter":"第四章　数据安全保护义务","text":"法律、行政法规规定提供数据处理相关服务应当取得行政许可的，服务提供者应当依法取得许可。"},{"n":35,"label":"第三十五条","chapter":"第四章　数据安全保护义务","text":"公安机关、国家安全机关因依法维护国家安全或者侦查犯罪的需要调取数据，应当按照国家有关规定，经过严格的批准手续，依法进行，有关组织、个人应当予以配合。"},{"n":36,"label":"第三十六条","chapter":"第四章　数据安全保护义务","text":"中华人民共和国主管机关根据有关法律和中华人民共和国缔结或者参加的国际条约、协定，或者按照平等互惠原则，处理外国司法或者执法机构关于提供数据的请求。非经中华人民共和国主管机关批准，境内的组织、个人不得向外国司法或者执法机构提供存储于中华人民共和国境内的数据。"},{"n":37,"label":"第三十七条","chapter":"第五章　政务数据安全与开放","text":"国家大力推进电子政务建设，提高政务数据的科学性、准确性、时效性，提升运用数据服务经济社会发展的能力。"},{"n":38,"label":"第三十八条","chapter":"第五章　政务数据安全与开放","text":"国家机关为履行法定职责的需要收集、使用数据，应当在其履行法定职责的范围内依照法律、行政法规规定的条件和程序进行；对在履行职责中知悉的个人隐私、个人信息、商业秘密、保密商务信息等数据应当依法予以保密，不得泄露或者非法向他人提供。"},{"n":39,"label":"第三十九条","chapter":"第五章　政务数据安全与开放","text":"国家机关应当依照法律、行政法规的规定，建立健全数据安全管理制度，落实数据安全保护责任，保障政务数据安全。"},{"n":40,"label":"第四十条","chapter":"第五章　政务数据安全与开放","text":"国家机关委托他人建设、维护电子政务系统，存储、加工政务数据，应当经过严格的批准程序，并应当监督受托方履行相应的数据安全保护义务。受托方应当依照法律、法规的规定和合同约定履行数据安全保护义务，不得擅自留存、使用、泄露或者向他人提供政务数据。"},{"n":41,"label":"第四十一条","chapter":"第五章　政务数据安全与开放","text":"国家机关应当遵循公正、公平、便民的原则，按照规定及时、准确地公开政务数据。依法不予公开的除外。"},{"n":42,"label":"第四十二条","chapter":"第五章　政务数据安全与开放","text":"国家制定政务数据开放目录，构建统一规范、互联互通、安全可控的政务数据开放平台，推动政务数据开放利用。"},{"n":43,"label":"第四十三条","chapter":"第五章　政务数据安全与开放","text":"法律、法规授权的具有管理公共事务职能的组织为履行法定职责开展数据处理活动，适用本章规定。"},{"n":44,"label":"第四十四条","chapter":"第六章　法律责任","text":"有关主管部门在履行数据安全监管职责中，发现数据处理活动存在较大安全风险的，可以按照规定的权限和程序对有关组织、个人进行约谈，并要求有关组织、个人采取措施进行整改，消除隐患。"},{"n":45,"label":"第四十五条","chapter":"第六章　法律责任","text":"开展数据处理活动的组织、个人不履行本法第二十七条、第二十九条、第三十条规定的数据安全保护义务的，由有关主管部门责令改正，给予警告，可以并处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；拒不改正或者造成大量数据泄露等严重后果的，处五十万元以上二百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五万元以上二十万元以下罚款。\n\n违反国家核心数据管理制度，危害国家主权、安全和发展利益的，由有关主管部门处二百万元以上一千万元以下罚款，并根据情况责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照；构成犯罪的，依法追究刑事责任。"},{"n":46,"label":"第四十六条","chapter":"第六章　法律责任","text":"违反本法第三十一条规定，向境外提供重要数据的，由有关主管部门责令改正，给予警告，可以并处十万元以上一百万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；情节严重的，处一百万元以上一千万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处十万元以上一百万元以下罚款。"},{"n":47,"label":"第四十七条","chapter":"第六章　法律责任","text":"从事数据交易中介服务的机构未履行本法第三十三条规定的义务的，由有关主管部门责令改正，没收违法所得，处违法所得一倍以上十倍以下罚款，没有违法所得或者违法所得不足十万元的，处十万元以上一百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。"},{"n":48,"label":"第四十八条","chapter":"第六章　法律责任","text":"违反本法第三十五条规定，拒不配合数据调取的，由有关主管部门责令改正，给予警告，并处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。\n违反本法第三十六条规定，未经主管机关批准向外国司法或者执法机构提供数据的，由有关主管部门给予警告，可以并处十万元以上一百万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；造成严重后果的，处一百万元以上五百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五万元以上五十万元以下罚款。"},{"n":49,"label":"第四十九条","chapter":"第六章　法律责任","text":"国家机关不履行本法规定的数据安全保护义务的，对直接负责的主管人员和其他直接责任人员依法给予处分。"},{"n":50,"label":"第五十条","chapter":"第六章　法律责任","text":"履行数据安全监管职责的国家工作人员玩忽职守、滥用职权、徇私舞弊的，依法给予处分。"},{"n":51,"label":"第五十一条","chapter":"第六章　法律责任","text":"窃取或者以其他非法方式获取数据，开展数据处理活动排除、限制竞争，或者损害个人、组织合法权益的，依照有关法律、行政法规的规定处罚。"},{"n":52,"label":"第五十二条","chapter":"第六章　法律责任","text":"违反本法规定，给他人造成损害的，依法承担民事责任。\n\n违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"n":53,"label":"第五十三条","chapter":"第七章　附　　则","text":"开展涉及国家秘密的数据处理活动，适用《中华人民共和国保守国家秘密法》等法律、行政法规的规定。\n\n在统计、档案工作中开展数据处理活动，开展涉及个人信息的数据处理活动，还应当遵守有关法律、行政法规的规定。"},{"n":54,"label":"第五十四条","chapter":"第七章　附　　则","text":"军事数据安全保护的办法，由中央军事委员会依据本法另行制定。"},{"n":55,"label":"第五十五条","chapter":"第七章　附　　则","text":"本法自2021年9月1日起施行。"}],"source":"https://www.beijing.gov.cn/zhengce/zhengcefagui/202106/t20210611_2411285.html","textSource":"https://www.beijing.gov.cn/zhengce/zhengcefagui/202106/t20210611_2411285.html","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"cb35d3d23f4940e343b765d21e7f9899ec015ea2d901580dc7ecb4147330385f"},{"id":"ordinance","title":"私募投资基金监督管理条例","level":"行政法规","issuer":"国务院","version":"国务院令第762号 / 2023","effective":"2023-09-01","scope":"通用","topics":["制度总览","募投管退","主体责任"],"overview":"覆盖境内私募证券、股权及创业投资基金业务的核心行政法规。管理人、托管人和服务机构各有职责，不能通过内部职责表相互替代。","practice":"从主体职责出发，把募集、备案、投资管理、关联交易、审计、信息提供和重大风险处置映射到控制证据。","priority":[2,4,11,15,18,19,22,26,27,28,29,31,33,34],"articles":[{"n":1,"label":"第一条","chapter":"第一章　总　　则","text":"为了规范私募投资基金（以下简称私募基金）业务活动，保护投资者以及相关当事人的合法权益，促进私募基金行业规范健康发展，根据《中华人民共和国证券投资基金法》（以下简称《证券投资基金法》）、《中华人民共和国信托法》、《中华人民共和国公司法》、《中华人民共和国合伙企业法》等法律，制定本条例。"},{"n":2,"label":"第二条","chapter":"第一章　总　　则","text":"在中华人民共和国境内，以非公开方式募集资金，设立投资基金或者以进行投资活动为目的依法设立公司、合伙企业，由私募基金管理人或者普通合伙人管理，为投资者的利益进行投资活动，适用本条例。"},{"n":3,"label":"第三条","chapter":"第一章　总　　则","text":"国家鼓励私募基金行业规范健康发展，发挥服务实体经济、促进科技创新等功能作用。\n从事私募基金业务活动，应当遵循自愿、公平、诚信原则，保护投资者合法权益，不得违反法律、行政法规和国家政策，不得违背公序良俗，不得损害国家利益、社会公共利益和他人合法权益。\n\n私募基金管理人管理、运用私募基金财产，私募基金托管人托管私募基金财产，私募基金服务机构从事私募基金服务业务，应当遵守法律、行政法规规定，恪尽职守，履行诚实守信、谨慎勤勉的义务。\n\n私募基金从业人员应当遵守法律、行政法规规定，恪守职业道德和行为规范，按照规定接受合规和专业能力培训。"},{"n":4,"label":"第四条","chapter":"第一章　总　　则","text":"私募基金财产独立于私募基金管理人、私募基金托管人的固有财产。私募基金财产的债务由私募基金财产本身承担，但法律另有规定的除外。\n\n投资者按照基金合同、公司章程、合伙协议（以下统称基金合同）约定分配收益和承担风险。"},{"n":5,"label":"第五条","chapter":"第一章　总　　则","text":"私募基金业务活动的监督管理，应当贯彻党和国家路线方针政策、决策部署。国务院证券监督管理机构依照法律和本条例规定对私募基金业务活动实施监督管理，其派出机构依照授权履行职责。\n\n国家对运用一定比例政府资金发起设立或者参股的私募基金的监督管理另有规定的，从其规定。"},{"n":6,"label":"第六条","chapter":"第一章　总　　则","text":"国务院证券监督管理机构根据私募基金管理人业务类型、管理资产规模、持续合规情况、风险控制情况和服务投资者能力等，对私募基金管理人实施差异化监督管理，并对创业投资等股权投资、证券投资等不同类型的私募基金实施分类监督管理。"},{"n":7,"label":"第七条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金管理人由依法设立的公司或者合伙企业担任。\n\n以合伙企业形式设立的私募基金，资产由普通合伙人管理的，普通合伙人适用本条例关于私募基金管理人的规定。\n\n私募基金管理人的股东、合伙人以及股东、合伙人的控股股东、实际控制人，控股或者实际控制其他私募基金管理人的，应当符合国务院证券监督管理机构的规定。"},{"n":8,"label":"第八条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"有下列情形之一的，不得担任私募基金管理人，不得成为私募基金管理人的控股股东、实际控制人或者普通合伙人：\n\n（一）本条例第九条规定的情形；\n\n（二）因本条例第十四条第一款第三项所列情形被注销登记，自被注销登记之日起未逾3年的私募基金管理人，或者为该私募基金管理人的控股股东、实际控制人、普通合伙人；\n\n（三）从事的业务与私募基金管理存在利益冲突；\n\n（四）有严重不良信用记录尚未修复。"},{"n":9,"label":"第九条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"有下列情形之一的，不得担任私募基金管理人的董事、监事、高级管理人员、执行事务合伙人或者委派代表：\n\n（一）因犯有贪污贿赂、渎职、侵犯财产罪或者破坏社会主义市场经济秩序罪，被判处刑罚；\n\n（二）最近3年因重大违法违规行为被金融管理部门处以行政处罚；\n\n（三）对所任职的公司、企业因经营不善破产清算或者因违法被吊销营业执照负有个人责任的董事、监事、厂长、高级管理人员、执行事务合伙人或者委派代表，自该公司、企业破产清算终结或者被吊销营业执照之日起未逾5年；\n\n（四）所负债务数额较大，到期未清偿或者被纳入失信被执行人名单；\n\n（五）因违法行为被开除的基金管理人、基金托管人、证券期货交易场所、证券公司、证券登记结算机构、期货公司以及其他机构的从业人员和国家机关工作人员；\n\n（六）因违法行为被吊销执业证书或者被取消资格的律师、注册会计师和资产评估机构、验证机构的从业人员、投资咨询从业人员，自被吊销执业证书或者被取消资格之日起未逾5年；\n（七）担任因本条例第十四条第一款第三项所列情形被注销登记的私募基金管理人的法定代表人、执行事务合伙人或者委派代表，或者负有责任的高级管理人员，自该私募基金管理人被注销登记之日起未逾3年。"},{"n":10,"label":"第十条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金管理人应当依法向国务院证券监督管理机构委托的机构（以下称登记备案机构）报送下列材料，履行登记手续：\n\n（一）统一社会信用代码；\n\n（二）公司章程或者合伙协议；\n\n（三）股东、实际控制人、董事、监事、高级管理人员，普通合伙人、执行事务合伙人或者委派代表的基本信息，股东、实际控制人、合伙人相关受益所有人信息；\n\n（四）保证报送材料真实、准确、完整和遵守监督管理规定的信用承诺书；\n\n（五）国务院证券监督管理机构规定的其他材料。\n\n私募基金管理人的控股股东、实际控制人、普通合伙人、执行事务合伙人或者委派代表等重大事项发生变更的，应当按照规定向登记备案机构履行变更登记手续。\n\n登记备案机构应当公示已办理登记的私募基金管理人相关信息。\n\n未经登记，任何单位或者个人不得使用“基金”或者“基金管理”字样或者近似名称进行投资活动，但法律、行政法规和国家另有规定的除外。"},{"n":11,"label":"第十一条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金管理人应当履行下列职责：\n\n（一）依法募集资金，办理私募基金备案；\n\n（二）对所管理的不同私募基金财产分别管理、分别记账，进行投资；\n\n（三）按照基金合同约定管理私募基金并进行投资，建立有效的风险控制制度；\n\n（四）按照基金合同约定确定私募基金收益分配方案，向投资者分配收益；\n\n（五）按照基金合同约定向投资者提供与私募基金管理业务活动相关的信息；\n\n（六）保存私募基金财产管理业务活动的记录、账册、报表和其他有关资料；\n\n（七）国务院证券监督管理机构规定和基金合同约定的其他职责。\n\n以非公开方式募集资金设立投资基金的，私募基金管理人还应当以自己的名义，为私募基金财产利益行使诉讼权利或者实施其他法律行为。"},{"n":12,"label":"第十二条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金管理人的股东、实际控制人、合伙人不得有下列行为：\n\n（一）虚假出资、抽逃出资、委托他人或者接受他人委托出资；\n\n（二）未经股东会或者董事会决议等法定程序擅自干预私募基金管理人的业务活动；\n\n（三）要求私募基金管理人利用私募基金财产为自己或者他人牟取利益，损害投资者利益；\n（四）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。"},{"n":13,"label":"第十三条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金管理人应当持续符合下列要求：\n\n（一）财务状况良好，具有与业务类型和管理资产规模相适应的运营资金；\n\n（二）法定代表人、执行事务合伙人或者委派代表、负责投资管理的高级管理人员按照国务院证券监督管理机构规定持有一定比例的私募基金管理人的股权或者财产份额，但国家另有规定的除外；\n\n（三）国务院证券监督管理机构规定的其他要求。"},{"n":14,"label":"第十四条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金管理人有下列情形之一的，登记备案机构应当及时注销私募基金管理人登记并予以公示：\n\n（一）自行申请注销登记；\n\n（二）依法解散、被依法撤销或者被依法宣告破产；\n\n（三）因非法集资、非法经营等重大违法行为被追究法律责任；\n\n（四）登记之日起12个月内未备案首只私募基金；\n\n（五）所管理的私募基金全部清算后，自清算完毕之日起12个月内未备案新的私募基金；\n\n（六）国务院证券监督管理机构规定的其他情形。\n\n登记备案机构注销私募基金管理人登记前，应当通知私募基金管理人清算私募基金财产或者依法将私募基金管理职责转移给其他经登记的私募基金管理人。"},{"n":15,"label":"第十五条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"除基金合同另有约定外，私募基金财产应当由私募基金托管人托管。私募基金财产不进行托管的，应当明确保障私募基金财产安全的制度措施和纠纷解决机制。"},{"n":16,"label":"第十六条","chapter":"第二章　私募基金管理人和私募基金托管人","text":"私募基金财产进行托管的，私募基金托管人应当依法履行职责。\n\n私募基金托管人应当依法建立托管业务和其他业务的隔离机制，保证私募基金财产的独立和安全。"},{"n":17,"label":"第十七条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人应当自行募集资金，不得委托他人募集资金，但国务院证券监督管理机构另有规定的除外。"},{"n":18,"label":"第十八条","chapter":"第三章　资金募集和投资运作","text":"私募基金应当向合格投资者募集或者转让，单只私募基金的投资者累计不得超过法律规定的人数。私募基金管理人不得采取为单一融资项目设立多只私募基金等方式，突破法律规定的人数限制；不得采取将私募基金份额或者收益权进行拆分转让等方式，降低合格投资者标准。\n\n前款所称合格投资者，是指达到规定的资产规模或者收入水平，并且具备相应的风险识别能力和风险承担能力，其认购金额不低于规定限额的单位和个人。\n\n合格投资者的具体标准由国务院证券监督管理机构规定。"},{"n":19,"label":"第十九条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人应当向投资者充分揭示投资风险，根据投资者的风险识别能力和风险承担能力匹配不同风险等级的私募基金产品。"},{"n":20,"label":"第二十条","chapter":"第三章　资金募集和投资运作","text":"私募基金不得向合格投资者以外的单位和个人募集或者转让；不得向为他人代持的投资者募集或者转让；不得通过报刊、电台、电视台、互联网等大众传播媒介，电话、短信、即时通讯工具、电子邮件、传单，或者讲座、报告会、分析会等方式向不特定对象宣传推介；不得以虚假、片面、夸大等方式宣传推介；不得以私募基金托管人名义宣传推介；不得向投资者承诺投资本金不受损失或者承诺最低收益。"},{"n":21,"label":"第二十一条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人运用私募基金财产进行投资的，在以私募基金管理人名义开立账户、列入所投资企业股东名册或者持有其他私募基金财产时，应当注明私募基金名称。"},{"n":22,"label":"第二十二条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人应当自私募基金募集完毕之日起20个工作日内，向登记备案机构报送下列材料，办理备案：\n\n（一）基金合同；\n\n（二）托管协议或者保障私募基金财产安全的制度措施；\n\n（三）私募基金财产证明文件；\n\n（四）投资者的基本信息、认购金额、持有基金份额的数量及其受益所有人相关信息；\n（五）国务院证券监督管理机构规定的其他材料。\n\n私募基金应当具有保障基本投资能力和抗风险能力的实缴募集资金规模。登记备案机构根据私募基金的募集资金规模等情况实施分类公示，对募集的资金总额或者投资者人数达到规定标准的，应当向国务院证券监督管理机构报告。"},{"n":23,"label":"第二十三条","chapter":"第三章　资金募集和投资运作","text":"国务院证券监督管理机构应当建立健全私募基金监测机制，对私募基金及其投资者份额持有情况等进行集中监测，具体办法由国务院证券监督管理机构规定。"},{"n":24,"label":"第二十四条","chapter":"第三章　资金募集和投资运作","text":"私募基金财产的投资包括买卖股份有限公司股份、有限责任公司股权、债券、基金份额、其他证券及其衍生品种以及符合国务院证券监督管理机构规定的其他投资标的。\n\n私募基金财产不得用于经营或者变相经营资金拆借、贷款等业务。私募基金管理人不得以要求地方人民政府承诺回购本金等方式变相增加政府隐性债务。"},{"n":25,"label":"第二十五条","chapter":"第三章　资金募集和投资运作","text":"私募基金的投资层级应当遵守国务院金融管理部门的规定。但符合国务院证券监督管理机构规定条件，将主要基金财产投资于其他私募基金的私募基金不计入投资层级。\n\n创业投资基金、本条例第五条第二款规定私募基金的投资层级，由国务院有关部门规定。"},{"n":26,"label":"第二十六条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人应当遵循专业化管理原则，聘用具有相应从业经历的高级管理人员负责投资管理、风险控制、合规等工作。\n\n私募基金管理人应当遵循投资者利益优先原则，建立从业人员投资申报、登记、审查、处置等管理制度，防范利益输送和利益冲突。"},{"n":27,"label":"第二十七条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人不得将投资管理职责委托他人行使。\n\n私募基金管理人委托其他机构为私募基金提供证券投资建议服务的，接受委托的机构应当为《证券投资基金法》规定的基金投资顾问机构。"},{"n":28,"label":"第二十八条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人应当建立健全关联交易管理制度，不得以私募基金财产与关联方进行不正当交易或者利益输送，不得通过多层嵌套或者其他方式进行隐瞒。\n\n私募基金管理人运用私募基金财产与自己、投资者、所管理的其他私募基金、其实际控制人控制的其他私募基金管理人管理的私募基金，或者与其有重大利害关系的其他主体进行交易的，应当履行基金合同约定的决策程序，并及时向投资者和私募基金托管人提供相关信息。"},{"n":29,"label":"第二十九条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人应当按照规定聘请会计师事务所对私募基金财产进行审计，向投资者提供审计结果，并报送登记备案机构。"},{"n":30,"label":"第三十条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人、私募基金托管人及其从业人员不得有下列行为：\n\n（一）将其固有财产或者他人财产混同于私募基金财产；\n\n（二）利用私募基金财产或者职务便利，为投资者以外的人牟取利益；\n\n（三）侵占、挪用私募基金财产；\n\n（四）泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的证券、期货交易活动；\n\n（五）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。"},{"n":31,"label":"第三十一条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人在资金募集、投资运作过程中，应当按照国务院证券监督管理机构的规定和基金合同约定，向投资者提供信息。\n\n私募基金财产进行托管的，私募基金管理人应当按照国务院证券监督管理机构的规定和托管协议约定，及时向私募基金托管人提供投资者基本信息、投资标的权属变更证明材料等信息。"},{"n":32,"label":"第三十二条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人、私募基金托管人及其从业人员提供、报送的信息应当真实、准确、完整，不得有下列行为：\n\n（一）虚假记载、误导性陈述或者重大遗漏；\n\n（二）对投资业绩进行预测；\n\n（三）向投资者承诺投资本金不受损失或者承诺最低收益；\n（四）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。"},{"n":33,"label":"第三十三条","chapter":"第三章　资金募集和投资运作","text":"私募基金管理人、私募基金托管人、私募基金服务机构应当按照国务院证券监督管理机构的规定，向登记备案机构报送私募基金投资运作等信息。登记备案机构应当根据不同私募基金类型，对报送信息的内容、频次等作出规定，并汇总分析私募基金行业情况，向国务院证券监督管理机构报送私募基金行业相关信息。\n\n登记备案机构应当加强风险预警，发现可能存在重大风险的，及时采取措施并向国务院证券监督管理机构报告。\n\n登记备案机构应当对本条第一款规定的信息保密，除法律、行政法规另有规定外，不得对外提供。"},{"n":34,"label":"第三十四条","chapter":"第三章　资金募集和投资运作","text":"因私募基金管理人无法正常履行职责或者出现重大风险等情形，导致私募基金无法正常运作、终止的，由基金合同约定或者有关规定确定的其他专业机构，行使更换私募基金管理人、修改或者提前终止基金合同、组织私募基金清算等职权。"},{"n":35,"label":"第三十五条","chapter":"第四章　关于创业投资基金的特别规定","text":"本条例所称创业投资基金，是指符合下列条件的私募基金：\n\n（一）投资范围限于未上市企业，但所投资企业上市后基金所持股份的未转让部分及其配售部分除外；\n（二）基金名称包含“创业投资基金”字样，或者在公司、合伙企业经营范围中包含“从事创业投资活动”字样；\n\n（三）基金合同体现创业投资策略；\n\n（四）不使用杠杆融资，但国家另有规定的除外；\n\n（五）基金最低存续期限符合国家有关规定；\n\n（六）国家规定的其他条件。"},{"n":36,"label":"第三十六条","chapter":"第四章　关于创业投资基金的特别规定","text":"国家对创业投资基金给予政策支持，鼓励和引导其投资成长性、创新性创业企业，鼓励长期资金投资于创业投资基金。\n\n国务院发展改革部门负责组织拟定促进创业投资基金发展的政策措施。国务院证券监督管理机构和国务院发展改革部门建立健全信息和支持政策共享机制，加强创业投资基金监督管理政策和发展政策的协同配合。登记备案机构应当及时向国务院证券监督管理机构和国务院发展改革部门报送与创业投资基金相关的信息。\n\n享受国家政策支持的创业投资基金，其投资应当符合国家有关规定。"},{"n":37,"label":"第三十七条","chapter":"第四章　关于创业投资基金的特别规定","text":"国务院证券监督管理机构对创业投资基金实施区别于其他私募基金的差异化监督管理：\n\n（一）优化创业投资基金营商环境，简化登记备案手续；\n（二）对合法募资、合规投资、诚信经营的创业投资基金在资金募集、投资运作、风险监测、现场检查等方面实施差异化监督管理，减少检查频次；\n\n（三）对主要从事长期投资、价值投资、重大科技成果转化的创业投资基金在投资退出等方面提供便利。"},{"n":38,"label":"第三十八条","chapter":"第四章　关于创业投资基金的特别规定","text":"登记备案机构在登记备案、事项变更等方面对创业投资基金实施区别于其他私募基金的差异化自律管理。"},{"n":39,"label":"第三十九条","chapter":"第五章　监督管理","text":"国务院证券监督管理机构对私募基金业务活动实施监督管理，依法履行下列职责：\n\n（一）制定有关私募基金业务活动监督管理的规章、规则；\n\n（二）对私募基金管理人、私募基金托管人以及其他机构从事私募基金业务活动进行监督管理，对违法行为进行查处；\n\n（三）对登记备案和自律管理活动进行指导、检查和监督；\n\n（四）法律、行政法规规定的其他职责。"},{"n":40,"label":"第四十条","chapter":"第五章　监督管理","text":"国务院证券监督管理机构依法履行职责，有权采取下列措施：\n\n（一）对私募基金管理人、私募基金托管人、私募基金服务机构进行现场检查，并要求其报送有关业务资料；\n\n（二）进入涉嫌违法行为发生场所调查取证；\n（三）询问当事人和与被调查事件有关的单位和个人，要求其对与被调查事件有关的事项作出说明；\n\n（四）查阅、复制与被调查事件有关的财产权登记、通讯记录等资料；\n\n（五）查阅、复制当事人和与被调查事件有关的单位和个人的证券交易记录、登记过户记录、财务会计资料以及其他有关文件和资料；对可能被转移、隐匿或者毁损的文件和资料，可以予以封存；\n\n（六）依法查询当事人和与被调查事件有关的账户信息；\n\n（七）法律、行政法规规定的其他措施。\n\n为防范私募基金风险，维护市场秩序，国务院证券监督管理机构可以采取责令改正、监管谈话、出具警示函等措施。"},{"n":41,"label":"第四十一条","chapter":"第五章　监督管理","text":"国务院证券监督管理机构依法进行监督检查或者调查时，监督检查或者调查人员不得少于2人，并应当出示执法证件和监督检查、调查通知书或者其他执法文书。对监督检查或者调查中知悉的商业秘密、个人隐私，依法负有保密义务。\n\n被检查、调查的单位和个人应当配合国务院证券监督管理机构依法进行的监督检查或者调查，如实提供有关文件和资料，不得拒绝、阻碍和隐瞒。"},{"n":42,"label":"第四十二条","chapter":"第五章　监督管理","text":"国务院证券监督管理机构发现私募基金管理人违法违规，或者其内部治理结构和风险控制管理不符合规定的，应当责令限期改正；逾期未改正，或者行为严重危及该私募基金管理人的稳健运行、损害投资者合法权益的，国务院证券监督管理机构可以区别情形，对其采取下列措施：\n\n（一）责令暂停部分或者全部业务；\n\n（二）责令更换董事、监事、高级管理人员、执行事务合伙人或者委派代表，或者限制其权利；\n\n（三）责令负有责任的股东转让股权、负有责任的合伙人转让财产份额，限制负有责任的股东或者合伙人行使权利；\n\n（四）责令私募基金管理人聘请或者指定第三方机构对私募基金财产进行审计，相关费用由私募基金管理人承担。\n\n私募基金管理人违法经营或者出现重大风险，严重危害市场秩序、损害投资者利益的，国务院证券监督管理机构除采取前款规定的措施外，还可以对该私募基金管理人采取指定其他机构接管、通知登记备案机构注销登记等措施。"},{"n":43,"label":"第四十三条","chapter":"第五章　监督管理","text":"国务院证券监督管理机构应当将私募基金管理人、私募基金托管人、私募基金服务机构及其从业人员的诚信信息记入资本市场诚信数据库和全国信用信息共享平台。国务院证券监督管理机构会同国务院有关部门依法建立健全私募基金管理人以及有关责任主体失信联合惩戒制度。\n\n国务院证券监督管理机构会同其他金融管理部门等国务院有关部门和省、自治区、直辖市人民政府建立私募基金监督管理信息共享、统计数据报送和风险处置协作机制。处置风险过程中，有关地方人民政府应当采取有效措施维护社会稳定。"},{"n":44,"label":"第四十四条","chapter":"第六章　法律责任","text":"未依照本条例第十条规定履行登记手续，使用“基金”或者“基金管理”字样或者近似名称进行投资活动的，责令改正，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处3万元以上30万元以下的罚款。"},{"n":45,"label":"第四十五条","chapter":"第六章　法律责任","text":"私募基金管理人的股东、实际控制人、合伙人违反本条例第十二条规定的，责令改正，给予警告或者通报批评，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":46,"label":"第四十六条","chapter":"第六章　法律责任","text":"私募基金管理人违反本条例第十三条规定的，责令改正；拒不改正的，给予警告或者通报批评，并处10万元以上100万元以下的罚款，责令其停止私募基金业务活动并予以公告。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":47,"label":"第四十七条","chapter":"第六章　法律责任","text":"违反本条例第十六条第二款规定，私募基金托管人未建立业务隔离机制的，责令改正，给予警告或者通报批评，并处5万元以上50万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":48,"label":"第四十八条","chapter":"第六章　法律责任","text":"违反本条例第十七条、第十八条、第二十条关于私募基金合格投资者管理和募集方式等规定的，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处3万元以上30万元以下的罚款。"},{"n":49,"label":"第四十九条","chapter":"第六章　法律责任","text":"违反本条例第十九条规定，未向投资者充分揭示投资风险，并误导其投资与其风险识别能力和风险承担能力不匹配的私募基金产品的，给予警告或者通报批评，并处10万元以上30万元以下的罚款；情节严重的，责令其停止私募基金业务活动并予以公告。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上10万元以下的罚款。"},{"n":50,"label":"第五十条","chapter":"第六章　法律责任","text":"违反本条例第二十二条第一款规定，私募基金管理人未对募集完毕的私募基金办理备案的，处10万元以上30万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处3万元以上10万元以下的罚款。"},{"n":51,"label":"第五十一条","chapter":"第六章　法律责任","text":"违反本条例第二十四条第二款规定，将私募基金财产用于经营或者变相经营资金拆借、贷款等业务，或者要求地方人民政府承诺回购本金的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":52,"label":"第五十二条","chapter":"第六章　法律责任","text":"违反本条例第二十六条规定，私募基金管理人未聘用具有相应从业经历的高级管理人员负责投资管理、风险控制、合规等工作，或者未建立从业人员投资申报、登记、审查、处置等管理制度的，责令改正，给予警告或者通报批评，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":53,"label":"第五十三条","chapter":"第六章　法律责任","text":"违反本条例第二十七条规定，私募基金管理人委托他人行使投资管理职责，或者委托不符合《证券投资基金法》规定的机构提供证券投资建议服务的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":54,"label":"第五十四条","chapter":"第六章　法律责任","text":"违反本条例第二十八条规定，私募基金管理人从事关联交易的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":55,"label":"第五十五条","chapter":"第六章　法律责任","text":"私募基金管理人、私募基金托管人及其从业人员有本条例第三十条所列行为之一的，责令改正，给予警告或者通报批评，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足100万元的，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":56,"label":"第五十六条","chapter":"第六章　法律责任","text":"私募基金管理人、私募基金托管人及其从业人员未依照本条例规定提供、报送相关信息，或者有本条例第三十二条所列行为之一的，责令改正，给予警告或者通报批评，没收违法所得，并处10万元以上100万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上30万元以下的罚款。"},{"n":57,"label":"第五十七条","chapter":"第六章　法律责任","text":"私募基金服务机构及其从业人员违反法律、行政法规规定，未恪尽职守、勤勉尽责的，责令改正，给予警告或者通报批评，并处10万元以上30万元以下的罚款；情节严重的，责令其停止私募基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告或者通报批评，并处3万元以上10万元以下的罚款。"},{"n":58,"label":"第五十八条","chapter":"第六章　法律责任","text":"私募基金管理人、私募基金托管人、私募基金服务机构及其从业人员违反本条例或者国务院证券监督管理机构的有关规定，情节严重的，国务院证券监督管理机构可以对有关责任人员采取证券期货市场禁入措施。\n\n拒绝、阻碍国务院证券监督管理机构及其工作人员依法行使监督检查、调查职权，由国务院证券监督管理机构责令改正，处10万元以上100万元以下的罚款；构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"n":59,"label":"第五十九条","chapter":"第六章　法律责任","text":"国务院证券监督管理机构、登记备案机构的工作人员玩忽职守、滥用职权、徇私舞弊或者利用职务便利索取或者收受他人财物的，依法给予处分；构成犯罪的，依法追究刑事责任。"},{"n":60,"label":"第六十条","chapter":"第六章　法律责任","text":"违反本条例规定和基金合同约定，依法应当承担民事赔偿责任和缴纳罚款、被没收违法所得，其财产不足以同时支付时，先承担民事赔偿责任。"},{"n":61,"label":"第六十一条","chapter":"第七章　附　　则","text":"外商投资私募基金管理人的管理办法，由国务院证券监督管理机构会同国务院有关部门依照外商投资法律、行政法规和本条例制定。\n\n境外机构不得直接向境内投资者募集资金设立私募基金，但国家另有规定的除外。\n\n私募基金管理人在境外开展私募基金业务活动，应当符合国家有关规定。"},{"n":62,"label":"第六十二条","chapter":"第七章　附　　则","text":"本条例自2023年9月1日起施行。"}],"source":"https://www.mee.gov.cn/zcwj/gwywj/202307/t20230710_1035724.shtml","textSource":"https://www.mee.gov.cn/zcwj/gwywj/202307/t20230710_1035724.shtml","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"6b272ba58a182bab1bc29099aa63657eca61558d6193493cdf1f92feee750c1e"},{"id":"interim","title":"私募投资基金监督管理暂行办法","level":"部门规章","issuer":"中国证监会","version":"证监会令第105号 / 2014","effective":"2014-08-21","scope":"通用","topics":["合格投资者","募集","运作"],"overview":"历史较早、仍需与上位法及后续专项规则合并阅读的私募监管规则。条文本身保留原始表述，不把旧罚则或旧报告安排孤立当成全部现行要求。","practice":"重点识别合格投资者、风险评估、禁止行为及资料保存；后续私募条例和2026信息披露规则优先纳入同一事项的适用分析。","priority":[2,11,12,13,16,23,24,26],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"为了规范私募投资基金活动，保护投资者及相关当事人的合法权益，促进私募投资基金行业健康发展，根据《证券投资基金法》、《国务院关于进一步促进资本市场健康发展的若干意见》，制定本办法。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"本办法所称私募投资基金（以下简称私募基金），是指在中华人民共和国境内，以非公开方式向投资者募集资金设立的投资基金。私募基金财产的投资包括买卖股票、股权、债券、期货、期权、基金份额及投资合同约定的其他投资标的。非公开募集资金，以进行投资活动为目的设立的公司或者合伙企业，资产由基金管理人或者普通合伙人管理的，其登记备案、资金募集和投资运作适用本办法。证券公司、基金管理公司、期货公司及其子公司从事私募基金业务适用本办法，其他法律法规和中国证券监督管理委员会（以下简称中国证监会）有关规定对上述机构从事私募基金业务另有规定的，适用其规定。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"从事私募基金业务，应当遵循自愿、公平、诚实信用原则，维护投资者合法权益，不得损害国家利益和社会公共利益。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"私募基金管理人和从事私募基金托管业务的机构（以下简称私募基金托管人）管理、运用私募基金财产，从事私募基金销售业务的机构（以下简称私募基金销售机构）及其他私募服务机构从事私募基金服务活动，应当恪尽职守，履行诚实信用、谨慎勤勉的义务。私募基金从业人员应当遵守法律、行政法规，恪守职业道德和行为规范。"},{"n":5,"label":"第五条","chapter":"第一章 总则","text":"中国证监会及其派出机构依照《证券投资基金法》、本办法和中国证监会的其他有关规定，对私募基金业务活动实施监督管理。设立私募基金管理机构和发行私募基金不设行政审批，允许各类发行主体在依法合规的基础上，向累计不超过法律规定数量的投资者发行私募基金。建立健全私募基金发行监管制度，切实强化事中事后监管，依法严厉打击以私募基金为名的各类非法集资活动。建立促进经营机构规范开展私募基金业务的风险控制和自律管理制度，以及各类私募基金的统一监测系统。"},{"n":6,"label":"第六条","chapter":"第一章 总则","text":"中国证券投资基金业协会（以下简称基金业协会）依照《证券投资基金法》、本办法、中国证监会其他有关规定和基金业协会自律规则，对私募基金业开展行业自律，协调行业关系，提供行业服务，促进行业发展。"},{"n":7,"label":"第七条","chapter":"第二章 登记备案","text":"各类私募基金管理人应当根据基金业协会的规定，向基金业协会申请登记，报送以下基本信息：\n\n（一）工商登记和营业执照正副本复印件;\n\n（二）公司章程或者合伙协议；\n\n（三）主要股东或者合伙人名单；\n\n（四）高级管理人员的基本信息；\n\n（五）基金业协会规定的其他信息。\n\n基金业协会应当在私募基金管理人登记材料齐备后的20 个工作日内，通过网站公告私募基金管理人名单及其基本情况的方式，为私募基金管理人办结登记手续。"},{"n":8,"label":"第八条","chapter":"第二章 登记备案","text":"各类私募基金募集完毕，私募基金管理人应当根据基金业协会的规定，办理基金备案手续，报送以下基本信息：\n\n（一）主要投资方向及根据主要投资方向注明的基金类别；\n\n（二）基金合同、公司章程或者合伙协议。资金募集过程中向投资者提供基金招募说明书的，应当报送基金招募说明书。以公司、合伙等企业形式设立的私募基金，还应当报送工商登记和营业执照正副本复印件；\n（三）采取委托管理方式的，应当报送委托管理协议。委托托管机构托管基金财产的，还应当报送托管协议；\n\n（四）基金业协会规定的其他信息。\n\n基金业协会应当在私募基金备案材料齐备后的20 个工作日内，通过网站公告私募基金名单及其基本情况的方式，为私募基金办结备案手续。"},{"n":9,"label":"第九条","chapter":"第二章 登记备案","text":"基金业协会为私募基金管理人和私募基金办理登记备案不构成对私募基金管理人投资能力、持续合规情况的认可；不作为对基金财产安全的保证。"},{"n":10,"label":"第十条","chapter":"第二章 登记备案","text":"私募基金管理人依法解散、被依法撤销、或者被依法宣告破产的，其法定代表人或者普通合伙人应当在20 个工作日内向基金业协会报告，基金业协会应当及时注销基金管理人登记并通过网站公告。"},{"n":11,"label":"第十一条","chapter":"第三章 合格投资者","text":"私募基金应当向合格投资者募集，单只私募基金的投资者人数累计不得超过《证券投资基金法》、《公司法》、《合伙企业法》等法律规定的特定数量。投资者转让基金份额的，受让人应当为合格投资者且基金份额受让后投资者人数应当符合前款规定。"},{"n":12,"label":"第十二条","chapter":"第三章 合格投资者","text":"私募基金的合格投资者是指具备相应风险识别能力和风险承担能力，投资于单只私募基金的金额不低于100 万元且符合下列相关标准的单位和个人：\n（一）净资产不低于1000 万元的单位；\n\n（二）金融资产不低于300 万元或者最近三年个人年均收入不低于50 万元的个人。\n\n前款所称金融资产包括银行存款、股票、债券、基金份额、资产管理计划、银行理财产品、信托计划、保险产品、期货权益等。"},{"n":13,"label":"第十三条","chapter":"第三章 合格投资者","text":"下列投资者视为合格投资者：\n\n（一）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金；\n\n（二）依法设立并在基金业协会备案的投资计划；\n\n（三）投资于所管理私募基金的私募基金管理人及其从业人员；\n\n（四）中国证监会规定的其他投资者。\n\n以合伙企业、契约等非法人形式，通过汇集多数投资者的资金直接或者间接投资于私募基金的，私募基金管理人或者私募基金销售机构应当穿透核查最终投资者是否为合格投资者，并合并计算投资者人数。但是，符合本条第（一）、（二）、（四）项规定的投资者投资私募基金的，不再穿透核查最终投资者是否为合格投资者和合并计算投资者人数。"},{"n":14,"label":"第十四条","chapter":"第四章 资金募集","text":"私募基金管理人、私募基金销售机构不得向合格投资者之外的单位和个人募集资金，不得通过报刊、电台、电视、互联网等公众传播媒体或者讲座、报告会、分析会和布告、传单、手机短信、微信、博客和电子邮件等方式，向不特定对象宣传推介。"},{"n":15,"label":"第十五条","chapter":"第四章 资金募集","text":"私募基金管理人、私募基金销售机构不得向投资者承诺投资本金不受损失或者承诺最低收益。"},{"n":16,"label":"第十六条","chapter":"第四章 资金募集","text":"私募基金管理人自行销售私募基金的，应当采取问卷调查等方式，对投资者的风险识别能力和风险承担能力进行评估，由投资者书面承诺符合合格投资者条件；应当制作风险揭示书，由投资者签字确认。私募基金管理人委托销售机构销售私募基金的，私募基金销售机构应当采取前款规定的评估、确认等措施。投资者风险识别能力和承担能力问卷及风险揭示书的内容与格式指引，由基金业协会按照不同类别私募基金的特点制定。"},{"n":17,"label":"第十七条","chapter":"第四章 资金募集","text":"私募基金管理人自行销售或者委托销售机构销售私募基金，应当自行或者委托第三方机构对私募基金进行风险评级，向风险识别能力和风险承担能力相匹配的投资者推介私募基金。"},{"n":18,"label":"第十八条","chapter":"第四章 资金募集","text":"投资者应当如实填写风险识别能力和承担能力问卷，如实承诺资产或者收入情况，并对其真实性、准确性和完整性负责。填写虚假信息或者提供虚假承诺文件的，应当承担相应责任。"},{"n":19,"label":"第十九条","chapter":"第四章 资金募集","text":"投资者应当确保投资资金来源合法，不得非法汇集他人资金投资私募基金。"},{"n":20,"label":"第二十条","chapter":"第五章 投资运作","text":"募集私募证券基金，应当制定并签订基金合同、公司章程或者合伙协议（以下统称基金合同）。基金合同应当符合《证券投资基金法》第九十三条、第九十四条规定。募集其他种类私募基金，基金合同应当参照《证券投资基金法》第九十三条、第九十四条规定，明确约定各方当事人的权利、义务和相关事宜。"},{"n":21,"label":"第二十一条","chapter":"第五章 投资运作","text":"除基金合同另有约定外，私募基金应当由基金托管人托管。基金合同约定私募基金不进行托管的，应当在基金合同中明确保障私募基金财产安全的制度措施和纠纷解决机制。"},{"n":22,"label":"第二十二条","chapter":"第五章 投资运作","text":"同一私募基金管理人管理不同类别私募基金的，应当坚持专业化管理原则；管理可能导致利益输送或者利益冲突的不同私募基金的，应当建立防范利益输送和利益冲突的机制。"},{"n":23,"label":"第二十三条","chapter":"第五章 投资运作","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募服务机构及其从业人员从事私募基金业务，不得有以下行为：\n\n（一）将其固有财产或者他人财产混同于基金财产从事投资活动；\n\n（二）不公平地对待其管理的不同基金财产；\n\n（三）利用基金财产或者职务之便，为本人或者投资者以外的人牟取利益，进行利益输送；\n\n（四）侵占、挪用基金财产；\n\n（五）泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的交易活动；\n\n（六）从事损害基金财产和投资者利益的投资活动；\n\n（七）玩忽职守，不按照规定履行职责；\n\n（八）从事内幕交易、操纵交易价格及其他不正当交易活动；\n\n（九）法律、行政法规和中国证监会规定禁止的其他行为。"},{"n":24,"label":"第二十四条","chapter":"第五章 投资运作","text":"私募基金管理人、私募基金托管人应当按照合同约定，如实向投资者披露基金投资、资产负债、投资收益分配、基金承担的费用和业绩报酬、可能存在的利益冲突情况以及可能影响投资者合法权益的其他重大信息，不得隐瞒或者提供虚假信息。信息披露规则由基金业协会另行制定。"},{"n":25,"label":"第二十五条","chapter":"第五章 投资运作","text":"私募基金管理人应当根据基金业协会的规定，及时填报并定期更新管理人及其从业人员的有关信息、所管理私募基金的投资运作情况和杠杆运用情况，保证所填报内容真实、准确、完整。发生重大事项的，应当在10 个工作日内向基金业协会报告。私募基金管理人应当于每个会计年度结束后的4 个月内，向基金业协会报送经会计师事务所审计的年度财务报告和所管理私募基金年度投资运作基本情况。"},{"n":26,"label":"第二十六条","chapter":"第五章 投资运作","text":"私募基金管理人、私募基金托管人及私募基金销售机构应当妥善保存私募基金投资决策、交易和投资者适当性管理等方面的记录及其他相关资料，保存期限自基金清算终止之日起不得少于10 年。"},{"n":27,"label":"第二十七条","chapter":"第六章 行业自律","text":"基金业协会应当建立私募基金管理人登记、私募基金备案管理信息系统。基金业协会应当对私募基金管理人和私募基金信息严格保密。除法律法规另有规定外，不得对外披露。"},{"n":28,"label":"第二十八条","chapter":"第六章 行业自律","text":"基金业协会应当建立与中国证监会及其派出机构和其他相关机构的信息共享机制，定期汇总分析私募基金情况，及时提供私募基金相关信息。"},{"n":29,"label":"第二十九条","chapter":"第六章 行业自律","text":"基金业协会应当制定和实施私募基金行业自律规则，监督、检查会员及其从业人员的执业行为。会员及其从业人员违反法律、行政法规、本办法规定和基金业协会自律规则的，基金业协会可以视情节轻重，采取自律管理措施，并通过网站公开相关违法违规信息。会员及其从业人员涉嫌违法违规的，基金业协会应当及时报告中国证监会。"},{"n":30,"label":"第三十条","chapter":"第六章 行业自律","text":"基金业协会应当建立投诉处理机制，受理投资者投诉，进行纠纷调解。"},{"n":31,"label":"第三十一条","chapter":"第七章 监督管理","text":"中国证监会及其派出机构依法对私募基金管理人、私募基金托管人、私募基金销售机构及其他私募服务机构开展私募基金业务情况进行统计监测和检查，依照《证券投资基金法》第一百一十四条规定采取有关措施。"},{"n":32,"label":"第三十二条","chapter":"第七章 监督管理","text":"中国证监会将私募基金管理人、私募基金托管人、私募基金销售机构及其他私募服务机构及其从业人员诚信信息记入证券期货市场诚信档案数据库；根据私募基金管理人的信用状况，实施差异化监管。"},{"n":33,"label":"第三十三条","chapter":"第七章 监督管理","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募服务机构及其从业人员违反法律、行政法规及本办法规定，中国证监会及其派出机构可以对其采取责令改正、监管谈话、出具警示函、公开谴责等行政监管措施。"},{"n":34,"label":"第三十四条","chapter":"第八章 关于创业投资基金的特别规定","text":"本办法所称创业投资基金，是指主要投资于未上市创业企业普通股或者依法可转换为普通股的优先股、可转换债券等权益的股权投资基金。"},{"n":35,"label":"第三十五条","chapter":"第八章 关于创业投资基金的特别规定","text":"鼓励和引导创业投资基金投资创业早期的小微企业。享受国家财政税收扶持政策的创业投资基金，其投资范围应当符合国家相关规定。"},{"n":36,"label":"第三十六条","chapter":"第八章 关于创业投资基金的特别规定","text":"基金业协会在基金管理人登记、基金备案、投资情况报告要求和会员管理等环节，对创业投资基金采取区别于其他私募基金的差异化行业自律，并提供差异化会员服务。"},{"n":37,"label":"第三十七条","chapter":"第八章 关于创业投资基金的特别规定","text":"中国证监会及其派出机构对创业投资基金在投资方向检查等环节，采取区别于其他私募基金的差异化监督管理；在账户开立、发行交易和投资退出等方面，为创业投资基金提供便利服务。"},{"n":38,"label":"第三十八条","chapter":"第九章 法律责任","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募服务机构及其从业人员违反本办法第七条、第八条、第十一条、第十四条至第十七条、第二十四条至第二十六条规定的，以及有本办法第二十三条第一项至第七项和第九项所列行为之一的，责令改正，给予警告并处三万元以下罚款；对直接负责的主管人员和其他直接责任人员，给予警告并处三万元以下罚款；有本办法第二十三条第八项行为的，按照《证券法》和《期货交易管理条例》的有关规定处罚；构成犯罪的，依法移交司法机关追究刑事责任。"},{"n":39,"label":"第三十九条","chapter":"第九章 法律责任","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募服务机构及其从业人员违反法律法规和本办法规定，情节严重的，中国证监会可以依法对有关责任人员采取市场禁入措施。"},{"n":40,"label":"第四十条","chapter":"第九章 法律责任","text":"私募证券基金管理人及其从业人员违反《证券投资基金法》有关规定的，按照《证券投资基金法》有关规定处罚。"},{"n":41,"label":"第四十一条","chapter":"第十章 附则","text":"本办法自公布之日起施行。"}],"source":"https://www.csrc.gov.cn/csrc/c106256/c1653981/content.shtml","textSource":"https://www.csrc.gov.cn/ningxia/c105511/c1307593/content.shtml","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"5131a56f27ab257deab023d573d83dc1156c29de7b03d329898946550f2adc92"},{"id":"fit","title":"证券期货投资者适当性管理办法","level":"部门规章","issuer":"中国证监会","version":"2022年第二次修正","effective":"2022-08-12修正；原办法2017-07-01施行","scope":"通用","topics":["TA","投资者分类","风险匹配"],"overview":"覆盖向投资者销售相关证券、基金、期货和衍生产品及提供服务的适当性要求。合格投资者准入与风险适当性匹配是两套需要同时判断的检查。","practice":"先确认投资者身份及资格，再做专业/普通分类、风险承受能力评估、产品分级、匹配、揭示和记录管理。","priority":[2,3,8,10,18,22,32],"articles":[{"n":1,"label":"第一条","chapter":"正文","text":"为了规范证券期货投资者适当性管理，维护投资者合法权益，根据《中华人民共和国证券法》（以下简称《证券法》）、《中华人民共和国证券投资基金法》（以下简称《证券投资基金法》）、《中华人民共和国期货和衍生品法》（以下简称《期货和衍生品法》）、《证券公司监督管理条例》《期货交易管理条例》及其他相关法律、行政法规，制定本办法。"},{"n":2,"label":"第二条","chapter":"正文","text":"向投资者销售公开或者非公开发行的证券、公开或者非公开募集的证券投资基金和股权投资基金（包括创业投资基金，以下简称基金）、公开或者非公开转让的期货及其他衍生产品，或者为投资者提供相关业务服务的，适用本办法。本办法所称投资者，包括《证券法》规定的投资者，《证券投资基金法》规定的投资人、基金份额持有人，以及《期货和衍生品法》规定的交易者等。"},{"n":3,"label":"第三条","chapter":"正文","text":"向投资者销售证券期货产品或者提供证券期货服务的机构（以下简称经营机构）应当遵守法律、行政法规、本办法及其他有关规定，在销售产品或者提供服务的过程中，勤勉尽责，审慎履职，全面了解投资者情况，深入调查分析产品或者服务信息，科学有效评估，充分揭示风险，基于投资者的不同风险承受能力以及产品或者服务的不同风险等级等因素，提出明确的适当性匹配意见，将适当的产品或者服务销售或者提供给适合的投资者，并对违法违规行为承担法律责任。"},{"n":4,"label":"第四条","chapter":"正文","text":"投资者应当在了解产品或者服务情况，听取经营机构适当性意见的基础上，根据自身能力审慎决策，独立承担投资风险。经营机构的适当性匹配意见不表明其对产品或者服务的风险和收益做出实质性判断或者保证。"},{"n":5,"label":"第五条","chapter":"正文","text":"中国证券监督管理委员会（以下简称中国证监会）及其派出机构依照法律、行政法规、本办法及其他相关规定，对经营机构履行适当性义务进行监督管理。证券期货交易场所、登记结算机构及中国证券业协会、中国期货业协会、中国证券投资基金业协会（以下统称行业协会）等自律组织对经营机构履行适当性义务进行自律管理。"},{"n":6,"label":"第六条","chapter":"正文","text":"经营机构向投资者销售产品或者提供服务时，应当了解投资者的下列信息：\n（一）自然人的姓名、住址、职业、年龄、联系方式，法人或者其他组织的名称、注册地址、办公地址、性质、资质及经营范围等基本信息；\n（二）收入来源和数额、资产、债务等财务状况；\n（三）投资相关的学习、工作经历及投资经验；\n（四）投资期限、品种、期望收益等投资目标；\n（五）风险偏好及可承受的损失；\n（六）诚信记录；\n（七）实际控制投资者的自然人和交易的实际受益人；\n（八）法律法规、自律规则规定的投资者准入要求相关信息；\n（九）其他必要信息。"},{"n":7,"label":"第七条","chapter":"正文","text":"投资者分为普通投资者与专业投资者。普通投资者在信息告知、风险警示、适当性匹配等方面享有特别保护。"},{"n":8,"label":"第八条","chapter":"正文","text":"符合下列条件之一的是专业投资者：\n（一）经有关金融监管部门批准设立的金融机构，包括证券公司、期货公司、基金管理公司及其子公司、商业银行、保险公司、信托公司、财务公司等；经行业协会备案或者登记的证券公司子公司、期货公司子公司、私募基金管理人。\n（二）上述机构面向投资者发行的理财产品，包括但不限于证券公司资产管理产品、基金管理公司及其子公司产品、期货公司资产管理产品、银行理财产品、保险产品、信托产品、经行业协会备案的私募基金。\n（三）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金，合格境外机构投资者（QFII）、人民币合格境外机构投资者（RQFII）。\n（四）同时符合下列条件的法人或者其他组织：1.最近 1年末净资产不低于 2000万元；2.最近 1年末金融资产不低于 1000万元；3.具有 2年以上证券、基金、期货、黄金、外汇等投资经历。\n（五）同时符合下列条件的自然人：1.金融资产不低于 500万元，或者最近 3年个人年均收入不低于 50万元；2.具有 2年以上证券、基金、期货、黄金、外汇等投资经历，或者具有 2年以上金融产品设计、投资、风险管理及相关工作经历，或者属于本条第（一）项规定的专业投资者的高级管理人员、获得职业资格认证的从事金融相关业务的注册会计师和律师。前款所称金融资产，是指银行存款、股票、债券、基金份额、资产管理计划、银行理财产品、信托计划、保险产品、期货及其他衍生产品等。"},{"n":9,"label":"第九条","chapter":"正文","text":"经营机构可以根据专业投资者的业务资格、投资实力、投资经历等因素，对专业投资者进行细化分类和管理。"},{"n":10,"label":"第十条","chapter":"正文","text":"专业投资者之外的投资者为普通投资者。经营机构应当按照有效维护投资者合法权益的要求，综合考虑收入来源、资产状况、债务、投资知识和经验、风险偏好、诚信状况等因素，确定普通投资者的风险承受能力，对其进行细化分类和管理。"},{"n":11,"label":"第十一条","chapter":"正文","text":"普通投资者和专业投资者在一定条件下可以互相转化。符合本办法第八条第（四）、（五）项规定的专业投资者，可以书面告知经营机构选择成为普通投资者，经营机构应当对其履行相应的适当性义务。符合下列条件之一的普通投资者可以申请转化成为专业投资者，但经营机构有权自主决定是否同意其转化：\n（一）最近 1年末净资产不低于 1000万元，最近 1年末金融资产不低于 500万元，且具有 1年以上证券、基金、期货、黄金、外汇等投资经历的除专业投资者外的法人或其他组织；\n（二）金融资产不低于 300万元或者最近 3年个人年均收入不低于 30万元，且具有 1年以上证券、基金、期货、黄金、外汇等投资经历或者 1年以上金融产品设计、投资、风险管理及相关工作经历的自然人投资者。"},{"n":12,"label":"第十二条","chapter":"正文","text":"普通投资者申请成为专业投资者应当以书面形式向经营机构提出申请并确认自主承担可能产生的风险和后果，提供相关证明材料。经营机构应当通过追加了解信息、投资知识测试或者模拟交易等方式对投资者进行谨慎评估，确认其符合前条要求，说明对不同类别投资者履行适当性义务的差别，警示可能承担的投资风险，告知申请的审查结果及其理由。"},{"n":13,"label":"第十三条","chapter":"正文","text":"经营机构应当告知投资者，其根据本办法第六条规定所提供的信息发生重要变化、可能影响分类的，应及时告知经营机构。经营机构应当建立投资者评估数据库并及时更新，充分使用已了解信息和已有评估结果，避免重复采集，提高评估效率。"},{"n":14,"label":"第十四条","chapter":"正文","text":"中国证监会、自律组织在针对特定市场、产品或者服务制定规则时，可以考虑风险性、复杂性以及投资者的认知难度等因素，从资产规模、收入水平、风险识别能力和风险承担能力、投资认购最低金额等方面，规定投资者准入要求。投资者准入要求包含资产指标的，应当规定投资者在购买产品或者接受服务前一定时期内符合该指标。现有市场、产品或者服务规定投资者准入要求的，应当符合前款规定。"},{"n":15,"label":"第十五条","chapter":"正文","text":"经营机构应当了解所销售产品或者所提供服务的信息，根据风险特征和程度，对销售的产品或者提供的服务划分风险等级。"},{"n":16,"label":"第十六条","chapter":"正文","text":"划分产品或者服务风险等级时应当综合考虑以下因素：\n（一）流动性；\n（二）到期时限；\n（三）杠杆情况；\n（四）结构复杂性；\n（五）投资单位产品或者相关服务的最低金额；\n（六）投资方向和投资范围；\n（七）募集方式；\n（八）发行人等相关主体的信用状况；\n（九）同类产品或者服务过往业绩；\n（十）其他因素。涉及投资组合的产品或者服务，应当按照产品或者服务整体风险等级进行评估。"},{"n":17,"label":"第十七条","chapter":"正文","text":"产品或者服务存在下列因素的，应当审慎评估其风险等级：\n（一）存在本金损失的可能性，因杠杆交易等因素容易导致本金大部分或者全部损失的产品或者服务；\n（二）产品或者服务的流动变现能力，因无公开交易市场、参与投资者少等因素导致难以在短期内以合理价格顺利变现的产品或者服务；\n（三）产品或者服务的可理解性，因结构复杂、不易估值等因素导致普通人难以理解其条款和特征的产品或者服务；\n（四）产品或者服务的募集方式，涉及面广、影响力大的公募产品或者相关服务；\n（五）产品或者服务的跨境因素，存在市场差异、适用境外法律等情形的跨境发行或者交易的产品或者服务；\n（六）自律组织认定的高风险产品或者服务；\n（七）其他有可能构成投资风险的因素。"},{"n":18,"label":"第十八条","chapter":"正文","text":"经营机构应当根据产品或者服务的不同风险等级，对其适合销售产品或者提供服务的投资者类型作出判断，根据投资者的不同分类，对其适合购买的产品或者接受的服务作出判断。"},{"n":19,"label":"第十九条","chapter":"正文","text":"经营机构告知投资者不适合购买相关产品或者接受相关服务后，投资者主动要求购买风险等级高于其风险承受能力的产品或者接受相关服务的，经营机构在确认其不属于风险承受能力最低类别的投资者后，应当就产品或者服务风险高于其承受能力进行特别的书面风险警示，投资者仍坚持购买的，可以向其销售相关产品或者提供相关服务。"},{"n":20,"label":"第二十条","chapter":"正文","text":"经营机构向普通投资者销售高风险产品或者提供相关服务，应当履行特别的注意义务，包括制定专门的工作程序，追加了解相关信息，告知特别的风险点，给予普通投资者更多的考虑时间，或者增加回访频次等。"},{"n":21,"label":"第二十一条","chapter":"正文","text":"经营机构应当根据投资者和产品或者服务的信息变化情况，主动调整投资者分类、产品或者服务分级以及适当性匹配意见，并告知投资者上述情况。"},{"n":22,"label":"第二十二条","chapter":"正文","text":"禁止经营机构进行下列销售产品或者提供服务的活动：\n（一）向不符合准入要求的投资者销售产品或者提供服务；\n（二）向投资者就不确定事项提供确定性的判断，或者告知投资者有可能使其误认为具有确定性的意见；\n（三）向普通投资者主动推介风险等级高于其风险承受能力的产品或者服务；\n（四）向普通投资者主动推介不符合其投资目标的产品或者服务；\n（五）向风险承受能力最低类别的投资者销售或者提供风险等级高于其风险承受能力的产品或者服务；\n（六）其他违背适当性要求，损害投资者合法权益的行为。"},{"n":23,"label":"第二十三条","chapter":"正文","text":"经营机构向普通投资者销售产品或者提供服务前，应当告知下列信息：\n（一）可能直接导致本金亏损的事项；\n（二）可能直接导致超过原始本金损失的事项；\n（三）因经营机构的业务或者财产状况变化，可能导致本金或者原始本金亏损的事项；\n（四）因经营机构的业务或者财产状况变化，影响客户判断的重要事由；\n（五）限制销售对象权利行使期限或者可解除合同期限等全部限制内容；\n（六）本办法第二十九条规定的适当性匹配意见。"},{"n":24,"label":"第二十四条","chapter":"正文","text":"经营机构对投资者进行告知、警示，内容应当真实、准确、完整，不存在虚假记载、误导性陈述或者重大遗漏，语言应当通俗易懂；告知、警示应当采用书面形式送达投资者，并由其确认已充分理解和接受。"},{"n":25,"label":"第二十五条","chapter":"正文","text":"经营机构通过营业网点向普通投资者进行本办法第十二条、第二十条、第二十一条和第二十三条规定的告知、警示，应当全过程录音或者录像；通过互联网等非现场方式进行的，经营机构应当完善配套留痕安排，由普通投资者通过符合法律、行政法规要求的电子方式进行确认。"},{"n":26,"label":"第二十六条","chapter":"正文","text":"经营机构委托其他机构销售本机构发行的产品或者提供服务，应当审慎选择受托方，确认受托方具备代销相关产品或者提供服务的资格和落实相应适当性义务要求的能力，应当制定并告知代销方所委托产品或者提供服务的适当性管理标准和要求，代销方应当严格执行，但法律、行政法规、中国证监会其他规章另有规定的除外。"},{"n":27,"label":"第二十七条","chapter":"正文","text":"经营机构代销其他机构发行的产品或者提供相关服务，应当在合同中约定要求委托方提供的信息，包括本办法第十六条、第十七条规定的产品或者服务分级考虑因素等，自行对该信息进行调查核实，并履行投资者评估、适当性匹配等适当性义务。委托方不提供规定的信息、提供信息不完整的，经营机构应当拒绝代销产品或者提供服务。"},{"n":28,"label":"第二十八条","chapter":"正文","text":"对在委托销售中违反适当性义务的行为，委托销售机构和受托销售机构应当依法承担相应法律责任，并在委托销售合同中予以明确。"},{"n":29,"label":"第二十九条","chapter":"正文","text":"经营机构应当制定适当性内部管理制度，明确投资者分类、产品或者服务分级、适当性匹配的具体依据、方法、流程等，严格按照内部管理制度进行分类、分级，定期汇总分类、分级结果，并对每名投资者提出匹配意见。经营机构应当制定并严格落实与适当性内部管理有关的限制不匹配销售行为、客户回访检查、评估与销售隔离等风控制度，以及培训考核、执业规范、监督问责等制度机制，不得采取鼓励不适当销售的考核激励措施，确保从业人员切实履行适当性义务。"},{"n":30,"label":"第三十条","chapter":"正文","text":"经营机构应当每半年开展一次适当性自查，形成自查报告。发现违反本办法规定的问题，应当及时处理并主动报告住所地中国证监会派出机构。"},{"n":31,"label":"第三十一条","chapter":"正文","text":"鼓励经营机构将投资者分类政策、产品或者服务分级政策、自查报告在公司网站或者符合中国证监会规定条件的媒体进行披露。"},{"n":32,"label":"第三十二条","chapter":"正文","text":"经营机构应当按照相关规定妥善保存其履行适当性义务的相关信息资料，防止泄露或者被不当利用，接受中国证监会及其派出机构和自律组织的检查。对匹配方案、告知警示资料、录音录像资料、自查报告等的保存期限不得少于 20年。"},{"n":33,"label":"第三十三条","chapter":"正文","text":"投资者购买产品或者接受服务，按规定需要提供信息的，所提供的信息应当真实、准确、完整。投资者根据本办法第六条规定所提供的信息发生重要变化、可能影响其分类的，应当及时告知经营机构。投资者不按照规定提供相关信息，提供信息不真实、不准确、不完整的，应当依法承担相应法律责任，经营机构应当告知其后果，并拒绝向其销售产品或者提供服务。"},{"n":34,"label":"第三十四条","chapter":"正文","text":"经营机构应当妥善处理适当性相关的纠纷，与投资者协商解决争议，采取必要措施支持和配合投资者提出的调解。经营机构履行适当性义务存在过错并造成投资者损失的，应当依法承担相应法律责任。经营机构与普通投资者发生纠纷的，经营机构应当提供相关资料，证明其已向投资者履行相应义务。"},{"n":35,"label":"第三十五条","chapter":"正文","text":"中国证监会及其派出机构在监管中应当审核或者关注产品或者服务的适当性安排，对适当性制度落实情况进行检查，督促经营机构严格落实适当性义务，强化适当性管理。"},{"n":36,"label":"第三十六条","chapter":"正文","text":"证券期货交易场所应当制定完善本市场相关产品或者服务的适当性管理自律规则。行业协会应当制定完善会员落实适当性管理要求的自律规则，制定并定期更新本行业的产品或者服务风险等级名录以及本办法第十九条、第二十二条规定的风险承受能力最低的投资者类别，供经营机构参考。经营机构评估相关产品或者服务的风险等级不得低于名录规定的风险等级。证券期货交易场所、行业协会应当督促、引导会员履行适当性义务，对备案产品或者相关服务应当重点关注高风险产品或者服务的适当性安排。"},{"n":37,"label":"第三十七条","chapter":"正文","text":"经营机构违反本办法规定的，中国证监会及其派出机构可以对经营机构及其直接负责的主管人员和其他直接责任人员，采取责令改正、监管谈话、出具警示函等监督管理措施。"},{"n":38,"label":"第三十八条","chapter":"正文","text":"证券公司、期货公司违反本办法规定，存在较大风险或者风险隐患的，中国证监会及其派出机构可以按照《证券法》第一百四十条、《期货和衍生品法》第七十三条、《证券公司监督管理条例》第七十条、《期货交易管理条例》第五十五条的规定，采取监督管理措施。"},{"n":39,"label":"第三十九条","chapter":"正文","text":"违反本办法第六条、第十八条、第十九条、第二十条、第二十一条、第二十二条第（三）项至第（六）项、第二十三条、第二十四条、第三十三条规定的，按照《证券法》第一百九十八条、《证券投资基金法》第一百三十七条、《期货和衍生品法》第一百三十五条、《证券公司监督管理条例》第八十四条、《期货交易管理条例》第六十七条予以处理。"},{"n":40,"label":"第四十条","chapter":"正文","text":"违反本办法第二十二条第（一）项至第（二）项、第二十六条、第二十七条规定的，按照《证券投资基金法》第一百三十五条、《期货和衍生品法》第一百三十五条、《证券公司监督管理条例》第八十三条、《期货交易管理条例》第六十六条予以处理。"},{"n":41,"label":"第四十一条","chapter":"正文","text":"经营机构有下列情形之一的，给予警告，并处以 3万元以下罚款；对直接负责的主管人员和其他直接责任人员，给予警告，并处以 3万元以下罚款：\n（一）违反本办法第十条，未按规定对普通投资者进行细化分类和管理的；\n（二）违反本办法第十一条、第十二条，未按规定进行投资者类别转化的；\n（三）违反本办法第十三条，未建立或者更新投资者评估数据库的；\n（四）违反本办法第十五条，未按规定了解所销售产品或者所提供服务信息或者履行分级义务的；\n（五）违反本办法第十六条、第十七条，未按规定划分产品或者服务风险等级的；\n（六）违反本办法第二十五条，未按规定录音录像或者采取配套留痕安排的；\n（七）违反本办法第二十九条，未按规定制定或者落实适当性内部管理制度和相关制度机制的；\n（八）违反本办法第三十条，未按规定开展适当性自查的；\n（九）违反本办法第三十二条，未按规定妥善保存相关信息资料的；\n（十）违反本办法第六条、第十八条至第二十四条、第二十六条、第二十七条、第三十三条规定，未构成《证券法》第一百九十八条，《证券投资基金法》第一百三十五条、第一百三十七条，《期货和衍生品法》第一百三十五条，《证券公司监督管理条例》第八十三条、第八十四条，《期货交易管理条例》第六十六条、第六十七条规定情形的。"},{"n":42,"label":"第四十二条","chapter":"正文","text":"经营机构从业人员违反相关法律法规和本办法规定，情节严重的，中国证监会可以依法采取市场禁入的措施。"},{"n":43,"label":"第四十三条","chapter":"正文","text":"本办法自 2017年 7月 1日起施行。"}],"source":"https://www.csrc.gov.cn/csrc/c101953/c5359211/content.shtml","textSource":"https://www.csrc.gov.cn/csrc/c101953/c5359211/5359211/files/%E9%99%84%E4%BB%B61.1%EF%BC%9A%E4%B8%AD%E5%9B%BD%E8%AF%81%E7%9B%91%E4%BC%9A%E5%86%B3%E5%AE%9A%E4%BF%AE%E6%94%B9%E7%9A%84%E8%A7%84%E7%AB%A0.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"864422e992e8594cf398023ba971f0ff22026230f0133d1b61bd3c263f6bbfe4"},{"id":"disclosure","title":"私募投资基金信息披露监督管理办法","level":"部门规章","issuer":"中国证监会","version":"证监会令第233号 / 2026","effective":"2026-09-01","scope":"通用","topics":["信息披露","FA","TA","估值"],"overview":"2026年私募基金信息披露的专门监管办法。管理人、托管人、受托销售机构的职责与不同基金类型的披露安排应分别识别。","practice":"按基金类型建立报告、时限、提供方、复核方、发送对象和留痕矩阵；再与协会细则及模板对照。","priority":[2,3,4,8,17,19,20,22,23,27,29,32,33,43,44],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总 则","text":"为了规范私募投资基金管理人（以下简称私募基金管理人）、私募投资基金托管人（以下简称私募基金托管人）向投资者提供信息的行为，保护投资者合法权益，促进私募投资基金（以下简称私募基金）行业规范健康发展，根据《中华人民共和国证券投资基金法》《私募投资基金监督管理条例》（以下简称《私募条例》）等法律、行政法规，制定本办法。"},{"n":2,"label":"第二条","chapter":"第一章 总 则","text":"私募基金管理人、私募基金托管人向投资者披露私募基金信息，私募基金销售机构接受私募基金管理人委托向投资者披露私募基金信息，适用本办法。"},{"n":3,"label":"第三条","chapter":"第一章 总 则","text":"私募基金管理人、私募基金托管人应当按照法律、行政法规、中国证券监督管理委员会（以下简称中国证监会）规定以及基金合同、公司章程或者合伙协议（以下统称基金合同）、托管协议约定，以投资者利益为根本出发点，向投资者披露私募基金信息，并保证所披露信息的真实性、准确性、完整性和及时性。"},{"n":4,"label":"第四条","chapter":"第一章 总 则","text":"私募基金销售机构接受私募基金管理人委托披露私募基金信息的，应当按照法律、行政法规、中国证监会规定以及基金合同、销售协议约定，真实、准确、完整、及时地向投资者披露有关信息。私募基金管理人不因委托私募基金销售机构披露信息而免除自身应当承担的信息披露义务。私募基金管理人应当及时将向投资者披露的信息提供给私募基金销售机构，私募基金销售机构不得对私募基金管理人提供的信息进行篡改。"},{"n":5,"label":"第五条","chapter":"第一章 总 则","text":"私募基金管理人向投资者披露私募基金信息，私募基金托管人履行与托管业务有关的私募基金信息披露职责，私募基金销售机构接受委托向投资者披露私募基金信息，应当恪尽职守，履行诚实守信、谨慎勤勉的义务，公平对待投资者。"},{"n":6,"label":"第六条","chapter":"第一章 总 则","text":"投资者通过私募基金管理人、私募基金托管人和私募基金销售机构披露的信息，了解私募基金是否按照基金合同约定开展投资以及实际投资运作等情况，并按照法律、行政法规、中国证监会规定和基金合同等约定的方式行使权利，保障自身合法权益。"},{"n":7,"label":"第七条","chapter":"第一章 总 则","text":"中国证监会及其派出机构依法对私募基金信息披露行为进行监督管理。中国证券投资基金业协会（以下简称基金业协会）依照法律、行政法规、章程和自律规则，对私募基金信息披露行为进行自律管理。"},{"n":8,"label":"第八条","chapter":"第二章 信息披露基本要求","text":"私募基金管理人应当按照基金合同约定的信息披露内容、渠道、方式、频率等，向投资者披露私募基金信息，并明确投资者就信息披露事项进行咨询的联络方式，以及私募基金管理人无法正常履行信息披露义务时的机制安排。基金合同约定信息披露事项应当充分考虑私募基金的产品类型、投资策略、风险状况等特征。基金合同约定的信息披露内容、频率等不得低于法律、行政法规和中国证监会规定的有关要求。"},{"n":9,"label":"第九条","chapter":"第二章 信息披露基本要求","text":"除依照规定和基金合同约定应当披露的信息外，私募基金管理人可以根据私募基金的投资范围、投资标的等情况自愿增加向全体投资者披露的内容，但不得与应当披露的信息相冲突，不得误导投资者，不得出于营销等目的临时性、选择性披露信息。"},{"n":10,"label":"第十条","chapter":"第二章 信息披露基本要求","text":"私募基金管理人应当按照与投资者约定的非公开方式，通过邮寄、电子邮件或者经过设置特定对象确定程序的网站、移动客户端等渠道，向持有该私募基金份额的投资者披露私募基金信息，并确保投资者能够按照基金合同约定的时间、渠道和方式获取信息。通过不同渠道披露私募基金同一信息的内容应当一致。"},{"n":11,"label":"第十一条","chapter":"第二章 信息披露基本要求","text":"私募基金管理人应当通过私募基金招募说明书、定期报告、临时报告等方式，向投资者披露私募基金信息。"},{"n":12,"label":"第十二条","chapter":"第二章 信息披露基本要求","text":"私募基金管理人应当在基金合同、信息披露文件中全面、客观揭示私募基金投资运作风险，对设计复杂、风险较高的私募基金以显著、清晰的方式揭示投资运作及交易等环节的相关风险。私募基金管理人在基金合同、信息披露文件中应当告知投资者，其需要根据自身风险承担能力审慎作出投资决策，充分了解相关投资运作情况，自行承担投资风险。"},{"n":13,"label":"第十三条","chapter":"第二章 信息披露基本要求","text":"私募基金投向其他私募基金、依法发行的资产管理产品（公开募集证券投资基金除外），或者通过特殊目的载体进行投资的，私募基金管理人按照本办法规定穿透披露时，被投资的私募基金、依法发行的资产管理产品（公开募集证券投资基金除外）、特殊目的载体应当予以配合。"},{"n":14,"label":"第十四条","chapter":"第二章 信息披露基本要求","text":"私募基金托管人应当履行披露基金托管协议、定期出具基金托管人报告、对私募证券投资基金财务情况等信息及时进行复核审查并出具意见等信息披露职责。"},{"n":15,"label":"第十五条","chapter":"第二章 信息披露基本要求","text":"私募基金托管人应当对私募证券投资基金的资金头寸、证券账目、基金净值、基金申购和赎回价格以及信息披露文件中基金财务情况等信息及时进行复核审查，及时核查认购与申购资金的到账、赎回资金的支付以及投资资金的支付与到账情况，并向私募基金管理人进行书面或者电子确认。私募基金管理人应当及时将复核审查所需信息提供给私募基金托管人。私募基金管理人应当向投资者披露经私募基金托管人复核的私募证券投资基金有关信息。私募基金托管人发现私募证券投资基金的净值计价出现错误的，应当提示私募基金管理人立即纠正，并采取合理措施防止损失进一步扩大。私募基金托管人发现基金净值计价出现重大错误或者估值出现重大偏离，且私募基金管理人拒不改正的，应当提示私募基金管理人依法履行信息披露义务，并向基金业协会、私募基金管理人注册地中国证监会派出机构报告。"},{"n":16,"label":"第十六条","chapter":"第二章 信息披露基本要求","text":"私募基金销售机构以外的其他私募基金服务机构，接受私募基金管理人委托开展与私募基金信息披露相关的估值等服务业务，应当按照法律、行政法规、中国证监会规定和基金合同、服务协议等约定履行相关职责。"},{"n":17,"label":"第十七条","chapter":"第二章 信息披露基本要求","text":"向投资者披露信息不得存在以下行为：\n（一）虚假记载、误导性陈述或者重大遗漏；\n（二）对投资业绩进行预测；\n（三）向投资者承诺投资本金不受损失或者承诺最低收益、最大亏损；\n（四）公开披露或者变相公开披露；\n（五）夸大或者片面宣传私募基金管理人、基金经理或者私募基金的过往业绩；\n（六）恶意诋毁、贬低其他私募基金管理人、私募基金托管人、私募基金销售机构或者其他私募基金；\n（七）法律、行政法规和中国证监会规定的其他禁止行为。"},{"n":18,"label":"第十八条","chapter":"第三章 定期报告","text":"私募基金管理人应当定期向投资者披露私募证券投资基金份额净值、份额累计净值、资产净值等信息。开放式私募证券投资基金的份额净值、份额累计净值披露频率不得低于基金开放频率。封闭式私募证券投资基金应当至少每季度向投资者披露一次基金净值信息。"},{"n":19,"label":"第十九条","chapter":"第三章 定期报告","text":"私募基金管理人应当在每季度结束之日起一个月内向投资者披露私募证券投资基金季度报告。季度报告应当包括以下信息：\n（一）私募基金的产品类型、投资范围、投资策略、投资限制等基本情况；\n（二）报告期末的基金净值、基金份额及其变动情况，报告期的基金收益、各项费用及利润等财务情况；\n（三）估值原则、估值方法、估值程序等情况；\n（四）报告期末投资资产类别、金额、比例等情况。投资股票资产的，还应当披露按行业分类的股票投资组合金额及占比；投资债券资产的，还应当披露按评级分类的债券投资组合金额及占比；投资衍生品资产的，还应当披露衍生品资产的类别、金额、挂钩资产类别等情况；\n（五）杠杆运用、无法以合理价格变现的流动性受限资产、跨境投资等情况；\n（六）报告期私募基金管理人运用基金财产与自己、投资者、所管理的其他私募基金、实际控制人控制的其他私募基金管理人管理的私募基金，或者与其有重大利害关系的其他主体进行的关联交易（以下简称关联交易）的金额、交易对手方、交易价格、定价依据、决策程序等情况；\n（七）私募基金托管人对基金财务情况等信息的复核意见；\n（八）报告期主要投资风险或者影响投资策略的情况以及应对方式；\n（九）法律、行政法规、中国证监会规定和基金合同约定的其他内容。投向其他私募基金或者依法发行的资产管理产品（公开募集证券投资基金除外）的私募证券投资基金，在按照前款第四项规定披露投资资产情况时，还应当披露投资路径、穿透后的投资资产情况。"},{"n":20,"label":"第二十条","chapter":"第三章 定期报告","text":"私募基金管理人应当在每年度结束之日起四个月内向投资者披露私募证券投资基金年度报告。年度报告应当包括以下信息：\n（一）本办法第十九条规定应当披露的信息；\n（二）私募基金年度财务会计报告，财务会计报告应当对关联交易情况进行专项说明。按照规定应当进行外部审计的，应当同时披露外部审计意见；\n（三）私募基金管理人报告，包括私募基金管理人基本情况、对投资策略和业绩表现的解释说明等；\n（四）私募基金托管人报告；\n（五）法律、行政法规、中国证监会规定和基金合同约定的其他内容。"},{"n":21,"label":"第二十一条","chapter":"第三章 定期报告","text":"私募证券投资基金存在以下情形之一的，其年度财务会计报告应当经符合《中华人民共和国证券法》（以下简称《证券法》）规定的会计师事务所审计：\n（一）主要投向流动性受限资产的；\n（二）主要投向衍生品资产的；\n（三）主要投向境外资产（直接投资于境外标准化资产的除外）的；\n（四）主要投向其他私募基金管理人管理的私募基金的；\n（五）中国证监会规定的其他情形。"},{"n":22,"label":"第二十二条","chapter":"第三章 定期报告","text":"私募基金管理人应当在每半年结束之日起两个月内向投资者披露私募股权投资基金半年度报告。半年度报告应当包括以下信息：\n（一）私募基金的产品类型、投资范围、投资策略、投资限制等基本情况；\n（二）报告期末基金净资产及变动情况，基金认缴、实缴情况，投资者变动情况，报告期的基金收益、各项费用及利润等财务情况；\n（三）估值原则、估值方法、估值程序等情况；\n（四）报告期末私募基金投资标的情况，包括投资标的名称、投资金额及比例、投资标的投资架构、权属确认等信息及变动情况；\n（五）杠杆运用、跨境投资等情况；\n（六）报告期私募基金关联交易的金额、交易对手方、交易价格、定价依据、决策程序等情况；\n（七）报告期新增投资情况以及决策程序情况，报告期项目退出情况以及退出资金分配情况；\n（八）报告期主要投资风险或者影响投资策略的情况以及应对方式；\n（九）法律、行政法规、中国证监会规定和基金合同约定的其他内容。投向其他私募基金，或者通过特殊目的载体进行投资的私募股权投资基金，在按照前款第四项规定披露投资标的情况时，还应当披露投资路径、穿透后的投资标的情况。"},{"n":23,"label":"第二十三条","chapter":"第三章 定期报告","text":"私募基金管理人应当在每年度结束之日起六个月内向投资者披露私募股权投资基金年度报告。年度报告应当包括以下信息：\n（一）本办法第二十二条规定应当披露的信息；\n（二）经审计的私募基金年度财务会计报告、外部审计意见。财务会计报告应当对关联交易情况进行专项说明；\n（三）私募基金管理人报告，包括私募基金管理人基本情况、对私募基金运作情况的解释说明等；\n（四）已托管私募基金的私募基金托管人报告；\n（五）法律、行政法规、中国证监会规定和基金合同约定的其他内容。"},{"n":24,"label":"第二十四条","chapter":"第三章 定期报告","text":"私募股权投资基金的年度财务会计报告应当经会计师事务所审计。私募股权投资基金管理规模较大且自然人投资者较多的，以及存在中国证监会规定的其他情形的，其年度财务会计报告应当经符合《证券法》规定的会计师事务所审计。"},{"n":25,"label":"第二十五条","chapter":"第三章 定期报告","text":"私募基金管理人应当向投资者披露创业投资基金年度报告，披露的内容、时间和审计要求按照本办法对私募股权投资基金的要求执行。"},{"n":26,"label":"第二十六条","chapter":"第三章 定期报告","text":"私募基金成立不足三个月的，私募基金管理人可以不编制当期的季度报告、半年度报告或者年度报告。"},{"n":27,"label":"第二十七条","chapter":"第四章 临时报告和清算报告","text":"私募基金发生重大事件，私募基金管理人应当及时编制临时报告，并在该事项发生之日起五个工作日内向投资者披露。前款所称重大事件，是指已经或者可能对投资者权益产生重大影响的下列事件：\n（一）基金份额持有人会议、合伙人会议或者股东会的召开及决议事项；\n（二）变更私募基金名称、组织形式；\n（三）更换私募基金管理人、私募基金托管人，以及私募基金管理人的名称、住所、法定代表人、执行事务合伙人或者其委派代表、控股股东、实际控制人发生变更；\n（四）变更基金经理、存续期限、投资范围、投资策略、投资架构、估值方法、收益分配安排、费用计提标准及方式、基金费率等重要事项；\n（五）重大关联交易的金额、交易对手方、交易价格、定价依据、决策程序等情况；\n（六）主要投资标的出现重大不利情形；\n（七）私募基金清算；\n（八）涉及私募基金的重大诉讼、仲裁；\n（九）对私募基金运作产生重大影响的机构或者人员受到重大行政、刑事处罚；\n（十）私募基金管理人认为已经或者可能对投资者权益产生重大影响的其他事项；\n（十一）法律、行政法规、中国证监会规定和基金合同约定的其他事项。出现本条第二款第六项情形对投资者权益产生重大负面影响的，私募基金管理人应当在临时报告中同时向投资者说明有关原因，并进行风险提示。"},{"n":28,"label":"第二十八条","chapter":"第四章 临时报告和清算报告","text":"私募基金托管人在履行职责过程中，发现私募基金管理人、私募基金存在已经或者可能对投资者权益产生重大负面影响的情形的，应当及时提示私募基金管理人依法履行信息披露义务；发现私募基金管理人涉嫌侵占、挪用私募基金财产或者失联等情形的，应当及时向基金业协会、私募基金管理人注册地中国证监会派出机构报告。"},{"n":29,"label":"第二十九条","chapter":"第四章 临时报告和清算报告","text":"私募基金管理人应当及时向投资者披露清算公告、清算报告以及与清算有关的其他重大事项信息。私募基金因受托财产流动性受限等原因延期清算的，私募基金管理人应当及时向投资者说明。"},{"n":30,"label":"第三十条","chapter":"第五章 信息披露事务管理","text":"私募基金管理人、私募基金托管人应当建立健全信息披露管理制度，指定专门部门和高级管理人员负责信息披露事务。"},{"n":31,"label":"第三十一条","chapter":"第五章 信息披露事务管理","text":"信息披露管理制度应当包括以下事项：\n（一）信息披露的内容、渠道、方式、频率等；\n（二）信息披露的管理部门、工作流程及内控机制；\n（三）办理投资者信息披露咨询事项的工作机制；\n（四）信息披露相关文件、资料的档案管理；\n（五）未按规定披露信息的责任追究机制。"},{"n":32,"label":"第三十二条","chapter":"第五章 信息披露事务管理","text":"私募基金管理人的股东、合伙人、实际控制人应当配合私募基金管理人履行信息披露义务，主动向私募基金管理人告知其与私募基金信息披露相关的事项，不得隐瞒或者提供虚假信息，不得组织、指使或者配合私募基金管理人实施违反信息披露规定的行为。"},{"n":33,"label":"第三十三条","chapter":"第五章 信息披露事务管理","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构应当建立未公开信息管理制度，并加强对未公开信息的管控。上述机构及其从业人员不得泄露因职务便利获取的未公开信息，不得利用该信息从事或者明示、暗示他人从事相关的证券、期货交易活动。"},{"n":34,"label":"第三十四条","chapter":"第五章 信息披露事务管理","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构应当妥善保管私募基金信息披露相关文件资料，保存期限自基金清算结束之日起不得少于二十年。"},{"n":35,"label":"第三十五条","chapter":"第六章 监督管理和法律责任","text":"中国证监会及其派出机构对私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构，以及前述机构的从业人员从事私募基金信息披露及相关服务的情况进行监督管理，按照法律、行政法规规定采取有关措施。相关单位及个人应当予以配合，不得拒绝、阻碍和隐瞒。"},{"n":36,"label":"第三十六条","chapter":"第六章 监督管理和法律责任","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构，以及前述机构的从业人员从事私募基金信息披露活动违反本办法规定的，中国证监会及其派出机构可以对上述主体及其直接负责的主管人员和其他直接责任人员采取下列行政监管措施：\n（一）责令改正；\n（二）监管谈话；\n（三）出具警示函；\n（四）法律、行政法规和中国证监会规章规定的其他措施。私募基金管理人的股东、合伙人、实际控制人违反本办法第三十二条规定，可以按照前款规定对相关股东、合伙人、实际控制人及其责任人员采取行政监管措施。"},{"n":37,"label":"第三十七条","chapter":"第六章 监督管理和法律责任","text":"私募基金管理人、私募基金托管人及其从业人员违反本办法第三条、第八条、第十条、第十二条、第十七条至第二十五条、第二十七条、第二十九条规定的，中国证监会及其派出机构可以依照《私募条例》第五十六条进行处罚。私募基金管理人、私募基金托管人及其从业人员违反本办法第三十三条第二款规定的，中国证监会及其派出机构可以依照《私募条例》第五十五条进行处罚。"},{"n":38,"label":"第三十八条","chapter":"第六章 监督管理和法律责任","text":"私募基金管理人的股东、合伙人、实际控制人违反本办法第三十二条规定的，中国证监会及其派出机构可以依照《私募条例》第四十五条进行处罚。"},{"n":39,"label":"第三十九条","chapter":"第六章 监督管理和法律责任","text":"有下列情形之一的，中国证监会及其派出机构可以给予警告或者通报批评，并处十万元以下的罚款；涉及金融安全且有危害后果的，并处二十万元以下的罚款。对直接负责的主管人员和其他直接责任人员可以给予警告或者通报批评，并处十万元以下的罚款；涉及金融安全且有危害后果的，并处二十万元以下的罚款：\n（一）私募基金管理人违反本办法第九条规定的；\n（二）私募基金托管人违反本办法第十四条、第十五条、第二十八条规定的；\n（三）私募基金销售机构违反本办法第四条、第十七条规定的；\n（四）私募基金管理人、私募基金托管人违反本办法第三十条、第三十一条规定，未建立信息披露管理制度的；\n（五）私募基金管理人、私募基金托管人违反本办法第三十三条第一款规定的；\n（六）私募基金销售机构及其他私募基金服务机构，以及前述机构的从业人员违反本办法第三十三条规定的；\n（七）中国证监会规定的其他情形。"},{"n":40,"label":"第四十条","chapter":"第七章 附 则","text":"中国证监会对募集期间私募基金信息披露另有规定的，从其规定。"},{"n":41,"label":"第四十一条","chapter":"第七章 附 则","text":"符合中国证监会规定条件，将主要基金财产投资于其他私募基金的私募基金，法律、行政法规、中国证监会对其信息披露另有规定的，从其规定。"},{"n":42,"label":"第四十二条","chapter":"第七章 附 则","text":"本办法所称信息披露，是指私募基金管理人、私募基金托管人按照规定和约定，采用非公开方式向投资者提供私募基金信息。"},{"n":43,"label":"第四十三条","chapter":"第七章 附 则","text":"本办法所称私募基金，不包括证券期货经营机构依法设立的私募资产管理计划。"},{"n":44,"label":"第四十四条","chapter":"第七章 附 则","text":"本办法自 2026年 9月 1日起施行。"}],"source":"https://www.csrc.gov.cn/csrc/c101953/c7616837/content.shtml","textSource":"https://www.csrc.gov.cn/shanghai/c105565/c7620466/7620466/files/%E9%99%84%E4%BB%B61%EF%BC%9A%E7%A7%81%E5%8B%9F%E6%8A%95%E8%B5%84%E5%9F%BA%E9%87%91%E4%BF%A1%E6%81%AF%E6%8A%AB%E9%9C%B2%E7%9B%91%E7%9D%A3%E7%AE%A1%E7%90%86%E5%8A%9E%E6%B3%95.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"b08e90deeddd716dfd5d73daeb90433e991290ce249a19480ad223806f2abfcf"},{"id":"strengthen","title":"关于加强私募投资基金监管的若干规定","level":"规范性文件","issuer":"中国证监会","version":"证监会公告〔2020〕71号","effective":"公布日起施行；落款2020-12-30，官网发布2021-01-08","scope":"通用","topics":["募集红线","关联交易","投资范围"],"overview":"围绕私募主体、募集行为、投资边界与利益冲突的底线要求。需同2023条例及后续规则共同阅读，注意原文过渡条款的历史时点。","practice":"把禁止事项转成募集材料审核、交易限制、关联方识别与异常升级的检查项。","priority":[4,6,8,9,11],"articles":[{"n":1,"label":"第一条","chapter":"正文","text":"为了规范私募投资基金（以下简称私募基金）业务活动，保护投资者和相关当事人的合法权益，促进私募基金行业健康发展，防范金融风险，根据《证券投资基金法》《私募投资基金监督管理暂行办法》（以下简称《私募办法》）等法律法规，制定本规定。"},{"n":2,"label":"第二条","chapter":"正文","text":"在中国证券投资基金业协会（以下简称基金业协会）依法登记的私募基金管理人从事私募基金业务，适用本规定。私募基金管理人在初次开展资金募集、基金管理等私募基金业务活动前，应当按照规定在基金业协会完成登记。"},{"n":3,"label":"第三条","chapter":"正文","text":"未经登记，任何单位或者个人不得使用“基金”或者“基金管理”字样或者近似名称进行私募基金业务活动，法律、行政法规另有规定的除外。私募基金管理人应当在名称中标明“私募基金”“私募基金管理”“创业投资”字样，并在经营范围中标明“私募投资基金管理”“私募证券投资基金管理”“私募股权投资基金管理”“创业投资基金管理”等体现受托管理私募基金特点的字样。"},{"n":4,"label":"第四条","chapter":"正文","text":"私募基金管理人不得直接或者间接从事民间借贷、担保、保理、典当、融资租赁、网络借贷信息中介、众筹、场外配资等任何与私募基金管理相冲突或者无关的业务，中国证券监督管理委员会（以下简称中国证监会）另有规定的除外。"},{"n":5,"label":"第五条","chapter":"正文","text":"私募基金管理人的出资人不得有代持、循环出资、交叉出资、层级过多、结构复杂等情形，不得隐瞒关联关系或者将关联关系非关联化。同一单位、个人控股或者实际控制两家及以上私募基金管理人的，应当具有设立多个私募基金管理人的合理性与必要性，全面、及时、准确披露各私募基金管理人业务分工，建立完善的合规风控制度。"},{"n":6,"label":"第六条","chapter":"正文","text":"私募基金管理人、私募基金销售机构及其从业人员在私募基金募集过程中不得直接或者间接存在下列行为：\n（一）向《私募办法》规定的合格投资者之外的单位、个人募集资金或者为投资者提供多人拼凑、资金借贷等满足合格投资者要求的便利；\n（二）通过报刊、电台、电视、互联网等公众传播媒体，讲座、报告会、分析会等方式，布告、传单、短信、即时通讯工具、博客和电子邮件等载体，向不特定对象宣传推介，但是通过设置特定对象确定程序的官网、客户端等互联网媒介向合格投资者进行宣传推介的情形除外；\n（三）口头、书面或者通过短信、即时通讯工具等方式直接或者间接向投资者承诺保本保收益，包括投资本金不受损失、固定比例损失或者承诺最低收益等情形；\n（四）夸大、片面宣传私募基金，包括使用安全、保本、零风险、收益有保障、高收益、本金无忧等可能导致投资者不能准确认识私募基金风险的表述，或者向投资者宣传预期收益率、目标收益率、基准收益率等类似表述；\n（五）向投资者宣传的私募基金投向与私募基金合同约定投向不符；\n（六）宣传推介材料有虚假记载、误导性陈述或者重大遗漏，包括未真实、准确、完整披露私募基金交易结构、各方主要权利义务、收益分配、费用安排、关联交易、委托第三方机构以及私募基金管理人的出资人、实际控制人等情况；\n（七）以登记备案、金融机构托管、政府出资等名义为增信手段进行误导性宣传推介；\n（八）委托不具有基金销售业务资格的单位或者个人从事资金募集活动；\n（九）以从事资金募集活动为目的设立或者变相设立分支机构；\n（十）法律、行政法规和中国证监会禁止的其他情形。私募基金管理人的出资人、实际控制人、关联方不得从事私募基金募集宣传推介，不得从事或者变相从事前款所列行为。私募基金募集完毕，私募基金管理人应当按照规定到基金业协会履行备案手续。私募基金管理人不得管理未备案的私募基金。"},{"n":7,"label":"第七条","chapter":"正文","text":"私募基金的投资者人数累计不得超过《证券投资基金法》《公司法》《合伙企业法》等法律规定的特定数量。投资者转让基金份额的，受让人应当为合格投资者且基金份额受让后投资者人数应当符合本条规定。国务院金融监督管理部门监管的机构依法发行的资产管理产品、合格境外机构投资者、人民币合格境外机构投资者，视为《私募办法》第十三条规定的合格投资者，不再穿透核查最终投资者。任何单位和个人不得通过将私募基金份额或者其收（受）益权进行拆分转让，或者通过为单一融资项目设立多只私募基金等方式，以变相突破合格投资者标准或投资者人数限制。"},{"n":8,"label":"第八条","chapter":"正文","text":"私募基金管理人不得直接或者间接将私募基金财产用于下列投资活动：\n（一）借（存）贷、担保、明股实债等非私募基金投资活动，但是私募基金以股权投资为目的，按照合同约定为被投企业提供1年期限以内借款、担保除外；\n（二）投向保理资产、融资租赁资产、典当资产等类信贷资产、股权或其收（受）益权；\n（三）从事承担无限责任的投资；\n（四）法律、行政法规和中国证监会禁止的其他投资活动。私募基金有前款第（一）项规定行为的，借款或者担保到期日不得晚于股权投资退出日，且借款或者担保余额不得超过该私募基金实缴金额的 20%；中国证监会另有规定的除外。"},{"n":9,"label":"第九条","chapter":"正文","text":"私募基金管理人及其从业人员从事私募基金业务，不得有下列行为：\n（一）未对不同私募基金单独管理、单独建账、单独核算，将其固有财产、他人财产混同于私募基金财产，将不同私募基金财产混同运作，或者不公平对待不同私募基金财产；\n（二）使用私募基金管理人及其关联方名义、账户代私募基金收付基金财产；\n（三）开展或者参与具有滚动发行、集合运作、期限错配、分离定价等特征的资金池业务；\n（四）以套取私募基金财产为目的，使用私募基金财产直接或者间接投资于私募基金管理人、控股股东、实际控制人及其实际控制的企业或项目等自融行为；\n（五）不公平对待同一私募基金的不同投资者，损害投资者合法权益；\n（六）私募基金收益不与投资项目的资产、收益、风险等情况挂钩，包括不按照投资标的实际经营业绩或者收益情况向投资者分红、支付收益等；\n（七）直接或者间接侵占、挪用私募基金财产；\n（八）不按照合同约定进行投资运作或者向投资者进行信息披露；\n（九）利用私募基金财产或者职务之便，以向私募基金、私募基金投资标的及其关联方收取咨询费、手续费、财务顾问费等名义，为自身或者投资者以外的人牟取非法利益、进行利益输送；\n（十）泄露因职务便利获取的未公开信息、利用该信息从事或者明示、暗示他人从事相关的交易活动；\n（十一）从事内幕交易、操纵证券期货市场及其他不正当交易活动；\n（十二）玩忽职守，不按照监管规定或者合同约定履行职责；\n（十三）法律、行政法规和中国证监会禁止的其他行为。私募基金管理人的出资人和实际控制人，私募基金托管人、私募基金销售机构及其他私募基金服务机构及其出资人、实际控制人，不得有前款所列行为或者为前款行为提供便利。"},{"n":10,"label":"第十条","chapter":"正文","text":"私募基金管理人管理的私募基金不得直接或者间接投资于国家禁止或者限制投资的项目，不符合国家产业政策、环境保护政策、土地管理政策的项目，但证券市场投资除外。"},{"n":11,"label":"第十一条","chapter":"正文","text":"私募基金管理人不得从事损害私募基金财产或者投资者利益的关联交易等投资活动。私募基金管理人应当建立健全关联交易管理制度，对关联交易定价方法、交易审批程序等进行规范。使用私募基金财产与关联方进行交易的，私募基金管理人应当遵守法律、行政法规、中国证监会的规定和私募基金合同约定，防范利益冲突，投资前应当取得全体投资者或者投资者认可的决策机制决策同意，投资后应当及时向投资者充分披露信息。"},{"n":12,"label":"第十二条","chapter":"正文","text":"私募基金管理人及其出资人和实际控制人、私募基金托管人、私募基金销售机构和其他私募基金服务机构所提交的登记备案信息及其他信息材料，不得有虚假记载、误导性陈述或者重大遗漏，并应当按照规定持续履行信息披露和报送义务，确保所提交信息材料及时、准确、真实、完整。私募基金管理人及其出资人和实际控制人、私募基金托管人、私募基金销售机构和其他私募基金服务机构及其从业人员应当配合中国证监会及其派出机构依法履行职责，如实提供有关文件和材料，不得拒绝、阻碍和隐瞒。"},{"n":13,"label":"第十三条","chapter":"正文","text":"中国证监会及其派出机构依法从严监管私募基金管理人、私募基金托管人、私募基金销售机构和其他私募基金服务机构及其从业人员的私募基金业务活动，严厉打击各类违法违规行为。对违反本规定的，中国证监会及其派出机构可以依照《私募办法》的规定，采取行政监管措施、市场禁入措施，实施行政处罚，并记入中国资本市场诚信信息数据库；涉嫌犯罪的，依法移送司法机关追究刑事责任。《证券投资基金法》等法律、行政法规另有规定的，依照其规定处理。基金业协会依法开展私募基金管理人登记和私募基金备案，加强自律管理与风险监测。对违反本规定的，基金业协会可以依法依规进行处理。"},{"n":14,"label":"第十四条","chapter":"正文","text":"本规定自发布之日起施行。证券公司、基金管理公司、期货公司及其子公司从事私募基金业务，不适用本规定。本规定施行前已登记私募基金管理人不符合本规定，按下列要求执行：\n（一）不符合本规定第四条、第五条、第六条第一款第（九）项、第十一条的，应当自本规定施行之日起一年内完成整改；\n（二）不符合本规定第六条第三款的，应当自本规定施行之日六个月内完成整改，整改期内暂停新增私募基金募集和备案；\n（三）不符合本规定第六条第一款第（一）项至第（八）项、第六条第一款第（十）项、第七条、第九条、第十二条的，中国证监会及其派出机构可以依照本规定第十三条进行处理，基金业协会可以依法依规进行处理；\n（四）不符合本规定第八条、第十条的，不得新增此类投资，不得新增募集规模，不得新增投资者，不得展期，合同到期后予以清算。"}],"source":"https://www.csrc.gov.cn/csrc/c101939/c1416932/content.shtml","textSource":"https://www.csrc.gov.cn/csrc/c101939/c1416932/1416932/files/%E9%99%84%E4%BB%B61%EF%BC%9A%E3%80%8A%E5%85%B3%E4%BA%8E%E5%8A%A0%E5%BC%BA%E7%A7%81%E5%8B%9F%E6%8A%95%E8%B5%84%E5%9F%BA%E9%87%91%E7%9B%91%E7%AE%A1%E7%9A%84%E8%8B%A5%E5%B9%B2%E8%A7%84%E5%AE%9A%E3%80%8B.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"2f55dbd5333eebaf7748a560c0da14a8615d92798ff95eacd8ebb161eb52050b"},{"id":"register","title":"私募投资基金登记备案办法","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"中基协发〔2023〕5号","effective":"2023-05-01","scope":"通用","topics":["登记","备案","变更","清算","报送"],"overview":"连接管理人准入、产品备案与持续运营的核心自律规则。登记备案不是业绩、合规或财产安全的保证。","practice":"区分管理人信息变更、产品信息变更、定期报送、重大事件和清算。每个流程明确触发点、计算口径、材料及回执。","priority":[8,13,29,32,33,35,38,39,47,55,56,57,59,60,61,62],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"为了规范私募投资基金（以下简称私募基金）业务，保护投资者合法权益，促进私募基金行业健康发展，根据《中华人民共和国证券投资基金法》《私募投资基金监督管理暂行办法》等法律、行政法规和中国证券监督管理委员会（以下简称中国证监会）规定，制定本办法。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"在中华人民共和国境内，以非公开方式募集资金设立投资基金，由私募基金管理人管理，为基金份额持有人的利益进行投资活动，适用本办法。非公开募集资金，以进行投资活动为目的设立的公司或者合伙企业，资产由私募基金管理人或者普通合伙人管理的，其私募基金业务活动适用本办法。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"从事私募基金活动，应当遵循自愿、公平、诚实信用原则，维护投资者合法权益，不得损害国家利益、社会公共利益和他人合法权益。私募基金管理人、私募基金托管人和私募基金服务机构从事私募基金业务活动，应当遵循投资者利益优先原则，恪尽职守，履行诚实信用、谨慎勤勉的义务，防范利益输送和利益冲突。私募基金从业人员应当遵守法律、行政法规和有关规定，恪守职业道德和行为规范，具备从事基金业务所需的专业能力。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"私募基金管理人应当按照规定，向中国证券投资基金业协会（以下简称协会）履行登记备案手续，持续报送相关信息。私募基金管理人应当诚实守信，保证提交的信息及材料真实、准确、完整，不得有虚假记载、误导性陈述或者重大遗漏。协会按照依法合规、公开透明、便捷高效的原则办理登记备案，对私募基金管理人及其管理的私募基金进行穿透核查。"},{"n":5,"label":"第五条","chapter":"第一章 总则","text":"协会办理登记备案不表明对私募基金管理人的投资能力、风控合规和持续经营情况作出实质性判断，不作为对私募基金财产安全和投资者收益的保证，也不表明协会对登记备案材料的真实性、准确性、完整性作出保证。投资者应当充分了解私募基金的投资范围、投资策略和风险收益等信息，根据自身风险承担能力审慎选择私募基金管理人和私募基金，自主判断投资价值，自行承担投资风险。"},{"n":6,"label":"第六条","chapter":"第一章 总则","text":"协会依法制定章程和行业自律规则，对私募基金行业进行自律管理，保护投资者合法权益，协调行业关系，提供行业服务，促进行业发展。"},{"n":7,"label":"第七条","chapter":"第一章 总则","text":"协会按照分类管理、扶优限劣的原则，对私募基金管理人和私募基金实施差异化自律管理和行业服务。协会支持治理结构健全、运营合规稳健、专业能力突出、诚信记录良好的私募基金管理人规范发展，对其办理登记备案业务提供便利。"},{"n":8,"label":"第八条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人应当是在中华人民共和国境内依法设立的公司或者合伙企业，并持续符合下列要求：\n（一）财务状况良好，实缴货币资本不低于 1000万元人民币或者等值可自由兑换货币，对专门管理创业投资基金的私募基金管理人另有规定的，从其规定；\n（二）出资架构清晰、稳定，股东、合伙人和实际控制人具有良好的信用记录，控股股东、实际控制人、普通合伙人具有符合要求的相关经验；\n（三）法定代表人、执行事务合伙人或其委派代表、负责投资管理的高级管理人员直接或者间接合计持有私募基金管理人一定比例的股权或者财产份额；\n（四）高级管理人员具有良好的信用记录，具备与所任职务相适应的专业胜任能力和符合要求的相关工作经验；专职员工不少于 5 人，对本办法第十七条规定的私募基金管理人另有规定的，从其规定；\n（五）内部治理结构健全、风控合规制度和利益冲突防范机制等完善；\n（六）有符合要求的名称、经营范围、经营场所和基金管理业务相关设施；\n（七）法律、行政法规、中国证监会和协会规定的其他情形。商业银行、证券公司、基金管理公司、期货公司、信托公司、保险公司等金融机构控制的私募基金管理人，政府及其授权机构控制的私募基金管理人，受境外金融监管部门监管的机构控制的私募基金管理人以及其他符合规定的私募基金管理人，不适用前款第三项的规定。"},{"n":9,"label":"第九条","chapter":"第二章 私募基金管理人登记","text":"有下列情形之一的，不得担任私募基金管理人的股东、合伙人、实际控制人：\n（一）未以合法自有资金出资，以委托资金、债务资金等非自有资金出资，违规通过委托他人或者接受他人委托方式持有股权、财产份额，存在循环出资、交叉持股、结构复杂等情形，隐瞒关联关系；\n（二）治理结构不健全，运作不规范、不稳定，不具备良好的财务状况，资产负债和杠杆比例不适当，不具有与私募基金管理人经营状况相匹配的持续资本补充能力；\n（三）控股股东、实际控制人、普通合伙人没有经营、管理或者从事资产管理、投资、相关产业等相关经验，或者相关经验不足 5年；\n（四）控股股东、实际控制人、普通合伙人、主要出资人在非关联私募基金管理人任职，或者最近 5年从事过冲突业务；\n（五）法律、行政法规、中国证监会和协会规定的其他情形。私募基金管理人的实际控制人为自然人的，除另有规定外应当担任私募基金管理人的董事、监事、高级管理人员，或者执行事务合伙人或其委派代表。"},{"n":10,"label":"第十条","chapter":"第二章 私募基金管理人登记","text":"有下列情形之一的，不得担任私募基金管理人的法定代表人、高级管理人员、执行事务合伙人或其委派代表：\n（一）最近 5年从事过冲突业务；\n（二）不符合中国证监会和协会规定的基金从业资格、执业条件；\n（三）没有与拟任职务相适应的经营管理能力，或者没有符合要求的相关工作经验；\n（四）法律、行政法规、中国证监会和协会规定的其他情形。私募证券基金管理人法定代表人、执行事务合伙人或其委派代表、经营管理主要负责人以及负责投资管理的高级管理人员应当具有 5年以上证券、基金、期货投资管理等相关工作经验。私募股权基金管理人法定代表人、执行事务合伙人或其委派代表、经营管理主要负责人以及负责投资管理的高级管理人员应当具有 5年以上股权投资管理或者相关产业管理等工作经验。私募基金管理人合规风控负责人应当具有 3年以上投资相关的法律、会计、审计、监察、稽核，或者资产管理行业合规、风控、监管和自律管理等相关工作经验。私募基金管理人负责投资管理的高级管理人员还应当具有符合要求的投资管理业绩。"},{"n":11,"label":"第十一条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人的法定代表人、高级管理人员、执行事务合伙人或其委派代表应当保证有足够的时间和精力履行职责，对外兼职的应当具有合理性。私募基金管理人的法定代表人、高级管理人员、执行事务合伙人或其委派代表不得在非关联私募基金管理人、冲突业务机构等与所在机构存在利益冲突的机构兼职，或者成为其控股股东、实际控制人、普通合伙人。合规风控负责人应当独立履行对私募基金管理人经营管理合规性进行审查、监督、检查等职责，不得从事投资管理业务，不得兼任与合规风控职责相冲突的职务；不得在其他营利性机构兼职，但对本办法第十七条规定的私募基金管理人另有规定的，从其规定。"},{"n":12,"label":"第十二条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人的法定代表人、高级管理人员、执行事务合伙人或其委派代表以外的其他从业人员应当以所在机构的名义从事私募基金业务活动，不得在其他营利性机构兼职，但对本办法第十七条规定的私募基金管理人另有规定的，从其规定。"},{"n":13,"label":"第十三条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人应当建立健全内部控制、风险控制和合规管理等制度，保持经营运作合法、合规，保证内部控制健全、有效。私募基金管理人应当完善防火墙等隔离机制，有效隔离自有资金投资与私募基金业务，与从事冲突业务的关联方采取办公场所、人员、财务、业务等方面的隔离措施，切实防范内幕交易、利用未公开信息交易、利益冲突和利益输送。"},{"n":14,"label":"第十四条","chapter":"第二章 私募基金管理人登记","text":"在境内开展私募证券基金业务且外资持股比例合计不低于 25%的私募基金管理人，还应当持续符合下列要求：\n（一）私募证券基金管理人为在中国境内设立的公司；\n（二）境外股东为所在国家或者地区金融监管部门批准或者许可的金融机构，且所在国家或者地区的证券监管机构已与中国证监会或者中国证监会认可的其他机构签订证券监管合作谅解备忘录；\n（三）私募证券基金管理人及其境外股东最近 3年没有受到监管机构和司法机关的重大处罚；\n（四）资本金及其结汇所得人民币资金的使用，应当符合国家外汇管理部门的相关规定；\n（五）在境内从事证券及期货交易，应当独立进行投资决策，不得通过境外机构或者境外系统下达交易指令，中国证监会另有规定的除外；\n（六）法律、行政法规、中国证监会和协会规定的其他要求。有境外实际控制人的私募证券基金管理人，该境外实际控制人应当符合前款第二项、第三项的要求。"},{"n":15,"label":"第十五条","chapter":"第二章 私募基金管理人登记","text":"有下列情形之一的，不得担任私募基金管理人，不得成为私募基金管理人的控股股东、实际控制人、普通合伙人或者主要出资人：\n（一）有本办法第十六条规定情形；\n（二）被协会采取撤销私募基金管理人登记的纪律处分措施，自被撤销之日起未逾 3年；\n（三）因本办法第二十五条第一款第六项、第八项所列情形被终止办理私募基金管理人登记的机构及其控股股东、实际控制人、普通合伙人，自被终止登记之日起未逾 3年；\n（四）因本办法第七十七条所列情形被注销登记的私募基金管理人及其控股股东、实际控制人、普通合伙人，自被注销登记之日起未逾 3年；\n（五）存在重大经营风险或者出现重大风险事件；\n（六）从事的业务与私募基金管理存在利益冲突；\n（七）有重大不良信用记录尚未修复；\n（八）法律、行政法规、中国证监会和协会规定的其他情形。"},{"n":16,"label":"第十六条","chapter":"第二章 私募基金管理人登记","text":"有下列情形之一的，不得担任私募基金管理人的董事、监事、高级管理人员、执行事务合伙人或其委派代表：\n（一）因犯有贪污贿赂、渎职、侵犯财产罪或者破坏社会主义市场经济秩序罪，被判处刑罚；\n（二）最近 3年因重大违法违规行为被金融管理部门处以行政处罚；\n（三）被中国证监会采取市场禁入措施，执行期尚未届满；\n（四）最近 3年被中国证监会采取行政监管措施或者被协会采取纪律处分措施，情节严重；\n（五）对所任职的公司、企业因经营不善破产清算或者因违法被吊销营业执照负有个人责任的董事、监事、高级管理人员、执行事务合伙人或其委派代表，自该公司、企业破产清算终结或者被吊销营业执照之日起未逾 5年；\n（六）因违法行为或者违纪行为被开除的基金管理人、基金托管人、证券期货交易场所、证券公司、证券登记结算机构、期货公司等机构的从业人员和国家机关工作人员，自被开除之日起未逾 5年；\n（七）因违法行为被吊销执业证书或者被取消资格的律师、注册会计师和资产评估等机构的从业人员、投资咨询从业人员，自被吊销执业证书或者被取消资格之日起未逾 5年；\n（八）因违反诚实信用、公序良俗等职业道德或者存在重大违法违规行为，引发社会重大质疑或者产生严重社会负面影响且尚未消除；对所任职企业的重大违规行为或者重大风险负有主要责任未逾 3年；\n（九）因本办法第二十五条第一款第六项、第八项所列情形被终止私募基金管理人登记的机构的控股股东、实际控制人、普通合伙人、法定代表人、执行事务合伙人或其委派代表、负有责任的高级管理人员和直接责任人员，自该机构被终止私募基金管理人登记之日起未逾 3年；\n（十）因本办法第七十七条所列情形被注销登记的私募基金管理人的控股股东、实际控制人、普通合伙人、法定代表人、执行事务合伙人或其委派代表、负有责任的高级管理人员和直接责任人员，自该私募基金管理人被注销登记之日起未逾 3年；\n（十一）所负债务数额较大且到期未清偿，或者被列为严重失信人或者被纳入失信被执行人名单；\n（十二）法律、行政法规、中国证监会和协会规定的其他情形。"},{"n":17,"label":"第十七条","chapter":"第二章 私募基金管理人登记","text":"同一控股股东、实际控制人控制两家以上私募基金管理人的，应当符合中国证监会和协会的规定，具备充分的合理性与必要性，其控制的私募基金管理人应当持续、合规、有效展业。控股股东、实际控制人应当合理区分各私募基金管理人的业务范围，并就业务风险隔离、避免同业化竞争、关联交易管理和防范利益冲突等内控制度作出合理有效安排。"},{"n":18,"label":"第十八条","chapter":"第二章 私募基金管理人登记","text":"同一控股股东、实际控制人控制两家以上私募基金管理人的，应当建立与所控制的私募基金管理人的管理规模、业务情况相适应的持续合规和风险管理体系，在保障私募基金管理人自主经营的前提下，加强对私募基金管理人的合规监督、检查。协会根据私募基金管理人的业务开展情况、投资管理能力、内部治理情况和合规风控水平，对私募基金管理人实施分类管理和差异化自律管理。"},{"n":19,"label":"第十九条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人应当遵循专业化运营原则，主营业务清晰，基金投资活动与私募基金管理人登记类型相一致，除另有规定外不得兼营或者变相兼营多种类型的私募基金管理业务。私募基金管理人开展投资顾问业务，应当符合中国证监会和协会的要求。"},{"n":20,"label":"第二十条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人应当保持资本充足，满足持续运营、业务发展和风险防范需要，私募基金管理人的股东、合伙人不得虚假出资或者抽逃出资。私募基金管理人的控股股东、实际控制人、普通合伙人所持有的股权、财产份额或者实际控制权，自登记或者变更登记之日起 3年内不得转让，但有下列情形之一的除外：\n（一）股权、财产份额按照规定进行行政划转或者变更；\n（二）股权、财产份额在同一实际控制人控制的不同主体之间进行转让；\n（三）私募基金管理人实施员工股权激励，但未改变实际控制人地位；\n（四）因继承等法定原因取得股权或者财产份额；\n（五）法律、行政法规、中国证监会和协会规定的其他情形。"},{"n":21,"label":"第二十一条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人应当保持管理团队和相关人员的充足、稳定。高级管理人员应当持续符合本办法的相关任职要求，原高级管理人员离职后，私募基金管理人应当按照公司章程规定或者合伙协议约定，由符合任职要求的人员代为履职，并在 6个月内聘任符合岗位要求的高级管理人员，不得因长期缺位影响内部治理和经营业务的有效运转。私募基金管理人在首支私募基金完成备案手续之前，不得更换法定代表人、执行事务合伙人或其委派代表、经营管理主要负责人、负责投资管理的高级管理人员和合规风控负责人。"},{"n":22,"label":"第二十二条","chapter":"第二章 私募基金管理人登记","text":"私募基金管理人应当在开展基金募集、投资管理等私募基金业务活动前，向协会报送以下基本信息和材料，履行登记手续：\n（一）统一社会信用代码等主体资格证明材料；\n（二）公司章程或者合伙协议；\n（三）实缴资本、财务状况的文件材料；\n（四）股东、合伙人、实际控制人、法定代表人、高级管理人员、执行事务合伙人或其委派代表的基本信息、诚信信息和相关投资能力、经验等材料；\n（五）股东、合伙人、实际控制人相关受益所有人信息；\n（六）分支机构、子公司以及其他关联方的基本信息；\n（七）资金募集、宣传推介、运营风控和信息披露等业务规范和制度文件；\n（八）经中国证监会备案的会计师事务所审计的财务报告和经中国证监会备案的律师事务所出具的法律意见书；\n（九）保证提交材料真实、准确、完整和遵守监督管理、自律管理规定，以及对规定事项的合法性、真实性、有效性负责的信用承诺书；\n（十）中国证监会、协会规定的其他信息和材料。私募基金管理人应当确保在登记备案电子系统中填报的邮寄地址、传真地址、电话号码、电子邮箱等联系方式和送达地址真实、有效和及时更新，并承担中国证监会及其派出机构、协会按照上述联系方式无法取得有效联系的相应后果。律师事务所、会计师事务所接受委托为私募基金管理人履行登记手续出具法律意见书、审计报告等文件，应当恪尽职守、勤勉尽责，审慎履行核查和验证义务，保证其出具文件的真实性、准确性、完整性。"},{"n":23,"label":"第二十三条","chapter":"第二章 私募基金管理人登记","text":"协会自私募基金管理人登记材料齐备之日起 20个工作日内办结登记手续。拟登记机构提交的登记信息、材料不完备或者不符合要求的，应当根据协会的要求及时补正，或者作出解释说明或者补充、修改。协会可以采取要求书面解释说明、当面约谈、现场检查、向中国证监会及其派出机构或者其他相关单位征询意见、公开问询等方式对登记信息、材料进行核查；对存在复杂、新型或者涉及政策、规则理解和适用等重大疑难问题的，协会可以采取商请有关部门指导、组织专家会商等方式进行研判。拟登记机构对登记信息、材料进行解释说明或者补充、修改的时间和协会采取前述方式核查、研判的时间，不计入办理时限。协会通过官方网站对私募基金管理人的基本信息、办理进度和办理结果等信息进行公示。私募基金管理人应当于登记完成之日起 10个工作日内向中国证监会派出机构报告。"},{"n":24,"label":"第二十四条","chapter":"第二章 私募基金管理人登记","text":"有下列情形之一的，协会中止办理私募基金管理人登记，并说明理由：\n（一）拟登记机构及其控股股东、实际控制人、普通合伙人、主要出资人因涉嫌违法违规被公安、检察、监察机关立案调查，或者正在接受金融管理部门、自律组织的调查、检查，尚未结案；\n（二）拟登记机构及其控股股东、实际控制人、普通合伙人、主要出资人出现可能影响正常经营的重大诉讼、仲裁等法律风险，或者可能影响办理私募基金管理人登记的重大内部纠纷，尚未消除或者解决；\n（三）拟登记机构及其控股股东、实际控制人、普通合伙人、主要出资人、关联私募基金管理人出现重大负面舆情，尚未消除；\n（四）中国证监会及其派出机构要求协会中止办理；\n（五）涉嫌提供有虚假记载、误导性陈述或者重大遗漏的信息、材料，通过欺骗、贿赂或者以规避监管、自律管理为目的与中介机构违规合作等不正当手段办理相关业务，相关情况尚在核实；\n（六）法律、行政法规、中国证监会和协会规定的其他情形。前款所列情形消失后，拟登记机构可以提请恢复办理私募基金管理人登记，办理时限自恢复之日起继续计算。"},{"n":25,"label":"第二十五条","chapter":"第二章 私募基金管理人登记","text":"有下列情形之一的，协会终止办理私募基金管理人登记，退回登记材料并说明理由：\n（一）主动申请撤回登记；\n（二）依法解散、注销，依法被撤销、吊销营业执照、责令关闭或者被依法宣告破产；\n（三）自协会退回之日起超过 6个月未对登记材料进行补正，或者未根据协会的反馈意见作出解释说明或者补充、修改；\n（四）被中止办理超过 12个月仍未恢复；\n（五）中国证监会及其派出机构要求协会终止办理；\n（六）提供有虚假记载、误导性陈述或者重大遗漏的信息、材料，通过欺骗、贿赂或者以规避监管、自律管理为目的与中介机构违规合作等不正当手段办理相关业务；\n（七）拟登记机构及其控股股东、实际控制人、普通合伙人、主要出资人、关联私募基金管理人出现重大经营风险；\n（八）未经登记开展基金募集、投资管理等私募基金业务活动，法律、行政法规另有规定的除外；\n（九）不符合本办法第八条至第二十一条规定的登记要求；\n（十）法律、行政法规、中国证监会和协会规定的其他情形。拟登记机构因前款第九项规定的情形被终止办理私募基金管理人登记，再次提请办理登记又因前款第九项规定的情形被终止办理的，自被再次终止办理之日起 6个月内不得再提请办理私募基金管理人登记。"},{"n":26,"label":"第二十六条","chapter":"第三章 私募基金备案","text":"私募基金管理人应当自行募集资金，或者按照中国证监会的相关规定，委托具有基金销售业务资格的机构（以下简称基金销售机构）募集资金。"},{"n":27,"label":"第二十七条","chapter":"第三章 私募基金备案","text":"私募基金应当面向合格投资者通过非公开方式募集资金。私募基金管理人、基金销售机构应当履行投资者适当性义务，将适当的私募基金提供给风险识别能力和风险承担能力相匹配的投资者，并向投资者充分揭示风险。私募基金管理人及其股东、合伙人、实际控制人、关联方和基金销售机构，以及前述机构的工作人员不得以任何方式明示或者暗示基金预期收益率，不得承诺或者误导投资者投资本金不受损失或者限定损失金额和比例，或者承诺最低收益。私募基金管理人、基金销售机构应当按照规定核实投资者对基金的出资金额与其出资能力相匹配。投资者应当以真实身份和自有资金购买私募基金，确保投资资金来源合法，不得非法汇集他人资金进行投资。以合伙企业、契约等非法人形式投资私募基金的，除另有规定外私募基金管理人、基金销售机构应当穿透核查最终投资者是否为合格投资者，并合并计算投资者人数。"},{"n":28,"label":"第二十八条","chapter":"第三章 私募基金备案","text":"私募基金管理人、基金销售机构向投资者募集资金，应当在募集推介材料、风险揭示书等文件中，就私募基金的管理人以及管理团队、投资范围、投资策略、投资架构、基金架构、托管情况、相关费用、收益分配原则、基金退出等重要信息，以及投资风险、运营风险、流动性风险等风险情况向投资者披露。有下列情形之一的，私募基金管理人应当通过风险揭示书向投资者进行特别提示：\n（一）基金财产不进行托管；\n（二）私募基金管理人与基金销售机构存在关联关系；\n（三）私募基金投资涉及关联交易；\n（四）私募基金通过特殊目的载体投向投资标的；\n（五）基金财产在境外进行投资；\n（六）私募基金存在分级安排或者其他复杂结构，或者涉及重大无先例事项；\n（七）私募证券基金主要投向收益互换、场外期权等场外衍生品标的，或者流动性较低的标的；\n（八）私募基金管理人的控股股东、实际控制人、普通合伙人发生变更，尚未在协会完成变更手续；\n（九）其他重大投资风险或者利益冲突风险。私募基金投向单一标的、未进行组合投资的，私募基金管理人应当特别提示风险，对投资标的的基本情况、投资架构、因未进行组合投资而可能受到的损失、纠纷解决机制等进行书面揭示，并由投资者签署确认。"},{"n":29,"label":"第二十九条","chapter":"第三章 私募基金备案","text":"私募基金应当制定并签订基金合同、公司章程或者合伙协议（以下统称基金合同），明确约定各方当事人的权利义务。除《中华人民共和国证券投资基金法》第九十二条、第九十三条规定的内容外，基金合同还应当对下列事项进行约定：\n（一）股东会、合伙人会议或者基金份额持有人大会的召集机制、议事内容和表决方式等；\n（二）本办法第三十八条规定的关联交易识别认定、交易决策和信息披露等机制；\n（三）信息披露的内容、方式、频率和投资者查询途径等相关事项；\n（四）基金财产不进行托管时的相关安排；\n（五）私募基金管理人因失联、注销私募基金管理人登记、破产等原因无法履行或者怠于履行管理职责等情况时，私募基金变更管理人、清算等相关决策机制、召集主体、表决方式、表决程序、表决比例等相关事项；\n（六）法律、行政法规、中国证监会和协会规定的其他事项。"},{"n":30,"label":"第三十条","chapter":"第三章 私募基金备案","text":"私募基金管理人应当按照诚实信用、勤勉尽责的原则切实履行受托管理职责，不得将投资管理职责委托他人行使。私募基金管理人委托他人履行职责的，其依法应当承担的责任不因委托而减轻或者免除。私募基金的管理人不得超过一家。"},{"n":31,"label":"第三十一条","chapter":"第三章 私募基金备案","text":"私募证券基金的投资范围主要包括股票、债券、存托凭证、资产支持证券、期货合约、期权合约、互换合约、远期合约、证券投资基金份额，以及中国证监会认可的其他资产。私募股权基金的投资范围包括未上市企业股权，非上市公众公司股票，上市公司向特定对象发行的股票，大宗交易、协议转让等方式交易的上市公司股票，非公开发行或者交易的可转换债券、可交换债券，市场化和法治化债转股，股权投资基金份额，以及中国证监会认可的其他资产。"},{"n":32,"label":"第三十二条","chapter":"第三章 私募基金备案","text":"私募基金托管人应当按照法律、行政法规、金融管理部门规定以及合同约定履行基金托管人应当承担的职责，维护投资者合法权益。私募基金的托管人不得超过一家。"},{"n":33,"label":"第三十三条","chapter":"第三章 私募基金备案","text":"私募基金应当具有保障基本投资能力和抗风险能力的实缴募集资金规模。私募基金初始实缴募集资金规模除另有规定外应当符合下列要求：\n（一）私募证券基金不低于 1000万元人民币；\n（二）私募股权基金不低于 1000万元人民币，其中创业投资基金备案时首期实缴资金不低于 500万元人民币，但应当在基金合同中约定备案后 6个月内完成符合前述初始募集规模最低要求的实缴出资；\n（三）投向单一标的的私募基金不低于 2000万元人民币。契约型私募基金份额的初始募集面值应当为 1元人民币，在基金成立后至到期日前不得擅自改变。"},{"n":34,"label":"第三十四条","chapter":"第三章 私募基金备案","text":"私募基金管理人设立合伙型基金，应当担任执行事务合伙人，或者与执行事务合伙人存在控制关系或者受同一控股股东、实际控制人控制，不得通过委托其他私募基金管理人等方式规避本办法关于私募基金管理人的相关规定。"},{"n":35,"label":"第三十五条","chapter":"第三章 私募基金备案","text":"私募股权基金备案完成后，投资者不得赎回或者退出。有下列情形之一的，不属于前述赎回或者退出：\n（一）基金封闭运作期间的分红；\n（二）进行基金份额转让；\n（三）投资者减少尚未实缴的认缴出资；\n（四）对有违约或者法定情形的投资者除名、替换或者退出；\n（五）退出投资项目减资；\n（六）中国证监会、协会规定的其他情形。私募股权基金开放认购、申购或者认缴，应当符合中国证监会和协会的相关要求。"},{"n":36,"label":"第三十六条","chapter":"第三章 私募基金备案","text":"私募基金应当约定明确的存续期。私募股权基金约定的存续期除另有规定外，不得少于 5年。鼓励私募基金管理人设立存续期不少于 7年的私募股权基金。"},{"n":37,"label":"第三十七条","chapter":"第三章 私募基金备案","text":"私募基金管理人运用基金财产进行股权投资，或者持有的被投企业股权、财产份额发生变更的，应当根据《中华人民共和国公司法》《中华人民共和国合伙企业法》等法律法规的规定，及时采取要求被投企业更新股东名册、向登记机关办理登记或者变更登记等合法合规方式进行投资确权。基金托管人应当督促私募基金管理人及时办理前款规定的市场主体登记或者变更登记。私募基金管理人应当及时将相关情况告知基金托管人并按照基金合同约定向投资者披露。"},{"n":38,"label":"第三十八条","chapter":"第三章 私募基金备案","text":"私募基金管理人应当建立健全关联交易管理制度，在基金合同中明确约定关联交易的识别认定、交易决策、对价确定、信息披露和回避等机制。关联交易应当遵循投资者利益优先、平等自愿、等价有偿的原则，不得隐瞒关联关系，不得利用关联关系从事不正当交易和利益输送等违法违规活动。私募股权基金管理人应当在经审计的私募股权基金年度财务报告中对关联交易进行披露。"},{"n":39,"label":"第三十九条","chapter":"第三章 私募基金备案","text":"私募基金管理人应当自私募基金募集完毕之日起 20个工作日内，向协会报送下列材料，办理备案手续：\n（一）基金合同；\n（二）托管协议或者保障基金财产安全的制度措施相关文件；\n（三）募集账户监督协议；\n（四）基金招募说明书；\n（五）风险揭示书以及投资者适当性相关文件；\n（六）募集资金实缴证明文件；\n（七）投资者基本信息、认购金额、持有基金份额的数量及其受益所有人相关信息；\n（八）中国证监会、协会规定的其他材料。募集完毕是指私募基金的已认缴投资者已签署基金合同，且首期实缴募集资金已进入托管账户等基金财产账户。单个投资者首期实缴出资除另有规定外，不得低于合格投资者的最低出资要求。"},{"n":40,"label":"第四十条","chapter":"第三章 私募基金备案","text":"协会自备案材料齐备之日起 20个工作日内为私募基金办结备案手续。私募基金备案信息、材料不完备或者不符合要求的，私募基金管理人应当根据协会的要求及时补正，或者进行解释说明或者补充、修改。协会对备案信息、材料的核查以及办理时限，适用本办法第二十三条第二款、第三款的规定。协会通过官方网站对已办理备案的私募基金相关信息进行公示。私募基金完成备案前，可以以现金管理为目的，投资于银行活期存款、国债、中央银行票据、货币市场基金等中国证监会认可的现金管理工具。"},{"n":41,"label":"第四十一条","chapter":"第三章 私募基金备案","text":"有下列情形之一的，协会不予办理私募基金备案，并说明理由：\n（一）从事或者变相从事信贷业务，或者直接投向信贷资产，中国证监会、协会另有规定的除外；\n（二）通过委托贷款、信托贷款等方式从事经营性民间借贷活动；\n（三）私募基金通过设置无条件刚性回购安排变相从事借贷活动，基金收益不与投资标的的经营业绩或者收益挂钩；\n（四）投向保理资产、融资租赁资产、典当资产等与私募基金相冲突业务的资产、资产收（受）益权，以及投向从事上述业务的公司的股权；\n（五）投向国家禁止或者限制投资的项目，不符合国家产业政策、环境保护政策、土地管理政策的项目；\n（六）通过投资公司、合伙企业、资产管理产品等方式间接从事或者变相从事本款第一项至第五项规定的活动；\n（七）不属于本办法第二条第二款规定的私募基金，不以基金形式设立和运作的投资公司和合伙企业；\n（八）以员工激励为目的设立的员工持股计划和私募基金管理人的员工跟投平台；\n（九）中国证监会、协会规定的其他情形。已备案的私募基金不得将基金财产用于经营或者变相经营前款第一项至第六项规定的相关业务。私募基金被协会不予备案的，私募基金管理人应当及时告知投资者，妥善处置相关财产，保护投资者的合法权益。"},{"n":42,"label":"第四十二条","chapter":"第三章 私募基金备案","text":"私募基金管理人有下列情形之一的，协会暂停办理其私募基金备案，并说明理由：\n（一）本办法第二十四条第一款规定的情形；\n（二）被列为严重失信人或者被纳入失信被执行人名单；\n（三）私募基金管理人及其控股股东、实际控制人、普通合伙人、关联私募基金管理人出现可能危害市场秩序或者损害投资者利益的重大经营风险或者其他风险；\n（四）因涉嫌违法违规、侵害投资者合法权益等多次受到投诉，未能向协会和投资者作出合理说明；\n（五）未按规定向协会报送信息，或者报送的信息存在虚假记载、误导性陈述或者重大遗漏；\n（六）登记备案信息发生变更，未按规定及时向协会履行变更手续，存在未及时改正等严重情形；\n（七）办理登记备案业务时的相关承诺事项未履行或者未完全履行；\n（八）采取拒绝、阻碍中国证监会及其派出机构、协会及其工作人员依法行使检查、调查职权等方式，不配合行政监管或者自律管理，情节严重；\n（九）中国证监会及其派出机构要求协会暂停备案；\n（十）中国证监会、协会规定的其他情形。"},{"n":43,"label":"第四十三条","chapter":"第三章 私募基金备案","text":"协会支持私募基金在服务国家战略、推动创新驱动发展和经济转型升级等方面发挥积极作用，对承担国家重大战略实施等职能的私募基金提供重点支持。对治理结构健全、业务运作合规、持续运营稳健、风险控制有效、管理团队专业、诚信状况良好的私募基金管理人，协会可以对其管理的符合条件的私募基金提供快速备案制度安排。具体规则由协会另行制定。"},{"n":44,"label":"第四十四条","chapter":"第三章 私募基金备案","text":"私募基金管理人存在较大风险隐患，私募基金涉及重大无先例事项，或者存在结构复杂、投资标的类型特殊等情形的，协会按照规定对私募基金管理人拟备案的私募基金采取提高投资者要求、提高基金规模要求、要求基金托管、要求托管人出具尽职调查报告或者配合询问、加强信息披露、提示特别风险、额度管理、限制关联交易，以及要求其出具内部合规意见、提交法律意见书或者相关财务报告等措施。私募基金管理人的资本实力、专业人员配备、投资管理能力、风险控制水平、内部控制制度、场所设施等，应当与其业务方向、发展规划和管理规模等相匹配。不匹配的，协会可以采取前款规定的措施；情节严重的，采取暂停办理其私募基金备案的自律管理措施。"},{"n":45,"label":"第四十五条","chapter":"第三章 私募基金备案","text":"协会对创业投资基金在基金备案、投资运作、上市公司股票减持等方面提供差异化自律管理服务。创业投资基金是指符合下列条件的私募基金：\n（一）投资范围限于未上市企业，但所投资企业上市后基金所持股份的未转让部分及其配售部分除外；\n（二）基金合同体现创业投资策略；\n（三）不使用杠杆融资，但国家另有规定的除外；\n（四）基金最低存续期限符合国家有关规定；\n（五）法律、行政法规、中国证监会和协会规定的其他条件。创业投资基金名称应当包含“创业投资基金”，或者在公司、合伙企业经营范围中包含“从事创业投资活动”字样。"},{"n":46,"label":"第四十六条","chapter":"第四章 信息变更和报送","text":"私募基金管理人及其备案的私募基金相关事项发生变更的，应当按规定及时向协会履行变更手续。相关变更事项应当符合规定的登记、备案要求；不符合要求的，应当按照规定及时改正。"},{"n":47,"label":"第四十七条","chapter":"第四章 信息变更和报送","text":"下列登记信息发生变更的，私募基金管理人应当自变更之日起 10个工作日内向协会履行变更手续：\n（一）名称、经营范围、资本金、注册地址、办公地址等基本信息；\n（二）股东、合伙人、关联方；\n（三）法定代表人、高级管理人员、执行事务合伙人或其委派代表；\n（四）中国证监会、协会规定的其他信息。"},{"n":48,"label":"第四十八条","chapter":"第四章 信息变更和报送","text":"私募基金管理人的控股股东、实际控制人、普通合伙人等发生变更的，私募基金管理人应当自变更之日起 30个工作日内向协会履行变更手续，提交专项法律意见书，就变更事项出具法律意见。私募基金管理人实际控制权发生变更的，应当就变更后是否全面符合私募基金管理人登记的要求提交法律意见书，协会按照新提交私募基金管理人登记的要求对其进行全面核查。股权、财产份额按照规定进行行政划转或者变更，或者在同一实际控制人控制的不同主体之间进行转让等情形，不视为实际控制权变更。私募基金管理人的实际控制权发生变更的，变更之日前12个月的管理规模应当持续不低于 3000万元人民币。"},{"n":49,"label":"第四十九条","chapter":"第四章 信息变更和报送","text":"私募基金管理人的股东、合伙人、实际控制人拟转让其所持有的股权、财产份额或者实际控制权的，应当充分了解受让方财务状况、专业能力和诚信信息等，并向其告知担任股东、合伙人、实际控制人的相关监管和自律要求。私募基金管理人的股东、合伙人、实际控制人拟发生变更导致实际控制权发生变更的，应当及时将相关情况告知私募基金管理人，私募基金管理人应当及时向投资者履行信息披露义务，并按照基金合同约定履行相关内部决策程序。"},{"n":50,"label":"第五十条","chapter":"第四章 信息变更和报送","text":"协会在私募基金管理人变更登记材料齐备之日起 20个工作日内办结变更手续，并就私募基金管理人变更后是否符合本办法规定的登记要求进行核查。协会对私募基金管理人变更登记材料的核查和办理时限，适用本办法第二十三条第一款至第三款的规定。协会通过官方网站对私募基金管理人变更的相关事项和办理结果等信息进行公示。"},{"n":51,"label":"第五十一条","chapter":"第四章 信息变更和报送","text":"有本办法第二十四条规定情形的，除另有规定外，协会中止办理私募基金管理人登记信息变更，并说明理由。相关情形消失后，私募基金管理人可以提请恢复办理变更，办理时限自恢复之日起继续计算。"},{"n":52,"label":"第五十二条","chapter":"第四章 信息变更和报送","text":"有下列情形之一的，协会终止办理私募基金管理人登记信息变更，退回变更登记材料，并说明理由：\n（一）不符合本办法规定的登记要求和变更要求；\n（二）本办法第二十五条第一款第三项至第六项规定的情形；\n（三）私募基金管理人及其控股股东、实际控制人、普通合伙人、主要出资人、关联私募基金管理人出现重大经营风险，但按照金融管理部门认可的风险处置方案变更的除外；\n（四）中国证监会、协会规定的其他情形。"},{"n":53,"label":"第五十三条","chapter":"第四章 信息变更和报送","text":"私募基金管理人的控股股东、实际控制人、普通合伙人发生变更，未按本办法第四十八条的规定向协会履行变更手续，或者虽履行变更手续但不符合要求的，协会采取暂停办理其私募基金备案的自律管理措施。"},{"n":54,"label":"第五十四条","chapter":"第四章 信息变更和报送","text":"私募基金管理人的控股股东、实际控制人、普通合伙人发生变更但未在协会完成变更手续的，私募基金管理人应当审慎开展新增业务；期间募集资金的，应当向投资者揭示变更情况，以及可能存在无法完成变更登记和基金备案手续的合规风险。"},{"n":55,"label":"第五十五条","chapter":"第四章 信息变更和报送","text":"私募基金下列信息发生变更的，私募基金管理人应当自变更之日起 10个工作日内，向协会履行变更手续：\n（一）基金合同约定的存续期限、投资范围、投资策略、投资限制、收益分配原则、基金费用等重要事项；\n（二）私募基金类型；\n（三）私募基金管理人、私募基金托管人；\n（四）负责份额登记、估值、信息技术服务等业务的基金服务机构；\n（五）影响基金运行和投资者利益的其他重大事项。私募基金备案信息发生变更，有本办法第二十五条第一款第六项规定的情形，或者变更后不符合规定要求的，协会终止办理变更，退回变更材料并说明理由。"},{"n":56,"label":"第五十六条","chapter":"第四章 信息变更和报送","text":"私募基金的管理人拟发生变更的，应当按照相关规定和合同约定履行变更程序，或者按照合同约定的决策机制达成有效处理方案。就变更私募基金管理人无法按照前款规定达成有效决议、协议或者处理方案的，应当向协会提交司法机关或者仲裁机构就私募基金管理人变更作出的发生法律效力的判决、裁定或者仲裁裁决，协会根据相关法律文书办理变更手续。"},{"n":57,"label":"第五十七条","chapter":"第四章 信息变更和报送","text":"私募基金合同终止的，私募基金管理人应当按照基金合同约定，及时对私募基金进行清算，自私募基金清算完成之日起 10个工作日内向协会报送清算报告等信息。一定期限内无法完成清算的，还应当自清算开始之日起10个工作日内向协会报送清算承诺函、清算公告等信息。私募基金在开始清算后不得再进行募集，不得再以基金的名义和方式进行投资。"},{"n":58,"label":"第五十八条","chapter":"第四章 信息变更和报送","text":"私募基金管理人因失联、注销私募基金管理人登记或者出现重大风险等情形无法履行或者怠于履行职责导致私募基金无法正常退出的，私募基金管理人、私募基金托管人、基金份额持有人大会或者持有一定份额比例以上的投资者，可以按照基金合同约定成立专项机构或者委托会计师事务所、律师事务所等中介服务机构，妥善处置基金财产，保护投资者合法权益，并行使下列职权：\n（一）清理核查私募基金资产情况；\n（二）制定、执行清算退出方案；\n（三）管理、处置、分配基金财产；\n（四）依法履行解散、清算、破产等法定程序；\n（五）代表私募基金进行纠纷解决；\n（六）中国证监会、协会规定或者基金合同约定的其他职权。私募基金通过前款规定的方式退出的，应当及时向协会报送专项机构组成情况、相关会议决议、财产处置方案、基金清算报告和相关诉讼仲裁情况等。"},{"n":59,"label":"第五十九条","chapter":"第四章 信息变更和报送","text":"私募基金管理人、私募基金托管人、私募基金销售机构和其他私募基金服务机构应当按照规定和合同约定履行信息披露义务，保证信息披露的及时、真实、准确和完整。私募基金管理人的股东、合伙人、实际控制人应当配合私募基金管理人履行信息披露义务，不得组织、指使或者配合私募基金管理人实施违反信息披露相关规定的行为。私募基金管理人应当按照规定在协会指定的私募基金信息披露备份平台备份各类信息披露报告，履行投资者查询账号的开立、维护和管理职责。信息披露的具体办法由协会另行制定。"},{"n":60,"label":"第六十条","chapter":"第四章 信息变更和报送","text":"私募基金管理人、私募基金托管人、私募基金服务机构应当按照规定向协会报送相关信息。私募基金管理人、私募基金托管人、私募基金服务机构应当建立信息报送制度，明确负责信息报送的高级管理人员及相关人员职责，依法依规履行信息报送义务，加强信息报送质量复核，保证信息报送的及时、真实、准确和完整。"},{"n":61,"label":"第六十一条","chapter":"第四章 信息变更和报送","text":"私募基金管理人应当按照规定报送下列信息：\n（一）在每一会计年度结束之日起 4个月内，报送私募基金管理人的相关财务、经营信息以及符合规定的会计师事务所审计的年度财务报告；管理规模超过一定金额以及本办法第十七条规定的私募基金管理人等，其年度财务报告应当经中国证监会备案的会计师事务所审计；\n（二）报送所管理的私募基金的投资运作情况；\n（三）在每一会计年度结束之日起 6个月内，报送私募股权基金的相关财务信息以及符合规定的会计师事务所审计的年度财务报告；基金规模超过一定金额、投资者超过一定人数的私募基金等，其年度财务报告应当经中国证监会备案的会计师事务所审计；\n（四）中国证监会、协会要求报送的临时报告和其他信息。因自然灾害等不可抗力导致无法按要求及时报送相关信息的，协会可以视情形延长报送时限。私募基金管理人存在严重损害投资者利益、危害市场秩序等风险的，协会可以视情况调整其信息报送的范围、内容、方式和频率等。"},{"n":62,"label":"第六十二条","chapter":"第四章 信息变更和报送","text":"有下列情形之一的，私募基金管理人应当在 10个工作日内向协会报告：\n（一）私募基金管理人及其管理的私募基金涉及重大诉讼、仲裁等法律纠纷，可能影响正常经营或者损害投资者利益；\n（二）出现重大负面舆情，可能对市场秩序或者投资者利益造成严重影响；\n（三）私募基金触发巨额赎回且不能满足赎回要求，或者投资金额占基金净资产 50%以上的项目不能正常退出；\n（四）私募基金管理人及其控股股东、实际控制人、普通合伙人、主要出资人业务运营、财务状况发生重大变化，或者出现重大信息安全事故，可能引发私募基金管理人经营风险，严重损害投资者利益；\n（五）私募基金管理人及其法定代表人、董事、监事、高级管理人员、执行事务合伙人或其委派代表或者从业人员等因重大违法违规行为受到行政处罚、行政监管措施和纪律处分措施，或者因违法犯罪活动被立案调查或者追究法律责任；\n（六）中国证监会、协会规定的其他情形。协会可以视情况要求私募基金管理人的股东、合伙人、实际控制人提供与私募基金管理人经营管理、投资运作有关的资料、信息，前述主体应当配合。"},{"n":63,"label":"第六十三条","chapter":"第五章 自律管理","text":"协会依法对私募基金行业进行自律管理，加强公示制度和信用体系建设，强化事中事后管理和风险监测机制，建设良好市场秩序和行业生态。"},{"n":64,"label":"第六十四条","chapter":"第五章 自律管理","text":"协会可以对私募基金管理人及其从业人员实施非现场检查和现场检查，也可以委托地方行业协会、中介服务机构等协助开展自律检查工作。协会可以采取查看被检查对象的经营场所，查阅、复制与检查事项有关的文件、账户信息和业务系统，询问与检查事项有关的单位和个人等方式，对被检查对象进行自律检查。"},{"n":65,"label":"第六十五条","chapter":"第五章 自律管理","text":"私募基金管理人及其从业人员应当配合协会的自律检查，如实提供有关文件资料，不得拒绝、阻碍和隐瞒，并按照要求协调其股东、合伙人、实际控制人、执行事务合伙人或其委派代表等相关单位和个人配合协会的自律检查。"},{"n":66,"label":"第六十六条","chapter":"第五章 自律管理","text":"私募基金管理人提交的登记备案和相关信息变更材料存在虚假记载、误导性陈述或者重大遗漏的，协会可以采取公开谴责、暂停办理备案、限制相关业务活动、撤销相关私募基金管理人登记和私募基金备案等自律管理或者纪律处分措施。私募基金管理人通过欺骗、贿赂或者以规避监管、自律管理为目的与中介机构违规合作等不正当手段办理登记备案相关业务的，协会撤销相关私募基金管理人登记、私募基金备案。对直接负责的主管人员和其他责任人员，协会可以采取公开谴责、不得从事相关业务、加入黑名单、取消基金从业资格等自律管理或者纪律处分措施。"},{"n":67,"label":"第六十七条","chapter":"第五章 自律管理","text":"私募基金管理人及其股东、合伙人、实际控制人，有下列情形之一的，协会可以采取书面警示、要求限期改正等自律管理或者纪律处分措施；情节严重的，可以采取公开谴责、暂停办理备案、限制相关业务活动等自律管理或者纪律处分措施：\n（一）股东、合伙人、实际控制人以非自有资金或者非法取得的资金向私募基金管理人出资，或者违规通过委托他人或者接受他人委托方式持有私募基金管理人股权、财产份额，或者存在循环出资、交叉持股、结构复杂等情形，隐瞒关联关系；\n（二）股东、合伙人、实际控制人抽逃出资或者违规转让股权、财产份额或者实际控制权；\n（三）私募基金管理人违反专业化运营原则，违规兼营多种类型的私募基金管理业务；\n（四）私募基金管理人违规开展投资顾问业务，开展或者变相开展冲突业务或者无关业务；\n（五）私募基金管理人未按规定保持人员充足稳定，高级管理人员长期缺位，或者在首支私募基金完成备案手续之前，违规更换法定代表人、执行事务合伙人或其委派代表、经营管理主要负责人、负责投资管理的高级管理人员和合规风控负责人；\n（六）违规聘用不符合要求的法定代表人、高级管理人员、执行事务合伙人或其委派代表、从业人员，或者前述人员存在违规兼职的情形；\n（七）违反关于同一控股股东、实际控制人控制两家以上私募基金管理人的有关规定；\n（八）中国证监会、协会规定的其他行为。对直接负责的主管人员和其他责任人员，协会可以采取书面警示、警告、公开谴责、不得从事相关业务、加入黑名单、取消基金从业资格等自律管理或者纪律处分措施。"},{"n":68,"label":"第六十八条","chapter":"第五章 自律管理","text":"私募基金管理人有下列行为之一的，协会可以采取书面警示、要求限期改正、公开谴责、暂停办理备案、限制相关业务活动等自律管理或者纪律处分措施；情节严重的，可以撤销私募基金管理人登记：\n（一）募集完毕未按照要求履行备案手续；\n（二）违规委托他人行使职责、不按照规定办理投资确权，以及未按照规定开展私募基金投资运作的其他情形；\n（三）未建立关联交易管理制度，或者违规开展关联交易；\n（四）未按规定及时履行私募基金清算义务；\n（五）中国证监会、协会规定的其他行为。对直接负责的主管人员和其他责任人员，协会可以采取书面警示、警告、公开谴责、不得从事相关业务、加入黑名单、取消基金从业资格等自律管理或者纪律处分措施。"},{"n":69,"label":"第六十九条","chapter":"第五章 自律管理","text":"私募基金管理人未按照要求履行信息披露、信息报送、信息变更和重大事项报告义务的，协会可以采取书面警示、要求限期改正、公开谴责、暂停办理备案、限制相关业务活动等自律管理或者纪律处分措施；对直接负责的主管人员和其他责任人员采取书面警示、警告、公开谴责等自律管理或者纪律处分措施。私募基金管理人披露、报送的信息存在虚假记载、误导性陈述或者重大遗漏的，协会可以采取书面警示、要求限期改正、公开谴责、暂停办理备案、限制相关业务活动、撤销私募基金管理人登记等自律管理或者纪律处分措施；对直接负责的主管人员和其他责任人员采取公开谴责、不得从事相关业务、加入黑名单、取消基金从业资格等自律管理或者纪律处分措施。"},{"n":70,"label":"第七十条","chapter":"第五章 自律管理","text":"私募基金管理人有下列行为之一的，协会可以采取书面警示、要求限期改正、公开谴责、暂停办理备案、限制相关业务活动、撤销私募基金管理人登记等自律管理或者纪律处分措施：\n（一）向合格投资者之外的单位和个人募集资金或者转让基金份额；\n（二）通过报刊、电台、电视、互联网等公众传播媒体，讲座、报告会、分析会等方式，布告、传单、短信、即时通讯工具、博客和电子邮件等载体，向不特定对象宣传推介；\n（三）通过“阴阳合同”“抽屉协议”等方式，承诺投资本金不受损失或者承诺最低收益；\n（四）将其固有财产、他人财产混同于私募基金财产，或者将不同私募基金财产混同运作；\n（五）开展或者参与具有滚动发行、集合运作、期限错配、分离定价等特征的资金池业务；\n（六）以套取私募基金财产为目的，使用私募基金财产直接或者间接投资于私募基金管理人、控股股东、实际控制人及其实际控制的企业或者项目等自融行为；\n（七）不公平对待私募基金投资者，损害投资者合法权益；\n（八）侵占、挪用私募基金财产；\n（九）利用私募基金财产或者职务之便，为自身或者投资者以外的单位或个人牟取非法利益、进行利益输送；\n（十）泄露因职务便利获取的未公开信息，利用该信息从事或者明示、暗示他人从事相关的交易活动；\n（十一）从事内幕交易、操纵证券期货市场及其他不正当交易活动；\n（十二）玩忽职守，不按照监管规定或者合同约定履行职责；\n（十三）通过直接或者间接参与结构化债券发行或者交易、返费等方式，扰乱市场秩序，侵害投资者利益；\n（十四）法律、行政法规、中国证监会和协会禁止的其他行为。对直接负责的主管人员和其他责任人员，协会可以采取书面警示、警告、公开谴责、不得从事相关业务、加入黑名单、取消基金从业资格等自律管理或者纪律处分措施。从业人员个人有前款规定行为的，协会可以对其采取前述自律管理或者纪律处分措施。私募基金管理人的股东、合伙人和实际控制人，私募基金托管人、私募基金销售机构及其他私募基金服务机构以及前述机构的工作人员，有本条第一款规定的行为或者为该行为提供便利的，适用前两款的规定。"},{"n":71,"label":"第七十一条","chapter":"第五章 自律管理","text":"律师事务所、会计师事务所等服务机构及其人员为私募基金业务活动提供服务，有下列情形之一，情节严重的，协会采取不再接受该机构、人员出具的文件的自律管理措施，并在官方网站予以公示：\n（一）出具有虚假记载、误导性陈述或者重大遗漏的相关文件；\n（二）通过虚假承诺等不正当手段承揽私募基金服务业务；\n（三）通过弄虚作假等违规行为或者其他不正当手段协助私募基金管理人办理登记备案业务；\n（四）中国证监会、协会规定的其他情形。"},{"n":72,"label":"第七十二条","chapter":"第五章 自律管理","text":"私募基金管理人有下列情形之一的，协会予以公示，提示风险：\n（一）私募基金管理人的登记备案信息发生变更，未按规定及时向协会履行变更手续；\n（二）私募基金运作、信息报送和信息披露出现异常；\n（三）处于协会无法取得有效联系的失联状态；\n（四）按照本办法第七十三条、第七十四条的规定被要求出具专项法律意见书；\n（五）被中国证监会及其派出机构处以行政处罚或者采取应予公开的行政监管措施
