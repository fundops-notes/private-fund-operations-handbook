架构说明、访问记录、保密协议及检查权。","links":[["privacy",21],["privacy",38],["datasecurity",27]],"caution":""},"internal:5":{"title":"控制有效性与成本都要考虑","meaning":"全面、制约、有效、独立、成本效益和适时性需要同时实现。以成本为由取消必要控制，或为形式上完整无差别重复劳动，都不是充分判断。","action":"把每个控制与风险、证据和耗时对应，判断重复或遗漏。","evidence":"风险控制矩阵、工时与差错记录、改进验证。","links":[["internal",6],["service",5]],"caution":""},"internal:10":{"title":"组织结构服务于职责明确和制约","meaning":"画组织图只是第一步。授权、相互制约和必要隔离要落实到真实任务和决定。","action":"分开执行、复核、批准，并处理小团队中的替代控制及备岗。","evidence":"岗位说明、权限表、复核日志、例外审批。","links":[["internal",11],["internal",12],["internal",15]],"caution":""},"internal:11":{"title":"人员管理也是控制的一部分","meaning":"胜任能力和激励约束影响控制是否实际执行。条文的最低人员表述仍要结合后续登记备案规则。","action":"建立技能矩阵，用演练验证备岗；绩效同时考察质量、及时报告和整改效果。","evidence":"培训记录、技能评估、备岗演练、绩效定义。","links":[["register",8],["internal",10]],"caution":""},"internal:15":{"title":"授权应覆盖全流程","meaning":"授权不能只管付款，募集、研究投资、运营和披露都需要明确权限、标准和程序。","action":"选择关键决定列证据输入、建议人、必要同意、最终决定及升级条件。","evidence":"有效授权制度、批准记录、权限定期回顾。","links":[["internal",10],["service",12]],"caution":""},"internal:23":{"title":"至少每年一次全面外包风险评估","meaning":"全面评估与持续关注并行。年度评分表不能替代平时对差错、系统变化和服务质量的跟踪。","action":"结合业务范围、历史事件、控制证据和利益冲突更新评估；重要变化及时复核。","evidence":"年度评估、事件台账、服务会议纪要、整改验证。","links":[["service",5],["service",48]],"caution":""},"internal:26":{"title":"不要孤立使用旧保存期限","meaning":"原文保留其10年要求；2026信息披露细则对披露相关文件资料规定了自基金清算结束之日起不少于二十年的保存要求。具体义务应按资料类型和适用规则综合确认，不能把一种资料的期限外推至全部档案。","action":"为每类资料列上位法、专项规则、合同和保存起点，由合规确认保管表。","evidence":"档案矩阵、法律冻结/争议保留安排。","links":[["ordinance",11],["details",45]],"caution":"本地原文未为迁就新规则改写旧条文。"},"register:8":{"title":"持续符合登记要求","meaning":"登记并非一次完成后永久不变。资本、人员、治理和经营条件要按适用要求持续满足。","action":"把HR、财务、法务发生的变化接入合规检查和变更流程。","evidence":"人岗/资本记录、主体信息台账、定期评估。","links":[["internal",11],["register",47]],"caution":""},"register:39":{"title":"募集完成、报送与备案办理不同","meaning":"管理人申报义务与协会办理时限是不同的时钟。材料补正也会影响办理过程。","action":"用四个日期字段管理业务触发、提交、补正和办结，不只写预计完成日。","evidence":"募集完毕判断、材料清单、提交回执。","links":[["ordinance",22],["register",40]],"caution":""},"register:55":{"title":"产品变更需要触发式管理","meaning":"变更不能仅更新Excel参数，还应判断合同决策、投资者通知及备案信息更新要求。","action":"将费用、投资者、期限等变更汇总至统一登记表，先判适用程序。","evidence":"版本差异、决议/同意、变更申请及回执。","links":[["change",2],["disclosure",27]],"caution":""},"register:56":{"title":"管理人变更是专门流程","meaning":"基金变更管理人涉及合同决策机制、交接和协会办理。采用2025年修订的备案指引3号，不继续机械套用2023版。","action":"先判断原管理人履职状态和适用路径，核实新管理人的承接范围与资料。","evidence":"决议、协议、移交清单、份额资产核对。","links":[["change",3],["change",15],["ordinance",34]],"caution":""},"fit:3":{"title":"适当性有实质判断责任","meaning":"全面了解投资者、分析产品、评估风险、揭示并提出匹配意见是一个连贯过程。签字或外包问卷不等于已经适当履职。","action":"把资格审查、风险测评、产品分级和匹配检查分别设门槛。","evidence":"调查、评估依据、匹配与风险揭示记录。","links":[["interim",12],["fitguide",36],["raise",27]],"caution":""},"fit:8":{"title":"专业投资者不等于所有义务豁免","meaning":"专业投资者是适当性分类中的概念，不能自动替代合格投资者准入及其他法定核验。","action":"为投资者分别记录资格依据、专业/普通分类及产品风险匹配。","evidence":"分类证据及定期更新记录。","links":[["fundlaw",87],["interim",12],["fitguide",22]],"caution":""},"raise:27":{"title":"资格不能只由投资者一句承诺证明","meaning":"需要按条文及适用要求取得必要资产或收入证明，并核实相关信息。不能通过拆分或汇集资金规避资格。","action":"建立材料清单、有效期和不一致信息的核验路径。","evidence":"资格证明、审核意见、拒绝/补充材料记录。","links":[["ordinance",18],["interim",12],["fit",3]],"caution":""},"raise:30":{"title":"正文与发布通知一起阅读","meaning":"本条描述回访确认；原发布通知明确鼓励按第30、31条实施，正式实施时间另行通知。阅读不能只摘取正文结论。","action":"由合规结合后续适用规则和合同确认本机构的回访安排；实践中保留身份、真实意愿与确认记录。","evidence":"合同约定、适用依据、回访证据。","links":[["raise",31],["raise",32]],"caution":"权威发布通知见本页原文末尾的发布来源。"},"disclosure:4":{"title":"委托发送不免除自身披露义务","meaning":"委托销售机构发送报告，与管理人承担信息披露义务不同。传输、版本与覆盖完整性都需要核对。","action":"将批准版本、投资者范围、发送渠道和失败补发纳入交付链。","evidence":"发送清单、报告版本、送达/失败记录。","links":[["details",43],["service",5]],"caution":""},"disclosure:19":{"title":"证券基金季度报告的业务分工","meaning":"按本条列示内容与协会细则组织季报；每个字段都要有来源、计算口径及复核职责。","action":"FA负责财务与估值输入，MO支持头寸风险，TA支持投资者数据，最终分工依授权确认。","evidence":"报告底稿、跨表核对、披露批准及发送记录。","links":[["details",6],["details",9],["details",10],["details",17]],"caution":""},"disclosure:22":{"title":"股权基金有不同的信息节奏","meaning":"股权基金的报告安排与证券基金不同。用项目和资本活动解释信息，而不是硬套交易型净值报告。","action":"连接项目估值、缴款、分配、费用与关联交易记录。","evidence":"项目台账、资本账户、估值与分配底稿。","links":[["details",23],["details",25],["details",26],["filing2",2]],"caution":""},"disclosure:27":{"title":"重大事件需有识别入口","meaning":"定期报告之外，还要监测并处理重大事项。重大性和触发时点不能由服务商是否报错单独决定。","action":"维护事件分类、影响评估、升级路径、披露及后续更正记录。","evidence":"事件时间线、影响测算、披露决定及回执。","links":[["details",38],["service",36]],"caution":""},"details:10":{"title":"把估值判断写入解释链","meaning":"对净值有重大影响的估值信息需要披露。估值原则、方法和变化应能由底稿支撑。","action":"将参数变更、非活跃市场报价及重大调整纳入报告编制检查。","evidence":"估值政策、独立价格来源、批准记录。","links":[["service",33],["disclosure",19]],"caution":""},"details:43":{"title":"平台备份不替代向投资者披露","meaning":"投资者可以在备份平台查询，但条文明确信息披露备份平台不作为披露渠道。仅在该平台备份，不能视为已向投资者披露。","action":"运营日历分成生成报告、批准、发送、平台备份、失败补救五步。","evidence":"发送证据、备份回执、时间戳和异常日志。","links":[["disclosure",4],["details",42],["details",45]],"caution":""},"details:45":{"title":"披露治理需要部门、高管和档案","meaning":"指定职责与妥善保存资料要落实到具体组织安排。应确保人员休假或离任时仍能履行。","action":"指定主责与备岗，锁定最终版本、批准和发送证据，按适用期限保存。","evidence":"披露职责表、备岗演练、档案目录。","links":[["internal",11],["internal",26],["ordinance",33]],"caution":""},"details:52":{"title":"新旧版本切换要落到流程","meaning":"细则自2026年9月1日施行，2016年协会披露办法及配套格式指引同时废止。文档库保留旧版应标历史，不继续作为现行操作模板。","action":"盘点旧模板、合同约定、报告日历和系统字段，记录切换与例外。","evidence":"规则差异表、模板版本清单、培训与验收记录。","links":[["disclosure",44],["details",42]],"caution":""},"privacy:21":{"title":"委托处理需要约定并监督","meaning":"把投资者资料交给服务商处理，应明确处理目的、期限、方式、种类和保护措施，并监督处理活动。","action":"区分受托处理和独立接收方，审查转委托、权限、到期删除和数据返还安排。","evidence":"委托条款、数据流、权限与监督证据。","links":[["service",48],["privacy",23],["privacy",55]],"caution":""},"privacy:38":{"title":"境外访问需要单独判断","meaning":"跨境提供个人信息有法定路径及相应要求。集团内部或境外服务商访问不能因为属于同一品牌而自动豁免。","action":"识别出境数据、接收方和处理目的，联合法律合规评估现行配套规则。","evidence":"出境评估记录、适用路径、必要告知与授权。","links":[["privacy",39],["privacy",55],["service",48]],"caution":""},"aml:6":{"title":"先确认义务主体","meaning":"本条规定金融机构与特定非金融机构的反洗钱义务。私募管理人具体如何适用，还须结合相关定义与配套规定、机构身份确认，不能笼统照搬银行报送流程。","action":"明确本机构直接义务、与银行/托管/销售机构的协作义务和合同要求。","evidence":"主体适用分析、KYC职责表、客户尽调制度。","links":[["aml",63],["aml",64],["fit",3]],"caution":""},"datasecurity:27":{"title":"安全贯穿数据处理全过程","meaning":"数据管理制度、教育培训及安全技术措施应覆盖实际处理链。依靠服务商口头保证不构成完整控制。","action":"对导入、清洗、计算、导出、备份和销毁逐环节配置权限及日志。","evidence":"数据流图、访问审查、恢复演练记录。","links":[["privacy",51],["service",48]],"caution":""},"futures:52":{"title":"交易者也需要自己的风险控制","meaning":"法人和非法人组织参与期货交易，应建立与交易类型、规模和目的相适应的内控与风险控制。不能把全部风险判断留给经纪商。","action":"定义保证金监测、日内资金、压力情景及异常升级，联动投资和运营。","evidence":"限额规则、资金预测、保证金通知与处置记录。","links":[["futures",18],["internal",20]],"caution":""},"securities:58":{"title":"账户实名与借用风险","meaning":"不能出借证券账户或借用他人账户从事证券交易。运营对账户名义和指令身份的核验，与交易合规相连。","action":"核对开户主体、基金标识、授权及指令来源，禁止方便处理而共用账户。","evidence":"账户台账、开户材料、访问/交易授权记录。","links":[["ordinance",21],["futures",18]],"caution":""}},"trails":[{"title":"外包监督 → 有效控制","desc":"从“收到外包结果”走到可验证的责任链。","refs":[["ordinance",11],["service",5],["internal",23],["service",12],["service",35]]},{"title":"投资者准入 → TA确认","desc":"资格、适当性、资金和份额分别核对。","refs":[["fundlaw",87],["interim",12],["fit",3],["raise",27],["service",20]]},{"title":"估值结果 → 投资者报告","desc":"估值依据、对账、解释、发送和备份。","refs":[["service",33],["service",35],["details",10],["disclosure",4],["details",43]]},{"title":"治理与授权 → 团队运行","desc":"把组织设计和人员管理落到内控条文。","refs":[["register",8],["internal",10],["internal",11],["internal",15],["internal",27]]},{"title":"存续变更 → 退出与交接","desc":"识别变更类型，维护权利与数据连续性。","refs":[["register",55],["register",56],["change",3],["change",15],["register",57]]},{"title":"资料保存 → 数据处理","desc":"比较不同规则中的对象、期限和数据义务。","refs":[["internal",26],["ordinance",33],["details",45],["privacy",21],["service",48]]}],"extensions":[["私募证券投资基金运作指引（2024）","协会自律规则","证券类运作的重要规则。官方PDF本次抓取未成功，保留权威入口及本地阅读指引；未冒充已收录全文。重点关注规模、流动性、组合投资、衍生品、估值与业绩报酬，以及发布公告的差异化过渡安排。","https://www.amac.org.cn/xwfb/xhyw/202404/t20240430_25508.html","原文待补"],["管理人登记指引第1—3号","协会自律规则","补充基本经营条件、股东控制人及高管要求；本地已收录登记备案办法，三个配套指引正文待扩充。","https://www.amac.org.cn/xwfb/xhyw/202302/t20230224_15636.html","配套附件"],["基金合同指引1—3号及备案材料清单","协会自律规则 / 办事材料","按契约型、公司型、合伙型区分合同治理与必备条款；与实际有效合同结合。本版未内嵌Word模板。","https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/smjjglrdjhcpba/fwzn/202206/t20220624_19657.html","配套附件"],["信息披露重要内容模板1—6号","协会配套模板","证券季报、年报、清算；股权半年报、股权创投年报与清算。正文细则已本地收录，模板附件尚未内嵌。","https://www.amac.org.cn/xwfb/tzgg/202606/t20260605_27780.html","配套附件"],["私募投资基金募集监督管理办法（征求意见稿）","证监会征求意见","2026-09-04发布征求意见消息。用于观察制度变化，不能代替现行合格投资者和募集规则。","https://www.csrc.gov.cn/csrc/c100028/c7656676/content.shtml","征求意见"],["衍生品交易监督管理办法（试行）","部门规章","证监会第234号令，2026-11-16起施行；截至本版核验日尚未生效。参与衍生品业务时需作制度衔接评估。","https://www.csrc.gov.cn/csrc/c101953/c7632837/content.shtml","已发布待施行"],["私募基金高质量发展指导意见","政策文件","用于了解监管方向。政策部署与直接操作义务、后续配套规则分开记录。","https://gs.mof.gov.cn/zhengcefagui/202606/t20260609_3991384.htm","政策观察"],["自查通知与自查工作底稿","地方监管通知","按辖区、对象、期间和送达通知判断适用。本版保留宁波2026通知及广东历史底稿的权威入口，历史案例不能外推为所有机构义务。","https://www.csrc.gov.cn/ningbo/c104115/c7646413/content.shtml","辖区适用"],["公司、合伙与合同治理","补充法律专题","公司法、合伙企业法、民法典、信托法需按组织形式及交易关系扩展。本版核心库不等于全部相关法律目录。","https://flk.npc.gov.cn/","待按结构扩展"],["会计、税务、市场与专项业务规则","补充业务专题","会计准则及资管产品会计处理、估值细则、税务、交易所/结算、程序化交易、跨境、政府/国资基金及不动产试点等，需要按实际资产、策略与机构身份建立子库。","https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/smjjglrdjhcpba/fwzn/202206/t20220624_19657.html","待按业务扩展"]],"cases":[{"id":"case-agency","lesson":"agency","title":"服务商每月都是零差错","theory":"委托代理：目标、信息与监督","scene":"服务商连续三个月报告零差错，但内部复核发现两次费用版本不一致。合同只考核准时交付率，主动报告问题会扣分。","principle":"信息不对称加上单一奖励，使“少报告”看起来比“早发现”更有利。委托代理分析关注行为条件，不能仅凭指标判断对方不诚信。","steps":["区分外部差错、主动发现和逾期未报，回看原始日志。","以交付、独立抽核质量、报告及时性和整改闭环建立平衡指标。","保留重大事项升级和抽样监督，明确管理人最终职责。"],"output":"一页供应商记分卡：指标定义、数据源、例外、复核人、整改期限。","boundary":"调整激励不意味着免除真实违约责任，也不能用供应商评分代替内部控制。","refs":[["service",5],["service",11]],"quizIds":["q9","q10"]},{"id":"case-star","lesson":"star","title":"改了组织图，净值仍然晚","theory":"星型模型：五个要素共同设计","scene":"团队把FA与TA放在同一主管下，但开放日数据依然晚到。TA只按确认笔数考核，FA拿不到最终份额版本，任何调整都要等主管回复。","principle":"结构只是战略、结构、流程、激励、人员五要素之一。把人合在一起不自动建立信息接口或授权。","steps":["明确开放日及时且可信的共同结果。","统一份额冻结版本、交付截止及例外通道。","匹配决策权限、共同质量指标与备岗技能。"],"output":"五要素诊断表：现状冲突、目标行为、改动、依赖、观察指标。","boundary":"五要素一致性是分析工具，不要求每次问题都进行全面重组。","refs":[["internal",10],["internal",15]],"quizIds":["q11","q12"]},{"id":"case-simon","lesson":"simon","title":"每日三百条差异，真正风险被淹没","theory":"有限理性：为注意力设计流程","scene":"核对清单每日有三百条，多数是小额舍入。团队按出现顺序处理，一笔异常现金交收直到下午才被发现。","principle":"人的注意力和处理能力有限。应设计信息分类与可解释的升级规则，而非要求每个人始终看见一切。","steps":["依金额、性质、时效、重复频率分类；重大性质不能被小金额掩盖。","为高风险异常设负责人和响应时限，小额差异仍保留累计监控。","回测分类是否漏掉关键事件，再由有权人批准。"],"output":"异常优先级规则：维度、示例、升级阈值、累计规则、复审频率。","boundary":"启发式可能造成盲区，阈值须根据实际业务验证，不是普遍监管标准。","refs":[["internal",23]],"quizIds":["q13","q14"]},{"id":"case-rapid","lesson":"rapid","title":"价格例外的决定卡在群聊里","theory":"RAPID：区分建议与最终决定","scene":"定价数据缺失，FA提出替代来源，投资团队、风险和服务商都发表意见，但谁批准仍不明确。交付窗口正在缩短。","principle":"RAPID区分Recommend、Agree、Perform、Input、Decide。必要同意应有明确范围，提供意见不等于拥有否决权。","steps":["先核对合同、估值制度、法定角色和有效授权。","写明建议人、必要同意、输入、决定、执行及截止。","记录依据、未采纳意见和升级路径，按授权处理。"],"output":"估值例外决策单：事实、选项、依据、各角色、批准、执行与留痕。","boundary":"内部决定权不能覆盖托管人或其他主体独立的法定、合同责任。","refs":[["disclosure",4],["service",36]],"quizIds":["q15","q16"]},{"id":"case-safety","lesson":"safety","title":"新人发现净值问题，却不敢说","theory":"心理安全：让坏消息及时出现","scene":"新人发现费用参数可能错误，但上次同事提出疑问被公开斥责。这次新人准备等资深同事先发现。","principle":"心理安全是表达问题与承认不确定时不担心受到人际惩罚。它与专业标准、复核和责任要求可以共存。","steps":["负责人先接收问题和保护报告渠道，立即按实际影响核查。","把事实调查、责任判断与公开羞辱分开。","复盘谁能发现、为何延迟、如何改进，并反馈整改结果。"],"output":"事件复盘记录：事实时间线、影响、控制、行动人、复测与反馈。","boundary":"鼓励发声不等于免于问责；故意隐瞒与诚实失误应按事实和制度区别处理。","refs":[["internal",26]],"quizIds":["q17","q18"]},{"id":"case-loop","lesson":"loop","title":"费用错误复发，大家又加了一次检查","theory":"双环学习：检查规则背后的假设","scene":"团队每月都遇到费率版本冲突。历次整改要求经办人更仔细，却没有指定合同条款解释与参数主版本的负责人。","principle":"单环学习纠正执行偏差；双环学习追问目标、规则和假设是否导致重复偏差。两者都需要，不能只追求宏大重构。","steps":["先修正当期错误并评估影响。","追问为何允许多个有效版本并存，谁维护权威参数。","建立变更授权、主版本、双人确认与生效时间，再复测。"],"output":"规则变更提案：旧假设、证据、新规则、责任、风险与验证。","boundary":"双环学习不能成为绕过合同或监管要求的理由。","refs":[["service",35],["internal",23]],"quizIds":["q19","q20"]},{"id":"case-pdsa","lesson":"pdsa","title":"自动核对一分钟，却没有发现缺文件","theory":"PDSA：小范围学习与验证","scene":"脚本将核对耗时从两小时降到一分钟。试点只使用完整、正常的历史文件，没有测试缺页、重复记录或错误日期。","principle":"Plan—Do—Study—Act强调预测、实验、研究结果与调整。处理快不等于控制有效，验证应包含能否检出预期异常。","steps":["写出预期结果及验收标准，包括完整性和重要漏检。","在获批范围内并行运行，注入缺失、重复、错日期等教学测试。","分析误报和漏报，保留回退，批准后再推广。"],"output":"试点报告：假设、样本范围、异常集、结果、漏检、限制与下一轮。","boundary":"教学异常不能擅自注入生产或影响真实投资者，需使用隔离测试数据。","refs":[["service",33],["internal",23]],"quizIds":["q21","q22"]},{"id":"case-kotter","lesson":"kotter","title":"新流程发布了，团队仍用旧表","theory":"变革管理：从发布走向采用","scene":"新异常登记表已经邮件发布，但资深员工仍用旧表，新人两边重复登记。主管只要求“尽快全面上线”。","principle":"Kotter强调紧迫性、支持力量、方向、清障与巩固等变革要素。模型是检查视角，并非每个项目都要按固定日程机械推进。","steps":["说明具体风险和改进目标，找出影响最大的使用障碍。","让业务骨干参与试点，统一入口并提供训练与备岗。","观察采用率与质量，取得可验证成效，更新制度和交接。"],"output":"采用计划：受影响角色、障碍、试点、培训、退出旧流程条件和监测。","boundary":"切换必须明确有效版本、授权和回退，不能以推动变革为由突然停用必要控制。","refs":[["internal",11],["internal",15]],"quizIds":["q23","q24"]}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('course-data').textContent);
const {lessons,sources,weeks,quizzes,tasks,glossary}=DATA;
const KEY='fund-operations-manual-v2';
const views={path:'学习路径',library:'知识速览',org:'组织与管理',laws:'法规原文库',practice:'情景练习',takeover:'90天改进',notes:'我的笔记'};
const ordered=lessons.slice().sort((a,b)=>a.week-b.week);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={done:[],stars:[],notes:{},answers:{},tasks:[],journal:'',last:'framework',week:1};
let persistent=true,view='path',filter='全部',query='',starIndex=0,levelIndex=0,activeLesson=null,returnFocus=null,toastTimer;
function clean(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('不是有效学习备份');
 const ids=new Set(lessons.map(x=>x.id));const tids=new Set(tasks.map(x=>x[0]));
 const list=(v,set)=>Array.isArray(v)?[...new Set(v.filter(x=>typeof x==='string'&&set.has(x)))]:[];
 const out={done:list(raw.done,ids),stars:list(raw.stars,ids),tasks:list(raw.tasks,tids),notes:{},answers:{},journal:typeof raw.journal==='string'?raw.journal.slice(0,50000):'',last:ids.has(raw.last)?raw.last:'framework',week:[1,2,3,4].includes(raw.week)?raw.week:1};
 for(const l of lessons)if(raw.notes&&typeof raw.notes[l.id]==='string')out.notes[l.id]=raw.notes[l.id].slice(0,20000);
 for(const q of quizzes)if(raw.answers&&Number.isInteger(raw.answers[q.id])&&raw.answers[q.id]>=0&&raw.answers[q.id]<q.options.length)out.answers[q.id]=raw.answers[q.id];
 return out;
}
try{const old=localStorage.getItem(KEY)||localStorage.getItem('ian-fund-operations-learning-v1');if(old)state=clean(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(state));}catch(e){persistent=false;}
function status(){const el=$('#storage-status');el.textContent=persistent?'● 进度已保存至本机':'未能保存 · 请导出备份';el.classList.toggle('unsaved',!persistent);}

function sidebar(){const n=state.done.length;$('#side-progress').textContent=n+' / '+lessons.length+' 个单元已学';$('#side-bar').style.width=(n/lessons.length*100)+'%';const p=$('.progress');p.setAttribute('aria-valuenow',n);}

}

function renderPractice(){const answered=Object.keys(state.answers).length;const right=quizzes.filter(q=>state.answers[q.id]===q.answer).length;return heading('SCENARIO LAB','先作判断，再看解释。','这些是教学情景，不代替真实合同、授权和业务判断。选择后即时显示解析，可反复尝试。',`<span class="badge outline" id="quiz-score">已答${answered}/${quizzes.length} · 当前正确${right}</span>`)+`<div class="split"><section><h2 style="margin-bottom:17px">运营与管理决策题</h2>${quizzes.map((q,i)=>`<article class="quiz"><fieldset><legend>${String(i+1).padStart(2,'0')} · ${esc(q.title)}</legend><p class="scene">${esc(q.scene)}</p><div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" data-quiz="${q.id}" value="${j}" ${state.answers[q.id]===j?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset><div id="feedback-${q.id}">${quizFeedback(q)}</div></article>`).join('')}</section><aside><div class="panel"><span class="badge orange">交互思考练习</span><h2 style="margin-top:14px">如何评估redo？</h2><p class="muted" style="font-size:13px;margin-top:12px">勾选已具备的条件，观察下一步应补什么。全部勾选也不构成撤销控制的批准。</p><div class="redo-options">${['已明确法规、合同及集团制度要求','能取得独立源数据且确认输入完整','不存在尚未解释的重大差异','试点已覆盖新旧并行和重要异常','有权人已确认变更、回退和监控安排'].map((t,i)=>`<label><input type="checkbox" data-redo="${i}"><span>${t}</span></label>`).join('')}</div><div id="redo-result" class="redo-result" aria-live="polite">先确认现有复核的义务来源与控制目的，再评估哪些环节适合试点。</div><button class="btn small" data-lesson="redo" style="margin-top:16px">阅读redo方法</button></div><div class="output" style="margin-top:18px"><div class="eyebrow">REFLECTION</div><h3>你的判断依据是什么？</h3><p>答对选项只是开始。试着补充：需要哪些事实、谁有权决定、错误判断会影响谁。</p></div></aside></div>`;}
const templateData=[['主体关系图','分别画合同关系、资金流与数据流。不要把服务商和托管人的角色混成一个。','主体名称 / 法律身份 / 合同关系 / 保管或处理事项 / 数据来源 / 授权边界 / 待核项'],['流程泳道图','先选NAV、开放日或交收之一，走查一个真实周期。','事件 / 输入 / 截止 / 执行 / 复核 / 批准 / 输出 / 异常分支 / 下游 / 证据'],['数据流及核对关系图','标出哪些来源真正独立，在哪里清洗、转换或人工调整。','源系统或文件 / 业务日期 / 字段口径 / 转换 / 唯一标识 / 控制总数 / 独立核对来源'],['职责与授权矩阵','任务职责与决策权分别写清，内部A不替代外部主体法定义务。','事项 / R执行 / A最终负责 / C征询 / I知会 / 必要同意 / 决定权 / 升级条件'],['风险控制与证据矩阵','每个控制说明要避免什么风险，并能找到执行证据。','风险 / 规则或合同 / 控制目的 / 方法 / 频率 / 执行人 / 复核人 / 证据 / 例外 / 复测'],['运营日历和交付表','区分投资者披露、协会报送备份、证监局通知与集团管理报告。','事项 / 触发或日期 / 接收对象 / 数据提供方 / 复核与批准 / 渠道 / 回执 / 备岗']];
function renderTakeover(){return heading('FIRST 90 DAYS','稳定运行，理解现状，再改进。','以下为建议推进节奏。当前没有内部资料，勾选仅记录你的行动进度，不表示公司已通过验收。',`<button class="btn" data-template-export>下载三图三表模板</button>`)+`<div class="split"><section>${['1—10天','11—30天','31—60天','61—90天'].map((stage,i)=>`<div class="panel task-block"><span class="eyebrow muted">PHASE ${i+1}</span><h3>${stage} · ${['确保连续运行','记录真实现状','标准化与试点','依据证据推广'][i]}</h3>${tasks.filter(t=>t[1]===stage).map(t=>`<label class="task-check"><input type="checkbox" data-task="${t[0]}" ${state.tasks.includes(t[0])?'checked':''}><span>${t[2]}</span></label>`).join('')}</div>`).join('')}</section><aside class="panel" style="align-self:start"><h2>三图三表 · 工作模板</h2><p class="muted small" style="margin-top:10px">先画现状，再写建议；点击查看字段。</p>${templateData.map(t=>`<details class="template"><summary>${t[0]}</summary><p>${t[1]}</p><pre>${t[2]}</pre></details>`).join('')}<div class="callout">如有近期监管截止事项，优先按实际适用通知处理，不等待计划中的阶段。</div><button class="btn small" data-lesson="takeover">阅读接管方法 →</button></aside></div>`;}
function renderNotes(){const entries=lessons.filter(l=>state.notes[l.id]?.trim());return heading('PERSONAL NOTEBOOK','把知识变成自己的判断。','进度与笔记保存在当前浏览器。切换设备、移动文件或清理浏览器后可能无法读取，建议导出备份；请勿录入未授权的公司或投资者信息。',`<div class="actions"><button class="btn" data-export="json">导出进度备份</button><button class="btn" data-import>导入备份</button><button class="btn primary" data-export="md">导出学习笔记</button></div>`)+`<section class="panel"><h2>学习日志 / 待确认问题</h2><label for="journal" class="note-label">今天学到什么？实际工作中需要用什么证据验证？</label><textarea id="journal" maxlength="50000" placeholder="例如：redo的要求来自哪份制度？哪些价格来源真正独立？谁可以批准估值例外？">${esc(state.journal)}</textarea><p class="small muted">输入后自动保存；导入会合并完成标记，已有笔记发生冲突时保留本机内容。</p></section><div class="section-head"><h2>单元笔记</h2><p>${entries.length}个单元有记录</p></div>${entries.length?entries.map(l=>`<article class="panel note-card"><h3>${esc(l.title)}</h3><pre>${esc(state.notes[l.id])}</pre><button class="btn small" data-lesson="${l.id}">继续阅读 / 编辑笔记</button></article>`).join(''):'<div class="empty">阅读任一单元后，在底部记下你的判断，笔记会汇总到这里。</div>'}<div class="section-head"><h2>已收藏</h2><p>${state.stars.length}个单元</p></div><div class="card-grid">${lessons.filter(l=>state.stars.includes(l.id)).map(card).join('')}</div>${!state.stars.length?'<p class="muted small">点击课程卡片或阅读窗口中的星标，即可收藏。</p>':''}`;}
function renderSearch(){const terms=query.toLocaleLowerCase().split(/\s+/).filter(Boolean);const ls=lessons.filter(l=>{const s=JSON.stringify(l).toLocaleLowerCase();return terms.every(t=>s.includes(t));});return heading('SEARCH RESULTS','搜索学习单元',`关键词「${esc(query)}」 · 找到${ls.length}个单元`)+`<div class="card-grid">${ls.map(card).join('')}</div>${ls.length?'':'<div class="empty">未找到匹配内容。可以试试「费用」「授权」「双环」「外包」。</div>'}`;}

function readerMarkup(l){const idx=ordered.findIndex(x=>x.id===l.id);return `<div class="dialog-header"><span class="small muted">第${l.week}周 / ${esc(l.track)} · 约${l.minutes}分钟</span><div class="actions">${starButton(l)}<button class="btn small" data-close>关闭 ×</button></div></div><div class="dialog-body"><span class="badge">${esc(l.track)}</span><h2 class="dialog-title" id="reader-title">${esc(l.title)}</h2>${l.author?`<p class="small" style="color:var(--orange);margin-bottom:10px">${esc(l.author)}</p>`:''}<p class="lesson-lead">${esc(l.summary)}</p><div class="reading-layout"><div class="reading-main">${l.parts.map(([t,p],i)=>`<section><h3>${i+1}. ${esc(t)}</h3><p>${esc(p)}</p></section>`).join('')}<section><h3>运营情景 · 教学示例</h3><div class="callout">${esc(l.example)}</div></section></div><aside class="reading-aside"><h3>学完后做一件事</h3><p>${esc(l.task)}</p><h3>原文与进一步阅读</h3>${sourceLinks(l.refs)}<div class="boundary"><strong>适用边界</strong><br>${esc(l.boundary)}</div></aside></div><section class="dialog-note"><label class="note-label" for="lesson-note">我的理解 / 待确认问题</label><textarea id="lesson-note" maxlength="20000" data-note="${l.id}" placeholder="用自己的话写一句原理，再写一个实际工作中需要核实的问题。">${esc(state.notes[l.id]||'')}</textarea></section><div class="dialog-footer"><button class="btn ${state.done.includes(l.id)?'':'primary'}" data-complete="${l.id}" aria-pressed="${state.done.includes(l.id)}">${state.done.includes(l.id)?'✓ 已学 · 点击取消':'标记本单元已学'}</button><div class="actions"><button class="btn" data-lesson="${idx>0?ordered[idx-1].id:l.id}" ${idx===0?'disabled':''}>← 上一单元</button><button class="btn" data-lesson="${idx<ordered.length-1?ordered[idx+1].id:l.id}" ${idx===ordered.length-1?'disabled':''}>下一单元 →</button></div></div></div>`;}
function openLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;const d=$('#reader');if(!d.open)returnFocus=document.activeElement;activeLesson=id;state.last=id;save();d.innerHTML=readerMarkup(l);if(!d.open)d.showModal();document.body.style.overflow='hidden';d.scrollTop=0;d.querySelector('[data-close]').focus();}

function toggle(arr,id){return arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportData(type){if(type==='json'){download('基金运营学习进度_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'fund-operations-learning',version:1,exportedAt:new Date().toISOString(),state},null,2),'application/json');}else{let text='# 基金运营学习笔记\n\n导出日期：'+new Date().toLocaleDateString('zh-CN')+'\n\n## 学习日志\n\n'+(state.journal||'（暂无）')+'\n\n## 学习进度\n\n'+ordered.map(l=>'- ['+(state.done.includes(l.id)?'x':' ')+'] '+l.title).join('\n')+'\n\n## 单元笔记\n\n'+lessons.filter(l=>state.notes[l.id]).map(l=>'### '+l.title+'\n\n'+state.notes[l.id]+'\n\n参考：\n'+l.refs.map(id=>'- ['+sources[id][0]+']('+sources[id][1]+')').join('\n')).join('\n\n');download('基金运营学习笔记.md',text,'text/markdown;charset=utf-8');}toast('已生成下载文件');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){go(b.dataset.view);return;}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return;}
 if(b.hasAttribute('data-close')){$('#reader').close();return;}
 if(b.dataset.week){state.week=Number(b.dataset.week);save();render();return;}
 if(b.dataset.filter){filter=b.dataset.filter;render();return;}
 if(b.dataset.starLesson){const id=b.dataset.starLesson;state.stars=toggle(state.stars,id);save();b.setAttribute('aria-pressed',state.stars.includes(id));b.setAttribute('aria-label',(state.stars.includes(id)?'取消收藏 ':'收藏 ')+lessons.find(l=>l.id===id).title);b.textContent=state.stars.includes(id)?'★':'☆';if(!$('#reader').open)render();return;}
 if(b.dataset.complete){state.done=toggle(state.done,b.dataset.complete);save();b.textContent=state.done.includes(b.dataset.complete)?'✓ 已学 · 点击取消':'标记本单元已学';b.classList.toggle('primary',!state.done.includes(b.dataset.complete));b.setAttribute('aria-pressed',state.done.includes(b.dataset.complete));toast(state.done.includes(b.dataset.complete)?'已记录完成；可以继续下一单元':'已取消完成标记');return;}
 if(b.dataset.starPart!==undefined){starIndex=Number(b.dataset.starPart);document.querySelectorAll('[data-star-part]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.starPart)===starIndex));$('#star-detail').innerHTML=`<h3>${starParts[starIndex][1]}</h3><p>${starParts[starIndex][2]}</p>`;return;}
 if(b.dataset.level!==undefined){levelIndex=Number(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.level)===levelIndex));$('#level-detail').innerHTML=levelDetail();return;}
 if(b.dataset.export){exportData(b.dataset.export);return;}
 if(b.hasAttribute('data-import')){$('#import-file').click();return;}
 if(b.hasAttribute('data-template-export')){download('三图三表_学习模板.md','# 三图三表 · 待机构内核实模板\n\n'+templateData.map(t=>'## '+t[0]+'\n\n'+t[1]+'\n\n'+t[2]+'\n\n现状：\n\n建议：\n\n证据和待确认项：\n').join('\n'),'text/markdown;charset=utf-8');toast('已生成模板下载');}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value.trim();render();}if(e.target.id==='journal'){state.journal=e.target.value;save();}if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save();}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.quiz){const q=quizzes.find(q=>q.id===t.dataset.quiz);state.answers[q.id]=Number(t.value);save();$('#feedback-'+q.id).innerHTML=quizFeedback(q);$('#quiz-score').textContent='已答'+Object.keys(state.answers).length+'/'+quizzes.length+' · 当前正确'+quizzes.filter(q=>state.answers[q.id]===q.answer).length;}
 if(t.dataset.task){state.tasks=toggle(state.tasks,t.dataset.task);save();}
 if(t.dataset.redo!==undefined){const cs=[...document.querySelectorAll('[data-redo]')].map(x=>x.checked);const prompts=['先明确义务来源与控制目的：现有复核可能来自法规、合同、集团制度或历史整改。','优先补独立来源和输入完整性：同源重算无法发现所有输入错误。','先解释重大差异及其影响，再评估是否具备改变控制的条件。','先完成平行试点，验证代表性样本、重要异常和漏检风险。','先确认有权批准、回退和持续监控；技术可行不等于可以直接改变控制。'];const i=cs.indexOf(false);$('#redo-result').textContent=i===-1?'这些准备条件已在练习中勾选。真实业务仍须复核证据和授权，在获批范围内推进，并持续监控。':prompts[i];}
});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const pack=JSON.parse(await f.text());if(pack.format!=='fund-operations-learning'||pack.version!==1)throw Error('格式或版本不匹配');const incoming=clean(pack.state);state.done=[...new Set([...state.done,...incoming.done])];state.stars=[...new Set([...state.stars,...incoming.stars])];state.tasks=[...new Set([...state.tasks,...incoming.tasks])];let conflicts=0;for(const l of lessons){if(!state.notes[l.id])state.notes[l.id]=incoming.notes[l.id]||'';else if(incoming.notes[l.id]&&incoming.notes[l.id]!==state.notes[l.id])conflicts++;}if(!state.journal)state.journal=incoming.journal;else if(incoming.journal&&incoming.journal!==state.journal)conflicts++;for(const q of quizzes)if(state.answers[q.id]===undefined&&incoming.answers[q.id]!==undefined)state.answers[q.id]=incoming.answers[q.id];save();render();toast('备份已合并'+(conflicts?'；'+conflicts+'处笔记冲突保留本机内容':''));}catch(err){toast('无法导入：'+err.message);}e.target.value='';});
const lawMap=Object.fromEntries(DATA.laws.map(l=>[l.id,l]));
let lawSelection=null,lawHistory=[],lawLevel='全部',lawScope='全部',lawQuery='',caseSelection=null;
function lawLink(id,n,label){const l=lawMap[id];return `<button class="law-ref" data-law="${id}" data-article="${n}">${esc(label||l.title+' · 第'+n+'条')} ↗</button>`;}
function sourceEnd(l){return `<div class="law-source"><strong>原文来源与版本</strong><p>${esc(l.issuer)} · ${esc(l.version)}<br>施行／修正：${esc(l.effective)}<br>${esc(l.format)}；收录核验：${l.checked}。</p><a href="${esc(l.textSource)}" target="_blank" rel="noopener noreferrer">官方原文／政府部门转载原文 ↗</a>${l.source!==l.textSource?` · <a href="${esc(l.source)}" target="_blank" rel="noopener noreferrer">权威发布入口 ↗</a>`:''}<p>本地收录正文${l.articles.length}条；附件与配套模板不包含在正文全文的统计中。执行前应核对最新修订及具体适用范围。</p></div>`;}
function renderLaws(){
 if(lawSelection)return renderLawReader();
 const levels=['全部','法律','行政法规','部门规章','规范性文件','协会自律规则'];
 const result=DATA.laws.filter(l=>(lawLevel==='全部'||l.level===lawLevel)&&(lawScope==='全部'||l.scope===lawScope)&&( !lawQuery||JSON.stringify(l).toLowerCase().includes(lawQuery.toLowerCase())));
 return heading('REGULATORY LIBRARY','先看层级，再读原文。','正文可离线阅读；解读为研习材料。按基金类型、机构角色与生效时间判断适用，不能只按层级机械套用。')+
 `<div class="law-metrics"><span><b>${DATA.laws.length}</b>部正文</span><span><b>${DATA.laws.reduce((s,l)=>s+l.articles.length,0)}</b>条原文</span><span><b>${Object.keys(DATA.comments).length}</b>条重点解读</span><span><b>2026.09.23</b>收录核验</span></div><details class="panel coverage"><summary>阅读边界与法规体系</summary><p>法律 → 行政法规 → 部门规章／规范性文件 → 协会自律规则及配套材料。协会规则不属于与法律相同层级的国家立法；合同与内部制度负责把适用要求落实到机构和产品。</p><p>证券、股权及创投的专项规则不应混用。旧正文保留原貌，需与后续规则及过渡安排合并阅读。本库是核心学习库，尚不覆盖所有会计、税务、交易所、跨境和试点规则。下方扩展索引明确标示未内嵌内容。</p></details>
 <div class="section-head"><h2>沿着业务读法规</h2><p>点击条文，本地交叉跳转</p></div><div class="trail-grid">${DATA.trails.map(t=>`<article class="panel"><h3>${t.title}</h3><p class="muted small">${t.desc}</p><div class="law-links">${t.refs.map(([id,n])=>lawLink(id,n)).join('')}</div></article>`).join('')}</div>
 <div class="section-head"><h2>正文库索引</h2><p>${result.length} / ${DATA.laws.length}部</p></div><div class="filters">${levels.map(x=>`<button class="chip" data-law-level="${x}" aria-pressed="${lawLevel===x}">${x}</button>`).join('')}</div><form id="law-search-form" class="law-search"><label>基金范围 <select id="law-scope">${['全部','通用','证券','股权创投'].map(x=>`<option ${lawScope===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="grow">搜索正文 <input id="law-search" value="${esc(lawQuery)}" placeholder="例如：估值、二十年、份额登记"></label><button class="btn primary" type="submit">检索</button></form>
 <div class="law-index">${result.map(l=>`<article class="law-index-row"><div><span class="badge">${l.level}</span> <span class="badge outline">${l.scope} · ${l.articles.length}条</span><h3>${esc(l.title)}</h3><p class="small muted">${esc(l.version)} · ${esc(l.effective)}</p><p>${esc(l.overview)}</p><div class="small muted">${l.topics.map(esc).join(' · ')}</div></div><button class="btn" data-law="${l.id}" data-article="${l.priority[0]||1}">原文与解读 →</button></article>`).join('')||'<div class="empty">没有匹配法规，请调整筛选条件。</div>'}</div>
 <div class="section-head"><h2>扩展索引与制度动态</h2><p>以下不计入本地全文库</p></div><div class="news-grid">${DATA.extensions.map(x=>`<article class="news"><span class="badge orange">${esc(x[4])}</span><h3>${esc(x[0])}</h3><p class="small">${esc(x[1])}</p><p>${esc(x[2])}</p><a href="${esc(x[3])}" target="_blank" rel="noopener noreferrer">权威来源 ↗</a></article>`).join('')}</div>`;
}
function renderLawReader(){const l=lawMap[lawSelection.id],a=l.articles.find(x=>x.n===lawSelection.n),c=DATA.comments[l.id+':'+a.n];
 return `<div class="actions"><button class="btn" data-law-index>← 法规库索引</button>${lawHistory.length?'<button class="btn" data-law-back>返回上一引用</button>':''}<button class="btn" data-law-full>下载本法规正文 TXT</button></div><div class="page-head law-title"><div><div class="eyebrow">${l.level} / ${l.scope} / ${l.coverage}</div><h1>${esc(l.title)}</h1><p>${esc(l.version)} · ${esc(l.effective)}</p></div></div><div class="article-toolbar"><label>条文目录 <select id="article-select">${l.articles.map(x=>`<option value="${x.n}" ${x.n===a.n?'selected':''}>${x.label} ${esc(x.text.slice(0,30))}…</option>`).join('')}</select></label><div class="actions"><button class="btn small" data-law="${l.id}" data-article="${a.n-1}" ${a.n===1?'disabled':''}>上一条</button><button class="btn small" data-law="${l.id}" data-article="${a.n+1}" ${a.n===l.articles.length?'disabled':''}>下一条</button></div></div>
 <div class="law-reader"><section class="original panel"><div class="eyebrow muted">ORIGINAL TEXT · 法规原文</div><h2>${esc(a.label)}</h2>${a.chapter?`<p class="small muted">${esc(a.chapter)}</p>`:''}<div class="original-text">${esc(a.text)}</div>${sourceEnd(l)}</section><aside class="interpretation panel"><div class="eyebrow">READING NOTES · 研习解读</div>${c?`<h2>${esc(c.title)}</h2><h3>这条规定如何理解</h3><p>${esc(c.meaning)}</p><h3>运营中怎样落实</h3><p>${esc(c.action)}</p><h3>可以检查什么证据</h3><p>${esc(c.evidence)}</p><div class="boundary">${esc(c.caution||'结合规则全文、实际合同、机构角色和有效授权判断。')}</div><h3>关联条文 · 本地跳转</h3><div class="law-links">${c.links.map(([id,n])=>lawLink(id,n)).join('')}</div>`:`<h2>本条尚无专题解读</h2><p>以下是整部规则的阅读提示，不是对本条新增义务的解释。</p><h3>规则定位</h3><p>${esc(l.overview)}</p><h3>运营阅读方向</h3><p>${esc(l.practice)}</p><h3>优先阅读条文</h3><div class="law-links">${l.priority.map(n=>lawLink(l.id,n,'第'+n+'条')).join('')}</div>`}<p class="fineprint">右侧为编写者的学习解释和控制建议，不属于法规原文；法规之间的连接表示共同阅读关系，不当然表示相互援引或同一适用范围。</p></aside></div>`;
}
function openLaw(id,n,remember=true){if(!lawMap[id]?.articles.some(a=>a.n===n))return;if(remember&&lawSelection)lawHistory.push({...lawSelection});lawSelection={id,n};if($('#reader').open)$('#reader').close();go('laws');}
const baseRenderOrg=renderOrg;
const baseReaderMarkup=readerMarkup;
readerMarkup=function(l){const refs={framework:[['fundlaw',2],['ordinance',11]],outsourcing:[['service',5],['internal',23]],control:[['internal',5]],lifecycle:[['register',39]],fa:[['service',33]],ta:[['service',20],['fit',3]],mo:[['futures',52]],redo:[['service',5]],data:[['datasecurity',27]],sla:[['service',11],['service',12]],disclosure:[['disclosure',19],['details',43]],agency:[['service',5]],star:[['internal',10]],simon:[['internal',5]],rapid:[['internal',15]],safety:[['internal',27]],loop:[['internal',5]],pdsa:[['internal',23]],kotter:[['internal',11]]}[l.id]||[];const c=DATA.cases.find(x=>x.lesson===l.id);return baseReaderMarkup(l).replace('<section class="dialog-note">',`<section class="local-reading"><h3>本地关联阅读</h3><div class="law-links">${refs.map(([id,n])=>lawLink(id,n)).join('')}${c?`<button class="btn small" data-open-case="${c.id}">用案例检验理解 →</button>`:''}</div></section><section class="dialog-note">`);};
renderOrg=function(){return baseRenderOrg()+`<div class="section-head"><h2>管理案例工作坊</h2><p>8个虚构案例 · 16道决策练习</p></div><div class="card-grid">${DATA.cases.map(c=>`<article class="course"><span class="badge">${esc(c.theory.split('：')[0])}</span><h3 style="margin-top:15px">${esc(c.title)}</h3><p>${esc(c.scene)}</p><button class="btn" data-case="${c.id}">进入案例 →</button></article>`).join('')}</div>${caseSelection?renderCase():''}`;};
function quizCard(q){return `<article class="quiz"><fieldset><legend>${esc(q.title)}</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="${q.id}" data-quiz="${q.id}" value="${i}" ${state.answers[q.id]===i?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset><div id="feedback-${q.id}">${quizFeedback(q)}</div></article>`;}
function renderCase(){const c=DATA.cases.find(x=>x.id===caseSelection);return `<section id="case-workshop" class="case-workshop"><div class="section-head"><div><div class="eyebrow">CASE WORKSHOP · 教学虚构情景</div><h2>${esc(c.title)}</h2></div><button class="btn" data-lesson="${c.lesson}">理论原理 ↗</button></div><p class="case-scene">${esc(c.scene)}</p><div class="split"><section class="panel"><span class="badge">${esc(c.theory)}</span><h3>解释机制</h3><p>${esc(c.principle)}</p><h3>将理论变为行动</h3><ol>${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>练习产出</h3><p>${esc(c.output)}</p><div class="boundary">${esc(c.boundary)}</div><h3>相关制度与控制</h3>${c.refs.map(([id,n])=>lawLink(id,n)).join('')}<p class="fineprint">用相关理论单元中的笔记区记录自己的决策依据，可随学习笔记导出。</p></section><section><p id="quiz-score" class="small muted">案例自测 · 选择后查看解析</p>${c.quizIds.map(id=>quizCard(quizzes.find(q=>q.id===id))).join('')}<div class="output"><h3>迁移练习</h3><p>将案例换成你的FA、TA或MO流程：先写事实与假设，再写谁决定、需要什么证据，以及如何确认改进有效。</p></div></section></div></section>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.law){openLaw(b.dataset.law,Number(b.dataset.article));}if(b.hasAttribute('data-law-index')){lawSelection=null;lawHistory=[];go('laws');}if(b.hasAttribute('data-law-back')){const p=lawHistory.pop();if(p)openLaw(p.id,p.n,false);}if(b.dataset.lawLevel){lawLevel=b.dataset.lawLevel;render();}if(b.hasAttribute('data-law-full')){const l=lawMap[lawSelection.id];download(l.title+'.txt',l.title+'\n'+l.version+'\n\n'+l.articles.map(a=>a.label+'\n'+a.text).join('\n\n')+'\n\n权威原文来源：'+l.textSource+'\n收录核验：'+l.checked,'text/plain;charset=utf-8');}if(b.dataset.case){caseSelection=b.dataset.case;render();$('#case-workshop').scrollIntoView({behavior:'instant'});}});
document.addEventListener('submit',e=>{if(e.target.id==='law-search-form'){e.preventDefault();lawQuery=$('#law-search').value.trim();lawScope=$('#law-scope').value;render();document.querySelector('.law-search').scrollIntoView({behavior:'instant',block:'start'});}});
document.addEventListener('change',e=>{if(e.target.id==='article-select')openLaw(lawSelection.id,Number(e.target.value));});
document.addEventListener('click',e=>{const b=e.target.closest('[data-open-case]');if(b){caseSelection=b.dataset.openCase;$('#reader').close();go('org');requestAnimationFrame(()=>$('#case-workshop')?.scrollIntoView({behavior:'instant'}));}});

render();
</script>
</body>
