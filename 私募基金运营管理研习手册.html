；\n（六）被列为严重失信人或者被纳入失信被执行人名单；\n（七）中国证监会、协会规定的其他情形。私募基金管理人最近 2年每个季度末管理规模均低于500万元人民币的，协会在信息公示平台予以特别提示。"},{"n":73,"label":"第七十三条","chapter":"第五章 自律管理","text":"私募基金管理人应当持续符合法律、行政法规、中国证监会和协会规定的相关要求。不符合要求的，协会予以公示并要求其限期改正；情节严重的，协会采取暂停办理私募基金备案的自律管理措施；逾期未改正或者经改正后仍不符合要求，情节特别严重的，协会注销私募基金管理人登记。协会可以要求私募基金管理人按照相关规定，委托律师事务所出具专项法律意见书就整改情况进行核验，并就其是否符合相关要求出具法律意见。"},{"n":74,"label":"第七十四条","chapter":"第五章 自律管理","text":"私募基金管理人出现重大经营风险，严重损害投资者利益或者危害市场秩序的，应当妥善处置和化解风险，切实履行管理人职责，维护投资者合法权益。其控股股东、实际控制人、普通合伙人、主要出资人应当积极配合相关风险处置和化解工作，承担补充实缴出资以及维持私募基金管理人运营、清收基金资产和安抚基金投资者等风险化解的责任。协会可以采取要求前述主体报送自查报告、提交风险处置方案、定期报告风险化解情况、委托律师事务所出具专项法律意见书、提交经会计师事务所审计的财务报告、鉴证报告、商定程序报告等措施，并可视情况暂停办理私募基金管理人登记信息变更和私募基金备案。"},{"n":75,"label":"第七十五条","chapter":"第五章 自律管理","text":"私募基金管理人有下列情形之一的，协会可以视情况要求其管理的私募基金不得新增投资者和基金规模，不得新增投资：\n（一）因有本办法第四十二条规定的情形被协会暂停备案，情节严重；\n（二）有本办法第四十四条第二款规定的情形，情节特别严重；\n（三）被协会采取限制相关业务活动的措施；\n（四）中国证监会及其派出机构要求限制相关业务活动；\n（五）中国证监会、协会规定的其他情形。"},{"n":76,"label":"第七十六条","chapter":"第五章 自律管理","text":"私募基金管理人有下列情形之一的，协会注销其私募基金管理人登记并予以公示：\n（一）主动申请注销登记，理由正当；\n（二）登记后 12个月内未备案自主发行的私募基金，或者备案的私募基金全部清算后 12个月内未备案新的私募基金，另有规定的除外；\n（三）依法解散、注销，依法被撤销、吊销营业执照、责令关闭或者被依法宣告破产；\n（四）中国证监会、协会规定的其他情形。因前款第一项规定的情形注销的，如管理的私募基金尚未清算，私募基金管理人应当取得投资者的一致同意，或者按照合同约定的决策机制达成处理意见。"},{"n":77,"label":"第七十七条","chapter":"第五章 自律管理","text":"私募基金管理人有下列情形之一的，协会注销其私募基金管理人登记：\n（一）因非法集资、非法经营等重大违法犯罪行为被追究法律责任；\n（二）存在本办法第二十五条第一款第六项规定的情形；\n（三）金融管理部门要求协会注销登记；\n（四）因失联状态被协会公示，公示期限届满未与协会取得有效联系；\n（五）采取拒绝、阻碍中国证监会及其派出机构、协会及其工作人员依法行使检查、调查职权等方式，不配合行政监管或者自律管理，情节严重；\n（六）未按照本办法第七十三条、第七十四条的规定提交专项法律意见书，或者提交的法律意见书不符合要求或者出具否定性结论；\n（七）中国证监会、协会规定的其他情形。"},{"n":78,"label":"第七十八条","chapter":"第五章 自律管理","text":"私募基金管理人被注销或者撤销登记后，应当符合下列要求：\n（一）不得新增投资者和基金规模，不得新增投资；\n（二）不得继续使用“基金”“基金管理”字样或者近似名称进行私募基金业务活动，但处置存续私募基金有关事项的除外；\n（三）采取适当措施，按照规定和合同约定妥善处置基金财产，维护投资者的合法权益；\n（四）基金财产处置完毕的，应当及时向市场主体登记机关办理变更名称、经营范围或者注销市场主体登记。被注销或者撤销登记的私募基金管理人对未清算的私募基金的受托管理职责和依法承担的相关责任，不因私募基金管理人被注销或者撤销登记而免除；不得通过注销市场主体登记、变更注册地等方式逃避相关责任。"},{"n":79,"label":"第七十九条","chapter":"第五章 自律管理","text":"协会在中国证监会的指导下，与其派出机构、其他金融管理部门、司法机关、地方政府和地方行业协会，建立业务协作和信息共享机制。私募基金管理人、私募基金托管人、私募基金服务机构及其从业人员违反本办法规定被协会采取自律管理或者纪律处分措施的，记入证券期货市场诚信档案数据库；涉嫌违反法律法规的，报中国证监会查处；涉嫌犯罪的，向中国证监会报告，移送司法机关追究其刑事责任。"},{"n":80,"label":"第八十条","chapter":"第六章 附则","text":"本办法下列用语的含义：\n（一）高级管理人员：是指公司的总经理、副总经理、合规风控负责人和公司章程规定的其他人员，以及合伙企业中履行前述经营管理和风控合规等职务的相关人员；虽不使用前述名称，但实际履行前述职务的其他人员，视为高级管理人员。\n（二）控股股东：是指出资额占有限责任公司资本总额50%以上或者其持有的股份占股份有限公司股本总额 50%以上的股东；出资额或者持有股份的比例虽然不足 50%，但依其出资额或者持有的股份所享有的表决权已足以对股东会、股东大会的决议产生重大影响的股东。\n（三）实际控制人：是指通过投资关系、协议或者其他安排，能够实际支配私募基金管理人运营的自然人、法人或者其他组织。实际控制人的具体认定标准由协会另行规定。\n（四）主要出资人：是指持有私募基金管理人 25%以上股权或者财产份额的股东、合伙人。\n（五）冲突业务：是指民间借贷、民间融资、小额理财、小额借贷、担保、保理、典当、融资租赁、网络借贷信息中介、众筹、场外配资、房地产开发、交易平台等与私募基金管理相冲突的业务，中国证监会、协会另有规定的除外。\n（六）资产管理产品：是指银行、信托、证券、基金、期货、保险资产管理机构、私募基金管理人等受国务院金融监督管理机构监管的机构依法发行的资产管理产品，包括银行非保本理财、证券期货经营机构资产管理计划、信托计划、保险资产管理产品和在协会备案的私募基金等。\n（七）本办法所称的“以上”“届满”，包括本数；所称的“超过”“以外”，不包括本数。"},{"n":81,"label":"第八十一条","chapter":"第六章 附则","text":"国家有关部门对下列私募基金管理人、私募基金另有规定的，从其规定：\n（一）政府及其授权机构通过直接出资、委托出资或者以注资企业方式出资设立的；\n（二）国有企业、国有资本占控股地位或者主导地位的企业出资设立的；\n（三）金融机构出资设立的；\n（四）中国证监会规定的其他情形。"},{"n":82,"label":"第八十二条","chapter":"第六章 附则","text":"私募资产配置类基金登记备案的特别规定，由协会另行制定。"},{"n":83,"label":"第八十三条","chapter":"第六章 附则","text":"本办法自 2023年 5月 1日起施行。自施行之日起，《私募投资基金管理人登记和基金备案办法（试行）》《私募基金管理人登记须知》《私募基金登记备案相关问题解答》（四）、（十三）、（十四）同时废止。"}],"source":"https://www.amac.org.cn/xwfb/xhyw/202302/t20230224_15636.html","textSource":"https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/smjjglrdjhcpba/fwzn/202206/P020231129532332167341.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"a7318dad5059d35c8a880344d4057f4bfe333ab00ed2d4dcb7e825fa207eda0a"},{"id":"filing1","title":"私募投资基金备案指引第1号——私募证券投资基金","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"2023年发布","effective":"2023-09-28","scope":"证券","topics":["产品备案","变更","清算"],"overview":"证券类基金备案的专项规则，需与登记备案办法、后续运作指引及备案材料清单共同使用。","practice":"产品设立前把合同、账户、募集完成证据、投资者信息、规模与运作安排对齐；备案提交前做版本一致性检查。","priority":[2,3,4,5,21,23],"articles":[{"n":1,"label":"第一条","chapter":"正文","text":"为了规范私募证券投资基金（以下简称私募证券基金）备案业务，保护投资者合法权益，促进私募基金行业健康发展，根据《中华人民共和国证券投资基金法》《私募投资基金监督管理条例》《私募投资基金监督管理暂行办法》《证券期货投资者适当性管理办法》《私募投资基金登记备案办法》（以下简称《登记备案办法》）等，制定本指引。"},{"n":2,"label":"第二条","chapter":"正文","text":"私募基金管理人办理私募证券基金的备案、备案信息变更和清算等业务，适用本指引。"},{"n":3,"label":"第三条","chapter":"正文","text":"私募基金管理人按照《登记备案办法》第三十九条的规定提请办理私募证券基金备案的，所提交的募集推介材料应当为私募基金管理人、基金销售机构在募集过程中真实使用的募集推介材料。《登记备案办法》第二十八条规定的私募证券基金募集推介材料中的“重要信息”，还包括下列内容：\n（一）私募证券基金有多名投资经理的，应当披露设置多名投资经理的合理性、管理方式、分工安排、调整机制等内容；\n（二）委托基金投资顾问机构提供证券投资建议服务的，应当披露基金投资顾问机构名称、投资顾问服务范围、投资顾问费用，以及更换、解聘投资顾问的条件和程序等内容；\n（三）私募证券基金进行份额分级的，应当披露分级设计及相应风险、收益分配、风险控制等内容；\n（四）中国证监会、协会规定的其他内容。私募基金管理人、基金销售机构应当确保募集推介材料中的信息真实、准确、完整。"},{"n":4,"label":"第四条","chapter":"正文","text":"以合伙企业、契约等非法人形式，通过汇集多数投资者的资金直接或者间接投资于私募证券基金的，私募基金管理人、基金销售机构应当穿透核查每一层的投资者是否为合格投资者，并合并计算投资者人数。下列投资者视为合格投资者，不再穿透核查和合并计算投资者人数：\n（一）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金；\n（二）国务院金融监督管理机构监管的机构依法发行的资产管理产品、私募基金；\n（三）合格境外机构投资者、人民币合格境外机构投资者；\n（四）投资于所管理私募证券基金的私募基金管理人及其员工；\n（五）中国证监会规定的其他投资者。本条第二款第四项所称私募基金管理人员工，是指与私募基金管理人签订劳动合同并缴纳社保的正式员工，签订劳动合同或者劳务合同的外籍员工、退休返聘员工，国家机关、事业单位、政府及其授权机构控制的企业委派的高级管理人员，以及中国证监会和协会规定的其他从业人员。"},{"n":5,"label":"第五条","chapter":"正文","text":"私募基金管理人、基金销售机构应当确保私募证券基金的投资者具备与其认（申）购基金相匹配的出资能力，投资者不得汇集他人资金认（申）购私募证券基金。私募基金管理人应当确保提请办理备案手续的私募证券基金已完成真实募集，不得在基金备案完成后通过短期赎回基金份额等方式，规避最低出资、募集完毕等要求。协会办理私募证券基金备案时，可以视情况要求私募基金管理人提供投资者的出资能力证明等材料。"},{"n":6,"label":"第六条","chapter":"正文","text":"私募基金管理人应当按照中国证监会和协会的规定，向投资者进行书面风险揭示和问卷调查，国务院金融监督管理机构监管的机构、符合本指引第四条第二款的投资者可以豁免签署风险揭示书和风险调查问卷等材料。"},{"n":7,"label":"第七条","chapter":"正文","text":"单个投资者对私募证券基金的首次出资金额不得低于合格投资者最低出资要求，但下列投资者除外：\n（一）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金；\n（二）投资于所管理私募证券基金的私募基金管理人及其员工；\n（三）中国证监会、协会规定的其他投资者。"},{"n":8,"label":"第八条","chapter":"正文","text":"私募基金管理人或者基金销售机构应当按照中国证监会和协会的规定，与募集监督机构签署募集监督协议，明确约定私募证券基金募集结算资金专用账户的控制权、责任划分以及保障资金划转安全等事项。"},{"n":9,"label":"第九条","chapter":"正文","text":"私募证券基金的名称应当标明私募基金管理人名称简称以及“私募证券投资基金”字样，不得包含“理财”“资管产品”“资管计划”等字样，法律、行政法规、中国证监会和协会另有规定的除外。未经批准或者授权，不得在基金名称中使用与国家重大发展战略、金融机构、知名私募基金管理人相同或者近似等可能误导投资者的字样。不得在基金名称中使用违背公序良俗或者造成不良社会影响的字样。"},{"n":10,"label":"第十条","chapter":"正文","text":"私募证券基金的基金合同应当约定明确、合理的存续期，不得约定无固定期限。"},{"n":11,"label":"第十一条","chapter":"正文","text":"私募证券基金的基金合同应当明确约定封闭式、开放式等基金运作方式。开放式私募证券基金的基金合同应当设置固定开放日，明确投资者认（申）购、赎回时间、频率、程序以及限制事项。未按照基金合同约定征得投资者同意，私募基金管理人不得擅自更改投资者认（申）购、赎回时间、频率、程序以及限制事项。私募证券基金设置临时开放日的，应当在基金合同中明确约定临时开放日的触发条件仅限于因法律、行政法规、监管政策调整、合同变更或解除等情形，不得利用临时开放日进行申购。私募基金管理人应当在临时开放日前 2个交易日通知全体投资者。"},{"n":12,"label":"第十二条","chapter":"正文","text":"私募证券基金的投资范围应当符合《登记备案办法》第三十一条第一款的规定，并在基金合同中明确约定：\n（一）投资策略与基金的风险收益特征；\n（二）调整投资范围或者投资比例限制时应当履行的变更程序，并设置临时开放日允许投资者赎回；\n（三）中国证监会、协会规定的其他内容。"},{"n":13,"label":"第十三条","chapter":"正文","text":"私募证券基金设置不同基金份额类别的，应当公平对待各基金份额持有人。基金合同应当明确约定基金份额类别的划分标准等相关要素，对不同份额类别可以设置差异化的认（申）购费率、赎回费率、管理费率、销售服务费率及业绩报酬计提比例等，不得设置差异化的开放日、封闭期、份额锁定期、业绩报酬计提基准。"},{"n":14,"label":"第十四条","chapter":"正文","text":"开放式私募证券基金不得进行份额分级。封闭式私募证券基金可以根据收益特征对份额进行分级。封闭式分级私募证券基金的名称应当包含“分级”或者“结构化”字样。固定收益类私募证券基金优先级与劣后级的比例不得超过 3:1，混合类、期货和衍生品类私募证券基金优先级与劣后级的比例不得超过 2:1，权益类私募证券基金的优先级与劣后级的比例不得超过 1:1。分级私募证券基金的同级份额享有同等权益、承担同等风险，若存在中间级份额，中间级份额应当计入优先级份额。优先级份额投资者获取收益或者承担亏损的比例不得低于30%，劣后级份额投资者获取收益或者承担亏损的比例不得高于 70%。分级私募证券基金不得投资其他分级或者结构化金融产品，不得直接或者间接对优先级份额投资者提供保本保收益安排。分级私募证券基金的总资产不得超过该基金净资产的 140%。"},{"n":15,"label":"第十五条","chapter":"正文","text":"私募基金管理人不得在私募证券基金内部设立由不同投资者参与并投向不同资产的投资单元或者基金子份额。"},{"n":16,"label":"第十六条","chapter":"正文","text":"私募基金管理人及私募证券基金不得通过设置增强资金、费用返还等方式调节基金收益或者亏损，不得以自有资金认购的基金份额先行承担亏损的方式提供风险补偿。"},{"n":17,"label":"第十七条","chapter":"正文","text":"基金合同应当约定私募证券基金各项费用的计费标准、计费时点、计提方式、计提频率等相关事项。从私募证券基金财产中支出的费用应当与基金运营、服务直接相关，不得支出与基金运作无关的费用。"},{"n":18,"label":"第十八条","chapter":"正文","text":"私募基金管理人应当根据私募证券基金的投资范围、投资策略、产品结构等因素设置合理的管理费。私募基金管理人以外的其他主体不得收取管理费。私募基金管理人不得通过约定管理费返还等方式，变相向投资者提供保本保收益安排。"},{"n":19,"label":"第十九条","chapter":"正文","text":"业绩报酬计提应当与私募证券基金的存续期限、收益分配和投资运作特征相匹配，单只私募证券基金只能采取一种业绩报酬计提方法，保证公平对待投资者。业绩报酬计提比例不得超过业绩报酬计提基准以上投资收益的60%。私募证券基金连续两次计提业绩报酬的间隔期不应短于 6个月。在投资者赎回基金份额时或者在私募证券基金清算时计提业绩报酬的，可以不受前述间隔期的限制。鼓励私募基金管理人在投资者持有基金份额期间不计提业绩报酬，以投资者赎回份额或者基金清算时的净值为基准计提业绩报酬。私募基金管理人按照基金合同约定的计提比例、计提时点、计提频率和计提方法对基金业绩超出计提基准的部分计提业绩报酬的，应当以投资者取得正收益为前提，但同时符合下列条件的除外：\n（一）以获取基于指数的超额收益为目标，将业绩报酬计提基准设置为某个指数，并采用紧盯该指数的投资策略；\n（二）仅在投资者赎回或者基金清算时计提业绩报酬；\n（三）在募集推介材料及基金合同的醒目位置明确提示投资者可能会在亏损的情况下计提业绩报酬。"},{"n":20,"label":"第二十条","chapter":"正文","text":"投资经理应当具有股票、债券、衍生品、证券投资基金等证券投资领域的投资管理或者研究经验，具备良好的诚信记录和职业操守。基金合同应当明确约定投资经理及其变更程序。投资经理发生变更的，应当按照基金合同约定履行相关变更程序后将变更情况及时告知投资者，并设置临时开放日允许投资者赎回。"},{"n":21,"label":"第二十一条","chapter":"正文","text":"私募证券基金应当由私募基金托管人托管，但按照基金合同约定设置能够切实履行安全保管基金财产职责的基金份额持有人大会日常机构等制度措施的除外。"},{"n":22,"label":"第二十二条","chapter":"正文","text":"私募证券基金发生《登记备案办法》第五十五条规定的信息变更的，私募基金管理人应当自变更之日起 10个工作日内，向协会报送变更决议文件、变更事项说明函以及下列变更材料，履行变更手续：\n（一）基金合同约定的存续期限、投资范围、投资策略、投资限制、收益分配原则、基金费用等事项变更的，还应当提交补充协议或者履行基金合同中变更程序所涉及材料；\n（二）私募基金托管人变更的，还应当提交托管人变更协议、重新签订的托管协议或者基金合同；\n（三）基金服务机构变更的，还应当提交重新签订的基金服务协议；\n（四）影响基金运行和投资者利益的其他重大事项发生变更的，还应当提交相应变更事项所涉及材料；\n（五）中国证监会、协会规定的其他材料。私募证券基金发生上述信息变更的，私募基金管理人应当向投资者披露并采取设置临时开放日或者其他保障投资者赎回私募证券基金权利的措施，但变更内容有利于投资者的除外。"},{"n":23,"label":"第二十三条","chapter":"正文","text":"私募证券基金存在下列情形之一的，应当进行清算：\n（一）存续期届满且不展期的；\n（二）发生基金合同约定应当终止的情形的；\n（三）经投资者、私募基金管理人、私募基金托管人协商一致决定终止基金合同的；\n（四）法律、行政法规、中国证监会和协会规定的其他情形。私募证券基金完成清算，剩余基金财产可以以货币资金方式分配给投资者，或者经投资者同意，以实物资产方式分配给投资者。"},{"n":24,"label":"第二十四条","chapter":"正文","text":"《登记备案办法》第五十七条规定的“一定期限内无法完成清算的”是指私募证券基金开始清算但预计 3个月内无法完成清算。"},{"n":25,"label":"第二十五条","chapter":"正文","text":"私募基金管理人有《登记备案办法》第六十六条规定情形的，协会可以撤销相关私募证券基金备案，并对私募基金管理人后续提请办理备案的私募证券基金采取要求其出具内部合规意见等措施。"},{"n":26,"label":"第二十六条","chapter":"正文","text":"协会对下列私募证券基金另有规定的，从其规定；未有规定的，适用本指引：\n（一）合格境内有限合伙人试点私募证券基金；\n（二）中国证监会规定的其他私募证券基金。"},{"n":27,"label":"第二十七条","chapter":"正文","text":"违反本指引规定的，协会按照《登记备案办法》和协会其他自律规则，采取自律管理或者纪律处分措施。"},{"n":28,"label":"第二十八条","chapter":"正文","text":"本指引自发布之日起施行。"}],"source":"https://www.amac.org.cn/xwfb/xhyw/202309/t20230928_24136.html","textSource":"https://www.amac.org.cn/xwfb/xhyw/202309/P020231126420860615829.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"9d413844adc8998acc36d7f26565b31c4ba647a6b87b5b9e51b5d40981125f71"},{"id":"filing2","title":"私募投资基金备案指引第2号——私募股权、创业投资基金","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"2023年发布","effective":"2023-09-28","scope":"股权创投","topics":["产品备案","扩募","项目","退出"],"overview":"股权、创业投资基金的专项备案规则。不能把证券基金的申赎、每日估值或流动性假设直接用于封闭式股权基金。","practice":"围绕认缴实缴、缴款通知、资本账户、后续募集、投资项目、分配与退出证据组织流程。","priority":[2,3,10,14,18,27,35],"articles":[{"n":1,"label":"第一条","chapter":"正文","text":"为了规范私募股权、创业投资基金(以下统称私募股权基金）备案业务，保护投资者合法权益，促进私募基金行业健康发展，根据《中华人民共和国证券投资基金法》《私募投资基金监督管理条例》《私募投资基金监督管理暂行办法》《证券期货投资者适当性管理办法》《私募投资基金登记备案办法》（以下简称《登记备案办法》）等，制定本指引。"},{"n":2,"label":"第二条","chapter":"正文","text":"私募基金管理人办理私募股权基金的备案、备案信息变更和清算等业务，适用本指引。"},{"n":3,"label":"第三条","chapter":"正文","text":"私募基金管理人按照《登记备案办法》第三十九条的规定提请办理私募股权基金备案的，所提交的募集推介材料应当为私募基金管理人、基金销售机构在募集过程中真实使用的募集推介材料。《登记备案办法》第二十八条规定的私募股权基金募集推介材料中的“重要信息”，还包括下列内容：\n（一）关键人士（如有）或者投资决策委员会成员（如有）；\n（二）单一拟投项目或者首个拟投项目组合（如有）的主营业务、交易对手方（如有）、基金投资款用途、退出方式等；\n（三）中国证监会、协会规定的其他内容。私募基金管理人、基金销售机构应当确保募集推介材料中的信息真实、准确、完整。"},{"n":4,"label":"第四条","chapter":"正文","text":"以合伙企业、契约等非法人形式，通过汇集多数投资者的资金直接或者间接投资于私募股权基金的，私募基金管理人、基金销售机构应当穿透核查每一层的投资者是否为合格投资者，并合并计算投资者人数。下列投资者视为合格投资者，不再穿透核查和合并计算投资者人数：\n（一）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金；\n（二）国务院金融监督管理机构监管的机构依法发行的资产管理产品、私募基金；\n（三）合格境外机构投资者、人民币合格境外机构投资者；\n（四）投资于所管理私募股权基金的私募基金管理人及其员工；\n（五）中国证监会规定的其他投资者。"},{"n":5,"label":"第五条","chapter":"正文","text":"私募基金管理人、基金销售机构应当确保私募股权基金的投资者具备与其认缴、认（申）购金额相匹配的出资能力，投资者不得汇集他人资金投资私募股权基金。协会办理私募股权基金备案时，可以视情形要求私募基金管理人提供投资者的出资能力证明等材料。"},{"n":6,"label":"第六条","chapter":"正文","text":"私募基金管理人应当按照中国证监会和协会的规定，向投资者进行书面风险揭示和问卷调查，国务院金融监督管理机构监管的机构、符合本指引第四条第二款的投资者可以豁免签署风险揭示书和风险调查问卷等材料。"},{"n":7,"label":"第七条","chapter":"正文","text":"单个投资者对私募股权基金的首期实缴出资不得低于合格投资者最低出资要求，但下列投资者除外：\n（一）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金；\n（二）保险资金；\n（三）地市级以上政府出资产业投资基金；\n（四）投资于所管理私募股权基金的私募基金管理人及其员工；\n（五）中国证监会、协会规定的其他投资者。私募股权基金备案后，私募基金管理人不得允许投资者以抽逃出资或者虚假出资为目的，通过向私募股权基金借款等方式规避最低出资要求。"},{"n":8,"label":"第八条","chapter":"正文","text":"私募基金管理人或者基金销售机构应当按照中国证监会和协会的规定，与募集监督机构签署募集监督协议，明确约定私募股权基金募集结算资金专用账户的控制权、责任划分以及保障资金划转安全等事项。"},{"n":9,"label":"第九条","chapter":"正文","text":"私募股权基金的名称应当标明“股权基金”“股权投资”等字样，私募股权基金组织形式为契约型的，名称应当标明“私募股权基金”字样。创业投资基金的名称应当标明“创业投资基金”字样，但公司型或者合伙型创业投资基金的经营范围中标明“从事创业投资活动”字样等已体现创业投资策略的除外。私募股权基金的名称中不得包含“理财”“资管产品”“资管计划”等字样，法律、行政法规、中国证监会和协会另有规定的除外。未经批准或者授权，不得在基金名称中使用与国家重大发展战略、金融机构、知名私募基金管理人相同或者近似等可能误导投资者的字样。不得在基金名称中使用违背公序良俗或者造成不良社会影响的字样。"},{"n":10,"label":"第十条","chapter":"正文","text":"私募股权基金的架构应当清晰、透明，不得通过设置复杂架构、多层嵌套等方式规避监管要求，收取不合理费用。私募基金管理人应当向投资者充分披露投资架构及投资者承担的费用等有关信息。私募基金管理人不得在私募股权基金内部设立由不同投资者参与并投向不同资产的投资单元或者基金子份额，但因投资排除等机制导致前述情形的除外。"},{"n":11,"label":"第十一条","chapter":"正文","text":"私募基金管理人不得将资金募集、投资管理等职责委托他人行使，变相开展多管理人或者通道业务。私募证券基金管理人或者其他类私募基金管理人不得通过担任合伙型私募股权基金的普通合伙人等方式，变相突破专业化运营要求。"},{"n":12,"label":"第十二条","chapter":"正文","text":"私募基金管理人设立合伙型私募股权基金且担任合伙人的，应当为执行事务合伙人。私募基金管理人不担任合伙人的，应当与其中一名执行事务合伙人存在控制关系或者受同一控股股东、实际控制人控制。"},{"n":13,"label":"第十三条","chapter":"正文","text":"基金合同、合伙协议或者公司章程（以下统称基金合同）应当约定主要投资行业、投资地域、投资阶段、投资集中度等，并符合私募股权基金投资范围要求。私募股权基金投资《登记备案办法》第三十一条第二款规定的资产的，应当符合下列要求：\n（一）投资未上市企业股权的，应当符合《登记备案办法》第四十一条的规定，不得变相从事信贷业务、经营性民间借贷活动，不得投向从事保理、融资租赁、典当等与私募基金相冲突业务的企业股权，不得投向国家禁止或者限制投资以及不符合国家产业政策、环境保护政策、土地管理政策的企业股权；\n（二）投资首发企业股票、存托凭证（以下统称股票）的，应当通过战略配售、基石投资（港股等境外市场）等方式，不得参与网下申购和网上申购；\n（三）投资上市公司股票的，应当通过定向增发、大宗交易和协议转让等方式，不得参与公开发行或者公开交易，但所投资公司上市后基金所持股份的未转让及其配售部分和所投资公司在北京证券交易所上市后基金增持部分除外；\n（四）投资上市公司可转换债券和可交换债券的，应当通过非公开发行或者非公开交易的方式；\n（五）投资公开募集基础设施证券投资基金份额的，应当通过战略配售、网下认购和非公开交易等方式，不得参与面向公众投资者的发售和竞价交易；\n（六）投资资产支持证券的，限于不动产持有型资产支持证券；\n（七）投资区域性股权市场可转债的，投资金额应当不超过基金实缴金额的 20%。鼓励创业投资基金投资早期企业、中小企业和高新技术企业。除中国证监会和协会另有规定外，创业投资基金不得直接或者间接投资下列资产：\n（一）不动产（含基础设施）；\n（二）本条第二款第二项、第四项至第六项规定的资产；\n（三）上市公司股票，但所投资公司上市后基金所持股份的未转让及其配售部分除外。"},{"n":14,"label":"第十四条","chapter":"正文","text":"除《关于加强私募投资基金监管的若干规定》规定的借款外，私募股权基金以股权投资为目的，对被投企业进行附转股权的债权投资的，约定的转股条件应当科学、合理、具有可实现性，与被投企业或者其关联方的股权结构、商业模式、经营业绩、上市进度、知识产权和核心人员等相挂钩。满足转股条件的，应当及时将债权转为股权，并办理对被投企业或者其关联方的股权确权手续。未选择转股的，应当按照基金合同约定征得投资者同意或者向投资者披露未转股原因。私募股权基金不得利用附转股权的债权投资变相从事借贷活动。"},{"n":15,"label":"第十五条","chapter":"正文","text":"私募股权基金采用分级安排的，私募基金管理人应当向投资者充分披露私募股权基金的分级设计、完整的风险收益分配情形等信息。投资本指引第十三条第二款第二项至第六项规定资产的分级私募股权基金，应当符合利益共享、风险共担、风险与收益相匹配原则，优先级与劣后级的比例不得超过 1:1，优先级份额投资者获取收益或者承担亏损的比例不得低于30%，劣后级份额投资者获取收益或者承担亏损的比例不得高于 70%。分级私募股权基金若存在中间级份额，计算杠杆、收益或者亏损比例时，中间级份额应当计入优先级份额。"},{"n":16,"label":"第十六条","chapter":"正文","text":"私募基金管理人应当向投资者披露投资架构，包含特殊目的载体（如有）、底层投资标的、基金交易对手方（如有），以及基金与特殊目的载体（如有）、特殊目的载体（如有）与交易对手方（如有）之间的划款路径等事项。"},{"n":17,"label":"第十七条","chapter":"正文","text":"私募基金管理人应当合理确定私募股权基金所投资资产的期限，加强流动性风险管理。私募股权基金投资资产管理产品、其他私募股权基金，或者接受其他私募股权基金投资的，私募股权基金的到期日应当不早于下层资产管理产品、私募股权基金的到期日 6个月以上，不晚于上层私募股权基金的到期日 6个月以上。但有下列情形之一的除外：\n（一）上层基金全体投资者一致同意期限错配事项；\n（二）本基金承担国家或者区域发展战略需要；\n（三）上层基金为规范运作的母基金；\n（四）上层基金投资者中有社会保障基金、企业年金等养老基金，保险资金或者地市级以上政府出资产业投资基金等；\n（五）中国证监会、协会规定的其他情形。"},{"n":18,"label":"第十八条","chapter":"正文","text":"基金合同应当约定私募股权基金各项费用的计费标准、计费时点、计提方式、计提频率等相关事项。从私募股权基金财产中支出的费用应当与基金运营、服务直接相关，不得支出与基金运作无关的费用。"},{"n":19,"label":"第十九条","chapter":"正文","text":"私募基金管理人应当设置合理的管理费。私募基金管理人不收取管理费或者管理费明显低于管理基金成本的，应当具有合理性，并在提请办理备案时提供相关说明。私募基金管理人以外的其他主体不得收取管理费。私募基金管理人不得通过约定管理费返还等方式，变相向投资者提供保本保收益安排。"},{"n":20,"label":"第二十条","chapter":"正文","text":"私募股权基金的业绩报酬计提应当清晰、合理，与基金实际表现相挂钩，不得采取在特定基准线以上100%计提等类似存款计息的计提方式。"},{"n":21,"label":"第二十一条","chapter":"正文","text":"私募股权基金存在下列情形之一的，应当由私募基金托管人托管：\n（一）私募股权基金的组织形式为契约型，但按照基金合同约定设置能够切实履行安全保管基金财产职责的基金份额持有人大会日常机构等制度措施的除外；\n（二）通过特殊目的载体开展投资的；\n（三）法律、行政法规、中国证监会和协会规定的其他情形。私募股权基金通过特殊目的载体开展投资的，托管人应当持续监督私募股权基金与特殊目的载体的资金流向，事前掌握资金划转路径，事后获取并保管资金划转及投资凭证。私募基金管理人应当及时将投资凭证交付托管人。"},{"n":22,"label":"第二十二条","chapter":"正文","text":"私募股权基金开放申购或者认缴的，应当符合下列条件：\n（一）由私募基金托管人进行托管；\n（二）在基金合同约定的投资期内；\n（三）开放申购或者认缴按照基金合同约定经全体投资者一致同意或者经全体投资者认可的决策机制决策通过；\n（四）中国证监会、协会规定的其他条件。私募股权基金开放申购或者认缴，增加的基金认缴总规模不得超过备案时基金认缴总规模的 3 倍，但符合下列情形之一的除外：\n（一）既存投资者或者新增投资者中存在社会保障基金、企业年金等养老基金；\n（二）既存投资者或者新增投资者中存在慈善基金等社会公益基金、保险资金或者地市级以上政府出资产业投资基金，并且前述投资者之一的实缴出资不低于 1000万元；\n（三）既存投资者和新增投资者均为首期实缴出资不低于 1000万元的投资者，私募基金管理人、私募基金管理人员工直接或者间接通过合伙企业等非法人形式间接投资于本公司管理的私募股权基金，且实缴出资不低于 100万的除外；\n（四）在协会备案为创业投资基金，且开放申购或者认缴时，基金已完成不少于 2个对早期企业、中小企业或者高新技术企业的投资；\n（五）中国证监会、协会规定的其他情形。适用本条第二款第三项要求的投资者为在协会备案的私募基金以及合伙企业等非法人形式的，私募基金管理人应当穿透认定投资者是否符合本条第二款第三项要求。增加基金认缴规模的，管理人应当依法履行信息披露义务，向投资者披露扩募资金的来源、规模、用途等信息。"},{"n":23,"label":"第二十三条","chapter":"正文","text":"鼓励私募股权基金进行组合投资。投资于单一标的的私募股权基金，其募集推介材料、基金合同应当明确约定私募股权基金仅投资于单一标的，并披露单一标的的具体信息。"},{"n":24,"label":"第二十四条","chapter":"正文","text":"私募股权基金的财产账户应当以基金名义开立，私募基金管理人不得使用自己或者他人名义为私募股权基金开立账户和接收出资，不得使用基金财产为自己或者他人垫付资金。"},{"n":25,"label":"第二十五条","chapter":"正文","text":"私募基金管理人应当公平地对待其管理的不同私募股权基金财产，有效防范私募股权基金之间的利益输送和利益冲突，不得在不同私募股权基金之间转移收益或者亏损。在已设立的私募股权基金尚未完成认缴规模 70%的投资（含为支付基金税费的合理预留）之前，除经全体投资者一致同意或者经全体投资者认可的决策机制决策通过外，私募基金管理人不得设立与前述基金的投资策略、投资范围、投资阶段、投资地域等均实质相同的新基金。"},{"n":26,"label":"第二十六条","chapter":"正文","text":"私募基金管理人超过《登记备案办法》第三十九条规定的时限提请办理私募股权基金备案手续的，私募股权基金应当符合下列要求：\n（一）实缴规模不低于 1000万元；\n（二）由私募基金托管人进行托管；\n（三）投资范围符合《登记备案办法》第三十一条和本指引第十三条的要求；\n（四）《登记备案办法》和本指引关于私募股权基金备案的其他要求。私募股权基金募集完成后 3个月内，私募基金管理人未提请办理备案手续，或者自退回补正之日起 3个月内未重新报送备案材料的，协会不予办理私募基金备案。所管理的私募股权基金被协会不予办理备案的，私募基金管理人应当及时告知投资者，解除或者终止基金合同和委托管理协议，妥善处置基金财产，及时清算并向投资者分配。私募基金管理人未按要求提请办理基金备案手续的，在未完成相关基金备案或者整改前，协会不予办理其他基金备案。"},{"n":27,"label":"第二十七条","chapter":"正文","text":"私募股权基金发生《登记备案办法》第五十五条规定的信息变更的，私募基金管理人应当自变更之日起 10个工作日内，向协会报送变更决议文件、变更事项说明函以及下列变更材料，履行变更手续：\n（一）基金合同约定的存续期限、投资范围、投资策略、投资限制、收益分配原则、基金费用等事项变更的，还应当提交补充协议或者履行基金合同中变更程序所涉及材料；\n（二）私募基金托管人变更的，还应当提交托管人变更协议、重新签订的托管协议或者基金合同；\n（三）基金服务机构变更的，还应当提交重新签订的基金服务协议；\n（四）影响基金运行和投资者利益的其他重大事项变更的，还应当提交相应变更事项所涉及材料；\n（五）中国证监会、协会规定的其他材料。私募股权基金发生基金类型变更的，相关程序和材料等要求由协会另行制定。"},{"n":28,"label":"第二十八条","chapter":"正文","text":"私募股权基金存在下列情形之一的，应当进行清算：\n（一）存续期届满且不展期的；\n（二）发生基金合同约定应当终止的情形的；\n（三）经投资者、私募基金管理人协商一致决定终止基金合同的；\n（四）法律、行政法规、中国证监会和协会规定的其他情形。私募股权基金完成清算，剩余基金财产可以以货币资金方式分配给投资者，或者经投资者同意，以实物资产方式分配给投资者。"},{"n":29,"label":"第二十九条","chapter":"正文","text":"《登记备案办法》第五十七条规定的“一定期限内无法完成清算的”是指私募股权基金开始清算但预计 3个月内无法完成清算。"},{"n":30,"label":"第三十条","chapter":"正文","text":"已备案的公司型或者合伙型私募股权基金，经投资者和私募基金管理人协商一致解除委托管理关系，作为非基金形式的公司或者合伙企业继续运作的，应当及时变更名称和经营范围，不得保留“基金”或者其他误导性字样，私募基金管理人不得担任其股东或者合伙人。自变更之日起10个工作日内，私募基金管理人应当向协会提请办理基金注销。作为非基金形式存续的公司或者合伙企业不得以基金形式继续运作，不得再次委托私募基金管理人管理，不得再次提请备案为私募基金。"},{"n":31,"label":"第三十一条","chapter":"正文","text":"私募基金管理人有《登记备案办法》第六十六条规定情形的，协会可以撤销相关私募股权基金备案，并对私募基金管理人后续提请办理备案的私募股权基金采取要求其出具内部合规意见等措施。"},{"n":32,"label":"第三十二条","chapter":"正文","text":"协会在基金备案、事项变更等方面对创业投资基金提供区别于私募股权基金的差异化自律管理服务，包括专人专岗办理、适当简化办理手续等。"},{"n":33,"label":"第三十三条","chapter":"正文","text":"协会对下列私募股权基金另有规定的，从其规定；未有规定的，适用本指引：\n（一）符合《不动产私募投资基金试点备案指引（试行）》规定并参与试点的私募股权基金；\n（二）合格境内有限合伙人试点私募股权基金；\n（三）合格境外有限合伙人试点私募股权基金；\n（四）中国证监会规定的其他私募股权基金。"},{"n":34,"label":"第三十四条","chapter":"正文","text":"违反本指引规定的，协会按照《登记备案办法》和协会其他自律规则，采取自律管理或者纪律处分措施。"},{"n":35,"label":"第三十五条","chapter":"正文","text":"本指引下列用语的含义：\n（一）关键人士：是指在基金募集、项目获取、投资决策、增值服务、投资退出等重要环节发挥关键性作用的基金管理团队核心成员。\n（二）私募基金管理人员工：是指与私募基金管理人签订劳动合同并缴纳社保的正式员工，签订劳动合同或者劳务合同的外籍员工、退休返聘员工，国家机关、事业单位、政府及其授权机构控制的企业委派的高级管理人员，以及中国证监会和协会规定的其他从业人员。\n（三）早期企业：是指接受私募股权基金投资时，成立时间不满 60个月的未上市企业。\n（四）中小企业：是指接受私募股权基金投资时，职工人数不超过 500 人，同时根据会计事务所审计的年度合并会计报表，年销售额不超过 2 亿元、资产总额不超过 2 亿元的未上市企业。\n（五）高新技术企业：是指接受私募股权基金投资时，依据《高新技术企业认定管理办法》（国科发火〔2016〕32号）已取得高新技术企业证书的未上市企业。\n（六）母基金：是指主要基金财产组合投资于其他私募基金的私募基金。\n（七）变更之日：变更事项需要办理市场主体变更登记的，是指市场主体变更登记之日；变更事项无需办理市场主体变更登记的，是指相关协议或者决议生效之日。"},{"n":36,"label":"第三十六条","chapter":"正文","text":"本指引自发布之日起施行。"}],"source":"https://www.amac.org.cn/xwfb/xhyw/202309/t20230928_24136.html","textSource":"https://www.amac.org.cn/xwfb/xhyw/202309/P020231126420863052960.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"e4221181f221f5cdbd45cc83f42e731cf32932d9c1896d5f31afe53d33e0a0ec"},{"id":"change","title":"私募投资基金备案指引第3号——私募投资基金变更管理人","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"2025年修订 / 中基协发〔2025〕14号","effective":"2025-10-24","scope":"通用","topics":["业务连续性","管理人变更","交接"],"overview":"2025年修订版，按原管理人是否正常履职等情形区分变更机制与材料。基金变更管理人与管理人股东变化是不同事项。","practice":"先查合同决策机制和有权主体，再准备投资者决议、交接、备案与信息披露；以资产和记录连续性为重点。","priority":[2,3,4,5,12,15],"articles":[{"n":1,"label":"第一条","chapter":"正文","text":"为了规范私募投资基金（以下简称私募基金）变更管理人业务，保护投资者合法权益，根据《中华人民共和国证券投资基金法》《私募投资基金监督管理条例》《私募投资基金监督管理暂行办法》《私募投资基金登记备案办法》（以下简称《登记备案办法》）等法律、行政法规、中国证券监督管理委员会（以下简称中国证监会）规章及中国证券投资基金业协会（以下简称协会）自律规则，制定本指引。"},{"n":2,"label":"第二条","chapter":"正文","text":"已在协会备案的私募基金，申请办理私募基金变更管理人业务的，适用本指引。"},{"n":3,"label":"第三条","chapter":"正文","text":"变更前私募基金管理人（以下简称原管理人）和变更后的私募基金管理人（以下简称新管理人）应当遵循投资者利益优先原则，明确管理人职责划分和权利义务转移等，妥善处置基金财产，不得损害投资者合法权益。"},{"n":4,"label":"第四条","chapter":"正文","text":"私募基金管理人应当在订立的基金合同中明确约定私募基金管理人无法履行或者怠于履行管理人职责时，通过召开基金份额持有人大会、合伙人会议或者股东会（以下统称投资者会议）等方式决议变更管理人、修改或者提前终止基金合同、基金清算等事项。基金合同应当订明投资者会议的召集主体、召开方式、表决方式、表决程序、表决比例、生效程序等，表决方式包括现场表决、通讯表决等。私募基金管理人拟发生变更的，应当按照法律法规、自律规则规定和合同约定的方式，通过投资者会议履行变更程序。除法律另有规定或合同另有约定外，私募基金变更管理人须经持有三分之二以上基金份额的投资者同意。经投资者会议变更或者解任私募基金管理人后，投资者应当及时通知原管理人。"},{"n":5,"label":"第五条","chapter":"正文","text":"新管理人应当符合下列要求：\n（一）具备持续经营能力；\n（二）有正在管理的私募基金，但原管理人、新管理人受同一实际控制人控制的除外；\n（三）符合专业化运营原则，但基于风险化解需要的变更除外；\n（四）不存在《登记备案办法》第四十二条规定的暂停备案的情形；\n（五）中国证监会、协会规定的其他要求。"},{"n":6,"label":"第六条","chapter":"正文","text":"私募基金管理人发生变更的，原管理人应当自变更之日起 10个工作日内通过登记备案电子系统向协会报送下列材料，并经新管理人在系统内确认，履行变更手续：\n（一）变更私募基金管理人的原因；\n（二）原管理人、新管理人、投资者、私募基金托管人（如有）共同签署的同意变更管理人的协议；或者投资者会议通过的同意变更管理人的决议；\n（三）新基金合同和委托管理协议（如有）；\n（四）私募基金托管人（如有）对变更管理人事项发表的明确意见；\n（五）基金组织形式为合伙企业或者公司的，应当提交变更后的工商登记信息（如有）；\n（六）信息变更承诺函，声明保证提交材料真实、准确、完整和遵守监督管理、自律管理规定，以及对材料内容的合法性、真实性、有效性负责；\n（七）中国证监会、协会规定的其他信息和材料。"},{"n":7,"label":"第七条","chapter":"正文","text":"私募基金原管理人有下列情形之一的，由新管理人按照第六条规定向协会报送材料，履行变更手续：\n（一）依法解散、注销，依法被撤销、吊销营业执照、责令关闭或者被依法宣告破产；\n（二）被注销、撤销私募基金管理人登记；\n（三）投资者、私募基金托管人或者其他基金合同当事人均无法与其取得有效联系；\n（四）经投资者大会决议变更管理人事项后，不予配合向协会履行变更手续的；\n（五）其他特殊情形。存在上述情形之一的，变更程序应当经公证机关公证或者由中国证监会备案的律师事务所出具专项法律意见书，全体投资者一致同意变更的除外。公证书和法律意见书应当对投资者会议的召集及决议程序是否符合法律法规规定、合同约定发表明确的结论性意见。"},{"n":8,"label":"第八条","chapter":"正文","text":"新管理人按照第六条规定向协会报送材料的，除第七条第一款第一项、第二项外，协会将通过登记备案电子系统通知原管理人。原管理人对变更事项存在异议的，应当自收到通知后 5个工作日内通过协会登记备案电子系统向协会提交不同意变更的说明材料，并在 20个工作日内提交人民法院受理案件通知书或者仲裁受理通知书。协会自收到原管理人上述材料之日起中止办理管理人变更手续。逾期未提交的，协会恢复办理管理人变更手续。"},{"n":9,"label":"第九条","chapter":"正文","text":"司法机关或者仲裁机构就私募基金管理人变更作出发生法律效力的判决、裁定、裁决等法律文书的，原管理人或者新管理人应当及时向协会提交相关法律文书，协会根据相关法律文书及协会自律规则规定办理或不予办理变更手续。"},{"n":10,"label":"第十条","chapter":"正文","text":"私募基金按照基金合同约定已完成管理人变更程序后，但仍有少数投资者未与新管理人签署基金合同的，新管理人应当保证公平对待所有投资者。"},{"n":11,"label":"第十一条","chapter":"正文","text":"有下列情形之一的，协会不予办理私募基金变更管理人手续：\n（一）存在《登记备案办法》第四十一条第一款规定的不予备案情形；\n（二）私募基金涉嫌非法集资、非法经营等重大违法违规行为；\n（三）已经进入企业清算程序的私募基金；\n（四）法律、行政法规、中国证监会和协会规定的其他情形。"},{"n":12,"label":"第十二条","chapter":"正文","text":"协会办理完成私募基金管理人变更手续后，通过协会官方网站对变更后的私募基金基本信息进行公示。原管理人或者新管理人提交的变更信息、材料不完备或者不符合要求的，应当及时补正，作出解释说明或者补充、修改。存在《登记备案办法》第二十五条第一款第六项规定的情形，或者变更后不符合要求的，协会终止办理变更，退回变更材料并说明理由。"},{"n":13,"label":"第十三条","chapter":"正文","text":"协会是否办理私募基金管理人变更不涉及私募基金管理人权利义务的设定、变更或者终止，不影响私募基金相关合同的效力及相关合同当事人的权利义务，不作为确定私募基金管理人身份及其权利义务的依据。"},{"n":14,"label":"第十四条","chapter":"正文","text":"私募基金根据《私募投资基金监督管理条例》第三十四条、《登记备案办法》第五十八条的规定，按照合同约定成立专业机构或者清算组行使管理职责的，不属于私募基金管理人变更。"},{"n":15,"label":"第十五条","chapter":"正文","text":"私募基金管理人及其控股股东、实际控制人、普通合伙人、主要出资人因涉嫌违法违规被公安、监察、检察机关立案调查或者已被追究刑事责任，或者正在接受金融管理部门、自律组织的调查、检查，或者已受到行政处罚、行政监管措施及纪律处分的，或者存在其他重大风险情形的，协会可以采取向中国证监会及其派出机构或者其他相关单位征询意见、商请有关部门指导、组织专家会商等方式进行核查、研判，协会根据相关部门意见决定办理或者不予办理管理人变更业务。私募基金完成管理人变更后，新管理人应当及时向其注册地证监局报告。"},{"n":16,"label":"第十六条","chapter":"正文","text":"本指引自发布之日起施行。"}],"source":"https://www.amac.org.cn/xwfb/tzgg/202510/t20251024_26990.html","textSource":"https://www.amac.org.cn/xwfb/xhyw/202510/P020251024606683240072.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"a92551df3d46a0bb4bdc4721064a611ea8c31bd24dc4825280a96682a45affde"},{"id":"raise","title":"私募投资基金募集行为管理办法","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"中基协发〔2016〕7号","effective":"2016-07-15；回访条款同时阅读发布通知","scope":"通用","topics":["TA","募集","资金账户","风险揭示"],"overview":"将募集过程拆成特定对象确定、适当性、风险揭示、资格确认、冷静期和相关确认安排。2026年9月新募集监管办法仍在征求意见，不能将草案当已生效规则。","practice":"原发布通知对第30、31条回访制度实施另有说明；具体业务需同时确认后续要求、合同和适用流程。本库收录正文44条，不含附表。","priority":[2,7,12,15,17,27,29,30,31,32],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"为了规范私募投资基金（以下简称私募基金）的募集-行为，促进私募基金行业健康发展，保护投资者及相关当事人的合法权益，根据《证券投资基金法》、《私募投资基金监督管理暂行办法》（以下简称《私募办法》）等法律法规的规定，制定本办法。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"私募基金管理人、在中国证监会注册取得基金销售业务资格并已成为中国证券投资基金业协会会员的机构（以下统称募集机构）及其从业人员以非公开方式向投资者募集资金的行为适用本办法。在中国证券投资基金业协会（以下简称中国基金业协会）办理私募基金管理人登记的机构可以自行募集其设立的私募基金，在中国证监会注册取得基金销售业务资格并已成为中国基金业协会会员的机构（以下简称基金销售机构）可以受私募基金管理人的委托募集私募基金。其他任何机构和个人不得从事私募基金的募集活动。本办法所称募集行为包含推介私募基金，发售基金份额（权益），办理基金份额（权益）认/申购（认缴）、赎回（退出）等活动。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"基金业务外包服务机构就其参与私募基金募集业务的环节适用本办法。本办法所称基金业务外包服务机构包括为私募基金管理人提供募集服务的基金销售机构，为私募基金募集机构提供支付结算服务、私募基金募集结算资金监督、份额登记等与私募基金募集业务相关服务的机构。前述基金业务外包服务机构应当遵守中国基金业协会基金业务外包服务相关管理办法。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"从事私募基金募集业务的人员应当具有基金从业资格-（包含原基金销售资格），应当遵守法律、行政法规和中国基金业协会的自律规则，恪守职业道德和行为规范，应当参加后续执业培训。"},{"n":5,"label":"第五条","chapter":"第一章 总则","text":"中国基金业协会依照法律法规、中国证监会相关规定及中国基金业协会自律规则，对私募基金募集活动实施自律管理。"},{"n":6,"label":"第六条","chapter":"第二章 一般规定","text":"募集机构应当恪尽职守、诚实信用、谨慎勤勉，防范利益冲突，履行说明义务、反洗钱义务等相关义务，承担特定对象确定、投资者适当性审查、私募基金推介及合格投资者确认等相关责任。募集机构及其从业人员不得从事侵占基金财产和客户资金、利用私募基金相关的未公开信息进行交易等违法活动。"},{"n":7,"label":"第七条","chapter":"第二章 一般规定","text":"私募基金管理人应当履行受托人义务，承担基金合同、公司章程或者合伙协议（以下统称基金合同）的受托责任。委托基金销售机构募集私募基金的，不得因委托募集免除私募基金管理人依法承担的责任。"},{"n":8,"label":"第八条","chapter":"第二章 一般规定","text":"私募基金管理人委托基金销售机构募集私募基金的，应当以书面形式签订基金销售协议，并将协议中关于私募基金管理人与基金销售机构权利义务划分以及其他涉及投资者利益的部分作为基金合同的附件。基金销售机构负责向投资者说明相关内容。基金销售协议与作为基金合同附件的关于基金销售的内容不一致的，以基金合同附件为准。"},{"n":9,"label":"第九条","chapter":"第二章 一般规定","text":"任何机构和个人不得为规避合格投资者标准，募集以私募基金份额或其收益权为投资标的的金融产品，或者将私募基金-份额或其收益权进行非法拆分转让，变相突破合格投资者标准。募集机构应当确保投资者已知悉私募基金转让的条件。投资者应当以书面方式承诺其为自己购买私募基金，任何机构和个人不得以非法拆分转让为目的购买私募基金。"},{"n":10,"label":"第十条","chapter":"第二章 一般规定","text":"募集机构应当对投资者的商业秘密及个人信息严格保密。除法律法规和自律规则另有规定的，不得对外披露。"},{"n":11,"label":"第十一条","chapter":"第二章 一般规定","text":"募集机构应当妥善保存投资者适当性管理以及其他与私募基金募集业务相关的记录及其他相关资料，保存期限自基金清算终止之日起不得少于 10年。"},{"n":12,"label":"第十二条","chapter":"第二章 一般规定","text":"募集机构或相关合同约定的责任主体应当开立私募基金募集结算资金专用账户，用于统一归集私募基金募集结算资金、向投资者分配收益、给付赎回款项以及分配基金清算后的剩余基金财产等，确保资金原路返还。本办法所称私募基金募集结算资金是指由募集机构归集的，在投资者资金账户与私募基金财产账户或托管资金账户之间划转的往来资金。募集结算资金从投资者资金账户划出，到达私募基金财产账户或托管资金账户之前，属于投资者的合法财产。"},{"n":13,"label":"第十三条","chapter":"第二章 一般规定","text":"募集机构应当与监督机构签署账户监督协议，明确对私募基金募集结算资金专用账户的控制权、责任划分及保障资金划转安全的条款。监督机构应当按照法律法规和账户监督协议的约定，对募集结算资金专用账户实施有效监督，承担保障私募基金募集结算资金划转安全的连带责任。取得基金销售业务资格的商业银行、证券公司等金融机构，可以在同一私募基金的募集过程中同时作为募集机构与监督机构。符-合前述情形的机构应当建立完备的防火墙制度，防范利益冲突。本办法所称监督机构指中国证券登记结算有限责任公司、取得基金销售业务资格的商业银行、证券公司以及中国基金业协会规定的其他机构。监督机构应当成为中国基金业协会的会员。私募基金管理人应当向中国基金业协会报送私募基金募集结算资金专用账户及其监督机构信息。"},{"n":14,"label":"第十四条","chapter":"第二章 一般规定","text":"涉及私募基金募集结算资金专用账户开立、使用的机构不得将私募基金募集结算资金归入其自有财产。禁止任何单位或者个人以任何形式挪用私募基金募集结算资金。私募基金管理人、基金销售机构、基金销售支付机构或者基金份额登记机构破产或者清算时，私募基金募集结算资金不属于其破产财产或者清算财产。"},{"n":15,"label":"第十五条","chapter":"第二章 一般规定","text":"私募基金募集应当履行下列程序：\n（一）特定对象确定；\n（二）投资者适当性匹配；\n（三）基金风险揭示；\n（四）合格投资者确认；\n（五）投资冷静期；\n（六）回访确认。"},{"n":16,"label":"第十六条","chapter":"第三章 特定对象的确定","text":"募集机构仅可以通过合法途径公开宣传私募基金管理人的品牌、发展战略、投资策略、管理团队、高管信息以及由中国基金业协会公示的已备案私募基金的基本信息。私募基金管理人应确保前述信息真实、准确、完整。-"},{"n":17,"label":"第十七条","chapter":"第三章 特定对象的确定","text":"募集机构应当向特定对象宣传推介私募基金。未经特定对象确定程序，不得向任何人宣传推介私募基金。"},{"n":18,"label":"第十八条","chapter":"第三章 特定对象的确定","text":"在向投资者推介私募基金之前，募集机构应当采取问卷调查等方式履行特定对象确定程序，对投资者风险识别能力和风险承担能力进行评估。投资者应当以书面形式承诺其符合合格投资者标准。投资者的评估结果有效期最长不得超过 3年。募集机构逾期再次向投资者推介私募基金时，需重新进行投资者风险评估。同一私募基金产品的投资者持有期间超过 3年的，无需再次进行投资者风险评估。投资者风险承担能力发生重大变化时，可主动申请对自身风险承担能力进行重新评估。"},{"n":19,"label":"第十九条","chapter":"第三章 特定对象的确定","text":"募集机构应建立科学有效的投资者问卷调查评估方法，确保问卷结果与投资者的风险识别能力和风险承担能力相匹配。募集机构应当在投资者自愿的前提下获取投资者问卷调查信息。问卷调查主要内容应包括但不限于以下方面：\n（一）投资者基本信息，其中个人投资者基本信息包括身份信息、年龄、学历、职业、联系方式等信息；机构投资者基本信息包括工商登记中的必备信息、联系方式等信息；\n（二）财务状况，其中个人投资者财务状况包括金融资产状况 、最近三年个人年均收入、收入中可用于金融投资的比例等信息；机构投资者财务状况包括净资产状况等信息；\n（三）投资知识，包括金融法律法规、投资市场和产品情况、对私募基金风险的了解程度、参加专业培训情况等信息；（四）投资经验，包括投资期限、实际投资产品类型、投资金融产品的数量、参与投资的金融市场情况等；\n（五）风险偏好，包括投资目的、风险厌恶程度、计划投资期限、投资出现波动时的焦虑状态等。《私募基金投资者问卷调查内容与格式指引（个人版）》详见附件一。"},{"n":20,"label":"第二十条","chapter":"第三章 特定对象的确定","text":"募集机构通过互联网媒介在线向投资者推介私募基金之前，应当设置在线特定对象确定程序，投资者应承诺其符合合格投资者标准。前述在线特定对象确定程序包括但不限于：\n（一）投资者如实填报真实身份信息及联系方式；\n（二）募集机构应通过验证码等有效方式核实用户的注册信息 ；\n（三）投资者阅读并同意募集机构的网络服务协议；\n（四）投资者阅读并主动确认其自身符合《私募办法》第三章关于合格投资者的规定；\n（五）投资者在线填报风险识别能力和风险承担能力的问卷调查；\n（六）募集机构根据问卷调查及其评估方法在线确认投资者的风险识别能力和风险承担能力。"},{"n":21,"label":"第二十一条","chapter":"第四章 私募基金推介","text":"募集机构应当自行或者委托第三方机构对私募基金进行风险评级，建立科学有效的私募基金风险评级标准和方法。募集机构应当根据私募基金的风险类型和评级结果，向投资者推介与其风险识别能力和风险承担能力相匹配的私募基金。"},{"n":22,"label":"第二十二条","chapter":"第四章 私募基金推介","text":"私募基金推介材料应由私募基金管理人制作并使-用。私募基金管理人应当对私募基金推介材料内容的真实性、完整性、准确性负责。除私募基金管理人委托募集的基金销售机构可以使用推介材料向特定对象宣传推介外，其他任何机构或个人不得使用、更改、变相使用私募基金推介材料。"},{"n":23,"label":"第二十三条","chapter":"第四章 私募基金推介","text":"募集机构应当采取合理方式向投资者披露私募基金信息，揭示投资风险，确保推介材料中的相关内容清晰、醒目。私募基金推介材料内容应与基金合同主要内容一致，不得有任何虚假记载、误导性陈述或者重大遗漏。如有不一致的，应当向投资者特别说明。私募基金推介材料内容包括但不限于：\n（一）私募基金的名称和基金类型；\n（二）私募基金管理人名称、私募基金管理人登记编码、基金管理团队等基本信息；\n（三）中国基金业协会私募基金管理人以及私募基金公示信息（含相关诚信信息）；\n（四） 私募基金托管情况（如无，应以显著字体特别标注）、其他服务提供商（如律师事务所、会计师事务所、保管机构等），是否聘用投资顾问等；\n（五）私募基金的外包情况；\n（六）私募基金的投资范围、投资策略和投资限制概况；\n（七）私募基金收益与风险的匹配情况；\n（八）私募基金的风险揭示；\n（九） 私募基金募集结算资金专用账户及其监督机构信息；\n（十）投资者承担的主要费用及费率，投资者的重要权利（如-认购、赎回、转让等限制、时间和要求等）；\n（十一）私募基金承担的主要费用及费率；\n（十二）私募基金信息披露的内容、方式及频率；\n（十三）明确指出该文件不得转载或给第三方传阅；\n（十四）私募基金采取合伙企业、有限责任公司组织形式的，应当明确说明入伙（股）协议不能替代合伙协议或公司章程。说明根据《合伙企业法》或《公司法》，合伙协议、公司章程依法应当由全体合伙人、股东协商一致，以书面形式订立。申请设立合伙企业、公司或变更合伙人、股东的，并应当向企业登记机关履行申请设立及变更登记手续；\n（十五）中国基金业协会规定的其他内容。"},{"n":24,"label":"第二十四条","chapter":"第四章 私募基金推介","text":"募集机构及其从业人员推介私募基金时，禁止有以下行为：\n（一）公开推介或者变相公开推介；\n（二）推介材料虚假记载、误导性陈述或者重大遗漏；\n（三）以任何方式承诺投资者资金不受损失，或者以任何方式承诺投资者最低收益，包括宣传“预期收益”、“预计收益”、“预测投资业绩”等相关内容；\n（四）夸大或者片面推介基金，违规使用“安全”、“保证”、“承诺”、“保险”、“避险”、“有保障”、“高收益”、“无风险”等可能误导投资人进行风险判断的措辞；\n（五）使用“欲购从速”、“申购良机”等片面强调集中营销时间限制的措辞；\n（六）推介或片面节选少于 6个月的过往整体业绩或过往基金-产品业绩；\n（七）登载个人、法人或者其他组织的祝贺性、恭维性或推荐性的文字；\n（八）采用不具有可比性、公平性、准确性、权威性的数据来源和方法进行业绩比较，任意使用“业绩最佳”、“规模最大”等相关措辞；\n（九）恶意贬低同行；\n（十）允许非本机构雇佣的人员进行私募基金推介；\n（十一）推介非本机构设立或负责募集的私募基金；\n（十二）法律、行政法规、中国证监会和中国基金业协会禁止的其他行为。"},{"n":25,"label":"第二十五条","chapter":"第四章 私募基金推介","text":"募集机构不得通过下列媒介渠道推介私募基金：\n（一）公开出版资料；\n（二）面向社会公众的宣传单、布告、手册、信函、传真；\n（三）海报、户外广告；\n（四）电视、电影、电台及其他音像等公共传播媒体；\n（五）公共、门户网站链接广告、博客等；\n（六）未设置特定对象确定程序的募集机构官方网站、微信朋友圈等互联网媒介；\n（七）未设置特定对象确定程序的讲座、报告会、分析会；\n（八）未设置特定对象确定程序的电话、短信和电子邮件等通讯媒介；\n（九）法律、行政法规、中国证监会规定和中国基金业协会自律规则禁止的其他行为。-"},{"n":26,"label":"第二十六条","chapter":"第五章 合格投资者确认及基金合同签署","text":"在投资者签署基金合同之前，募集机构应当向投资者说明有关法律法规，说明投资冷静期、回访确认等程序性安排以及投资者的相关权利，重点揭示私募基金风险，并与投资者签署风险揭示书。风险揭示书的内容包括但不限于：\n（一）私募基金的特殊风险，包括基金合同与中国基金业协会合同指引不一致所涉风险、基金未托管所涉风险、基金委托募集所涉风险、外包事项所涉风险、聘请投资顾问所涉风险、未在中国基金业协会登记备案的风险等；\n（二）私募基金的一般风险，包括资金损失风险、基金运营风险、流动性风险、募集失败风险、投资标的的风险、税收风险等；\n（三）投资者对基金合同中投资者权益相关重要条款的逐项确认，包括当事人权利义务、费用及税收、纠纷解决方式等。《私募投资基金风险揭示书内容与格式指引》详见附件二。"},{"n":27,"label":"第二十七条","chapter":"第五章 合格投资者确认及基金合同签署","text":"在完成私募基金风险揭示后，募集机构应当要求投资者提供必要的资产证明文件或收入证明。募集机构应当合理审慎地审查投资者是否符合私募基金合格投资者标准，依法履行反洗钱义务，并确保单只私募基金的投资者人数累计不得超过《证券投资基金法》、《公司法》、《合伙企业法》等法律规定的特定数量。"},{"n":28,"label":"第二十八条","chapter":"第五章 合格投资者确认及基金合同签署","text":"根据《私募办法》，私募基金的合格投资者是指具备相应风险识别能力和风险承担能力，投资于单只私募基金的金额不低于 100万元且符合下列相关标准的机构和个人：-\n（一）净资产不低于 1000万元的机构；\n（二）金融资产不低于 300万元或者最近三年个人年均收入不低于 50万元的个人。前款所称金融资产包括银行存款、股票、债券、基金份额、资产管理计划、银行理财产品、信托计划、保险产品、期货权益等。"},{"n":29,"label":"第二十九条","chapter":"第五章 合格投资者确认及基金合同签署","text":"各方应当在完成合格投资者确认程序后签署私募基金合同。基金合同应当约定给投资者设置不少于二十四小时的投资冷静期，募集机构在投资冷静期内不得主动联系投资者。\n（一）私募证券投资基金合同应当约定，投资冷静期自基金合同签署完毕且投资者交纳认购基金的款项后起算；\n（二）私募股权投资基金、创业投资基金等其他私募基金合同关于投资冷静期的约定可以参照前款对私募证券投资基金的相关要求，也可以自行约定。"},{"n":30,"label":"第三十条","chapter":"第五章 合格投资者确认及基金合同签署","text":"募集机构应当在投资冷静期满后，指令本机构从事基金销售推介业务以外的人员以录音电话、电邮、信函等适当方式进行投资回访。回访过程不得出现诱导性陈述。募集机构在投资冷静期内进行的回访确认无效。回访应当包括但不限于以下内容：\n（一）确认受访人是否为投资者本人或机构；\n（二）确认投资者是否为自己购买了该基金产品以及投资者是否按照要求亲笔签名或盖章；\n（三）确认投资者是否已经阅读并理解基金合同和风险揭示的内容；（四）确认投资者的风险识别能力及风险承担能力是否与所投资的私募基金产品相匹配；\n（五）确认投资者是否知悉投资者承担的主要费用及费率，投资者的重要权利、私募基金信息披露的内容、方式及频率；\n（六）确认投资者是否知悉未来可能承担投资损失；\n（七）确认投资者是否知悉投资冷静期的起算时间、期间以及享有的权利；\n（八）确认投资者是否知悉纠纷解决安排。"},{"n":31,"label":"第三十一条","chapter":"第五章 合格投资者确认及基金合同签署","text":"基金合同应当约定，投资者在募集机构回访确认成功前有权解除基金合同。出现前述情形时，募集机构应当按合同约定及时退还投资者的全部认购款项。未经回访确认成功，投资者交纳的认购基金款项不得由募集账户划转到基金财产账户或托管资金账户，私募基金管理人不得投资运作投资者交纳的认购基金款项。"},{"n":32,"label":"第三十二条","chapter":"第五章 合格投资者确认及基金合同签署","text":"私募基金投资者属于以下情形的，可以不适用本办法第十七条至第二十一条、第二十六条至第三十一条的规定：\n（一）社会保障基金、企业年金等养老基金，慈善基金等社会公益基金；\n（二）依法设立并在中国基金业协会备案的私募基金产品；\n（三）受国务院金融监督管理机构监管的金融产品；\n（四）投资于所管理私募基金的私募基金管理人及其从业人员 ；\n（五）法律法规、中国证监会和中国基金业协会规定的其他投资者。投资者为专业投资机构的，可不适用本办法第二十九条、第三-十条、第三十一条的规定。"},{"n":33,"label":"第三十三条","chapter":"第六章 自律管理","text":"中国基金业协会可以按照相关自律规则，对会员及登记机构的私募基金募集行为合规性进行定期或不定期的现场和非现场自律检查，会员及登记机构应当予以配合。"},{"n":34,"label":"第三十四条","chapter":"第六章 自律管理","text":"私募基金管理人委托未取得基金销售业务资格的机构募集私募基金的，中国基金业协会不予办理私募基金备案业务。"},{"n":35,"label":"第三十五条","chapter":"第六章 自律管理","text":"募集机构在开展私募基金募集业务过程中违反本办法第六条至第十四条、第十七条至第二十条、第二十二条至第二十三条、第二十六条的规定，中国基金业协会可以视情节轻重对募集机构采取要求限期改正、行业内谴责、加入黑名单、公开谴责、暂停受理或办理相关业务、撤销管理人登记等纪律处分；对相关工作人员采取要求参加强制培训、行业内谴责、加入黑名单、公开谴责、认定为不适当人选、暂停基金从业资格、取消基金从业资格等纪律处分。"},{"n":36,"label":"第三十六条","chapter":"第六章 自律管理","text":"募集机构在开展私募基金募集业务过程中违反本办法第二十九条至第三十一条的规定，中国基金业协会视情节轻重对私募基金管理人、募集机构采取暂停私募基金备案业务、不予办理私募基金备案业务等措施。"},{"n":37,"label":"第三十七条","chapter":"第六章 自律管理","text":"募集机构在开展私募基金募集业务过程中违反本办法第十六条、第二十一条、第二十四条、第二十五条、第二十七条、第二十八条的规定，中国基金业协会可以视情节轻重对募集机构采取加入黑名单、公开谴责、撤销管理人登记等纪律处分；对相-关工作人员采取行业内谴责、加入黑名单、公开谴责、取消基金从业资格等纪律处分。情节严重的，移送中国证监会处理。"},{"n":38,"label":"第三十八条","chapter":"第六章 自律管理","text":"募集机构在一年之内两次被采取谈话提醒、书面警示、要求限期改正等纪律处分的，中国基金业协会可对其采取加入黑名单、公开谴责等纪律处分；在两年之内两次被采取加入黑名单、公开谴责等纪律处分的，中国基金业协会可以采取撤销管理人登记等纪律处分，并移送中国证监会处理。"},{"n":39,"label":"第三十九条","chapter":"第六章 自律管理","text":"在中国基金业协会登记的基金业务外包服务机构就其参与私募基金募集业务的环节违反本办法有关规定，中国基金业协会可以采取相关自律措施。"},{"n":40,"label":"第四十条","chapter":"第六章 自律管理","text":"投资者可以按照规定向中国基金业协会投诉或举报募集机构及其从业人员的违规募集行为。"},{"n":41,"label":"第四十一条","chapter":"第六章 自律管理","text":"募集机构、基金业务外包服务机构及其从业人员因募集过程中的违规行为被中国基金业协会采取相关纪律处分的，中国基金业协会可视情节轻重记入诚信档案。"},{"n":42,"label":"第四十二条","chapter":"第六章 自律管理","text":"募集机构、基金业务外包服务机构及其从业人员涉嫌违反法律、行政法规、中国证监会有关规定的，移送中国证监会或司法机关处理。"},{"n":43,"label":"第四十三条","chapter":"第七章 附则","text":"本办法自 2016年 7月 15日起实施。"},{"n":44,"label":"第四十四条","chapter":"第七章 附则","text":"本办法由中国基金业协会负责解释。"}],"source":"https://www.amac.org.cn/xwfb/tzgg/201604/t20160415_18610.html","textSource":"https://www.csrc.gov.cn/qinghai/c105502/c1306838/1306838/files/%E7%A7%81%E5%8B%9F%E5%9F%BA%E9%87%91%E7%9B%91%E7%AE%A1%E8%A7%84%E5%88%99%E6%B1%87%E7%BC%96.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"5883c715898b84b43d87e922cad0c4cf740bb98a3b19bb50c532aa344383475a"},{"id":"service","title":"私募投资基金服务业务管理办法（试行）","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"2017年发布","effective":"2017年公布日起实施","scope":"通用","topics":["外包","FA","TA","数据","BCP"],"overview":"外包监督的核心阅读材料。管理人应对服务商进行尽调、签订安排、持续关注和评估；具体控制要对应义务、业务风险和合同。","practice":"先阅读第5、11、12条，再按服务范围读份额登记、估值核算、信息技术章节。把协议约定落到真实输入输出和异常流程。","priority":[5,11,12,17,18,20,23,32,33,35,36,44,48],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"〖立法依据〗为促进私募投资基金（以下简称私募基金）行业健康发展，规范私募基金服务业务，保护投资者及相关当事人合法权益，根据《中华人民共和国证券投资基金法》、《私募投资基金监督管理暂行办法》等有关规定，制定本办法。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"〖适用范围〗私募基金管理人委托私募基金服务机构（以下简称服务机构），为私募基金提供基金募集、投资顾问、份额登记、估值核算、信息技术系统等服务业务，适用本办法。服务机构开展私募基金服务业务及私募基金管理人、私募基金托管人就其参与私募基金服务业务的环节适用本办法。\n\n私募基金管理人应当委托在中国证券投资基金业协会（以下简称协会）完成登记并已成为协会会员的服务机构提供私募基金服务业务。私募基金管理人委托服务机构从事私募基金募集、投资顾问等业务的相关规定，由协会另行规定。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"〖服务机构权利义务〗服务机构及其从业人员从事私募基金服务业务，应当遵循有关法律法规和行业规范，依照服务协议、操作备忘录或各方认可的其他法律文本的约定，诚实信用、勤勉尽责、恪尽职守，防止利益冲突，保护私募基金财产和投资者财产安全，维护投资者合法权益。\n\n服务机构不得将已承诺的私募基金服务业务转包或变相转包。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"〖财产独立〗私募基金服务所涉及的基金财产和投资者财产应当独立于服务机构的自有财产。服务机构破产或者清算时，私募基金服务所涉及的基金财产和投资者财产不属于其破产或清算财产。"},{"n":5,"label":"第五条","chapter":"第一章 总则","text":"〖管理人权利义务〗私募基金管理人委托服务机构开展业务，应当制定相应的风险管理框架及制度，并根据审慎经营原则制定业务委托实施规划，确定与其经营水平相适宜的委托服务范围。\n\n私募基金管理人委托服务机构开展服务前，应当对服务机构开展尽职调查，了解其人员储备、业务隔离措施、软硬件设施、专业能力、诚信状况等情况；并与服务机构签订书面服务协议，明确双方的权利义务及违约责任。私募基金管理人应当对服务机构的运营能力和服务水平进行持续关注和定期评估。\n私募基金管理人委托服务机构提供私募基金服务的，私募基金管理人依法应当承担的责任不因委托而免除。"},{"n":6,"label":"第六条","chapter":"第一章 总则","text":"〖行业自律〗协会依据法律法规和自律规则，对服务机构及其私募基金服务业务进行自律管理。"},{"n":7,"label":"第七条","chapter":"第二章 服务机构的登记","text":"〖风险提示〗协会为服务机构办理登记不构成对服务机构服务能力、持续合规情况的认可，不作为对基金财产和投资者财产安全的保证。服务机构在协会完成登记之后连续6个月没有开展基金服务业务的，协会将注销其登记。"},{"n":8,"label":"第八条","chapter":"第二章 服务机构的登记","text":"〖登记要求〗申请开展私募基金份额登记服务、基金估值核算服务、信息技术系统服务的机构，应当具备下列条件：\n\n（一）经营状况良好，其中开展私募基金份额登记服务和信息技术系统服务的机构实缴资本不低于人民币5000万元；\n\n（二）公司治理结构完善，内部控制有效；\n\n（三）经营运作规范，最近3年内无重大违法违规记录；\n\n（四）组织架构完整，设有专门的服务业务团队和分管服务业务的高管，服务业务团队的设置能够保证业务运营的完整与独立，服务业务团队有满足营业需要的固定场所和安全防范措施；\n（五）配备相应的软硬件设施，具备安全、独立、高效、稳定的业务技术系统，且所有系统已完成包括协会指定的中央数据交换平台在内的业务联网测试；\n\n（六）负责私募基金服务业务的部门负责人、独立第三方服务机构的法定代表人等应当具备基金从业资格。所有从业人员应当自从事私募基金服务业务之日起6个月内具备基金从业资格，并参加后续执业培训；\n\n（七）申请机构应当评估业务是否存在利益冲突并设置相应的防火墙制度；\n\n（八）申请机构的信息技术系统应当符合法律法规、中国证监会及协会的规定及相关标准，建立网络隔离、安全防护与应急处理等风险管理制度和灾难备份系统；\n\n（九）申请开展信息技术服务的机构应当具有国家有关部门规定的资质条件或者取得相关资质认证，拥有同类应用服务经验，具有开展业务所有需要的人员、设备、技术、知识产权以及良好的安全运营记录等条件；\n\n（十）协会规定的其他条件。"},{"n":9,"label":"第九条","chapter":"第二章 服务机构的登记","text":"〖登记材料〗申请登记的机构提交的材料包括但不限于：\n\n（一） 诚信及合法合规承诺函；\n\n（二） 内控管理制度、业务隔离措施以及应急处理方案；\n\n（三） 信息系统配备情况及系统运行测试报告；\n（四） 私募基金服务业务团队设置和岗位职责规定及包括分管领导、业务负责人、业务人员等在内的人员基本情况；\n\n（五） 与私募基金管理人签订的约定双方权利义务的服务协议或意向合作协议清单；\n\n（六） 涉及募集结算资金的，应当包括相关账户信息、募集销售结算资金安全保障机制的说明材料，以及协会指定的中央数据交换平台的测试报告等；\n\n（七） 法律意见书；\n\n（八） 开展私募基金服务业务的商业计划书；\n\n（九） 协会规定的其他材料。"},{"n":10,"label":"第十条","chapter":"第二章 服务机构的登记","text":"〖登记流程〗登记材料不完备或不符合规定的，协会告知需要补正的内容。服务机构提交的登记材料完备且登记材料符合要求的，协会自受理之日起2个月内出具登记函并公示。"},{"n":11,"label":"第十一条","chapter":"第三章 基本业务规范","text":"〖协议签署〗私募基金管理人与服务机构应当依据基金合同签订书面服务协议。协议应当至少包括以下内容：服务范围、服务内容、双方的权利和义务、收费方式和业务费率、保密义务等。除基金合同约定外，服务费用应当由私募基金管理人自行支付。"},{"n":12,"label":"第十二条","chapter":"第三章 基本业务规范","text":"〖备忘录签署〗私募基金管理人、私募基金托管人、服务机构、经纪商等相关方，应当就账户信息、交易数据、估值对账数据、电子划款指令、投资者名册等信息的交互时间及交互方式、对接人员、对接方式、业务实施方案、应急预案等内容签订操作备忘录或各方认可的其他法律文本，对私募基金服务事项进行单独约定。其中，数据交互应当遵守协会的相关标准。"},{"n":13,"label":"第十三条","chapter":"第三章 基本业务规范","text":"〖公平竞争〗服务机构在开展业务过程中应当执行贯彻国家有关反不正当竞争行为的各项规定，设定合理、清晰的费用结构和费率标准，不得以低于成本的收费标准提供服务。"},{"n":14,"label":"第十四条","chapter":"第三章 基本业务规范","text":"〖基金财产和投资者财产安全〗服务机构应当对提供服务业务所涉及的基金财产和投资者财产实行严格的分账管理，确保基金财产和投资者财产的安全，任何单位或者个人不得以任何形式挪用基金财产和投资者财产。"},{"n":15,"label":"第十五条","chapter":"第三章 基本业务规范","text":"〖风险防范〗服务机构应当具备开展服务业务的营运能力和风险承受能力，审慎评估私募基金服务的潜在风险与利益冲突，建立严格的防火墙制度与业务隔离制度，有效执行信息隔离等内部控制制度，切实防范利益输送。"},{"n":16,"label":"第十六条","chapter":"第三章 基本业务规范","text":"〖基金服务与托管隔离〗私募基金托管人不得被委托担任同一私募基金的服务机构，除该托管人能够将其托管职能和基金服务职能进行分离，恰当的识别、管理、监控潜在的利益冲突，并披露给投资者。"},{"n":17,"label":"第十七条","chapter":"第三章 基本业务规范","text":"〖档案管理〗服务机构应当建立健全档案管理制度，妥善保管服务所涉及的资料。服务机构提供份额登记服务的，登记数据保存期限自基金账户销户之日起不得少于20年。"},{"n":18,"label":"第十八条","chapter":"第三章 基本业务规范","text":"〖专项审计〗服务机构每年应当聘请具有证券业务资格的会计师事务所对私募基金服务业务的内部控制与业务实施情况进行审计并出具审计报告。经国务院金融监督管理机构核准的金融机构，每年可以选择由该机构内部审计部门出具私募基金服务业务评估报告。"},{"n":19,"label":"第十九条","chapter":"第三章 基本业务规范","text":"〖责任分担〗服务机构在开展业务的过程中，因违法违规、违反服务协议、技术故障、操作错误等原因给基金财产造成的损失，应当由私募基金管理人先行承担赔偿责任。私募基金管理人再按照服务协议约定与服务机构进行责任分配与损失追偿。"},{"n":20,"label":"第二十条","chapter":"第四章 基金份额登记服务业规范","text":"〖基本职责〗从事私募基金份额登记服务的机构（以下简称基金份额登记机构）的基本职责包括：建立并管理投资者的基金账户、负责基金份额的登记及资金结算、基金交易确认、代理发放红利、保管投资者名册、法律法规或服务协议规定的其他职责。基金份额登记机构登记的数据，是投资者权利归属的根据。"},{"n":21,"label":"第二十一条","chapter":"第四章 基金份额登记服务业规范","text":"〖募集结算资金〗基金募集结算资金是指由基金募集机构归集的，基金份额登记机构进行资金清算，在合格投资者资金账户与基金财产资金账户或托管资金账户之间划转的往来资金。"},{"n":22,"label":"第二十二条","chapter":"第四章 基金份额登记服务业规范","text":"〖资金账户安全保障〗基金募集结算资金专用账户包括募集机构开立的募集结算资金归集账户和基金份额登记机构开立的注册登记账户。基金募集结算资金专用账户应当由监督机构负责实施有效监督，监督协议中应当明确监督机构保障投资者资金安全的连带责任条款。其中，监督机构指中国证券登记结算有限责任公司、取得基金销售业务资格的商业银行、证券公司、公募基金管理公司以及协会规定的其他机构。监督机构和服务机构为同一机构的，应当做好内部风险防范。\n\n私募基金管理人应当向协会报送私募基金募集结算资金专用账户及其监督机构信息。"},{"n":23,"label":"第二十三条","chapter":"第四章 基金份额登记服务业规范","text":"〖内部控制机制〗基金份额登记机构和监督机构应当建立健全内部控制机制，将划款指令的生成与复核相分离，对系统重要参数的设置和修改建立多层审核机制，切实保障募集结算资金安全。"},{"n":24,"label":"第二十四条","chapter":"第四章 基金份额登记服务业规范","text":"〖基金账户开立要求〗基金份额登记机构办理账户类业务(如开立、变更、销户等)时，应当就投资者信息的真实性和准确性与募集机构进行书面约定。\n\n投资者是其他基金的，基金份额登记机构应当与募集机构约定，采取将该基金的托管资金账户或者专门的基金财产资金账户作为收付款的唯一指定账户等方式保障投资者财产安全。"},{"n":25,"label":"第二十五条","chapter":"第四章 基金份额登记服务业规范","text":"〖份额确认〗基金份额登记机构应当根据募集机构提供的认购、申购、认缴、实缴、赎回、转托管等数据和自身资金结算结果，办理投资者名册的初始登记或者变更登记。基金份额登记机构应当向私募基金托管人提供投资者名册。"},{"n":26,"label":"第二十六条","chapter":"第四章 基金份额登记服务业规范","text":"〖资金交收风险〗基金份额登记机构在进行份额登记时，如果与资金交收存在时间差，应当充分评估资金交收风险。法律授权下执行担保交收的，应当动态评估交收风险，提取足额备付金；在非担保交收的情况下，应当与管理人或管理人授权的募集机构书面约定资金交收过程中不得截留、挪用交易资金或者将资金做内部非法轧差处理，以及在发生损失情况下的责任承担。"},{"n":27,"label":"第二十七条","chapter":"第四章 基金份额登记服务业规范","text":"〖募集结算资金划付〗基金份额登记机构应当严格按照服务协议约定的资金交收路径进行募集结算资金划付。募集结算资金监督机构未按照约定进行汇款或提交正确的汇款指令，基金份额登记机构应当拒绝操作执行。"},{"n":28,"label":"第二十八条","chapter":"第四章 基金份额登记服务业规范","text":"〖份额变更〗基金份额以协议继承、捐赠、强制执行、转让等方式发生变更的，基金份额登记机构应当在募集机构履行合格投资者审查、反洗钱等义务的基础上，根据相关法律证明文件及资金清算结果，结合自身业务规则变更基金账户余额，相应办理投资者名册的变更登记。"},{"n":29,"label":"第二十九条","chapter":"第四章 基金份额登记服务业规范","text":"〖关于计提业绩报酬〗基金合同约定由基金份额登记机构负责计提业绩报酬的，基金份额登记机构应当保证业绩报酬计算过程及结果的准确性，不得损害投资者利益。"},{"n":30,"label":"第三十条","chapter":"第四章 基金份额登记服务业规范","text":"〖数据备份〗基金份额登记机构应当妥善保存登记数据，并根据协会的规定将投资者名称、身份信息及基金份额明细等数据在发生变更的T+1日内备份至协会指定数据备份平台。"},{"n":31,"label":"第三十一条","chapter":"第四章 基金份额登记服务业规范","text":"〖自行办理份额登记〗私募基金管理人自行办理份额登记业务的，应当参考本章规定执行。"},{"n":32,"label":"第三十二条","chapter":"第五章 基金估值核算服务业规范","text":"〖基本职责〗从事私募基金估值核算服务的机构（以下简称基金估值核算机构）的基本职责包括：开展基金会计核算、估值、报表编制，相关业务资料的保存管理，配合私募基金管理人聘请的会计师事务所进行审计以及法律法规及服务协议规定的其他职责。"},{"n":33,"label":"第三十三条","chapter":"第五章 基金估值核算服务业规范","text":"〖估值依据〗基金估值核算机构开展估值核算服务，应当遵守《企业会计准则》、《证券投资基金会计核算业务指引》以及协会的估值规则等相关法律法规的规定。基金估值核算机构应当按照基金合同和服务协议规定的估值方法、估值频率、估值流程对基金财产进行估值核算。"},{"n":34,"label":"第三十四条","chapter":"第五章 基金估值核算服务业规范","text":"〖估值频率〗基金估值核算机构应当至少保证在开放式基金申赎，封闭式基金扩募、增减资等私募基金份额（权益）发生变化时进行估值。"},{"n":35,"label":"第三十五条","chapter":"第五章 基金估值核算服务业规范","text":"〖与托管人对账〗基金估值核算机构应当按照服务协议、操作备忘录或各方认可的其他法律文本的约定与私募基金托管人核对账务，由私募基金托管人对估值结果进行复核。"},{"n":36,"label":"第三十六条","chapter":"第五章 基金估值核算服务业规范","text":"〖差错处理〗当份额净值计算出现错误时，基金估值核算机构应当及时纠正，采取合理措施防止损失进一步扩大，并根据服务协议约定通知私募基金管理人依法履行披露及报告义务。"},{"n":37,"label":"第三十七条","chapter":"第五章 基金估值核算服务业规范","text":"〖信息披露〗基金估值核算机构应当配合私募基金管理人按照服务协议的约定，及时、准确地披露基金产品净值，编制和提供定期报告等基金产品运作信息。"},{"n":38,"label":"第三十八条","chapter":"第五章 基金估值核算服务业规范","text":"〖附属服务〗在协会完成基金估值核算登记的服务机构可以提供基金绩效分析、数据报送支持等附属服务。"},{"n":39,"label":"第三十九条","chapter":"第六章 信息技术系统服务业规范","text":"〖信息技术系统服务定义〗信息技术系统服务是指为私募基金管理人、私募基金托管人和其他服务机构提供私募基金业务核心应用系统、信息系统运营维护及安全保障等服务。其中，私募基金业务核心应用系统包括销售系统、投资交易管理系统、份额登记系统、资金清算系统、估值核算系统等。"},{"n":40,"label":"第四十条","chapter":"第六章 信息技术系统服务业规范","text":"〖提供系统要求〗服务机构提供基金业务核心应用系统的，不得从事与其所提供系统相对应的私募基金服务业务，不得直接进行相关业务操作，可以提供信息系统运营维护及安全保障等服务。"},{"n":41,"label":"第四十一条","chapter":"第六章 信息技术系统服务业规范","text":"〖风控要求〗提供投资交易管理系统的服务机构应当保证单只基金开立独立证券账户，单个证券账户不得下设子账户、分账户、虚拟账户；不得直接进行投资业务操作，不得代为行使私募基金管理人的平仓和交易职责。"},{"n":42,"label":"第四十二条","chapter":"第六章 信息技术系统服务业规范","text":"〖风控检查〗提供投资交易管理系统的服务机构应当建立公平交易机制，公平对待同一私募基金管理人管理的私募基金及不同私募基金管理人管理的私募基金，防范私募基金之间进行利益输送。指令在发送到交易场所之前应当经过投资交易管理系统的风控检查，不得绕过风控检查直接下单到交易场所。"},{"n":43,"label":"第四十三条","chapter":"第六章 信息技术系统服务业规范","text":"〖销售系统服务要求〗提供销售系统的服务机构应与私募基金管理人签署书面服务协议明确双方的权利和义务。销售系统涉及基金电子合同平台的，私募基金管理人在基金募集中应依法承担的投资者适当性和真实性核查等责任不因签署电子合同平台的外包协议而免除。"},{"n":44,"label":"第四十四条","chapter":"第六章 信息技术系统服务业规范","text":"〖接口管理〗服务机构提供核心应用系统的，应当保证数据通讯接口符合中国证监会及协会颁布的接口规范标准要求；无接口规范标准的，数据接口应当具备可兼容性，不得随意变更。服务机构应当向客户提供开发接口和完整的数据库表结构设计，开发接口应当能够覆盖客户的全部数据读写。"},{"n":45,"label":"第四十五条","chapter":"第六章 信息技术系统服务业规范","text":"〖执行程序和源代码的安全〗服务机构应当对信息技术系统相关的执行程序和源代码设置有效的安全措施，切实保障执行程序和源代码的安全。在所有信息技术系统发布前对执行程序和源代码进行严格的审查和充分的测试，并积极协助客户进行上线前的验收工作。"},{"n":46,"label":"第四十六条","chapter":"第六章 信息技术系统服务业规范","text":"〖信息技术系统架构〗信息技术系统架构设计应当实现接入层、网络层、应用层分离，方便进行网络防火墙建设管理。信息技术系统架构应当能够支持系统负载均衡和性能线性扩张，通过增加硬件设备可以简单实现产品性能的扩充。"},{"n":47,"label":"第四十七条","chapter":"第六章 信息技术系统服务业规范","text":"〖信息技术系统管理〗服务机构应当保证其信息技术系统有足够的业务容量和技术容量，并能够满足市场可能出现的峰值压力需求，并根据市场的发展变化和客户的需求及时提供系统的升级、维护服务。服务机构应当对信息技术系统缺陷实施应急管理机制，一旦发现缺陷，应当立即通知信息技术系统使用人并及时提供解决方案。"},{"n":48,"label":"第四十八条","chapter":"第六章 信息技术系统服务业规范","text":"〖数据安全〗服务机构应当确保其主要业务信息系统持续稳定运行，其中涉及核心业务处理的信息系统应当部署在中华人民共和国境内，并配合监管部门、司法机关现场检查及调查取证。\n\n服务机构在业务开展过程中所获取的客户信息、业务资料等数据的存储与备份应当在中华人民共和国境内完成，相关数据的保密管理应当符合国家相关规定。服务机构及其从业人员应当恪尽职守，保护客户隐私，严守客户机密。"},{"n":49,"label":"第四十九条","chapter":"第七章 自律管理","text":"〖报告义务〗服务机构应当在每个季度结束之日起15个工作日内向协会报送服务业务情况表，每个年度结束之日起三个月内向协会报送运营情况报告。服务机构应当在每个年度结束之日起四个月内向协会报送审计报告。服务机构的注册资本、注册地址、法定代表人、分管基金服务业务的高级管理人员等重大信息发生变更的，应当自变更发生之日起10个工作日内向协会更新登记信息。\n\n独立第三方服务机构通过一次或多次股权变更，整体构成变更持股5%以上股东或变更股东持股比例超过5%的，应当及时向协会报告；整体构成变更持股20%以上股东或变更股东持股比例超过20%，或实际控制人发生变化的，应当自董事会或者股东（大）会做出决议之日起10个工作日内向协会提交重大信息变更申请。\n\n发生重大事件时，私募基金管理人、私募基金托管人、服务机构应当及时向协会报告。关于服务机构需要报送的投资者信息和产品运作信息的规范，由协会另行规定。"},{"n":50,"label":"第五十条","chapter":"第七章 自律管理","text":"〖协会职责〗协会对服务机构从事私募基金服务业务进行定期或者不定期的现场和非现场自律检查，服务机构应当予以配合。"},{"n":51,"label":"第五十一条","chapter":"第七章 自律管理","text":"〖投诉举报〗私募基金管理人、托管人可以按照规定向协会投诉或举报服务机构及其从业人员的违规行为。\n\n服务机构可以按照规定向协会投诉或举报私募基金管理人、托管人及其从业人员的违规行为。"},{"n":52,"label":"第五十二条","chapter":"第七章 自律管理","text":"〖一般违规责任〗服务机构违反本办法第二章第七条至第十条、第三章第十一条至第十三条、第十七条至第十九条、第四章第二十条、第二十四条、第二十五条、第二十八条至第三十一条、第五章第三十二条、第三十四条至第三十八条、第六章第四十三条至第四十七条、第七章第四十九条第一款、第三款的规定，协会可以要求服务机构限期改正。逾期未改正的，协会可以视情节轻重对服务机构主要负责人采取谈话提醒、书面警示、要求强制参加培训、行业内谴责、加入黑名单等纪律处分。"},{"n":53,"label":"第五十三条","chapter":"第二章第七条至第十条、第三章第十一条至第十三条、第十七条至第十九条、第四章第二十条、第二十四条、第二十五条、第二十八条至第三十一条、第五章第三十二条、第三十四条至第三十八条、第六章第四十三条至第四十七条、第七章第四十九条第一款、第三款的规定，协会可以要求服务机构限期改正。逾期未改正的，协会可以视情节轻重对服务机构主要负责人采取谈话提醒、书面警示、要求强制参加培训、行业内谴责、加入黑名单等纪律处分。","text":"〖严重违规责任〗服务机构违反本办法第三章第十四条至第十六条、第四章第二十一条至第二十三条、第二十六条及第二十七条、第五章第三十三条、第六章第四十条至第四十二条、第四十八条、第四十九条第二款的规定，协会可视情节轻重对服务机构采取公开谴责、暂停办理相关业务、撤销服务机构登记或取消会员资格等纪律处分；对服务机构主要负责人，协会可采取加入黑名单、公开谴责、暂停或取消基金从业资格等纪律处分，并加入诚信档案。"},{"n":54,"label":"第五十四条","chapter":"第三章第十四条至第十六条、第四章第二十一条至第二十三条、第二十六条及第二十七条、第五章第三十三条、第六章第四十条至第四十二条、第四十八条、第四十九条第二款的规定，协会可视情节轻重对服务机构采取公开谴责、暂停办理相关业务、撤销服务机构登记或取消会员资格等纪律处分；对服务机构主要负责人，协会可采取加入黑名单、公开谴责、暂停或取消基金从业资格等纪律处分，并加入诚信档案。","text":"〖多次违规处分〗一年之内服务机构两次被要求限期改正，服务机构主要负责人两次被采取谈话提醒、书面警示等纪律处分的，协会可对其采取加入黑名单、公开谴责等纪律处分；服务机构及其主要负责人在两年之内两次被采取加入黑名单、公开谴责等纪律处分的，协会可以采取撤销服务机构登记或取消会员资格，暂停或取消服务机构主要负责人基金从业资格等纪律处分。"},{"n":55,"label":"第五十五条","chapter":"第三章第十四条至第十六条、第四章第二十一条至第二十三条、第二十六条及第二十七条、第五章第三十三条、第六章第四十条至第四十二条、第四十八条、第四十九条第二款的规定，协会可视情节轻重对服务机构采取公开谴责、暂停办理相关业务、撤销服务机构登记或取消会员资格等纪律处分；对服务机构主要负责人，协会可采取加入黑名单、公开谴责、暂停或取消基金从业资格等纪律处分，并加入诚信档案。","text":"〖诚信记录〗服务机构及其从业人员因违规行为被协会采取相关纪律处分的，协会可视情节轻重计入诚信档案。"},{"n":56,"label":"第五十六条","chapter":"第三章第十四条至第十六条、第四章第二十一条至第二十三条、第二十六条及第二十七条、第五章第三十三条、第六章第四十条至第四十二条、第四十八条、第四十九条第二款的规定，协会可视情节轻重对服务机构采取公开谴责、暂停办理相关业务、撤销服务机构登记或取消会员资格等纪律处分；对服务机构主要负责人，协会可采取加入黑名单、公开谴责、暂停或取消基金从业资格等纪律处分，并加入诚信档案。","text":"〖行政与刑事责任〗服务机构及其从业人员涉嫌违反法律、行政法规、证监会有关规定的，移送中国证监会或司法机关处理。"},{"n":57,"label":"第五十七条","chapter":"第八章 附则","text":"〖适用〗服务机构为证券期货经营机构私募资产管理计划提供服务业务的，适用本办法。"},{"n":58,"label":"第五十八条","chapter":"第八章 附则","text":"〖生效〗本规范自公布之日起实施，原《基金业务外包服务指引(试行)》同时废止。"},{"n":59,"label":"第五十九条","chapter":"第八章 附则","text":"〖解释〗本办法由协会负责解释。"}],"source":"https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/smjjfwjgdj/tzgg/202106/t20210608_19965.html","textSource":"https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/zcglcpba/xgzc/201912/t20191222_19887.html","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"0a5b1923d3c8d612d8380648d8728da0779f412ed6a07315451334655f97ca41"},{"id":"internal","title":"私募投资基金管理人内部控制指引","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"2016年发布","effective":"2016-02-01","scope":"通用","topics":["组织管理","授权","职责分离","外包"],"overview":"把内控理解成组织体系、制度安排与控制活动。制度是否存在与制度是否执行有效是不同的验收问题。","practice":"围绕五要素评估风险、授权、职责分离、外包和信息沟通；老规则的保存期限要与后续专项规则交叉检查。","priority":[5,6,10,11,12,14,15,22,23,25,26,27],"articles":[{"n":1,"label":"第一条","chapter":"第一章     总 则","text":"为了引导私募基金管理人加强内部控制，促进合法合规、诚信经营，提高风险防范能力，推动私募基金行业规范发展，根据《证券投资基金法》、《私募投资基金监督管理暂行办法》、《私募投资基金管理人登记和基金备案办法（试行）》，制定本指引。"},{"n":2,"label":"第二条","chapter":"第一章     总 则","text":"私募基金管理人内部控制是指私募基金管理人为防范和化解风险，保证各项业务的合法合规运作，实现经营目标，在充分考虑内外部环境的基础上，对经营过程中的风险进行识别、评价和管理的制度安排、组织体系和控制措施。"},{"n":3,"label":"第三条","chapter":"第一章     总 则","text":"私募基金管理人应当按照本指引的要求，结合自身的具体情况，建立健全内部控制机制，明确内部控制职责，完善内部控制措施，强化内部控制保障，持续开展内部控制评价和监督。\n\n私募基金管理人最高权力机构对建立内部控制制度和维持其有效性承担最终责任，经营层对内部控制制度的有效执行承担责任。"},{"n":4,"label":"第四条","chapter":"第二章     目标和原则","text":"私募基金管理人内部控制总体目标是：\n\n（一）保证遵守私募基金相关法律法规和自律规则。\n（二）防范经营风险，确保经营业务的稳健运行。\n\n（三）保障私募基金财产的安全、完整。\n\n（四）确保私募基金、私募基金管理人财务和其他信息真实、准确、完整、及时。"},{"n":5,"label":"第五条","chapter":"第二章     目标和原则","text":"私募基金管理人内部控制应当遵循以下原则：\n\n（一）全面性原则。内部控制应当覆盖包括各项业务、各个部门和各级人员，并涵盖资金募集、投资研究、投资运作、运营保障和信息披露等主要环节。\n\n（二）相互制约原则。组织结构应当权责分明、相互制约。\n\n（三）执行有效原则。通过科学的内控手段和方法，建立合理的内控程序，维护内控制度的有效执行。\n\n（四）独立性原则。各部门和岗位职责应当保持相对独立，基金财产、管理人固有财产、其他财产的运作应当分离。\n\n（五）成本效益原则。以合理的成本控制达到最佳的内部控制效果，内部控制与私募基金管理人的管理规模和员工人数等方面相匹配，契合自身实际情况。\n\n（六）适时性原则。私募基金管理人应当定期评价内部控制的有效性，并随着有关法律法规的调整和经营战略、方针、理念等内外部环境的变化同步适时修改或完善。"},{"n":6,"label":"第六条","chapter":"第三章     基本要求","text":"私募基金管理人建立与实施有效的内部控制，应当包括下列要素：\n\n（一）内部环境：包括经营理念和内控文化、治理结构、组织结构、人力资源政策和员工道德素质等，内部环境是实施内部控制的基础。\n\n（二）风险评估：及时识别、系统分析经营活动中与内部控制目标相关的风险，合理确定风险应对策略。\n\n（三）控制活动：根据风险评估结果，采用相应的控制措施，将风险控制在可承受范围之内。\n\n（四）信息与沟通：及时、准确地收集、传递与内部控制相关的信息，确保信息在内部、企业与外部之间进行有效沟通。\n\n（五）内部监督：对内部控制建设与实施情况进行周期性监督检查，评价内部控制的有效性，发现内部控制缺陷或因业务变化导致内控需求有变化的，应当及时加以改进、更新。"},{"n":7,"label":"第七条","chapter":"第三章     基本要求","text":"私募基金管理人应当牢固树立合法合规经营的理念和风险控制优先的意识，培养从业人员的合规与风险意识，营造合规经营的制度文化环境，保证管理人及其从业人员诚实信用、勤勉尽责、恪尽职守。"},{"n":8,"label":"第八条","chapter":"第三章     基本要求","text":"私募基金管理人应当遵循专业化运营原则，主营业务清晰，不得兼营与私募基金管理无关或存在利益冲突的其他业务。"},{"n":9,"label":"第九条","chapter":"第三章     基本要求","text":"私募基金管理人应当健全治理结构，防范不正当关联交易、利益输送和内部人控制风险，保护投资者利益和自身合法权益。"},{"n":10,"label":"第十条","chapter":"第三章     基本要求","text":"私募基金管理人组织结构应当体现职责明确、相互制约的原则，建立必要的防火墙制度与业务隔离制度，各部门有合理及明确的授权分工，操作相互独立。"},{"n":11,"label":"第十一条","chapter":"第三章     基本要求","text":"私募基金管理人应当建立有效的人力资源管理制度，健全激励约束机制，确保工作人员具备与岗位要求相适应的职业操守和专业胜任能力。\n\n私募基金管理人应具备至少2名高级管理人员。"},{"n":12,"label":"第十二条","chapter":"第三章     基本要求","text":"私募基金管理人应当设置负责合规风控的高级管理人员。负责合规风控的高级管理人员，应当独立地履行对内部控制监督、检查、评价、报告和建议的职能，对因失职渎职导致内部控制失效造成重大损失的，应承担相关责任。"},{"n":13,"label":"第十三条","chapter":"第三章     基本要求","text":"私募基金管理人应当建立科学的风险评估体系，对内外部风险进行识别、评估和分析，及时防范和化解风险。"},{"n":14,"label":"第十四条","chapter":"第三章     基本要求","text":"私募基金管理人应当建立科学严谨的业务操作流程，利用部门分设、岗位分设、外包、托管等方式实现业务流程的控制。"},{"n":15,"label":"第十五条","chapter":"第三章     基本要求","text":"授权控制应当贯穿于私募基金管理人资金募集、投资研究、投资运作、运营保障和信息披露等主要环节的始终。私募基金管理人应当建立健全授权标准和程序，确保授权制度的贯彻执行。"},{"n":16,"label":"第十六条","chapter":"第三章     基本要求","text":"私募基金管理人自行募集私募基金的，应设置有效机制，切实保障募集结算资金安全；私募基金管理人应当建立合格投资者适当性制度。"},{"n":17,"label":"第十七条","chapter":"第三章     基本要求","text":"私募基金管理人委托募集的，应当委托获得中国证监会基金销售业务资格且成为中国证券投资基金业协会（以下简称“中国基金业协会”）会员的机构募集私募基金，并制定募集机构遴选制度，切实保障募集结算资金安全；确保私募基金向合格投资者募集以及不变相进行公募。"},{"n":18,"label":"第十八条","chapter":"第三章     基本要求","text":"私募基金管理人应当建立完善的财产分离制度，私募基金财产与私募基金管理人固有财产之间、不同私募基金财产之间、私募基金财产和其他财产之间要实行独立运作，分别核算。"},{"n":19,"label":"第十九条","chapter":"第三章     基本要求","text":"私募基金管理人应建立健全相关机制，防范管理的各私募基金之间的利益输送和利益冲突，公平对待管理的各私募基金，保护投资者利益。"},{"n":20,"label":"第二十条","chapter":"第三章     基本要求","text":"私募基金管理人应当建立健全投资业务控制，保证投资决策严格按照法律法规规定，符合基金合同所规定的投资目标、投资范围、投资策略、投资组合和投资限制等要求。"},{"n":21,"label":"第二十一条","chapter":"第三章     基本要求","text":"除基金合同另有约定外，私募基金应当由基金托管人托管，私募基金管理人应建立健全私募基金托管人遴选制度，切实保障资金安全。\n\n基金合同约定私募基金不进行托管的，私募基金管理人应建立保障私募基金财产安全的制度措施和纠纷解决机制。"},{"n":22,"label":"第二十二条","chapter":"第三章     基本要求","text":"私募基金管理人开展业务外包应制定相应的风险管理框架及制度。私募基金管理人根据审慎经营原则制定其业务外包实施规划，确定与其经营水平相适宜的外包活动范围。"},{"n":23,"label":"第二十三条","chapter":"第三章     基本要求","text":"私募基金管理人应建立健全外包业务控制，并至少每年开展一次全面的外包业务风险评估。在开展业务外包的各个阶段，关注外包机构是否存在与外包服务相冲突的业务，以及外包机构是否采取有效的隔离措施。"},{"n":24,"label":"第二十四条","chapter":"第三章     基本要求","text":"私募基金管理人自行承担信息技术和会计核算等职能的，应建立相应的信息系统和会计系统，保证信息技术和会计核算等的顺利运行。"},{"n":25,"label":"第二十五条","chapter":"第三章     基本要求","text":"私募基金管理人应当建立健全信息披露控制，维护信息沟通渠道的畅通，保证向投资者、监管机构及中国基金业协会所披露信息的真实性、准确性、完整性和及时性，不存在虚假记载、误导性陈述或重大遗漏。"},{"n":26,"label":"第二十六条","chapter":"第三章     基本要求","text":"私募基金管理人应当保存私募基金内部控制活动等方面的信息及相关资料，确保信息的完整、连续、准确和可追溯，保存期限自私募基金清算终止之日起不得少于10 年。"},{"n":27,"label":"第二十七条","chapter":"第三章     基本要求","text":"私募基金管理人应对内部控制制度的执行情况进行定期和不定期的检查、监督及评价，排查内部控制制度是否存在缺陷及实施中是否存在问题，并及时予以改进，确保内部控制制度的有效执行。"},{"n":28,"label":"第二十八条","chapter":"第四章     检查和监督","text":"中国基金业协会对私募基金管理人内部控制的建立及执行情况进行监督。"},{"n":29,"label":"第二十九条","chapter":"第四章     检查和监督","text":"私募基金管理人应当按照本指引要求制定相关内部控制制度，并在中国基金业协会私募基金登记备案系统填报及上传相关内部控制制度。"},{"n":30,"label":"第三十条","chapter":"第四章     检查和监督","text":"中国基金业协会按照相关自律规则，对私募基金管理人的人员、内部控制、业务活动及信息披露等合规情况进行业务检查，业务检查可通过现场或非现场方式进行，私募基金管理人及相关人员应予以配合。"},{"n":31,"label":"第三十一条","chapter":"第四章     检查和监督","text":"私募基金管理人未按本指引建立健全内部控制，或内部控制存在重大缺陷，导致违反相关法律法规及自律规则的，中国基金业协会可以视情节轻重对私募基金管理人及主要负责人采取书面警示、行业内通报批评、公开谴责等措施。"},{"n":32,"label":"第三十二条","chapter":"第五章     附 则","text":"本指引由中国基金业协会负责解释。"},{"n":33,"label":"第三十三条","chapter":"第五章     附 则","text":"本指引自2016年2月1日起施行。"}],"source":"https://www.amac.org.cn/xwfb/tzgg/201602/t20160201_18607.html","textSource":"https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/smjjglrdjhcpba/xgzc/202001/t20200101_23064.html","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"a7d7da521e14978f26f43e0fe5da02e1d6b094c7a42d368ac9a37d6adaa2cb85"},{"id":"fitguide","title":"基金募集机构投资者适当性管理实施指引（试行）","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"2017年发布","effective":"2017-07-01","scope":"通用","topics":["TA","风险分级","动态管理"],"overview":"提供基金募集场景下的适当性实施方法，需与2022修正的证监会办法一并使用。正文55条，配套表格本版不收录。","practice":"把调查信息、风险评级、匹配意见、特别警示、转化审批及更新记录连接成可复核的投资者档案。","priority":[2,22,33,36,38,43,44,48,49],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"为规范基金募集机构销售行为，指导投资者适当性管理制度的有效落实，维护投资者合法权益，依据《证券投资基金法》、《证券期货投资者适当性管理办法》（以下简称《办法》）、《证券投资基金销售管理办法》、《私募投资基金监督管理暂行办法》、《证券投资基金销售适用性指导意见》、《私募投资基金募集行为管理办法》及其他法律法规制定本指引。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"基金募集机构向投资者公开或者非公开募集的证券投资基金和股权投资基金（包括创业投资基金）产品，或者为投资者提供相关业务服务的（以下统称基金产品或者服务），适用本办法。\n\n基金募集机构是指公募基金管理人、私募基金管理人（以下统称基金管理人），在中国证监会注册取得基金销售业务资格并已成为中国证券投资基金业协会（以下简称协会）会员的机构。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"投资者适当性是指基金募集机构在销售基金产品或者服务的过程中，根据投资者的风险承受能力销售不同风险等级的基金产品或者服务，把合适的基金产品或者服务卖给合适的投资者。\n本指引所称的专业投资者，为符合本指引第二十二条规定的投资者；普通投资者，为符合本指引第二十六条规定的投资者；风险承受能力最低类别投资者，为符合本指引第二十九条规定的投资者。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"基金募集机构按照本指引，建立健全投资者适当性管理制度。在销售基金产品或者服务过程中，勤勉尽责，诚实信用深入调查分析基金管理人、基金产品或者服务及投资者信息，充分揭示基金产品或者服务风险，降低投诉风险。"},{"n":5,"label":"第五条","chapter":"第一章 总则","text":"协会依据法律法规和自律规则，对基金募集机构投资者适当性制度建立及实施情况进行自律管理。"},{"n":6,"label":"第六条","chapter":"第二章 一般规定","text":"基金募集机构在实施投资者适当性的过程中遵循以下指导原则：\n\n（一）投资者利益优先原则。当基金募集机构或基金销售人员的利益与投资者的利益发生冲突时，优先保障投资者的合法利益；\n\n（二）客观性原则。建立科学合理的方法，设置必要的标准和流程，保证适当性管理的实施。对基金管理人、基金产品或者服务和投资者的调查和评价，尽力做到客观准确，并作为基金销售人员向投资者推介合适基金产品或者服务的重要依据；\n（三）有效性原则。通过建立科学的投资者适当性管理制度与方法，确保投资者适当性管理的有效执行；\n\n（四）差异性原则。对投资者进行分类管理，对普通投资者和专业投资者实施差别适当性管理，履行差别适当性义务。"},{"n":7,"label":"第七条","chapter":"第二章 一般规定","text":"基金募集机构建立适当性管理制度，至少包括以下内容：\n\n（一）对基金管理人进行审慎调查的方式和方法；\n\n（二）对基金产品或者服务的风险等级进行设置、对基金产品或者服务进行风险评价的方式或方法；\n\n（三）对投资者进行分类的方法和程序、投资者转化的方法和程序；\n\n（四）对普通投资者风险承受能力进行调查和评价的方式和方法；\n\n（五）对基金产品或者服务和投资者进行匹配的方法；\n\n（六）投资者适当性管理的保障措施和风控制度。"},{"n":8,"label":"第八条","chapter":"第二章 一般规定","text":"基金募集机构选择销售基金产品或者服务，要对基金管理人进行审慎调查并做出评价，了解基金管理人的诚信状况、经营管理能力、投资管理能力产品设计能力和内部控制情况，并可将调查结果作为是否销售该基金管理人产品或者服务、是否向投资者推介该基金管理人的重要依据。\n基金管理人在选择基金募集机构时，为确保适当性的贯彻实施，要对基金募集机构进行审慎调查，了解基金募集机构的内部控制情况、信息管理平台建设、账户管理制度、销售人员能力和持续营销能力，并可将调查结果作为选择基金募集机构的重要依据。"},{"n":9,"label":"第九条","chapter":"第二章 一般规定","text":"基金募集机构要建立对销售人员的考核、监督问责、培训等机制规范销售人员履行投资者适当性工作职责的情况。\n\n基金募集机构不得采取鼓励其向投资者销售不适当基金产品或者服务的考核、激励机制或措施。"},{"n":10,"label":"第十条","chapter":"第二章 一般规定","text":"基金募集机构要加强对销售人员的日常管理，建立管理档案，对销售人员行为、诚信、奖惩等方面进行记录。"},{"n":11,"label":"第十一条","chapter":"第二章 一般规定","text":"基金募集机构及其销售人员要对履行投资者适当性管理职责过程中获取的投资者信息、投资者风险承受能力评价结果等信息和资料严格保密，防止该等信息和资料泄露或被不当利用。"},{"n":12,"label":"第十二条","chapter":"第二章 一般规定","text":"基金募集机构要建立健全普通投资者回访制度，对购买基金产品或者服务的普通投资者定期抽取一定比例进行回访，对持有 R5 等级基金产品或者服务的普通投资者增加回访比例和频次。\n基金募集机构对回访时发现的异常情况进行持续跟踪，对异常情况进行核查，存在风险隐患的及时排查，并定期整理总结，以完善投资者适当性制度。"},{"n":13,"label":"第十三条","chapter":"第二章 一般规定","text":"回访内容包括但不限于以下信息：\n\n（一）受访人是否为投资者本人；\n\n（二）受访人是否已知晓基金产品或者服务的风险以及相关风险警示；\n\n（三）受访人是否已知晓自己的风险承受能力等级、购买的基金产品或者接受的服务的风险等级以及适当性匹配意见；\n\n（四）受访人是否知晓承担的费用以及可能产生的投资损失；\n\n（五）基金募集机构及其工作人员是否存在《办法》第二十二条规定的禁止行为。"},{"n":14,"label":"第十四条","chapter":"第二章 一般规定","text":"基金募集机构要建立完备的投资者投诉处理体系，准确记录投资者投诉内容。\n\n基金募集机构要妥善处理因履行投资者适当性职责引起的投资者投诉，及时发现业务风险，完善内控制度。"},{"n":15,"label":"第十五条","chapter":"第二章 一般规定","text":"基金募集机构每半年开展一次投资者适当性管理自查。自查可以采取现场、非现场及暗访相结合的方式进行，并形成自查报告留存备查。\n自查内容包括但不限于投资者适当性管理制度建设及落实情况，人员考核及培训情况，投资者投诉处理情况，发现业务风险及时整改情况，以及其他需要报告的事项。"},{"n":16,"label":"第十六条","chapter":"第二章 一般规定","text":"基金募集机构通过营业网点等现场方式执行普通投资者申请成为专业投资者，向普通投资者销售高风险产品或者服务，调整投资者分类、基金产品或者服务分级以及适当性匹配意见，向普通投资者销售基金产品或者服务前对其进行风险提示的环节要录音或者录像；通过互联网等非现场方式执行的，基金募集机构及合作平台要完善信息管理平台留痕功能，记录投资者确认信息。"},{"n":17,"label":"第十七条","chapter":"第二章 一般规定","text":"基金募集机构要建立完善的档案管理制度，妥善保存投资者适当性管理业务资料。投资者适当性管理制度、投资者信息资料、告知警示投资者资料、录音录像资料、自查报告等至少保存 20 年。"},{"n":18,"label":"第十八条","chapter":"第三章 投资者分类","text":"基金募集机构要根据自然人投资者、机构投资者、金融机构理财产品的各自特点，向投资者提供具有针对性的投资者信息表。\n\n基金募集机构要设计风险测评问卷，并对普通投资者进行风险测评。"},{"n":19,"label":"第十九条","chapter":"第三章 投资者分类","text":"投资者分为专业投资者和普通投资者。未对投资者进行分类的，要履行普通投资者适当性义务。"},{"n":20,"label":"第二十条","chapter":"第三章 投资者分类","text":"了解投资者信息要包含但不限于《办法》第六条所规定的内容。\n\n自然人投资者还要提供有效身份证件、出生日期、性别、国籍等信息。\n\n《办法》第八条第一款所述机构作为投资者的，还要向基金募集机构提供营业执照、开展金融相关业务资格证明、机构负责人或者法定代表人信息、经办人身份信息等资料。\n\n《办法》第八条第二款所述产品作为投资者的，要向基金募集机构提供产品成立、备案证明文件等资料及参照金融机构要求提交该产品管理人的机构信息。基金募集机构要告知投资者对其所填资料的真实性、有效性、完整性负责。"},{"n":21,"label":"第二十一条","chapter":"第三章 投资者分类","text":"基金募集机构在为投资者开立账户时，要以纸质或者电子文档的形式，向投资者提供信息表，要求其填写相关信息，并遵循以下程序：\n\n（一）基金募集机构要执行对投资者的身份认证程序，核查投资者的投资资格，切实履行反洗钱等法律义务；\n\n（二）基金募集机构要根据投资者的主体不同，提供相应的投资者信息表；\n\n（三）基金募集机构核查自然人投资者本人或者代表金融机构及其产品的工作人员身份，并要求其如实填写投资者信息表；\n（四）基金募集机构要对投资者身份信息进行核查，并在核查工作结束之日起 5 个工作日内，将结果以及投资者类型告知投资者。"},{"n":22,"label":"第二十二条","chapter":"第三章 投资者分类","text":"符合《办法》第八条要求的投资者为专业投资者。"},{"n":23,"label":"第二十三条","chapter":"第三章 投资者分类","text":"基金募集机构要根据《办法》第八条规定，结合投资者信息表内容，对专业投资者资格进行认定。"},{"n":24,"label":"第二十四条","chapter":"第三章 投资者分类","text":"基金募集机构可以根据专业投资者的业务资格、投资实力、投资经历等因素，对专业投资者进行细化分类和管理。"},{"n":25,"label":"第二十五条","chapter":"第三章 投资者分类","text":"基金募集机构对专业投资者进行细化分类的，要向投资者提供风险测评问卷，对专业投资者的投资知识、投资经验、风险偏好进行评估，并得出相对应的风险等级。"},{"n":26,"label":"第二十六条","chapter":"第三章 投资者分类","text":"专业投资者之外的，符合法律、法规要求，可以从事基金交易活动的投资者为普通投资者。\n\n基金募集机构要按照风险承受能力，将普通投资者由低到高至少分为 C1（含风险承受能力最低类别）、C2、C3、C4、C5 五种类型。"},{"n":27,"label":"第二十七条","chapter":"第三章 投资者分类","text":"基金募集机构向普通投资者以纸质或者电子文档形式提供风险测评问卷，对其风险承受能力进行测试，并遵循以下程序：\n\n（一）基金募集机构要核查参加风险测评的投资者或机构经办人员的身份信息；\n（二）基金募集机构以及工作人员在测试过程中，不得有提示、暗示、诱导、误导等行为对测试人员进行干扰，影响测试结果；\n\n（三）风险测评问卷要在填写完毕后 5 个工作日内，得出相应结果。"},{"n":28,"label":"第二十八条","chapter":"第三章 投资者分类","text":"基金募集机构要根据投资者信息表、风险测评问卷以及其它相关材料，对普通投资者风险等级进行综合评估，并在评估工作结束之日起 5 个工作日内，告知投资者风险等级评估结果。"},{"n":29,"label":"第二十九条","chapter":"第三章 投资者分类","text":"基金募集机构可以将 C1 中符合下列情形之一的自然人，作为风险承受能力最低类别投资者：\n\n（一）不具有完全民事行为能力；\n\n（二）没有风险容忍度或者不愿承受任何投资损失；\n\n（三）法律、行政法规规定的其他情形。"},{"n":30,"label":"第三十条","chapter":"第三章 投资者分类","text":"符合《办法》第十一条规定的专业投资者、普通投资者可以进行转化。\n\n投资者转化效力范围仅适用于所告知、申请的基金募集机构。其它基金募集机构不得以此作为参考依据，将投资者自行转化。"},{"n":31,"label":"第三十一条","chapter":"第三章 投资者分类","text":"专业投资者转化为普通投资者的，要遵循以下程序：\n\n（一）符合转化条件的专业投资者，通过纸质或者电子文档形式告知基金募集机构其转化为普通投资者的决定；\n（二）基金募集机构要在收到投资者转化决定 5 个工作日内，对投资者的转化资格进行核查；\n\n（三）基金募集机构要在核查工作结束之日起 5 个工作日内，以纸质或者电子文档形式，告知投资者核查结果。"},{"n":32,"label":"第三十二条","chapter":"第三章 投资者分类","text":"普通投资者转化为专业投资者的，要遵循以下程序：\n\n（一）符合转化条件的普通投资者，要通过纸质或者电子文档形式向基金募集机构提出转化申请，同时还要向基金募集机构做出了解相应风险并自愿承担相应不利后果的意思表示；\n\n（二）基金募集机构要在收到投资者转化申请之日起 5个工作日内，对投资者的转化资格进行核查；\n\n（三）对于符合转化条件的，基金募集机构要在 5 个工作日内，通知投资者以纸质或者电子文档形式补充提交相关信息、参加投资知识或者模拟交易等测试；\n\n（四）基金募集机构要根据以上情况，结合投资者的风险承受能力、投资知识、投资经验、投资偏好等要素，对申请者进行谨慎评估，并以纸质或者电子文档形式，告知投资者是否同意其转化的决定以及理由。"},{"n":33,"label":"第三十三条","chapter":"第三章 投资者分类","text":"基金募集机构要建立投资者评估数据库，为投资者建立信息档案，并对投资者风险等级进行动态管理。\n基金募集机构要充分使用已了解信息和已有评估结果，避免投资者信息重复采集，提高评估效率。"},{"n":34,"label":"第三十四条","chapter":"第三章 投资者分类","text":"投资者评估数据库要包含但不限于以下内容：\n\n（一） 投资者填写信息表及历次变动的内容；\n\n（二） 普通投资者过往风险测评结果；\n\n（三） 投资者风险承受能力及对应风险等级变动情况；\n\n（四）投资者历次申请转化为专业投资者或普通投资者情况及审核结果；\n\n（五）基金募集机构风险评估标准、程序等内容信息及调整、修改情况；\n\n（六）协会及基金募集机构认为必要的其它信息。"},{"n":35,"label":"第三十五条","chapter":"第三章 投资者分类","text":"基金募集机构要告知投资者，其重要信息发生变更时要及时告知基金募集机构。基金募集机构还要通过明确的公开方式，提醒投资者及时告知重大信息变更事项。"},{"n":36,"label":"第三十六条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金募集机构对基金产品或者服务的风险等级划分，可以由基金募集机构完成，也可以委托第三方机构提供。\n\n委托第三方机构提供基金产品或者服务风险等级划分的，基金募集机构应当要求其提供基金产品或者服务风险等级划分方法及其说明。\n\n基金募集机构落实适当性义务不因委托第三方而免除。"},{"n":37,"label":"第三十七条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金募集机构所使用的基金产品或者服务风险等级划分方法及其说明，通过适当途径向投资者告知。"},{"n":38,"label":"第三十八条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金产品或者服务的风险等级要按照风险由低到高顺序，至少划分为：R1、R2、R3、R4、R5 五个等级。\n\n基金募集机构可以根据实际情况在前款所列等级的基础上进一步进行风险细分。"},{"n":39,"label":"第三十九条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金募集机构对基金产品或者服务进行风险等级划分，要了解以下信息：\n\n（一）基金管理人的诚信状况、经营管理能力、投资管理能力、内部控制情况、合法合规情况；\n\n（二）基金产品或者服务的合法合规情况，发行方式，类型及组织形式，托管情况，投资范围、投资策略和投资限制概况，业绩比较基准，收益与风险的匹配情况，投资者承担的主要费用及费率。"},{"n":40,"label":"第四十条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金产品或者服务风险等级划分要综合考虑以下因素：\n\n（一）基金管理人成立时间，治理结构，资本金规模，管理基金规模，投研团队稳定性，资产配置能力、内部控制制度健全性及执行度，风险控制完备性，是否有风险准备金制度安排，从业人员合规性，股东、高级管理人员及基金经理的稳定性等；\n（二）基金产品或者服务的结构（母子基金、平行基金），投资方向、投资范围和投资比例，募集方式及最低认缴金额，运作方式，存续期限，过往业绩及净值的历史波动程度，成立以来有无违规行为发生，基金估值政策、程序和定价模式，申购和赎回安排，杠杆运用情况等。"},{"n":41,"label":"第四十一条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金产品或者服务存在下列因素的，要审慎评估其风险等级：\n\n（一）基金产品或者服务合同存在特殊免责条款、结构性安排、投资标的具有衍生品性质等导致普通投资者难以理解的；\n\n（二）基金产品或者服务不存在公开交易市场，或因参与投资者少等因素导致难以在短期内以合理价格顺利变现的；\n\n（三）基金产品或者服务的投资标的流动性差、存在非标准资产投资导致不易估值的；\n\n（四）基金产品或者服务投资杠杆达到相关要求上限、投资单一标的集中度过高的；\n\n（五）基金管理人、实际控制人、高管人员涉嫌重大违法违规行为或正在接受监管部门或自律管理部门调查的；\n\n（六）影响投资者利益的其他重大事项；\n\n（七）协会认定的高风险基金产品或者服务。"},{"n":42,"label":"第四十二条","chapter":"第四章 基金产品或者服务风险等级划分","text":"基金募集机构可以通过定量和定性相结合的方法对基金产品或者服务进行风险分级。\n基金募集机构可以根据基金产品或者服务风险因素与风险等级的相关性，确定各项评估因素的分值和权重，建立评估分值与基金产品风险等级的对应关系。\n\n基金募集机构通过定量分析对基金产品进行风险分级时，可以运用贝塔系数、标准差、风险在险值等风险指标体系，划分基金的期限风险、流动性风险、波动性风险等。"},{"n":43,"label":"第四十三条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"基金募集机构要制定普通投资者和基金产品或者服务匹配的方法、流程，明确各个岗位在执行投资者适当性管理过程中的职责。\n\n匹配方法至少要在普通投资者的风险承受能力类型和基金产品或者服务的风险等级之间建立合理的对应关系，同时在建立对应关系的基础上将基金产品或者服务风险超越普通投资者风险承受能力的情况定义为风险不匹配。"},{"n":44,"label":"第四十四条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"基金募集机构要根据普通投资者风险承受能力和基金产品或者服务的风险等级建立以下适当性匹配原则：\n\n（一）C1 型（含最低风险承受能力类别）普通投资者可以购买 R1 级基金产品或者服务；\n\n（二）C2 型普通投资者可以购买 R2 级及以下风险等级的基金产品或者服务；\n（三）C3 型普通投资者可以购买 R3 级及以下风险等级的基金产品或者服务；\n\n（四）C4 型普通投资者可以购买 R4 级及以下风险等级的基金产品或者服务；\n\n（五）C5 型普通投资者可以购买所有风险等级的基金产品或者服务。"},{"n":45,"label":"第四十五条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"基金募集机构向投资者销售基金产品或者服务时，禁止出现以下行为：\n\n（一）向不符合准入要求的投资者销售基金产品或者服务；\n\n（二）向投资者就不确定的事项提供确定性的判断，或者告知投资者有可能使其误认为具有确定性的判断；\n\n（三）向普通投资者主动推介风险等级高于其风险承受能力的基金产品或者服务；\n\n（四）向普通投资者主动推介不符合其投资目标的基金产品或者服务；\n\n（五）向风险承受能力最低类别的普通投资者销售风险等级高于其风险承受能力的基金产品或者服务；\n\n（六）其他违背适当性要求，损害投资者合法权益的行为。"},{"n":46,"label":"第四十六条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"最低风险承受能力类别的普通投资者不得购买高于其风险承受能力的基金产品或者服务。\n除因遗产继承等特殊原因产生的基金份额转让之外，普通投资者主动购买高于其风险承受能力基金产品或者服务的行为，不得突破相关准入资格的限制。"},{"n":47,"label":"第四十七条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"基金募集机构在向普通投资者销售 R5 风险等级的基金产品或者服务时，应向其完整揭示以下事项：\n\n（一）基金产品或者服务的详细信息、重点特性和风险；\n\n（二）基金产品或者服务的主要费用、费率及重要权利、信息披露内容、方式及频率\n\n（三）普通投资者可能承担的损失；\n\n（四）普通投资者投诉方式及纠纷解决安排。"},{"n":48,"label":"第四十八条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"普通投资者主动要求购买与之风险承受能力不匹配的基金产品或者服务的，基金销售要遵循以下程序：\n\n（一）普通投资者主动向基金募集机构提出申请，明确表示要求购买具体的、高于其风险承受能力的基金产品或服务，并同时声明，基金募集机构及其工作人员没有在基金销售过程中主动推介该基金产品或服务的信息；\n\n（二）基金募集机构对普通投资者资格进行审核，确认其不属于风险承受能力最低类别投资者，也没有违反投资者准入性规定；\n（三）基金募集机构向普通投资者以纸质或电子文档的方式进行特别警示，告知其该产品或服务风险高于投资者承受能力；\n\n（四）普通投资者对该警示进行确认，表示已充分知晓该基金产品或者服务风险高于其承受能力，并明确做出愿意自行承担相应不利结果的意思表示；\n\n（五）基金募集机构履行特别警示义务后，普通投资者仍坚持购买该产品或者服务的，基金募集机构可以向其销售相关产品或者提供相关服务。"},{"n":49,"label":"第四十九条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"投资者信息发生重大变化的，基金募集机构要及时更新投资者信息，重新评估投资者风险承受能力，并将调整后的风险承受能力告知投资者。"},{"n":50,"label":"第五十条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"基金募集机构销售的基金产品或者服务信息发生变化的，要及时依据基金产品或者服务风险等级划分参考标准，重新评估其风险等级。基金募集机构还要建立长效机制，对基金产品或者服务的风险定期进行评价更新。"},{"n":51,"label":"第五十一条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"由于投资者风险承受能力或基金产品或者服务风险等级发生变化，导致投资者所持有基金产品或者服务不匹配的，基金募集机构要将不匹配情况告知投资者，并给出新的匹配意见。"},{"n":52,"label":"第五十二条","chapter":"第五章 普通投资者与基金产品或者服务的风险匹配","text":"协会对基金募集机构履行适当性义务进行自律管理，对违反适当性管理规定的基金募集机构及人员依法采取自律惩戒措施。"},{"n":53,"label":"第五十三条","chapter":"第六章 附则","text":"私募基金管理人的主体范围适用《私募投资基金监督管理暂行办法》第二条的规定。\n\n本指引未尽内容，募集机构依据《办法》及相关法律法规、自律规则予以适用。"},{"n":54,"label":"第五十四条","chapter":"第六章 附则","text":"本指引自2017年7月1日起实施。"},{"n":55,"label":"第五十五条","chapter":"第六章 附则","text":"本指引由协会负责解释。"}],"source":"https://www.amac.org.cn/xwfb/hydt/202005/t20200513_18820.html","textSource":"https://www.amac.org.cn/xwfb/hydt/202005/t20200513_18820.html","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"0e2d19878a50593b6c330fc7d5eb42514a7f032c665e2baa9b2b6b1c89540dcc"},{"id":"details","title":"私募投资基金信息披露实施细则","level":"协会自律规则","issuer":"中国证券投资基金业协会","version":"中基协发〔2026〕11号 / 2026","effective":"2026-09-01","scope":"通用","topics":["信息披露","FA","报表","备份"],"overview":"配套2026年证监会披露办法，分证券、股权创投等规定披露内容。第52条明确废止2016年协会披露办法及配套内容格式指引。","practice":"从报告内容追溯数据字段、计算、复核与发送记录；本地备份、向投资者披露和协会平台备份分别留证。本版收录正文，不含六份模板。","priority":[5,9,10,18,19,22,25,26,32,33,36,37,38,40,42,43,45,52],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"为了规范私募投资基金（以下简称私募基金）信息披露行为，保护投资者合法权益，促进私募基金行业规范健康发展，根据《中华人民共和国证券投资基金法》《私募投资基金监督管理条例》《私募投资基金信息披露监督管理办法》（以下简称《信息披露办法》）等法律法规、中国证券监督管理委员会（以下简称中国证监会）规定，制定本细则。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"私募基金管理人、私募基金托管人向投资者披露私募基金信息，私募基金销售机构接受委托向投资者披露私募基金信息，适用本细则。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"私募基金管理人、私募基金托管人应当按照法律、行政法规、中国证监会规定、中国证券投资基金业协会（以下简称协会）自律规则和基金合同、公司章程或者合伙协议（以下统称基金合同）以及相关协议的约定向投资者披露私募基金信息，并保证所披露信息的真实性、准确性、完整性和及时性。私募基金销售机构接受私募基金管理人委托披露私募基金信息的，应当按照法律、行政法规、中国证监会规定、协会自律规则以及基金合同、销售协议约定，真实、准确、完整、及时地向投资者披露有关信息。私募基金管理人、私募基金托管人、私募基金销售机构以及投资者对信息披露事项存在争议的，应当根据基金合同以及相关协议约定的纠纷解决机制处理。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"向投资者披露信息不得存在下列行为：\n（一）虚假记载、误导性陈述或者重大遗漏；\n（二）对投资业绩进行预测；\n（三）向投资者承诺投资本金不受损失或者承诺最低收益、最大亏损；\n（四）公开披露或者变相公开披露；\n（五）夸大或者片面宣传私募基金管理人、基金经理或者私募基金的过往业绩；\n（六）恶意诋毁、贬低其他私募基金管理人、私募基金托管人、私募基金销售机构或者其他私募基金；\n（七）法律、行政法规、中国证监会规定和协会自律规则规定的其他禁止行为。"},{"n":5,"label":"第五条","chapter":"第二章 私募证券投资基金定期报告","text":"私募基金管理人披露私募证券投资基金（以下简称私募证券基金）净值信息应当符合下列要求：\n（一）封闭式私募证券基金至少每季度披露一次基金份额净值、份额累计净值和资产净值；\n（二）开放式私募证券基金在封闭期内，至少每季度披露一次基金份额净值和份额累计净值；\n（三）开放式私募证券基金披露基金份额净值和份额累计净值的频率不得低于基金开放频率，至少披露开放日基金份额净值和份额累计净值。第二节私募证券投资基金季度报告"},{"n":6,"label":"第六条","chapter":"第二章 私募证券投资基金定期报告","text":"私募基金管理人应当按照《信息披露办法》第十九条以及本细则第七条至第十七条的具体规定，在每季度结束之日起一个月内向投资者披露私募证券基金季度报告。"},{"n":7,"label":"第七条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金季度报告产品概况应当披露下列信息：\n（一）私募基金名称、运作方式、类型、成立日期、到期日期、开放频率、分级信息等；\n（二）期末私募基金总份额、净资产、总资产；\n（三）基金经理、投资策略、投资范围、投资限制；\n（四）私募基金管理人、私募基金托管人基本信息以及信息披露联系方式；\n（五）私募基金托管人对基金财务情况等信息的复核意见。"},{"n":8,"label":"第八条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金应当向投资者披露基金份额净值、份额累计净值、基金收益率、业绩比较基准（如有）、十二个月内最大回撤、基金份额及其变动情况等信息。分级私募证券基金应当分别披露各级的上述信息。"},{"n":9,"label":"第九条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金应当披露基金主要财务指标，披露信息包括但不限于费用总额及主要费用明细、已实现收益、公允价值变动收益、利润总额、净利润等。"},{"n":10,"label":"第十条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金应当披露对基金净值有重大影响的估值信息，包括但不限于估值原则、估值方法、估值程序。主要投向单一投资标的的私募证券基金，应当就投资标的估值情况进行具体说明。"},{"n":11,"label":"第十一条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金应当披露报告期末投资资产类别、金额、比例等情况。投资股票资产的，还应当披露按行业分类的股票投资组合金额及占比；投资债券资产的，还应当披露按债券类型、评级分类的债券投资组合公允价值及占比；投资衍生品资产的，还应当披露衍生品资产的类别、挂钩资产类别、权利金、保证金、期末合约市值、公允价值变动、杠杆水平等情况。投资其他私募基金或者依法发行的资产管理产品（公开募集证券投资基金除外）的私募证券基金，还应当披露所投资产管理产品情况，包括按主要投资策略及所投资产管理产品管理人列示投资金额及占比。"},{"n":12,"label":"第十二条","chapter":"第二章 私募证券投资基金定期报告","text":"投向其他私募基金或者依法发行的资产管理产品（公开募集证券投资基金除外）的私募证券基金，除按照本细则第十一条规定披露投资资产情况外，还应当披露穿透后合并计算的报告期末投资资产类别、金额、比例以及投资路径等信息。私募证券基金将百分之九十以上基金净资产投资于本管理人管理的单一私募基金的，应当披露所投单一私募基金的信息披露报告。"},{"n":13,"label":"第十三条","chapter":"第二章 私募证券投资基金定期报告","text":"投资于同一债券的金额超过本基金净资产百分之十或者投资于其他同一资产的金额超过本基金净资产百分之二十五的，应当披露投资资产的具体信息，包括资产类型、投资资产数量、投资金额及其占比、后续拟处理方式，投资于银行活期存款、国债、中央银行票据、政策性金融债、地方政府债券以及债券通用质押式回购的除外。符合《私募证券投资基金运作指引》第二十二条要求且在二十个交易日内完成调整的不适用前款规定。"},{"n":14,"label":"第十四条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金应当披露基金期初、期末杠杆水平。分级私募证券基金还应当披露分级杠杆水平。"},{"n":15,"label":"第十五条","chapter":"第二章 私募证券投资基金定期报告","text":"投资流动性受限资产合计超过本基金净资产百分之二十的，应当按受限类型披露持有流动性受限资产情况，包括资产类别、金额及占比、估值方法等信息。"},{"n":16,"label":"第十六条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金直接或者通过衍生品等间接方式投资境外资产的，应当分别按照跨境投资方式以及资产交易场所地点，披露主要投资境外资产类别、投资规模及占比、跨境投资路径等情况。在跨境投资路径披露中，涉及场外衍生品的，应当披露交易对手方名称；涉及资产管理产品的，应当披露所投资产管理产品名称、管理人名称及其基本情况。"},{"n":17,"label":"第十七条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金涉及关联交易的，应当按照《信息披露办法》第十九条第一款第六项规定披露交易日期、关联方名称、关联关系、资产类型、交易对手方、交易方向、交易价格、交易金额、定价依据及决策程序等情况。将百分之九十以上基金净资产投资于本管理人管理的私募基金的，可以汇总披露净申赎金额及期末投资余额等相关情况。第三节私募证券投资基金年度报告"},{"n":18,"label":"第十八条","chapter":"第二章 私募证券投资基金定期报告","text":"私募基金管理人应当按照《信息披露办法》第二十条以及本细则第七条至第十七条、第十九条至第二十二条的规定，在每年度结束之日起四个月内向投资者披露私募证券基金年度报告。"},{"n":19,"label":"第十九条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金年度财务会计报告应当按照《资产管理产品相关会计处理规定》相关规定进行编制，并对关联交易情况进行专项说明。按照规定应当进行外部审计的，私募基金管理人应当披露审计报告全文，并在私募证券基金年度报告正文中转载注册会计师的审计意见，不得修改或者删减注册会计师的审计意见。将百分之九十以上基金净资产投资于单一私募证券基金，且被投私募基金应当审计的，私募基金管理人还应当向投资者披露被投私募证券基金的审计报告。"},{"n":20,"label":"第二十条","chapter":"第二章 私募证券投资基金定期报告","text":"私募基金管理人报告应当披露下列信息：\n（一）私募基金管理人基本情况及管理基金的经验；\n（二）私募基金管理人的资本变动和私募基金管理人的法定代表人、普通合伙人、执行事务合伙人或者其委派代表、控股股东、实际控制人变动情况的说明；\n（三）基金经理简介及任职情况；\n（四）私募基金管理人对报告期内本基金运作遵规守信情况说明；\n（五）私募基金管理人对报告期内本基金的投资策略和业绩表现的说明；\n（六）私募基金管理人对会计师事务所出具非标准审计意见所涉相关事项的说明；\n（七）私募基金管理人在报告期内发生影响正常持续经营的重大事项或其他可能影响管理人正常履职的重大情况；\n（八）中国证监会规定和协会规定的其他事项。"},{"n":21,"label":"第二十一条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金托管人报告应当披露报告期内本基金托管人遵规守信、履职尽责情况以及中国证监会和协会规定的其他事项。"},{"n":22,"label":"第二十二条","chapter":"第二章 私募证券投资基金定期报告","text":"私募证券基金在本年末存在下列情形之一的，其年度财务会计报告应当经符合《中华人民共和国证券法》（以下简称《证券法》）规定的会计师事务所审计：\n（一）投资流动性受限资产以及新三板股票的比例合计高于私募证券基金净资产的百分之六十，投资私募基金及衍生品的除外；\n（二）持有衍生品资产合约价值的比例高于私募证券基金净资产的百分之六十，或者衍生品账户权益高于私募证券基金净资产的百分之二十；\n（三）投资境外资产的比例高于私募证券基金净资产的百分之六十，直接投资于境外标准化资产的除外；\n（四）投资其他私募证券基金管理人管理的私募基金的比例高于该私募证券基金净资产的百分之六十；\n（五）投资前述流动性受限资产、新三板股票、境外资产、其他私募证券基金管理人管理的私募基金的金额与衍生品资产的持仓合约价值合计高于私募证券基金净资产的百分之六十；\n（六）中国证监会规定的其他情形。"},{"n":23,"label":"第二十三条","chapter":"第三章 私募股权投资基金定期报告","text":"私募基金管理人应当按照《信息披露办法》第二十二条以及本细则第二十四条至第三十一条的规定，在每半年结束之日起两个月内向投资者披露私募股权投资基金（以下简称私募股权基金）半年度报告。"},{"n":24,"label":"第二十四条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金半年度报告产品概况应当披露下列信息：\n（一）私募基金名称、类型、注册地（如有）、成立日期、到期日期、运作状态；\n（二）期末基金净资产、期末基金总资产；\n（三）执行事务合伙人名称（如有）、关键人士（如有）、投资策略、投资范围、投资限制；\n（四）私募基金管理人、私募基金托管人（如有）基本信息以及信息披露联系方式；\n（五）私募基金托管人对基金财务信息的复核意见（如有）。"},{"n":25,"label":"第二十五条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金应当披露基金净资产及变动情况，投资者变动情况，收益、各项费用及利润情况，包括但不限于下列信息：\n（一）认缴实缴金额及占比、净资产、投入资本回报率、投入资本总值倍数；\n（二）私募基金投资者变动情况，自然人投资者变动情况应当单独披露；\n（三）已分配金额、累计分配总额等；\n（四）费用总额及主要费用明细、应缴税费、净利润。"},{"n":26,"label":"第二十六条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金应当披露基金估值信息，包括但不限于估值原则、估值方法、估值程序、其他估值相关事项。"},{"n":27,"label":"第二十七条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金应当披露投资资产组合的投资金额及比例。私募股权基金应当汇总披露基金累计项目投资情况，包括但不限于总投资项目、新增投资项目及投资决策程序、项目退出及退出资金分配情况。投资其他私募基金的私募股权基金，还应当披露所投私募基金情况，包括但不限于投资私募基金名称、类型、累计投资成本、已回款金额、账面价值及占比。"},{"n":28,"label":"第二十八条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金应当披露基金投资项目具体情况，包括但不限于下列信息：\n（一）基本情况：投资日期、统一社会信用编码、股票代码（如有）、投资方式、投资行业；\n（二）投资情况：项目投资本金及账面价值，估值方法，权属确认及投资决策程序情况；\n（三）退出情况：退出方式、累计退出本金及回款金额；\n（四）项目的投资架构情况；\n（五）跨境投资方式及项目所在国家或地区。通过特殊目的载体进行投资的私募股权基金，应当按照前款要求披露穿透后投资项目情况，还应当披露特殊目的载体名称等情况。"},{"n":29,"label":"第二十九条","chapter":"第三章 私募股权投资基金定期报告","text":"投向其他私募基金的私募股权基金，除按照本细则第二十七条、第二十八条规定披露投资资产情况外，还应当披露穿透后投资规模占基金净资产比例前十名的投资项目情况，包括但不限于投资项目名称、累计投资成本、已回款金额、账面价值以及投资路径等情况。私募股权基金将百分之九十以上基金净资产投资于单一私募基金的，应当披露所投单一私募基金的信息披露报告。"},{"n":30,"label":"第三十条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金应当披露基金期初、期末杠杆水平。分级私募股权基金还应当披露分级杠杆水平。私募股权基金通过特殊目的载体投资的，还应当披露特殊目的载体名称、基金投资金额以及期初、期末杠杆水平。"},{"n":31,"label":"第三十一条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金涉及关联交易的，应当按照《信息披露办法》第二十二条第六项规定披露交易日期、关联方名称、关联关系、资产类型、交易对手方、交易方向、交易价格、交易金额、定价依据及决策程序等情况。第二节私募股权投资基金年度报告"},{"n":32,"label":"第三十二条","chapter":"第三章 私募股权投资基金定期报告","text":"私募基金管理人应当按照《信息披露办法》第二十三条以及本细则第二十四条至第三十一条、第三十三条至第三十六条的规定，在每年度结束之日起六个月内向投资者披露私募股权基金年度报告。"},{"n":33,"label":"第三十三条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金年度财务会计报告应当按照《企业会计准则》相关规定进行编制，并对关联交易情况进行专项说明。私募股权基金年度财务会计报告应当经会计师事务所审计。私募基金管理人应当披露审计报告全文，并在私募股权基金年度报告正文中转载注册会计师的审计意见，不得修改或者删减注册会计师的审计意见。"},{"n":34,"label":"第三十四条","chapter":"第三章 私募股权投资基金定期报告","text":"私募基金管理人报告应当披露下列信息：\n（一）私募基金管理人基本情况以及管理基金的经验；\n（二）私募基金管理人的资本变动和私募基金管理人的法定代表人、普通合伙人、执行事务合伙人或者其委派代表、控股股东、实际控制人变动情况；\n（三）关键人士（如有）的简介以及任职情况；\n（四）私募基金管理人对报告期内本基金运作遵规守信情况说明；\n（五）私募基金管理人对报告期内基金运作管理和项目运行情况的说明；\n（六）私募基金管理人对会计师事务所出具非标准审计意见所涉相关事项的说明；\n（七）私募基金管理人在报告期内发生影响正常持续经营的重大事项或其他可能影响管理人正常履职的重大情况；\n（八）中国证监会和协会规定的其他事项。"},{"n":35,"label":"第三十五条","chapter":"第三章 私募股权投资基金定期报告","text":"私募股权基金托管人报告应当披露报告期内本基金托管人遵规守信、履职尽责情况以及中国证监会和协会规定的其他事项。"},{"n":36,"label":"第三十六条","chapter":"第三章 私募股权投资基金定期报告","text":"私募基金规模超过一亿元且自然人投资者二十人以上的私募股权基金，以及存在中国证监会规定的其他情形的，其年度财务报告应当经符合《证券法》规定的会计师事务所审计。"},{"n":37,"label":"第三十七条","chapter":"第三章 私募股权投资基金定期报告","text":"私募基金管理人应当在每年度结束之日起六个月内编制完成创业投资基金年度报告并向投资者披露，披露的内容、时间和审计要求按照本细则对私募股权投资基金的要求执行。鼓励私募基金管理人披露私募创业投资基金半年度报告。"},{"n":38,"label":"第三十八条","chapter":"第四章 临时报告和清算报告","text":"私募基金在完成清算前发生《信息披露办法》第二十七条规定事项，已经或者可能对投资者权益产生重大影响的，私募基金管理人应当及时编制临时报告，并在该事项发生之日起五个工作日内向投资者披露。《信息披露办法》第二十七条第五项所述重大关联交易临时报告的信息应当包括但不限于交易日期、关联方名称、关联关系、资产类型、交易对手方、交易方向、交易价格、交易金额、定价依据及决策程序、交易事项概述等，若交易价格与公允价格差异较大的，应当说明原因。"},{"n":39,"label":"第三十九条","chapter":"第四章 临时报告和清算报告","text":"私募基金管理人应当按照《信息披露办法》第二十九条规定，及时向投资者披露清算公告、清算报告以及与清算有关的其他重大事项。私募基金应当在每次清算结束后及时披露清算报告。超过一年无法完成清算的，应当每年至少披露一次清算有关事项，披露内容按照清算报告相关要求执行。除基金合同另有约定外，未托管私募基金的最后一次清算报告应当经会计师事务所审计。私募基金管理人未担任私募基金财产清算组成员的，私募基金管理人应当配合私募基金财产清算组对私募基金财产进行清算。私募基金财产清算组应当按照《信息披露办法》以及本细则相关规定向投资者披露私募基金信息。"},{"n":40,"label":"第四十条","chapter":"第四章 临时报告和清算报告","text":"私募基金清算报告应当披露下列信息：\n（一）基金清算组（人）、清算起止日期、清算次数等基本情况；\n（二）私募证券基金应当披露清算报告基准日资产情况、主要财务费用、分配情况、未变现资产情况以及私募基金托管人对基金财务信息的复核意见；\n（三）私募股权基金应当披露认缴金额、累计实缴金额（份额）、投资收益、主要财务费用、已分配金额、投入资本回报率、未变现资产情况以及私募基金托管人对基金财务信息的复核意见（如有）。"},{"n":41,"label":"第四十一条","chapter":"第四章 临时报告和清算报告","text":"私募基金将百分之九十以上基金净资产投资于单一私募基金的，应当披露所投单一私募基金的临时报告、清算公告、清算报告以及与清算有关的其他重大事项信息。"},{"n":42,"label":"第四十二条","chapter":"第五章 其他事项","text":"协会制定信息披露重要内容模板。私募基金管理人向投资者披露的具体信息应当不少于重要内容模板的要求，具体格式可以自定。对投资者决策有重大影响的信息，不论本细则是否有明确规定，私募基金管理人均应当披露。"},{"n":43,"label":"第四十三条","chapter":"第五章 其他事项","text":"私募基金管理人应当将所披露的信息在协会的信息披露备份平台进行备份，投资者可以登录该平台进行信息查询。信息披露备份平台不作为信息披露渠道。私募基金管理人仅在信息披露备份平台进行备份，未通过其他信息披露渠道披露的，不能视为向投资者进行信息披露。"},{"n":44,"label":"第四十四条","chapter":"第五章 其他事项","text":"向投资者披露的私募基金信息应当采用中文文本。文本内容应当真实、准确、完整。同时采用外文文本的，私募基金管理人应当保证不同文本的内容一致。披露的相关数据信息应当采用阿拉伯数字，除特别说明外，货币单位应当为人民币元。"},{"n":45,"label":"第四十五条","chapter":"第五章 其他事项","text":"私募基金管理人、私募基金托管人应当建立健全信息披露管理制度，指定专门部门和高级管理人员负责信息披露事务；私募基金管理人的股东、合伙人、实际控制人应当配合私募基金管理人履行信息披露义务。私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构应当妥善保管私募基金信息披露相关文件资料，保存期限自基金清算结束之日起不得少于二十年。"},{"n":46,"label":"第四十六条","chapter":"第五章 其他事项","text":"私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构、投资者及其他相关机构应当依法对所获取的私募基金未公开信息等履行保密义务。上述机构及相关从业人员不得泄露因职务便利获取的未公开信息，不得利用该信息从事或者明示、暗示他人从事相关的证券、期货交易活动。协会对信息披露备份平台信息严格保密，除依法配合开展案件检查、调查外不予使用。"},{"n":47,"label":"第四十七条","chapter":"第六章 自律管理","text":"协会依据法律、行政法规、中国证监会相关规定、章程和自律规则对私募基金的信息披露行为实施自律管理。协会可以对私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构履行信息披露职责的情况进行检查，相关主体应当予以配合。"},{"n":48,"label":"第四十八条","chapter":"第六章 自律管理","text":"协会发现私募基金管理人、私募基金托管人、私募基金销售机构及其他私募基金服务机构，以及前述机构的从业人员在信息披露中违反本细则第三条、第五条至第四十五条规定的，协会依据相关自律规则实施自律管理，可以对相关主体采取谈话提醒、书面警示、限期改正等自律管理措施，以及警告、公开谴责、限制相关业务活动等纪律处分措施；可以对直接负责的主管人员和其他责任人员采取谈话提醒、书面警示等自律管理措施，以及警告、行业内谴责、公开谴责、不得从事相关业务等纪律处分措施。"},{"n":49,"label":"第四十九条","chapter":"第六章 自律管理","text":"私募基金管理人、私募基金托管人、私募基金销售机构在信息披露活动中存在本细则第四条所述行为的，协会可以对相关主体采取自律管理措施以及警告、公开谴责、限制相关业务活动、撤销管理人登记、取消会员资格等纪律处分措施；对直接负责的主管人员和其他直接责任人员，协会可以采取自律管理措施以及警告、公开谴责、加入黑名单、取消基金从业资格等纪律处分措施。"},{"n":50,"label":"第五十条","chapter":"第六章 自律管理","text":"私募基金管理人违反本细则第四十二条规定未在信息披露备份平台备份披露信息的，协会可以要求其限期备份；逾期未备份的，协会可以对外公示，并依据相关自律规则实施自律管理。"},{"n":51,"label":"第五十一条","chapter":"第六章 自律管理","text":"私募基金管理人进行信息披露，违反相关法律法规和中国证监会规定，被中国证监会及其派出机构采取行政监管措施或者予以行政处罚的，协会可以对外公示，并记入协会诚信档案。"},{"n":52,"label":"第五十二条","chapter":"第七章 附则","text":"本细则自 2026年 9月 1日起施行。2016年2月 4日发布的《私募投资基金信息披露管理办法》及配套内容与格式指引同时废止。"}],"source":"https://www.amac.org.cn/xwfb/tzgg/202606/t20260605_27780.html","textSource":"https://www.amac.org.cn/xwfb/tzgg/202606/P020260605683618804893.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"b39a5c717c12d7e70f1ba3324505812d94c14b14d00a220a4756ae1a96e64e00"}],"comments":{"fundlaw:2":{"title":"先确定法律适用对象","meaning":"本法以证券投资基金活动为主要调整对象，包含公募和非公开募集两类。某一公募专章中的要求不因同属基金行业就自动适用于私募。","action":"给产品标注组织形式、管理人类别、主要投资标的及募资方式，然后确定适用规则。","evidence":"产品适用法规清单、合同结构图。","links":[["ordinance",2],["fundlaw",87]],"caution":""},"fundlaw:5":{"title":"财产独立是运营底层控制","meaning":"独立性不仅是账上分开，也是账户、权利归属、债务承担与破产隔离安排的问题。","action":"核对账户名义、基金标识、费用归属、跨产品往来及清算处理。","evidence":"账户清单、总账/明细账、费用分摊依据。","links":[["ordinance",4],["internal",18],["service",4]],"caution":""},"fundlaw:87":{"title":"人数限制与投资者资格分开看","meaning":"资格、单只基金人数与穿透规则需要分别检查。证券基金条文的二百人不能不加区分地套用于所有公司、合伙结构。","action":"将投资者名册、穿透结果和合同结构联动审核。","evidence":"投资者台账、资质证明、人数核对底稿。","links":[["ordinance",18],["interim",12],["fit",8]],"caution":""},"fundlaw:95":{"title":"合同不能取代后续监管要求","meaning":"基金合同的信息提供约定需要与后续条例、披露办法及细则共同满足。仅按旧合同提供一句净值可能不足。","action":"建立产品类型与报告类型矩阵，检查存量合同与当前流程。","evidence":"合同版本、披露日历、发送及备份记录。","links":[["ordinance",31],["disclosure",3],["details",43]],"caution":""},"ordinance:11":{"title":"管理职责要有可执行的责任链","meaning":"列明的募集备案、分别记账、风险控制、分配、信息提供和资料保存，构成经理人运营责任的主干。内部部门可以分工，但分工表不改变管理人的法律身份。","action":"用RACI列责任，用SOP列执行与复核，再用证据矩阵证明已执行。","evidence":"责任矩阵、运营日历、执行回执。","links":[["internal",10],["service",5],["register",39]],"caution":""},"ordinance:15":{"title":"不托管不等于无控制","meaning":"条文允许合同约定的情形，同时要求不托管时有财产安全制度与纠纷解决机制。还须检查适用产品专项规则。","action":"设立时由法律合规核实是否可不托管，再确认账户访问、独立核验和异常处置机制。","evidence":"合同条款、保障措施、授权及核对证据。","links":[["fundlaw",88],["register",32],["internal",21]],"caution":""},"ordinance:22":{"title":"备案时钟从实际业务事件开始","meaning":"募集完毕后的备案义务，应与具体募集完成认定和提交材料要求衔接。不能用内部排期替代法定触发点。","action":"记录募集完成日、申请日、补正日和办结日，分别管理责任及截止。","evidence":"资金证明、合同、投资者名册、系统提交与回执。","links":[["register",39],["filing1",3],["filing2",3]],"caution":""},"ordinance:27":{"title":"外包运营与转移投资管理职责不同","meaning":"投资管理职责不得委托他人行使，证券投资建议服务另有主体要求。TA、估值核算等运营外包不能被理解为允许外包全部受托管理。","action":"画清投资决定、指令执行、核算和复核的边界，识别服务商是否越过授权范围。","evidence":"授权表、交易指令证据、服务范围说明。","links":[["service",2],["service",5],["register",30]],"caution":""},"ordinance:28":{"title":"关联交易需要识别、决策、披露","meaning":"关联交易控制贯穿识别、定价和决策，不是付款前打一个勾。不同规则和合同的披露安排需共同检查。","action":"维护关联方名单，评估公平性，记录决策和回避，再按适用要求披露。","evidence":"关联方库、审批记录、公允性证据、披露记录。","links":[["register",38],["details",17],["details",31]],"caution":""},"ordinance:31":{"title":"信息提供与经营实质相连","meaning":"向投资者提供的信息应与真实运作及合同安排对应。证券类、股权类和创投类不能只用同一个报告包。","action":"从报告反向追溯到FA、TA、MO输入与复核。","evidence":"数据字段血缘、报告审核记录。","links":[["disclosure",3],["details",6],["details",23]],"caution":""},"ordinance:33":{"title":"报送与投资者披露分别管理","meaning":"本条规定向登记备案机构报送投资运作等信息，并规定登记备案机构的分析、风险预警和保密职责；本条不规定档案保存年限。","action":"区分协会报送、向投资者披露和内部管理报告，分别记录口径、时限、责任及回执。资料保存另查相关条文。","evidence":"报送日历、最终版本、提交回执和差异说明。","links":[["ordinance",31],["details",43],["register",60]],"caution":""},"service:5":{"title":"外包以后仍要监督","meaning":"条文要求尽职调查、明确权利义务、持续关注和评估服务情况，责任不因委托免除。它不是要求所有机构每日全量手工redo的同义表达。","action":"先识别法规、合同和内部制度的明确要求，再按风险设计完整性核对、关键独立重算、差异分析与服务商评价。","evidence":"尽调报告、服务评估、独立数据源、复核底稿、例外关闭记录。","links":[["internal",22],["internal",23],["ordinance",11]],"caution":"调整现有复核必须有风险覆盖、平行验证及实际有权人的批准。"},"service:11":{"title":"把协议写成可以验收的交付","meaning":"书面协议应覆盖条文所列事项。SLA是将约定落到输入输出、时点、质量和例外处理的实践方法，不是条文中的统一格式。","action":"明确缺失数据、补发文件、迟交和差错各由谁判断与升级。","evidence":"已签服务协议、SLA、服务范围/版本清单。","links":[["service",12],["service",5]],"caution":""},"service:12":{"title":"操作备忘录连接多个主体","meaning":"账户、交易、估值、划款和投资者数据的交接需要各方达成具体可执行的操作安排。邮件习惯不等于完整流程。","action":"选择一个NAV周期走查从源数据到对账与发布的全部交接。","evidence":"多方备忘录、泳道图、字段字典、时点表。","links":[["internal",14],["service",35],["service",20]],"caution":""},"service:20":{"title":"TA记录关系到权利归属","meaning":"份额登记服务涉及账户、份额及资金结算等事项，需要按具体协议分清执行与核验责任。","action":"对投资者、申请、资金和份额四类记录建立关联键，保留更正痕迹。","evidence":"TA流水、名册、份额与资金对账、操作日志。","links":[["fundlaw",102],["raise",12],["privacy",21]],"caution":""},"service:33":{"title":"估值不是复制一张净值表","meaning":"会计准则、估值规则和有效合同共同约束估值方法、频率和流程。应证明输入和方法合理，而不只是算术一致。","action":"列出资产类别、价格来源、估值层级、参数版本和例外批准路径。","evidence":"价格与持仓独立证据、估值政策、参数变更记录。","links":[["service",35],["service",36],["details",10]],"caution":""},"service:35":{"title":"与托管人的核对要有证据","meaning":"条文要求按有效安排与托管人核对账务，并由托管人复核估值结果。内部redo并不代替托管人的独立职责。","action":"给每个核对点规定数据口径、负责人、未决差异处理和放行标准。","evidence":"对账记录、差异工单、确认时间戳。","links":[["service",12],["disclosure",8]],"caution":""},"service:36":{"title":"差错处理先限制影响","meaning":"发现份额净值错误，需要及时纠正、防止扩大，并通知管理人依法履行披露和报告义务。不要等到root cause报告完成才处置。","action":"保留旧版、测算影响范围、控制后续处理、按权限更正和通知，再复盘。","evidence":"影响评估、更正及通知记录、批准、根因与复测。","links":[["disclosure",27],["internal",27]],"caution":""},"service:48":{"title":"数据地点与安全安排需要可核验","meaning":"本条对核心业务系统部署、存储备份和保密提出要求；跨境或远程支持安排还要结合其他数据法律。","action":"确认实际系统及备份部署位置、运维访问权限和委托链。","evidence":"服务商
