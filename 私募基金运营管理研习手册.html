令或者利用职务违反交易规则的，由所属的证券公司承担全部责任。证券公司的从业人员不得私下接受客户委托买卖证券。"},{"n":137,"label":"第一百三十七条","chapter":"第八章 　证券公司","text":"证券公司应当建立客户信息查询制度，确保客户能够查询其账户信息、委托记录、交易记录以及其他与接受服务或者购买产品有关的重要信息。证券公司应当妥善保存客户开户资料、委托记录、交易记录和与内部管理、业务经营有关的各项信息，任何人不得隐匿、伪造、篡改或者毁损。上述信息的保存期限不得少于二十年。"},{"n":138,"label":"第一百三十八条","chapter":"第八章 　证券公司","text":"证券公司应当按照规定向国务院证券监督管理机构报送业务、财务等经营管理信息和资料。国务院证券监督管理机构有权要求证券公司及其主要股东、实际控制人在指定的期限内提供有关信息、资料。证券公司及其主要股东、实际控制人向国务院证券监督管理机构报送或者提供的信息、资料，必须真实、准确、完整。"},{"n":139,"label":"第一百三十九条","chapter":"第八章 　证券公司","text":"国务院证券监督管理机构认为有必要时，可以委托会计师事务所、资产评估机构对证券公司的财务状况、内部控制状况、资产价值进行审计或者评估。具体办法由国务院证券监督管理机构会同有关主管部门制定。"},{"n":140,"label":"第一百四十条","chapter":"第八章 　证券公司","text":"证券公司的治理结构、合规管理、风险控制指标不符合规定的，国务院证券监督管理机构应当责令其限期改正；逾期未改正，或者其行为严重危及该证券公司的稳健运行、损害客户合法权益的，国务院证券监督管理机构可以区别情形，对其采取下列措施：\n（一）限制业务活动，责令暂停部分业务，停止核准新业务；\n（二）限制分配红利，限制向董事、监事、高级管理人员支付报酬、提供福利；\n（三）限制转让财产或者在财产上设定其他权利；\n（四）责令更换董事、监事、高级管理人员或者限制其权利；\n（五）撤销有关业务许可；\n（六）认定负有责任的董事、监事、高级管理人员为不适当人选；\n（七）责令负有责任的股东转让股权，限制负有责任的股东行使股东权利。证券公司整改后，应当向国务院证券监督管理机构提交报告。国务院证券监督管理机构经验收，治理结构、合规管理、风险控制指标符合规定的，应当自验收完毕之日起三日内解除对其采取的前款规定的有关限制措施。"},{"n":141,"label":"第一百四十一条","chapter":"第八章 　证券公司","text":"证券公司的股东有虚假出资、抽逃出资行为的，国务院证券监督管理机构应当责令其限期改正，并可责令其转让所持证券公司的股权。在前款规定的股东按照要求改正违法行为、转让所持证券公司的股权前，国务院证券监督管理机构可以限制其股东权利。"},{"n":142,"label":"第一百四十二条","chapter":"第八章 　证券公司","text":"证券公司的董事、监事、高级管理人员未能勤勉尽责，致使证券公司存在重大违法违规行为或者重大风险的，国务院证券监督管理机构可以责令证券公司予以更换。"},{"n":143,"label":"第一百四十三条","chapter":"第八章 　证券公司","text":"证券公司违法经营或者出现重大风险，严重危害证券市场秩序、损害投资者利益的，国务院证券监督管理机构可以对该证券公司采取责令停业整顿、指定其他机构托管、接管或者撤销等监管措施。"},{"n":144,"label":"第一百四十四条","chapter":"第八章 　证券公司","text":"在证券公司被责令停业整顿、被依法指定托管、接管或者清算期间，或者出现重大风险时，经国务院证券监督管理机构批准，可以对该证券公司直接负责的董事、监事、高级管理人员和其他直接责任人员采取以下措施：\n（一）通知出境入境管理机关依法阻止其出境；\n（二）申请司法机关禁止其转移、转让或者以其他方式处分财产，或者在财产上设定其他权利。"},{"n":145,"label":"第一百四十五条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构为证券交易提供集中登记、存管与结算服务，不以营利为目的，依法登记，取得法人资格。设立证券登记结算机构必须经国务院证券监督管理机构批准。"},{"n":146,"label":"第一百四十六条","chapter":"第九章 　证券登记结算机构","text":"设立证券登记结算机构，应当具备下列条件：\n（一）自有资金不少于人民币二亿元；\n（二）具有证券登记、存管和结算服务所必须的场所和设施；\n（三）国务院证券监督管理机构规定的其他条件。证券登记结算机构的名称中应当标明证券登记结算字样。"},{"n":147,"label":"第一百四十七条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构履行下列职能：\n（一）证券账户、结算账户的设立；\n（二）证券的存管和过户；\n（三）证券持有人名册登记；\n（四）证券交易的清算和交收；\n（五）受发行人的委托派发证券权益；\n（六）办理与上述业务有关的查询、信息服务；\n（七）国务院证券监督管理机构批准的其他业务。"},{"n":148,"label":"第一百四十八条","chapter":"第九章 　证券登记结算机构","text":"在证券交易所和国务院批准的其他全国性证券交易场所交易的证券的登记结算，应当采取全国集中统一的运营方式。前款规定以外的证券，其登记、结算可以委托证券登记结算机构或者其他依法从事证券登记、结算业务的机构办理。"},{"n":149,"label":"第一百四十九条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构应当依法制定章程和业务规则，并经国务院证券监督管理机构批准。证券登记结算业务参与人应当遵守证券登记结算机构制定的业务规则。"},{"n":150,"label":"第一百五十条","chapter":"第九章 　证券登记结算机构","text":"在证券交易所或者国务院批准的其他全国性证券交易场所交易的证券，应当全部存管在证券登记结算机构。证券登记结算机构不得挪用客户的证券。"},{"n":151,"label":"第一百五十一条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构应当向证券发行人提供证券持有人名册及有关资料。证券登记结算机构应当根据证券登记结算的结果，确认证券持有人持有证券的事实，提供证券持有人登记资料。证券登记结算机构应当保证证券持有人名册和登记过户记录真实、准确、完整，不得隐匿、伪造、篡改或者毁损。"},{"n":152,"label":"第一百五十二条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构应当采取下列措施保证业务的正常进行：\n（一）具有必备的服务设备和完善的数据安全保护措施；\n（二）建立完善的业务、财务和安全防范等管理制度；\n（三）建立完善的风险管理系统。"},{"n":153,"label":"第一百五十三条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构应当妥善保存登记、存管和结算的原始凭证及有关文件和资料。其保存期限不得少于二十年。"},{"n":154,"label":"第一百五十四条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构应当设立证券结算风险基金，用于垫付或者弥补因违约交收、技术故障、操作失误、不可抗力造成的证券登记结算机构的损失。证券结算风险基金从证券登记结算机构的业务收入和收益中提取，并可以由结算参与人按照证券交易业务量的一定比例缴纳。证券结算风险基金的筹集、管理办法，由国务院证券监督管理机构会同国务院财政部门规定。"},{"n":155,"label":"第一百五十五条","chapter":"第九章 　证券登记结算机构","text":"证券结算风险基金应当存入指定银行的专门账户，实行专项管理。证券登记结算机构以证券结算风险基金赔偿后，应当向有关责任人追偿。"},{"n":156,"label":"第一百五十六条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构申请解散，应当经国务院证券监督管理机构批准。"},{"n":157,"label":"第一百五十七条","chapter":"第九章 　证券登记结算机构","text":"投资者委托证券公司进行证券交易，应当通过证券公司申请在证券登记结算机构开立证券账户。证券登记结算机构应当按照规定为投资者开立证券账户。投资者申请开立账户，应当持有证明中华人民共和国公民、法人、合伙企业身份的合法证件。国家另有规定的除外。"},{"n":158,"label":"第一百五十八条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构作为中央对手方提供证券结算服务的，是结算参与人共同的清算交收对手，进行净额结算，为证券交易提供集中履约保障。证券登记结算机构为证券交易提供净额结算服务时，应当要求结算参与人按照货银对付的原则，足额交付证券和资金，并提供交收担保。在交收完成之前，任何人不得动用用于交收的证券、资金和担保物。结算参与人未按时履行交收义务的，证券登记结算机构有权按照业务规则处理前款所述财产。"},{"n":159,"label":"第一百五十九条","chapter":"第九章 　证券登记结算机构","text":"证券登记结算机构按照业务规则收取的各类结算资金和证券，必须存放于专门的清算交收账户，只能按业务规则用于已成交的证券交易的清算交收，不得被强制执行。"},{"n":160,"label":"第一百六十条","chapter":"第十章 　证券服务机构","text":"会计师事务所、律师事务所以及从事证券投资咨询、资产评估、资信评级、财务顾问、信息技术系统服务的证券服务机构，应当勤勉尽责、恪尽职守，按照相关业务规则为证券的交易及相关活动提供服务。从事证券投资咨询服务业务，应当经国务院证券监督管理机构核准；未经核准，不得为证券的交易及相关活动提供服务。从事其他证券服务业务，应当报国务院证券监督管理机构和国务院有关主管部门备案。"},{"n":161,"label":"第一百六十一条","chapter":"第十章 　证券服务机构","text":"证券投资咨询机构及其从业人员从事证券服务业务不得有下列行为：\n（一）代理委托人从事证券投资；\n（二）与委托人约定分享证券投资收益或者分担证券投资损失；\n（三）买卖本证券投资咨询机构提供服务的证券；\n（四）法律、行政法规禁止的其他行为。有前款所列行为之一，给投资者造成损失的，应当依法承担赔偿责任。"},{"n":162,"label":"第一百六十二条","chapter":"第十章 　证券服务机构","text":"证券服务机构应当妥善保存客户委托文件、核查和验证资料、工作底稿以及与质量控制、内部管理、业务经营有关的信息和资料，任何人不得泄露、隐匿、伪造、篡改或者毁损。上述信息和资料的保存期限不得少于十年，自业务委托结束之日起算。"},{"n":163,"label":"第一百六十三条","chapter":"第十章 　证券服务机构","text":"证券服务机构为证券的发行、上市、交易等证券业务活动制作、出具审计报告及其他鉴证报告、资产评估报告、财务顾问报告、资信评级报告或者法律意见书等文件，应当勤勉尽责，对所依据的文件资料内容的真实性、准确性、完整性进行核查和验证。其制作、出具的文件有虚假记载、误导性陈述或者重大遗漏，给他人造成损失的，应当与委托人承担连带赔偿责任，但是能够证明自己没有过错的除外。"},{"n":164,"label":"第一百六十四条","chapter":"第十一章 　证券业协会","text":"证券业协会是证券业的自律性组织，是社会团体法人。证券公司应当加入证券业协会。证券业协会的权力机构为全体会员组成的会员大会。"},{"n":165,"label":"第一百六十五条","chapter":"第十一章 　证券业协会","text":"证券业协会章程由会员大会制定，并报国务院证券监督管理机构备案。"},{"n":166,"label":"第一百六十六条","chapter":"第十一章 　证券业协会","text":"证券业协会履行下列职责：\n（一）教育和组织会员及其从业人员遵守证券法律、行政法规，组织开展证券行业诚信建设，督促证券行业履行社会责任；\n（二）依法维护会员的合法权益，向证券监督管理机构反映会员的建议和要求；\n（三）督促会员开展投资者教育和保护活动，维护投资者合法权益；\n（四）制定和实施证券行业自律规则，监督、检查会员及其从业人员行为，对违反法律、行政法规、自律规则或者协会章程的，按照规定给予纪律处分或者实施其他自律管理措施；\n（五）制定证券行业业务规范，组织从业人员的业务培训；\n（六）组织会员就证券行业的发展、运作及有关内容进行研究，收集整理、发布证券相关信息，提供会员服务，组织行业交流，引导行业创新发展；\n（七）对会员之间、会员与客户之间发生的证券业务纠纷进行调解；\n（八）证券业协会章程规定的其他职责。"},{"n":167,"label":"第一百六十七条","chapter":"第十一章 　证券业协会","text":"证券业协会设理事会。理事会成员依章程的规定由选举产生。"},{"n":168,"label":"第一百六十八条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构依法对证券市场实行监督管理，维护证券市场公开、公平、公正，防范系统性风险，维护投资者合法权益，促进证券市场健康发展。"},{"n":169,"label":"第一百六十九条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构在对证券市场实施监督管理中履行下列职责：\n（一）依法制定有关证券市场监督管理的规章、规则，并依法进行审批、核准、注册，办理备案；\n（二）依法对证券的发行、上市、交易、登记、存管、结算等行为，进行监督管理；\n（三）依法对证券发行人、证券公司、证券服务机构、证券交易场所、证券登记结算机构的证券业务活动，进行监督管理；\n（四）依法制定从事证券业务人员的行为准则，并监督实施；\n（五）依法监督检查证券发行、上市、交易的信息披露；\n（六）依法对证券业协会的自律管理活动进行指导和监督；\n（七）依法监测并防范、处置证券市场风险；\n（八）依法开展投资者教育；\n（九）依法对证券违法行为进行查处；\n（十）法律、行政法规规定的其他职责。"},{"n":170,"label":"第一百七十条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构依法履行职责，有权采取下列措施：\n（一）对证券发行人、证券公司、证券服务机构、证券交易场所、证券登记结算机构进行现场检查；\n（二）进入涉嫌违法行为发生场所调查取证；\n（三）询问当事人和与被调查事件有关的单位和个人，要求其对与被调查事件有关的事项作出说明；或者要求其按照指定的方式报送与被调查事件有关的文件和资料；\n（四）查阅、复制与被调查事件有关的财产权登记、通讯记录等文件和资料；\n（五）查阅、复制当事人和与被调查事件有关的单位和个人的证券交易记录、登记过户记录、财务会计资料及其他相关文件和资料；对可能被转移、隐匿或者毁损的文件和资料，可以予以封存、扣押；\n（六）查询当事人和与被调查事件有关的单位和个人的资金账户、证券账户、银行账户以及其他具有支付、托管、结算等功能的账户信息，可以对有关文件和资料进行复制；对有证据证明已经或者可能转移或者隐匿违法资金、证券等涉案财产或者隐匿、伪造、毁损重要证据的，经国务院证券监督管理机构主要负责人或者其授权的其他负责人批准，可以冻结或者查封，期限为六个月；因特殊原因需要延长的，每次延长期限不得超过三个月，冻结、查封期限最长不得超过二年；\n（七）在调查操纵证券市场、内幕交易等重大证券违法行为时，经国务院证券监督管理机构主要负责人或者其授权的其他负责人批准，可以限制被调查的当事人的证券买卖，但限制的期限不得超过三个月；案情复杂的，可以延长三个月；\n（八）通知出境入境管理机关依法阻止涉嫌违法人员、涉嫌违法单位的主管人员和其他直接责任人员出境。为防范证券市场风险，维护市场秩序，国务院证券监督管理机构可以采取责令改正、监管谈话、出具警示函等措施。"},{"n":171,"label":"第一百七十一条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构对涉嫌证券违法的单位或者个人进行调查期间，被调查的当事人书面申请，承诺在国务院证券监督管理机构认可的期限内纠正涉嫌违法行为，赔偿有关投资者损失，消除损害或者不良影响的，国务院证券监督管理机构可以决定中止调查。被调查的当事人履行承诺的，国务院证券监督管理机构可以决定终止调查；被调查的当事人未履行承诺或者有国务院规定的其他情形的，应当恢复调查。具体办法由国务院规定。国务院证券监督管理机构决定中止或者终止调查的，应当按照规定公开相关信息。"},{"n":172,"label":"第一百七十二条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构依法履行职责，进行监督检查或者调查，其监督检查、调查的人员不得少于二人，并应当出示合法证件和监督检查、调查通知书或者其他执法文书。监督检查、调查的人员少于二人或者未出示合法证件和监督检查、调查通知书或者其他执法文书的，被检查、调查的单位和个人有权拒绝。"},{"n":173,"label":"第一百七十三条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构依法履行职责，被检查、调查的单位和个人应当配合，如实提供有关文件和资料，不得拒绝、阻碍和隐瞒。"},{"n":174,"label":"第一百七十四条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构制定的规章、规则和监督管理工作制度应当依法公开。国务院证券监督管理机构依据调查结果，对证券违法行为作出的处罚决定，应当公开。"},{"n":175,"label":"第一百七十五条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构应当与国务院其他金融监督管理机构建立监督管理信息共享机制。国务院证券监督管理机构依法履行职责，进行监督检查或者调查时，有关部门应当予以配合。"},{"n":176,"label":"第一百七十六条","chapter":"第十二章 　证券监督管理机构","text":"对涉嫌证券违法、违规行为，任何单位和个人有权向国务院证券监督管理机构举报。对涉嫌重大违法、违规行为的实名举报线索经查证属实的，国务院证券监督管理机构按照规定给予举报人奖励。国务院证券监督管理机构应当对举报人的身份信息保密。"},{"n":177,"label":"第一百七十七条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构可以和其他国家或者地区的证券监督管理机构建立监督管理合作机制，实施跨境监督管理。境外证券监督管理机构不得在中华人民共和国境内直接进行调查取证等活动。未经国务院证券监督管理机构和国务院有关主管部门同意，任何单位和个人不得擅自向境外提供与证券业务活动有关的文件和资料。"},{"n":178,"label":"第一百七十八条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构依法履行职责，发现证券违法行为涉嫌犯罪的，应当依法将案件移送司法机关处理；发现公职人员涉嫌职务违法或者职务犯罪的，应当依法移送监察机关处理。"},{"n":179,"label":"第一百七十九条","chapter":"第十二章 　证券监督管理机构","text":"国务院证券监督管理机构工作人员必须忠于职守、依法办事、公正廉洁，不得利用职务便利牟取不正当利益，不得泄露所知悉的有关单位和个人的商业秘密。国务院证券监督管理机构工作人员在任职期间，或者离职后在《中华人民共和国公务员法》规定的期限内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。"},{"n":180,"label":"第一百八十条","chapter":"第十三章 　法律责任","text":"违反本法第九条的规定，擅自公开或者变相公开发行证券的，责令停止发行，退还所募资金并加算银行同期存款利息，处以非法所募资金金额百分之五以上百分之五十以下的罚款；对擅自公开或者变相公开发行证券设立的公司，由依法履行监督管理职责的机构或者部门会同县级以上地方人民政府予以取缔。对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。"},{"n":181,"label":"第一百八十一条","chapter":"第十三章 　法律责任","text":"发行人在其公告的证券发行文件中隐瞒重要事实或者编造重大虚假内容，尚未发行证券的，处以二百万元以上二千万元以下的罚款；已经发行证券的，处以非法所募资金金额百分之十以上一倍以下的罚款。对直接负责的主管人员和其他直接责任人员，处以一百万元以上一千万元以下的罚款。发行人的控股股东、实际控制人组织、指使从事前款违法行为的，没收违法所得，并处以违法所得百分之十以上一倍以下的罚款；没有违法所得或者违法所得不足二千万元的，处以二百万元以上二千万元以下的罚款。对直接负责的主管人员和其他直接责任人员，处以一百万元以上一千万元以下的罚款。"},{"n":182,"label":"第一百八十二条","chapter":"第十三章 　法律责任","text":"保荐人出具有虚假记载、误导性陈述或者重大遗漏的保荐书，或者不履行其他法定职责的，责令改正，给予警告，没收业务收入，并处以业务收入一倍以上十倍以下的罚款；没有业务收入或者业务收入不足一百万元的，处以一百万元以上一千万元以下的罚款；情节严重的，并处暂停或者撤销保荐业务许可。对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。"},{"n":183,"label":"第一百八十三条","chapter":"第十三章 　法律责任","text":"证券公司承销或者销售擅自公开发行或者变相公开发行的证券的，责令停止承销或者销售，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款；情节严重的，并处暂停或者撤销相关业务许可。给投资者造成损失的，应当与发行人承担连带赔偿责任。对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。"},{"n":184,"label":"第一百八十四条","chapter":"第十三章 　法律责任","text":"证券公司承销证券违反本法第二十九条规定的，责令改正，给予警告，没收违法所得，可以并处五十万元以上五百万元以下的罚款；情节严重的，暂停或者撤销相关业务许可。对直接负责的主管人员和其他直接责任人员给予警告，可以并处二十万元以上二百万元以下的罚款；情节严重的，并处以五十万元以上五百万元以下的罚款。"},{"n":185,"label":"第一百八十五条","chapter":"第十三章 　法律责任","text":"发行人违反本法第十四条、第十五条的规定擅自改变公开发行证券所募集资金的用途的，责令改正，处以五十万元以上五百万元以下的罚款；对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。发行人的控股股东、实际控制人从事或者组织、指使从事前款违法行为的，给予警告，并处以五十万元以上五百万元以下的罚款；对直接负责的主管人员和其他直接责任人员，处以十万元以上一百万元以下的罚款。"},{"n":186,"label":"第一百八十六条","chapter":"第十三章 　法律责任","text":"违反本法第三十六条的规定，在限制转让期内转让证券，或者转让股票不符合法律、行政法规和国务院证券监督管理机构规定的，责令改正，给予警告，没收违法所得，并处以买卖证券等值以下的罚款。"},{"n":187,"label":"第一百八十七条","chapter":"第十三章 　法律责任","text":"法律、行政法规规定禁止参与股票交易的人员，违反本法第四十条的规定，直接或者以化名、借他人名义持有、买卖股票或者其他具有股权性质的证券的，责令依法处理非法持有的股票、其他具有股权性质的证券，没收违法所得，并处以买卖证券等值以下的罚款；属于国家工作人员的，还应当依法给予处分。"},{"n":188,"label":"第一百八十八条","chapter":"第十三章 　法律责任","text":"证券服务机构及其从业人员，违反本法第四十二条的规定买卖证券的，责令依法处理非法持有的证券，没收违法所得，并处以买卖证券等值以下的罚款。"},{"n":189,"label":"第一百八十九条","chapter":"第十三章 　法律责任","text":"上市公司、股票在国务院批准的其他全国性证券交易场所交易的公司的董事、监事、高级管理人员、持有该公司百分之五以上股份的股东，违反本法第四十四条的规定，买卖该公司股票或者其他具有股权性质的证券的，给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":190,"label":"第一百九十条","chapter":"第十三章 　法律责任","text":"违反本法第四十五条的规定，采取程序化交易影响证券交易所系统安全或者正常交易秩序的，责令改正，并处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":191,"label":"第一百九十一条","chapter":"第十三章 　法律责任","text":"证券交易内幕信息的知情人或者非法获取内幕信息的人违反本法第五十三条的规定从事内幕交易的，责令依法处理非法持有的证券，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。单位从事内幕交易的，还应当对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。国务院证券监督管理机构工作人员从事内幕交易的，从重处罚。违反本法第五十四条的规定，利用未公开信息进行交易的，依照前款的规定处罚。"},{"n":192,"label":"第一百九十二条","chapter":"第十三章 　法律责任","text":"违反本法第五十五条的规定，操纵证券市场的，责令依法处理其非法持有的证券，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款。单位操纵证券市场的，还应当对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。"},{"n":193,"label":"第一百九十三条","chapter":"第十三章 　法律责任","text":"违反本法第五十六条第一款、第三款的规定，编造、传播虚假信息或者误导性信息，扰乱证券市场的，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足二十万元的，处以二十万元以上二百万元以下的罚款。违反本法第五十六条第二款的规定，在证券交易活动中作出虚假陈述或者信息误导的，责令改正，处以二十万元以上二百万元以下的罚款；属于国家工作人员的，还应当依法给予处分。传播媒介及其从事证券市场信息报道的工作人员违反本法第五十六条第三款的规定，从事与其工作职责发生利益冲突的证券买卖的，没收违法所得，并处以买卖证券等值以下的罚款。"},{"n":194,"label":"第一百九十四条","chapter":"第十三章 　法律责任","text":"证券公司及其从业人员违反本法第五十七条的规定，有损害客户利益的行为的，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足十万元的，处以十万元以上一百万元以下的罚款；情节严重的，暂停或者撤销相关业务许可。"},{"n":195,"label":"第一百九十五条","chapter":"第十三章 　法律责任","text":"违反本法第五十八条的规定，出借自己的证券账户或者借用他人的证券账户从事证券交易的，责令改正，给予警告，可以处五十万元以下的罚款。"},{"n":196,"label":"第一百九十六条","chapter":"第十三章 　法律责任","text":"收购人未按照本法规定履行上市公司收购的公告、发出收购要约义务的，责令改正，给予警告，并处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。收购人及其控股股东、实际控制人利用上市公司收购，给被收购公司及其股东造成损失的，应当依法承担赔偿责任。"},{"n":197,"label":"第一百九十七条","chapter":"第十三章 　法律责任","text":"信息披露义务人未按照本法规定报送有关报告或者履行信息披露义务的，责令改正，给予警告，并处以五十万元以上五百万元以下的罚款；对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。发行人的控股股东、实际控制人组织、指使从事上述违法行为，或者隐瞒相关事项导致发生上述情形的，处以五十万元以上五百万元以下的罚款；对直接负责的主管人员和其他直接责任人员，处以二十万元以上二百万元以下的罚款。信息披露义务人报送的报告或者披露的信息有虚假记载、误导性陈述或者重大遗漏的，责令改正，给予警告，并处以一百万元以上一千万元以下的罚款；对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。发行人的控股股东、实际控制人组织、指使从事上述违法行为，或者隐瞒相关事项导致发生上述情形的，处以一百万元以上一千万元以下的罚款；对直接负责的主管人员和其他直接责任人员，处以五十万元以上五百万元以下的罚款。"},{"n":198,"label":"第一百九十八条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第八十八条的规定未履行或者未按照规定履行投资者适当性管理义务的，责令改正，给予警告，并处以十万元以上一百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以下的罚款。"},{"n":199,"label":"第一百九十九条","chapter":"第十三章 　法律责任","text":"违反本法第九十条的规定征集股东权利的，责令改正，给予警告，可以处五十万元以下的罚款。"},{"n":200,"label":"第二百条","chapter":"第十三章 　法律责任","text":"非法开设证券交易场所的，由县级以上人民政府予以取缔，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。证券交易所违反本法第一百零五条的规定，允许非会员直接参与股票的集中交易的，责令改正，可以并处五十万元以下的罚款。"},{"n":201,"label":"第二百零一条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第一百零七条第一款的规定，未对投资者开立账户提供的身份信息进行核对的，责令改正，给予警告，并处以五万元以上五十万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以下的罚款。证券公司违反本法第一百零七条第二款的规定，将投资者的账户提供给他人使用的，责令改正，给予警告，并处以十万元以上一百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以下的罚款。"},{"n":202,"label":"第二百零二条","chapter":"第十三章 　法律责任","text":"违反本法第一百一十八条、第一百二十条第一款、第四款的规定，擅自设立证券公司、非法经营证券业务或者未经批准以证券公司名义开展证券业务活动的，责令改正，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。对擅自设立的证券公司，由国务院证券监督管理机构予以取缔。证券公司违反本法第一百二十条第五款规定提供证券融资融券服务的，没收违法所得，并处以融资融券等值以下的罚款；情节严重的，禁止其在一定期限内从事证券融资融券业务。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":203,"label":"第二百零三条","chapter":"第十三章 　法律责任","text":"提交虚假证明文件或者采取其他欺诈手段骗取证券公司设立许可、业务许可或者重大事项变更核准的，撤销相关许可，并处以一百万元以上一千万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":204,"label":"第二百零四条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第一百二十二条的规定，未经核准变更证券业务范围，变更主要股东或者公司的实际控制人，合并、分立、停业、解散、破产的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款；情节严重的，并处撤销相关业务许可。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":205,"label":"第二百零五条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第一百二十三条第二款的规定，为其股东或者股东的关联人提供融资或者担保的，责令改正，给予警告，并处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。股东有过错的，在按照要求改正前，国务院证券监督管理机构可以限制其股东权利；拒不改正的，可以责令其转让所持证券公司股权。"},{"n":206,"label":"第二百零六条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第一百二十八条的规定，未采取有效隔离措施防范利益冲突，或者未分开办理相关业务、混合操作的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款；情节严重的，并处撤销相关业务许可。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":207,"label":"第二百零七条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第一百二十九条的规定从事证券自营业务的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款；情节严重的，并处撤销相关业务许可或者责令关闭。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":208,"label":"第二百零八条","chapter":"第十三章 　法律责任","text":"违反本法第一百三十一条的规定，将客户的资金和证券归入自有财产，或者挪用客户的资金和证券的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款；情节严重的，并处撤销相关业务许可或者责令关闭。对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。"},{"n":209,"label":"第二百零九条","chapter":"第十三章 　法律责任","text":"证券公司违反本法第一百三十四条第一款的规定接受客户的全权委托买卖证券的，或者违反本法第一百三十五条的规定对客户的收益或者赔偿客户的损失作出承诺的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款；情节严重的，并处撤销相关业务许可。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。证券公司违反本法第一百三十四条第二款的规定，允许他人以证券公司的名义直接参与证券的集中交易的，责令改正，可以并处五十万元以下的罚款。"},{"n":210,"label":"第二百一十条","chapter":"第十三章 　法律责任","text":"证券公司的从业人员违反本法第一百三十六条的规定，私下接受客户委托买卖证券的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得的，处以五十万元以下的罚款。"},{"n":211,"label":"第二百一十一条","chapter":"第十三章 　法律责任","text":"证券公司及其主要股东、实际控制人违反本法第一百三十八条的规定，未报送、提供信息和资料，或者报送、提供的信息和资料有虚假记载、误导性陈述或者重大遗漏的，责令改正，给予警告，并处以一百万元以下的罚款；情节严重的，并处撤销相关业务许可。对直接负责的主管人员和其他直接责任人员，给予警告，并处以五十万元以下的罚款。"},{"n":212,"label":"第二百一十二条","chapter":"第十三章 　法律责任","text":"违反本法第一百四十五条的规定，擅自设立证券登记结算机构的，由国务院证券监督管理机构予以取缔，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":213,"label":"第二百一十三条","chapter":"第十三章 　法律责任","text":"证券投资咨询机构违反本法第一百六十条第二款的规定擅自从事证券服务业务，或者从事证券服务业务有本法第一百六十一条规定行为的，责令改正，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员，给予警告，并处以二十万元以上二百万元以下的罚款。会计师事务所、律师事务所以及从事资产评估、资信评级、财务顾问、信息技术系统服务的机构违反本法第一百六十条第二款的规定，从事证券服务业务未报备案的，责令改正，可以处二十万元以下的罚款。证券服务机构违反本法第一百六十三条的规定，未勤勉尽责，所制作、出具的文件有虚假记载、误导性陈述或者重大遗漏的，责令改正，没收业务收入，并处以业务收入一倍以上十倍以下的罚款，没有业务收入或者业务收入不足五十万元的，处以五十万元以上五百万元以下的罚款；情节严重的，并处暂停或者禁止从事证券服务业务。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":214,"label":"第二百一十四条","chapter":"第十三章 　法律责任","text":"发行人、证券登记结算机构、证券公司、证券服务机构未按照规定保存有关文件和资料的，责令改正，给予警告，并处以十万元以上一百万元以下的罚款；泄露、隐匿、伪造、篡改或者毁损有关文件和资料的，给予警告，并处以二十万元以上二百万元以下的罚款；情节严重的，处以五十万元以上五百万元以下的罚款，并处暂停、撤销相关业务许可或者禁止从事相关业务。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":215,"label":"第二百一十五条","chapter":"第十三章 　法律责任","text":"国务院证券监督管理机构依法将有关市场主体遵守本法的情况纳入证券市场诚信档案。"},{"n":216,"label":"第二百一十六条","chapter":"第十三章 　法律责任","text":"国务院证券监督管理机构或者国务院授权的部门有下列情形之一的，对直接负责的主管人员和其他直接责任人员，依法给予处分：\n（一）对不符合本法规定的发行证券、设立证券公司等申请予以核准、注册、批准的；\n（二）违反本法规定采取现场检查、调查取证、查询、冻结或者查封等措施的；\n（三）违反本法规定对有关机构和人员采取监督管理措施的；\n（四）违反本法规定对有关机构和人员实施行政处罚的；\n（五）其他不依法履行职责的行为。"},{"n":217,"label":"第二百一十七条","chapter":"第十三章 　法律责任","text":"国务院证券监督管理机构或者国务院授权的部门的工作人员，不履行本法规定的职责，滥用职权、玩忽职守，利用职务便利牟取不正当利益，或者泄露所知悉的有关单位和个人的商业秘密的，依法追究法律责任。"},{"n":218,"label":"第二百一十八条","chapter":"第十三章 　法律责任","text":"拒绝、阻碍证券监督管理机构及其工作人员依法行使监督检查、调查职权，由证券监督管理机构责令改正，处以十万元以上一百万元以下的罚款，并由公安机关依法给予治安管理处罚。"},{"n":219,"label":"第二百一十九条","chapter":"第十三章 　法律责任","text":"违反本法规定，构成犯罪的，依法追究刑事责任。"},{"n":220,"label":"第二百二十条","chapter":"第十三章 　法律责任","text":"违反本法规定，应当承担民事赔偿责任和缴纳罚款、罚金、违法所得，违法行为人的财产不足以支付的，优先用于承担民事赔偿责任。"},{"n":221,"label":"第二百二十一条","chapter":"第十三章 　法律责任","text":"违反法律、行政法规或者国务院证券监督管理机构的有关规定，情节严重的，国务院证券监督管理机构可以对有关责任人员采取证券市场禁入的措施。前款所称证券市场禁入，是指在一定期限内直至终身不得从事证券业务、证券服务业务，不得担任证券发行人的董事、监事、高级管理人员，或者一定期限内不得在证券交易所、国务院批准的其他全国性证券交易场所交易证券的制度。"},{"n":222,"label":"第二百二十二条","chapter":"第十三章 　法律责任","text":"依照本法收缴的罚款和没收的违法所得，全部上缴国库。"},{"n":223,"label":"第二百二十三条","chapter":"第十三章 　法律责任","text":"当事人对证券监督管理机构或者国务院授权的部门的处罚决定不服的，可以依法申请行政复议，或者依法直接向人民法院提起诉讼。"},{"n":224,"label":"第二百二十四条","chapter":"第十四章 　附则","text":"境内企业直接或者间接到境外发行证券或者将其证券在境外上市交易，应当符合国务院的有关规定。"},{"n":225,"label":"第二百二十五条","chapter":"第十四章 　附则","text":"境内公司股票以外币认购和交易的，具体办法由国务院另行规定。"},{"n":226,"label":"第二百二十六条","chapter":"第十四章 　附则","text":"本法自2020年3月1日起施行。"}],"source":"https://www.csrc.gov.cn/jiangxi/c105769/c7463999/7463999/files/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E8%AF%81%E5%88%B8%E6%B3%95%282019%E4%BF%AE%E8%AE%A2%29.pdf","textSource":"https://www.csrc.gov.cn/jiangxi/c105769/c7463999/7463999/files/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E8%AF%81%E5%88%B8%E6%B3%95%282019%E4%BF%AE%E8%AE%A2%29.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"291953767f333d669c53e644505a0f0b9396758567f3f36a594e884c5cf5bee4"},{"id":"futures","title":"中华人民共和国期货和衍生品法","level":"法律","issuer":"全国人大常委会","version":"2022年通过","effective":"2022-08-01","scope":"证券","topics":["交易后处理","保证金","衍生品"],"overview":"期货与衍生品交易的基础法律。基金作为交易者，与期货经营机构、交易所和结算机构的义务不同。","practice":"把账户、主协议、交易确认、保证金、结算和应急管理串起来；具体交易所规则及合同需按产品补齐。","priority":[2,18,21,32,35,36,52],"articles":[{"n":1,"label":"第一条","chapter":"第一章 总则","text":"为了规范期货交易和衍生品交易行为，保障各方合法权益，维护市场秩序和社会公共利益，促进期货市场和衍生品市场服务国民经济，防范化解金融风险，维护国家经济安全，制定本法。"},{"n":2,"label":"第二条","chapter":"第一章 总则","text":"在中华人民共和国境内，期货交易和衍生品交易及相关活动，适用本法。在中华人民共和国境外的期货交易和衍生品交易及相关活动，扰乱中华人民共和国境内市场秩序，损害境内交易者合法权益的，依照本法有关规定处理并追究法律责任。"},{"n":3,"label":"第三条","chapter":"第一章 总则","text":"本法所称期货交易，是指以期货合约或者标准化期权合约为交易标的的交易活动。本法所称衍生品交易，是指期货交易以外的，以互换合约、远期合约和非标准化期权合约及其组合为交易标的的交易活动。本法所称期货合约，是指期货交易场所统一制定的、约定在将来某一特定的时间和地点交割一定数量标的物的标准化合约。本法所称期权合约，是指约定买方有权在将来某一时间以特定价格买入或者卖出约定标的物（包括期货合约）的标准化或非标准化合约。本法所称互换合约，是指约定在将来某一特定时间内相互交换特定标的物的金融合约。本法所称远期合约，是指期货合约以外的，约定在将来某一特定的时间和地点交割一定数量标的物的金融合约。"},{"n":4,"label":"第四条","chapter":"第一章 总则","text":"国家支持期货市场健康发展，发挥发现价格、管理风险、配置资源的功能。国家鼓励利用期货市场和衍生品市场从事套期保值等风险管理活动。国家采取措施推动农产品期货市场和衍生品市场发展，引导国内农产品生产经营。本法所称套期保值，是指交易者为管理因其资产、负债等价值变化产生的风险而达成与上述资产、负债等基本吻合的期货交易和衍生品交易的活动。"},{"n":5,"label":"第五条","chapter":"第一章 总则","text":"期货市场和衍生品市场应当建立和完善风险的监测监控与化解处置制度机制，依法限制过度投机行为，防范市场系统性风险。"},{"n":6,"label":"第六条","chapter":"第一章 总则","text":"期货交易和衍生品交易活动，应当遵守法律、行政法规和国家有关规定，遵循公开、公平、公正的原则，禁止欺诈、操纵市场和内幕交易的行为。"},{"n":7,"label":"第七条","chapter":"第一章 总则","text":"参与期货交易和衍生品交易活动的各方具有平等的法律地位，应当遵守自愿、有偿、诚实信用的原则。"},{"n":8,"label":"第八条","chapter":"第一章 总则","text":"国务院期货监督管理机构依法对全国期货市场实行集中统一监督管理。国务院对利率、汇率期货的监督管理另有规定的，适用其规定。衍生品市场由国务院期货监督管理机构或者国务院授权的部门按照职责分工实行监督管理。"},{"n":9,"label":"第九条","chapter":"第一章 总则","text":"期货和衍生品行业协会依法实行自律管理。"},{"n":10,"label":"第十条","chapter":"第一章 总则","text":"国家审计机关依法对期货经营机构、期货交易场所、期货结算机构、国务院期货监督管理机构进行审计监督。"},{"n":11,"label":"第十一条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易应当在依法设立的期货交易所或者国务院期货监督管理机构依法批准组织开展期货交易的其他期货交易场所（以下统称期货交易场所），采用公开的集中交易方式或者国务院期货监督管理机构批准的其他方式进行。禁止在期货交易场所之外进行期货交易。衍生品交易，可以采用协议交易或者国务院规定的其他交易方式进行。"},{"n":12,"label":"第十二条","chapter":"第二章 期货交易和衍生品交易","text":"任何单位和个人不得操纵期货市场或者衍生品市场。禁止以下列手段操纵期货市场，影响或者意图影响期货交易价格或者期货交易量：\n（一）单独或者合谋，集中资金优势、持仓优势或者利用信息优势联合或者连续买卖合约；\n（二）与他人串通，以事先约定的时间、价格和方式相互进行期货交易；\n（三）在自己实际控制的账户之间进行期货交易；\n（四）利用虚假或者不确定的重大信息，诱导交易者进行期货交易；\n（五）不以成交为目的，频繁或者大量申报并撤销申报；\n（六）对相关期货交易或者合约标的物的交易作出公开评价、预测或者投资建议，并进行反向操作或者相关操作；\n（七）为影响期货市场行情囤积现货；\n（八）在交割月或者临近交割月，利用不正当手段规避持仓限额，形成持仓优势；\n（九）利用在相关市场的活动操纵期货市场；\n（十）操纵期货市场的其他手段。"},{"n":13,"label":"第十三条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易和衍生品交易的内幕信息的知情人和非法获取内幕信息的人，在内幕信息公开前不得从事相关期货交易或者衍生品交易，明示、暗示他人从事与内幕信息有关的期货交易或者衍生品交易，或者泄露内幕信息。"},{"n":14,"label":"第十四条","chapter":"第二章 期货交易和衍生品交易","text":"本法所称内幕信息，是指可能对期货交易或者衍生品交易的交易价格产生重大影响的尚未公开的信息。期货交易的内幕信息包括：\n（一）国务院期货监督管理机构以及其他相关部门正在制定或者尚未发布的对期货交易价格可能产生重大影响的政策、信息或者数据；\n（二）期货交易场所、期货结算机构作出的可能对期货交易价格产生重大影响的决定；\n（三）期货交易场所会员、交易者的资金和交易动向；\n（四）相关市场中的重大异常交易信息；\n（五）国务院期货监督管理机构规定的对期货交易价格有重大影响的其他信息。"},{"n":15,"label":"第十五条","chapter":"第二章 期货交易和衍生品交易","text":"本法所称内幕信息的知情人，是指由于经营地位、管理地位、监督地位或者职务便利等，能够接触或者获得内幕信息的单位和个人。期货交易的内幕信息的知情人包括：\n（一）期货经营机构、期货交易场所、期货结算机构、期货服务机构的有关人员；\n（二）国务院期货监督管理机构和其他有关部门的工作人员；\n（三）国务院期货监督管理机构规定的可以获取内幕信息的其他单位和个人。"},{"n":16,"label":"第十六条","chapter":"第二章 期货交易和衍生品交易","text":"禁止任何单位和个人编造、传播虚假信息或者误导性信息，扰乱期货市场和衍生品市场。禁止期货经营机构、期货交易场所、期货结算机构、期货服务机构及其从业人员，组织、开展衍生品交易的场所、机构及其从业人员，期货和衍生品行业协会、国务院期货监督管理机构、国务院授权的部门及其工作人员，在期货交易和衍生品交易及相关活动中作出虚假陈述或者信息误导。各种传播媒介传播期货市场和衍生品市场信息应当真实、客观，禁止误导。传播媒介及其从事期货市场和衍生品市场信息报道的工作人员不得从事与其工作职责发生利益冲突的期货交易和衍生品交易及相关活动。第二节期货交易"},{"n":17,"label":"第十七条","chapter":"第二章 期货交易和衍生品交易","text":"期货合约品种和标准化期权合约品种的上市应当符合国务院期货监督管理机构的规定，由期货交易场所依法报经国务院期货监督管理机构注册。期货合约品种和标准化期权合约品种的中止上市、恢复上市、终止上市应当符合国务院期货监督管理机构的规定，由期货交易场所决定并向国务院期货监督管理机构备案。期货合约品种和标准化期权合约品种应当具有经济价值，合约不易被操纵，符合社会公共利益。"},{"n":18,"label":"第十八条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易实行账户实名制。交易者进行期货交易的，应当持有证明身份的合法证件，以本人名义申请开立账户。任何单位和个人不得违反规定，出借自己的期货账户或者借用他人的期货账户从事期货交易。"},{"n":19,"label":"第十九条","chapter":"第二章 期货交易和衍生品交易","text":"在期货交易场所进行期货交易的，应当是期货交易场所会员或者符合国务院期货监督管理机构规定的其他参与者。"},{"n":20,"label":"第二十条","chapter":"第二章 期货交易和衍生品交易","text":"交易者委托期货经营机构进行交易的，可以通过书面、电话、自助终端、网络等方式下达交易指令。交易指令应当明确、具体、全面。"},{"n":21,"label":"第二十一条","chapter":"第二章 期货交易和衍生品交易","text":"通过计算机程序自动生成或者下达交易指令进行程序化交易的，应当符合国务院期货监督管理机构的规定，并向期货交易场所报告，不得影响期货交易场所系统安全或者正常交易秩序。"},{"n":22,"label":"第二十二条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易实行保证金制度，期货结算机构向结算参与人收取保证金，结算参与人向交易者收取保证金。保证金用于结算和履约保障。保证金的形式包括现金，国债、股票、基金份额、标准仓单等流动性强的有价证券，以及国务院期货监督管理机构规定的其他财产。以有价证券等作为保证金的，可以依法通过质押等具有履约保障功能的方式进行。期货结算机构、结算参与人收取的保证金的形式、比例等应当符合国务院期货监督管理机构的规定。交易者进行标准化期权合约交易的，卖方应当缴纳保证金，买方应当支付权利金。前款所称权利金是指买方支付的用于购买标准化期权合约的资金。"},{"n":23,"label":"第二十三条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易实行持仓限额制度，防范合约持仓过度集中的风险。从事套期保值等风险管理活动的，可以申请持仓限额豁免。持仓限额、套期保值的管理办法由国务院期货监督管理机构制定。"},{"n":24,"label":"第二十四条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易实行交易者实际控制关系报备管理制度。交易者应当按照国务院期货监督管理机构的规定向期货经营机构或者期货交易场所报备实际控制关系。"},{"n":25,"label":"第二十五条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易的收费应当合理，收费项目、收费标准和管理办法应当公开。"},{"n":26,"label":"第二十六条","chapter":"第二章 期货交易和衍生品交易","text":"依照期货交易场所依法制定的业务规则进行的交易，不得改变其交易结果，本法第八十九条第二款规定的除外。"},{"n":27,"label":"第二十七条","chapter":"第二章 期货交易和衍生品交易","text":"期货交易场所会员和交易者应当按照国务院期货监督管理机构的规定，报告有关交易、持仓、保证金等重大事项。"},{"n":28,"label":"第二十八条","chapter":"第二章 期货交易和衍生品交易","text":"任何单位和个人不得违规使用信贷资金、财政资金进行期货交易。"},{"n":29,"label":"第二十九条","chapter":"第二章 期货交易和衍生品交易","text":"期货经营机构、期货交易场所、期货结算机构、期货服务机构等机构及其从业人员对发现的禁止的交易行为，应当及时向国务院期货监督管理机构报告。第三节衍生品交易"},{"n":30,"label":"第三十条","chapter":"第二章 期货交易和衍生品交易","text":"依法设立的场所，经国务院授权的部门或者国务院期货监督管理机构审批，可以组织开展衍生品交易。组织开展衍生品交易的场所制定的交易规则，应当公平保护交易参与各方合法权益和防范市场风险，并报国务院授权的部门或者国务院期货监督管理机构批准。"},{"n":31,"label":"第三十一条","chapter":"第二章 期货交易和衍生品交易","text":"金融机构开展衍生品交易业务，应当依法经过批准或者核准，履行交易者适当性管理义务，并应当遵守国家有关监督管理规定。"},{"n":32,"label":"第三十二条","chapter":"第二章 期货交易和衍生品交易","text":"衍生品交易采用主协议方式的，主协议、主协议项下的全部补充协议以及交易双方就各项具体交易作出的约定等，共同构成交易双方之间一个完整的单一协议，具有法律约束力。"},{"n":33,"label":"第三十三条","chapter":"第二章 期货交易和衍生品交易","text":"本法第三十二条规定的主协议等合同范本，应当按照国务院授权的部门或者国务院期货监督管理机构的规定报送备案。"},{"n":34,"label":"第三十四条","chapter":"第二章 期货交易和衍生品交易","text":"进行衍生品交易，可以依法通过质押等方式提供履约保障。"},{"n":35,"label":"第三十五条","chapter":"第二章 期货交易和衍生品交易","text":"依法采用主协议方式从事衍生品交易的，发生约定的情形时，可以依照协议约定终止交易，并按净额对协议项下的全部交易盈亏进行结算。依照前款规定进行的净额结算，不因交易任何一方依法进入破产程序而中止、无效或者撤销。"},{"n":36,"label":"第三十六条","chapter":"第二章 期货交易和衍生品交易","text":"国务院授权的部门、国务院期货监督管理机构应当建立衍生品交易报告库，对衍生品交易标的、规模、对手方等信息进行集中收集、保存、分析和管理，并按照规定及时向市场披露有关信息。具体办法由国务院授权的部门、国务院期货监督管理机构规定。"},{"n":37,"label":"第三十七条","chapter":"第二章 期货交易和衍生品交易","text":"衍生品交易，由国务院授权的部门或者国务院期货监督管理机构批准的结算机构作为中央对手方进行集中结算的，可以依法进行终止净额结算；结算财产应当优先用于结算和交割，不得被查封、冻结、扣押或者强制执行；在结算和交割完成前，任何人不得动用。依法进行的集中结算，不因参与结算的任何一方依法进入破产程序而中止、无效或者撤销。"},{"n":38,"label":"第三十八条","chapter":"第二章 期货交易和衍生品交易","text":"对衍生品交易及相关活动进行规范和监督管理的具体办法，由国务院依照本法的原则规定。"},{"n":39,"label":"第三十九条","chapter":"第三章 期货结算与交割","text":"期货交易实行当日无负债结算制度。在期货交易场所规定的时间，期货结算机构应当在当日按照结算价对结算参与人进行结算；结算参与人应当根据期货结算机构的结算结果对交易者进行结算。结算结果应当在当日及时通知结算参与人和交易者。"},{"n":40,"label":"第四十条","chapter":"第三章 期货结算与交割","text":"期货结算机构、结算参与人收取的保证金、权利金等，应当与其自有资金分开，按照国务院期货监督管理机构的规定，在期货保证金存管机构专户存放，分别管理，禁止违规挪用。"},{"n":41,"label":"第四十一条","chapter":"第三章 期货结算与交割","text":"结算参与人的保证金不符合期货结算机构业务规则规定标准的，期货结算机构应当按照业务规则的规定通知结算参与人在规定时间内追加保证金或者自行平仓；结算参与人未在规定时间内追加保证金或者自行平仓的，通知期货交易场所强行平仓。交易者的保证金不符合结算参与人与交易者约定标准的，结算参与人应当按照约定通知交易者在约定时间内追加保证金或者自行平仓；交易者未在约定时间内追加保证金或者自行平仓的，按照约定强行平仓。以有价证券等作为保证金，期货结算机构、结算参与人按照前两款规定强行平仓的，可以对有价证券等进行处置。"},{"n":42,"label":"第四十二条","chapter":"第三章 期货结算与交割","text":"结算参与人在结算过程中违约的，期货结算机构按照业务规则动用结算参与人的保证金、结算担保金以及结算机构的风险准备金、自有资金等完成结算；期货结算机构以其风险准备金、自有资金等完成结算的，可以依法对该结算参与人进行追偿。交易者在结算过程中违约的，其委托的结算参与人按照合同约定动用该交易者的保证金以及结算参与人的风险准备金和自有资金完成结算；结算参与人以其风险准备金和自有资金完成结算的，可以依法对该交易者进行追偿。本法所称结算担保金，是指结算参与人以自有资金向期货结算机构缴纳的，用于担保履约的资金。"},{"n":43,"label":"第四十三条","chapter":"第三章 期货结算与交割","text":"期货结算机构依照其业务规则收取和提取的保证金、权利金、结算担保金、风险准备金等资产，应当优先用于结算和交割，不得被查封、冻结、扣押或者强制执行。在结算和交割完成之前，任何人不得动用用于担保履约和交割的保证金、进入交割环节的交割财产。依法进行的结算和交割，不因参与结算的任何一方依法进入破产程序而中止、无效或者撤销。"},{"n":44,"label":"第四十四条","chapter":"第三章 期货结算与交割","text":"期货合约到期时，交易者应当通过实物交割或者现金交割，了结到期未平仓合约。在标准化期权合约规定的时间，合约的买方有权以约定的价格买入或者卖出标的物，或者按照约定进行现金差价结算，合约的卖方应当按照约定履行相应的义务。标准化期权合约的行权，由期货结算机构组织进行。"},{"n":45,"label":"第四十五条","chapter":"第三章 期货结算与交割","text":"期货合约采取实物交割的，由期货结算机构负责组织货款与标准仓单等合约标的物权利凭证的交付。期货合约采取现金交割的，由期货结算机构以交割结算价为基础，划付持仓双方的盈亏款项。本法所称标准仓单，是指交割库开具并经期货交易场所登记的标准化提货凭证。"},{"n":46,"label":"第四十六条","chapter":"第三章 期货结算与交割","text":"期货交易的实物交割在期货交易场所指定的交割库、交割港口或者其他符合期货交易场所要求的地点进行。实物交割不得限制交割总量。采用标准仓单以外的单据凭证或者其他方式进行实物交割的，期货交易场所应当明确规定交割各方的权利和义务。"},{"n":47,"label":"第四十七条","chapter":"第三章 期货结算与交割","text":"结算参与人在交割过程中违约的，期货结算机构有权对结算参与人的标准仓单等合约标的物权利凭证进行处置。交易者在交割过程中违约的，结算参与人有权对交易者的标准仓单等合约标的物权利凭证进行处置。"},{"n":48,"label":"第四十八条","chapter":"第三章 期货结算与交割","text":"不符合结算参与人条件的期货经营机构可以委托结算参与人代为其客户进行结算。不符合结算参与人条件的期货经营机构与结算参与人、交易者之间的权利义务关系，参照本章关于结算参与人与交易者之间权利义务的规定执行。"},{"n":49,"label":"第四十九条","chapter":"第四章 期货交易者","text":"期货交易者是指依照本法从事期货交易，承担交易结果的自然人、法人和非法人组织。期货交易者从事期货交易，除国务院期货监督管理机构另有规定外，应当委托期货经营机构进行。"},{"n":50,"label":"第五十条","chapter":"第四章 期货交易者","text":"期货经营机构向交易者提供服务时，应当按照规定充分了解交易者的基本情况、财产状况、金融资产状况、交易知识和经验、专业能力等相关信息；如实说明服务的重要内容，充分揭示交易风险；提供与交易者上述状况相匹配的服务。交易者在参与期货交易和接受服务时，应当按照期货经营机构明示的要求提供前款所列真实信息。拒绝提供或者未按照要求提供信息的，期货经营机构应当告知其后果，并按照规定拒绝提供服务。期货经营机构违反第一款规定导致交易者损失的，应当承担相应的赔偿责任。"},{"n":51,"label":"第五十一条","chapter":"第四章 期货交易者","text":"根据财产状况、金融资产状况、交易知识和经验、专业能力等因素，交易者可以分为普通交易者和专业交易者。专业交易者的标准由国务院期货监督管理机构规定。普通交易者与期货经营机构发生纠纷的，期货经营机构应当证明其行为符合法律、行政法规以及国务院期货监督管理机构的规定，不存在误导、欺诈等情形。期货经营机构不能证明的，应当承担相应的赔偿责任。"},{"n":52,"label":"第五十二条","chapter":"第四章 期货交易者","text":"参与期货交易的法人和非法人组织，应当建立与其交易合约类型、规模、目的等相适应的内部控制制度和风险控制制度。"},{"n":53,"label":"第五十三条","chapter":"第四章 期货交易者","text":"期货经营机构、期货交易场所、期货结算机构的从业人员，国务院期货监督管理机构、期货业协会的工作人员，以及法律、行政法规和国务院期货监督管理机构规定禁止参与期货交易的其他人员，不得进行期货交易。"},{"n":54,"label":"第五十四条","chapter":"第四章 期货交易者","text":"交易者有权查询其委托记录、交易记录、保证金余额、与其接受服务有关的其他重要信息。"},{"n":55,"label":"第五十五条","chapter":"第四章 期货交易者","text":"期货经营机构、期货交易场所、期货结算机构、期货服务机构及其工作人员应当依法为交易者的信息保密，不得非法买卖、提供或者公开交易者的信息。期货经营机构、期货交易场所、期货结算机构、期货服务机构及其工作人员不得泄露所知悉的商业秘密。"},{"n":56,"label":"第五十六条","chapter":"第四章 期货交易者","text":"交易者与期货经营机构等发生纠纷的，双方可以向行业协会等申请调解。普通交易者与期货经营机构发生期货业务纠纷并提出调解请求的，期货经营机构不得拒绝。"},{"n":57,"label":"第五十七条","chapter":"第四章 期货交易者","text":"交易者提起操纵市场、内幕交易等期货民事赔偿诉讼时，诉讼标的是同一种类，且当事人一方人数众多的，可以依法推选代表人进行诉讼。"},{"n":58,"label":"第五十八条","chapter":"第四章 期货交易者","text":"国家设立期货交易者保障基金。期货交易者保障基金的筹集、管理和使用的具体办法，由国务院期货监督管理机构会同国务院财政部门制定。"},{"n":59,"label":"第五十九条","chapter":"第五章 期货经营机构","text":"期货经营机构是指依照《中华人民共和国公司法》和本法设立的期货公司以及国务院期货监督管理机构核准从事期货业务的其他机构。"},{"n":60,"label":"第六十条","chapter":"第五章 期货经营机构","text":"设立期货公司，应当具备下列条件，并经国务院期货监督管理机构核准：\n（一）有符合法律、行政法规规定的公司章程；\n（二）主要股东及实际控制人具有良好的财务状况和诚信记录，净资产不低于国务院期货监督管理机构规定的标准，最近三年无重大违法违规记录；\n（三）注册资本不低于人民币一亿元，且应当为实缴货币资本；\n（四）从事期货业务的人员符合本法规定的条件，董事、监事和高级管理人员具备相应的任职条件；\n（五）有良好的公司治理结构、健全的风险管理制度和完善的内部控制制度；\n（六）有合格的经营场所、业务设施和信息技术系统；\n（七）法律、行政法规和国务院期货监督管理机构规定的其他条件。国务院期货监督管理机构根据审慎监管原则和各项业务的风险程度，可以提高注册资本最低限额。国务院期货监督管理机构应当自受理期货公司设立申请之日起六个月内依照法定条件、法定程序和审慎监管原则进行审查，作出核准或者不予核准的决定，并通知申请人；不予核准的，应当说明理由。"},{"n":61,"label":"第六十一条","chapter":"第五章 期货经营机构","text":"期货公司应当在其名称中标明“期货”字样，国务院期货监督管理机构另有规定的除外。"},{"n":62,"label":"第六十二条","chapter":"第五章 期货经营机构","text":"期货公司办理下列事项，应当经国务院期货监督管理机构核准：\n（一）合并、分立、停业、解散或者申请破产；\n（二）变更主要股东或者公司的实际控制人；\n（三）变更注册资本且调整股权结构；\n（四）变更业务范围；\n（五）国务院期货监督管理机构规定的其他重大事项。前款第三项、第五项所列事项，国务院期货监督管理机构应当自受理申请之日起二十日内作出核准或者不予核准的决定；前款所列其他事项，国务院期货监督管理机构应当自受理申请之日起六十日内作出核准或者不予核准的决定。"},{"n":63,"label":"第六十三条","chapter":"第五章 期货经营机构","text":"期货公司经国务院期货监督管理机构核准可以从事下列期货业务：\n（一）期货经纪；\n（二）期货交易咨询；\n（三）期货做市交易；\n（四）其他期货业务。期货公司从事资产管理业务的，应当符合《中华人民共和国证券投资基金法》等法律、行政法规的规定。未经国务院期货监督管理机构核准，任何单位和个人不得设立或者变相设立期货公司，经营或者变相经营期货经纪业务、期货交易咨询业务，也不得以经营为目的使用“期货”、“期权”或者其他可能产生混淆或者误导的名称。"},{"n":64,"label":"第六十四条","chapter":"第五章 期货经营机构","text":"期货公司的董事、监事、高级管理人员，应当正直诚实、品行良好，熟悉期货法律、行政法规，具有履行职责所需的经营管理能力。期货公司任免董事、监事、高级管理人员，应当报国务院期货监督管理机构备案。有下列情形之一的，不得担任期货公司的董事、监事、高级管理人员：\n（一）存在《中华人民共和国公司法》规定的不得担任公司董事、监事和高级管理人员的情形；\n（二）因违法行为或者违纪行为被解除职务的期货经营机构的董事、监事、高级管理人员，或者期货交易场所、期货结算机构的负责人，自被解除职务之日起未逾五年；\n（三）因违法行为或者违纪行为被吊销执业证书或者被取消资格的注册会计师、律师或者其他期货服务机构的专业人员，自被吊销执业证书或者被取消资格之日起未逾五年。"},{"n":65,"label":"第六十五条","chapter":"第五章 期货经营机构","text":"期货经营机构应当依法经营，勤勉尽责，诚实守信。期货经营机构应当建立健全内部控制制度，采取有效隔离措施，防范经营机构与客户之间、不同客户之间的利益冲突。期货经营机构应当将其期货经纪业务、期货做市交易业务、资产管理业务和其他相关业务分开办理，不得混合操作。期货经营机构应当依法建立并执行反洗钱制度。"},{"n":66,"label":"第六十六条","chapter":"第五章 期货经营机构","text":"期货经营机构接受交易者委托为其进行期货交易，应当签订书面委托合同，以自己的名义为交易者进行期货交易，交易结果由交易者承担。期货经营机构从事经纪业务，不得接受交易者的全权委托。"},{"n":67,"label":"第六十七条","chapter":"第五章 期货经营机构","text":"期货经营机构从事资产管理业务，接受客户委托，运用客户资产进行投资的，应当公平对待所管理的不同客户资产，不得违背受托义务。"},{"n":68,"label":"第六十八条","chapter":"第五章 期货经营机构","text":"期货经营机构不得违反规定为其股东、实际控制人或者股东、实际控制人的关联人提供融资或者担保，不得违反规定对外担保。"},{"n":69,"label":"第六十九条","chapter":"第五章 期货经营机构","text":"期货经营机构从事期货业务的人员应当正直诚实、品行良好，具备从事期货业务所需的专业能力。期货经营机构从事期货业务的人员不得私下接受客户委托从事期货交易。期货经营机构从事期货业务的人员在从事期货业务活动中，执行所属的期货经营机构的指令或者利用职务违反期货交易规则的，由所属的期货经营机构承担全部责任。"},{"n":70,"label":"第七十条","chapter":"第五章 期货经营机构","text":"国务院期货监督管理机构应当制定期货经营机构持续性经营规则，对期货经营机构及其分支机构的经营条件、风险管理、内部控制、保证金存管、合规管理、风险监管指标、关联交易等方面作出规定。期货经营机构应当符合持续性经营规则。"},{"n":71,"label":"第七十一条","chapter":"第五章 期货经营机构","text":"期货经营机构应当按照规定向国务院期货监督管理机构报送业务、财务等经营管理信息和资料。国务院期货监督管理机构有权要求期货经营机构及其主要股东、实际控制人、其他关联人在指定的期限内提供有关信息、资料。期货经营机构及其主要股东、实际控制人或者其他关联人向国务院期货监督管理机构报送或者提供的信息、资料，应当真实、准确、完整。"},{"n":72,"label":"第七十二条","chapter":"第五章 期货经营机构","text":"期货经营机构涉及重大诉讼、仲裁，股权被冻结或者用于担保，以及发生其他重大事件时，应当自该事件发生之日起五日内向国务院期货监督管理机构提交书面报告。期货经营机构的控股股东或者实际控制人应当配合期货经营机构履行前款规定的义务。"},{"n":73,"label":"第七十三条","chapter":"第五章 期货经营机构","text":"期货经营机构不符合持续性经营规则或者出现经营风险的，国务院期货监督管理机构应当责令其限期改正；期货经营机构逾期未改正的，或者其行为严重危及该期货经营机构的稳健运行、损害交易者合法权益的，或者涉嫌严重违法违规正在被国务院期货监督管理机构调查的，国务院期货监督管理机构可以区别情形，对其采取下列措施：\n（一）限制或者暂停部分业务；\n（二）停止核准新增业务；\n（三）限制分配红利，限制向董事、监事、高级管理人员支付报酬、提供福利；\n（四）限制转让财产或者在财产上设定其他权利；\n（五）责令更换董事、监事、高级管理人员或者有关业务部门、分支机构的负责人员，或者限制其权利；\n（六）限制期货经营机构自有资金或者风险准备金的调拨和使用；\n（七）认定负有责任的董事、监事、高级管理人员为不适当人选；\n（八）责令负有责任的股东转让股权，限制负有责任的股东行使股东权利。对经过整改符合有关法律、行政法规规定以及持续性经营规则要求的期货经营机构，国务院期货监督管理机构应当自验收完毕之日起三日内解除对其采取的有关措施。对经过整改仍未达到持续性经营规则要求，严重影响正常经营的期货经营机构，国务院期货监督管理机构有权撤销其部分或者全部期货业务许可、关闭其部分或者全部分支机构。"},{"n":74,"label":"第七十四条","chapter":"第五章 期货经营机构","text":"期货经营机构违法经营或者出现重大风险，严重危害期货市场秩序、损害交易者利益的，国务院期货监督管理机构可以对该期货经营机构采取责令停业整顿、指定其他机构托管或者接管等监督管理措施。期货经营机构有前款所列情形，经国务院期货监督管理机构批准，可以对该期货经营机构直接负责的董事、监事、高级管理人员和其他直接责任人员采取以下措施：\n（一）决定并通知出境入境管理机关依法阻止其出境；\n（二）申请司法机关禁止其转移、转让或者以其他方式处分财产，或者在财产上设定其他权利。"},{"n":75,"label":"第七十五条","chapter":"第五章 期货经营机构","text":"期货经营机构的股东有虚假出资、抽逃出资行为的，国务院期货监督管理机构应当责令其限期改正，并可责令其转让所持期货经营机构的股权。在股东依照前款规定的要求改正违法行为、转让所持期货经营机构的股权前，国务院期货监督管理机构可以限制其股东权利。"},{"n":76,"label":"第七十六条","chapter":"第五章 期货经营机构","text":"期货经营机构有下列情形之一的，国务院期货监督管理机构应当依法办理相关业务许可证注销手续：\n（一）营业执照被依法吊销；\n（二）成立后无正当理由超过三个月未开始营业，或者开业后无正当理由停业连续三个月以上；\n（三）主动提出注销申请；\n（四）《中华人民共和国行政许可法》和国务院期货监督管理机构规定应当注销行政许可的其他情形。期货经营机构在注销相关业务许可证前，应当结清相关期货业务，并依法返还交易者的保证金和其他资产。"},{"n":77,"label":"第七十七条","chapter":"第五章 期货经营机构","text":"国务院期货监督管理机构认为必要时，可以委托期货服务机构对期货经营机构的财务状况、内部控制状况、资产价值进行审计或者评估。具体办法由国务院期货监督管理机构会同有关主管部门制定。"},{"n":78,"label":"第七十八条","chapter":"第五章 期货经营机构","text":"禁止期货经营机构从事下列损害交易者利益的行为：\n（一）向交易者作出保证其资产本金不受损失或者取得最低收益承诺；\n（二）与交易者约定分享利益、共担风险；\n（三）违背交易者委托进行期货交易；\n（四）隐瞒重要事项或者使用其他不正当手段，诱骗交易者交易；\n（五）以虚假或者不确定的重大信息为依据向交易者提供交易建议；\n（六）向交易者提供虚假成交回报；\n（七）未将交易者交易指令下达到期货交易场所；\n（八）挪用交易者保证金；\n（九）未依照规定在期货保证金存管机构开立保证金账户，或者违规划转交易者保证金；\n（十）利用为交易者提供服务的便利，获取不正当利益或者转嫁风险；\n（十一）其他损害交易者权益的行为。"},{"n":79,"label":"第七十九条","chapter":"第六章 期货交易场所","text":"期货交易场所应当遵循社会公共利益优先原则，为期货交易提供场所和设施，组织和监督期货交易，维护市场的公平、有序和透明，实行自律管理。"},{"n":80,"label":"第八十条","chapter":"第六章 期货交易场所","text":"设立、变更和解散期货交易所，应当由国务院期货监督管理机构批准。设立期货交易所应当制定章程。期货交易所章程的制定和修改，应当经国务院期货监督管理机构批准。"},{"n":81,"label":"第八十一条","chapter":"第六章 期货交易场所","text":"期货交易所应当在其名称中标明“商品交易所”或者“期货交易所”等字样。其他任何单位或者个人不得使用期货交易所或者其他可能产生混淆或者误导的名称。"},{"n":82,"label":"第八十二条","chapter":"第六章 期货交易场所","text":"期货交易所可以采取会员制或者公司制的组织形式。会员制期货交易所的组织机构由其章程规定。"},{"n":83,"label":"第八十三条","chapter":"第六章 期货交易场所","text":"期货交易所依照法律、行政法规和国务院期货监督管理机构的规定，制定有关业务规则；其中交易规则的制定和修改应当报国务院期货监督管理机构批准。期货交易所业务规则应当体现公平保护会员、交易者等市场相关各方合法权益的原则。在期货交易所从事期货交易及相关活动，应当遵守期货交易所依法制定的业务规则。违反业务规则的，由期货交易所给予纪律处分或者采取其他自律管理措施。"},{"n":84,"label":"第八十四条","chapter":"第六章 期货交易场所","text":"期货交易所的负责人由国务院期货监督管理机构提名或者任免。有《中华人民共和国公司法》规定的不适合担任公司董事、监事、高级管理人员的情形或者下列情形之一的，不得担任期货交易所的负责人：\n（一）因违法行为或者违纪行为被解除职务的期货经营机构的董事、监事、高级管理人员，或者期货交易场所、期货结算机构的负责人，自被解除职务之日起未逾五年；\n（二）因违法行为或者违纪行为被吊销执业证书或者被取消资格的注册会计师、律师或者其他期货服务机构的专业人员，自被吊销执业证书或者被取消资格之日起未逾五年。"},{"n":85,"label":"第八十五条","chapter":"第六章 期货交易场所","text":"期货交易场所应当依照本法和国务院期货监督管理机构的规定，加强对交易活动的风险控制和对会员以及交易场所工作人员的监督管理，依法履行下列职责：\n（一）提供交易的场所、设施和服务；\n（二）设计期货合约、标准化期权合约品种，安排期货合约、标准化期权合约品种上市；\n（三）对期货交易进行实时监控和风险监测；\n（四）依照章程和业务规则对会员、交易者、期货服务机构等进行自律管理；\n（五）开展交易者教育和市场培育工作；\n（六）国务院期货监督管理机构规定的其他职责。期货交易场所不得直接或者间接参与期货交易。未经国务院批准，期货交易场所不得从事信托投资、股票投资、非自用不动产投资等与其职责无关的业务。"},{"n":86,"label":"第八十六条","chapter":"第六章 期货交易场所","text":"期货交易所的所得收益按照国家有关规定管理和使用，应当首先用于保证期货交易的场所、设施的运行和改善。"},{"n":87,"label":"第八十七条","chapter":"第六章 期货交易场所","text":"期货交易场所应当加强对期货交易的风险监测，出现异常情况的，期货交易场所可以依照业务规则，单独或者会同期货结算机构采取下列紧急措施，并立即报告国务院期货监督管理机构： （一）调整保证金；\n（二）调整涨跌停板幅度；\n（三）调整会员、交易者的交易限额或持仓限额标准；\n（四）限制开仓；\n（五）强行平仓；\n（六）暂时停止交易；\n（七）其他紧急措施。异常情况消失后，期货交易场所应当及时取消紧急措施。"},{"n":88,"label":"第八十八条","chapter":"第六章 期货交易场所","text":"期货交易场所应当实时公布期货交易即时行情，并按交易日制作期货市场行情表，予以公布。期货交易行情的权益由期货交易场所享有。未经期货交易场所许可，任何单位和个人不得发布期货交易行情。期货交易场所不得发布价格预测信息。期货交易场所应当依照国务院期货监督管理机构的规定，履行信息报告义务。"},{"n":89,"label":"第八十九条","chapter":"第六章 期货交易场所","text":"因突发性事件影响期货交易正常进行时，为维护期货交易正常秩序和市场公平，期货交易场所可以按照本法和业务规则规定采取必要的处置措施，并应当及时向国务院期货监督管理机构报告。因前款规定的突发性事件导致期货交易结果出现重大异常，按交易结果进行结算、交割将对期货交易正常秩序和市场公平造成重大影响的，期货交易场所可以按照业务规则采取取消交易等措施，并应当及时向国务院期货监督管理机构报告并公告。"},{"n":90,"label":"第九十条","chapter":"第六章 期货交易场所","text":"期货交易场所对其依照本法第八十七条、第八十九条规定采取措施造成的损失，不承担民事赔偿责任，但存在重大过错的除外。"},{"n":91,"label":"第九十一条","chapter":"第七章 期货结算机构","text":"期货结算机构是指依法设立，为期货交易提供结算、交割服务，实行自律管理的法人。期货结算机构包括内部设有结算部门的期货交易场所、独立的期货结算机构和经国务院期货监督管理机构批准从事与证券业务相关的期货交易结算、交割业务的证券结算机构。"},{"n":92,"label":"第九十二条","chapter":"第七章 期货结算机构","text":"独立的期货结算机构的设立、变更和解散，应当经国务院期货监督管理机构批准。设立独立的期货结算机构，应当具备下列条件：\n（一）具备良好的财务状况，注册资本最低限额符合国务院期货监督管理机构的规定；\n（二）有具备任职专业知识和业务工作经验的高级管理人员；\n（三）具备完善的治理结构、内部控制制度和风险控制制度；\n（四）具备符合要求的营业场所、信息技术系统以及与期货交易的结算有关的其他设施；\n（五）国务院期货监督管理机构规定的其他条件。承担期货结算机构职责的期货交易场所，应当具备本条第二款规定的条件。国务院期货监督管理机构应当根据审慎监管原则进行审查，在六个月内作出批准或者不予批准的决定。"},{"n":93,"label":"第九十三条","chapter":"第七章 期货结算机构","text":"期货结算机构作为中央对手方，是结算参与人共同对手方，进行净额结算，为期货交易提供集中履约保障。"},{"n":94,"label":"第九十四条","chapter":"第七章 期货结算机构","text":"期货结算机构履行下列职责：\n（一）组织期货交易的结算、交割；\n（二）按照章程和业务规则对交易者、期货经营机构、期货服务机构、非期货经营机构结算参与人等进行自律管理；\n（三）办理与期货交易的结算、交割有关的信息查询业务；\n（四）国务院期货监督管理机构规定的其他职责。"},{"n":95,"label":"第九十五条","chapter":"第七章 期货结算机构","text":"期货结算机构应当按照国务院期货监督管理机构的规定，在其业务规则中规定结算参与人制度、风险控制制度、信息安全管理制度、违规违约处理制度、应急处理及临时处置措施等事项。期货结算机构制定和修改章程、业务规则，应当经国务院期货监督管理机构批准。参与期货结算，应当遵守期货结算机构制定的业务规则。期货结算机构制定和执行业务规则，应当与期货交易场所的相关制度衔接、协调。"},{"n":96,"label":"第九十六条","chapter":"第七章 期货结算机构","text":"期货结算机构应当建立流动性管理制度，保障结算活动的稳健运行。"},{"n":97,"label":"第九十七条","chapter":"第七章 期货结算机构","text":"本法第八十四条，第八十五条第二款，第八十六条，第八十八条第三款、第四款的规定，适用于独立的期货结算机构和经批准从事期货交易结算、交割业务的证券结算机构。"},{"n":98,"label":"第九十八条","chapter":"第八章 期货服务机构","text":"会计师事务所、律师事务所、资产评估机构、期货保证金存管机构、交割库、信息技术服务机构等期货服务机构，应当勤勉尽责、恪尽职守，按照相关业务规则为期货交易及相关活动提供服务，并按照国务院期货监督管理机构的要求提供相关资料。"},{"n":99,"label":"第九十九条","chapter":"第八章 期货服务机构","text":"会计师事务所、律师事务所、资产评估机构等期货服务机构接受期货经营机构、期货交易场所、期货结算机构的委托出具审计报告、法律意见书等文件，应当对所依据的文件资料内容的真实性、准确性、完整性进行核查和验证。"},{"n":100,"label":"第一百条","chapter":"第八章 期货服务机构","text":"交割库包括交割仓库和交割厂库等。交割库为期货交易的交割提供相关服务，应当符合期货交易场所规定的条件。期货交易场所应当与交割库签订协议，明确双方的权利和义务。交割库不得有下列行为：\n（一）出具虚假仓单；\n（二）违反期货交易场所的业务规则，限制交割商品的出库、入库；\n（三）泄露与期货交易有关的商业秘密；\n（四）违反国家有关规定参与期货交易；\n（五）违反国务院期货监督管理机构规定的其他行为。"},{"n":101,"label":"第一百零一条","chapter":"第八章 期货服务机构","text":"为期货交易及相关活动提供信息技术系统服务的机构，应当符合国家及期货行业信息安全相关的技术管理规定和标准，并向国务院期货监督管理机构备案。国务院期货监督管理机构可以依法要求信息技术服务机构提供前款规定的信息技术系统的相关材料。"},{"n":102,"label":"第一百零二条","chapter":"第九章 期货业协会","text":"期货业协会是期货行业的自律性组织，是社会团体法人。期货经营机构应当加入期货业协会。期货服务机构可以加入期货业协会。"},{"n":103,"label":"第一百零三条","chapter":"第九章 期货业协会","text":"期货业协会的权力机构为会员大会。期货业协会的章程由会员大会制定，并报国务院期货监督管理机构备案。期货业协会设理事会。理事会成员依照章程的规定选举产生。"},{"n":104,"label":"第一百零四条","chapter":"第九章 期货业协会","text":"期货业协会履行下列职责：\n（一）制定和实施行业自律规则，监督、检查会员的业务活动及从业人员的执业行为，对违反法律、行政法规、国家有关规定、协会章程和自律规则的，按照规定给予纪律处分或者实施其他自律管理措施；\n（二）对会员之间、会员与交易者之间发生的纠纷进行调解；\n（三）依法维护会员的合法权益，向国务院期货监督管理机构反映会员的建议和要求；\n（四）组织期货从业人员的业务培训，开展会员间的业务交流；\n（五）教育会员和期货从业人员遵守期货法律法规和政策，组织开展行业诚信建设，建立行业诚信激励约束机制；\n（六）开展交易者教育和保护工作，督促会员落实交易者适当性管理制度，开展期货市场宣传；\n（七）对会员的信息安全工作实行自律管理，督促会员执行国家和行业信息安全相关规定和技术标准；\n（八）组织会员就期货行业的发展、运作及有关内容进行研究，收集整理、发布期货相关信息，提供会员服务，组织行业交流，引导行业创新发展；\n（九）期货业协会章程规定的其他职责。"},{"n":105,"label":"第一百零五条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构依法对期货市场实行监督管理，维护期货市场公开、公平、公正，防范系统性风险，维护交易者合法权益，促进期货市场健康发展。国务院期货监督管理机构在对期货市场实施监督管理中，依法履行下列职责：\n（一）制定有关期货市场监督管理的规章、规则，并依法进行审批、核准、注册，办理备案；\n（二）对品种的上市、交易、结算、交割等期货交易及相关活动，进行监督管理；\n（三）对期货经营机构、期货交易场所、期货结算机构、期货服务机构和非期货经营机构结算参与人等市场相关参与者的期货业务活动，进行监督管理；\n（四）制定期货从业人员的行为准则，并监督实施；\n（五）监督检查期货交易的信息公开情况；\n（六）维护交易者合法权益、开展交易者教育；\n（七）对期货违法行为进行查处；\n（八）监测监控并防范、处置期货市场风险；\n（九）对期货行业金融科技和信息安全进行监管；\n（十）对期货业协会的自律管理活动进行指导和监督；\n（十一）法律、行政法规规定的其他职责。国务院期货监督管理机构根据需要可以设立派出机构，依照授权履行监督管理职责。"},{"n":106,"label":"第一百零六条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构依法履行职责，有权采取下列措施：\n（一）对期货经营机构、期货交易场所、期货结算机构进行现场检查，并要求其报送有关的财务会计、业务活动、内部控制等资料；\n（二）进入涉嫌违法行为发生场所调查取证；\n（三）询问当事人和与被调查事件有关的单位和个人，要求其对与被调查事件有关的事项作出说明，或者要求其按照指定的方式报送与被调查事件有关的文件和资料；\n（四）查阅、复制与被调查事件有关的财产权登记、通讯记录等文件和资料；\n（五）查阅、复制当事人和与被调查事件有关的单位和个人的期货交易记录、财务会计资料及其他相关文件和资料；对可能被转移、隐匿或者毁损的文件资料，可以予以封存、扣押；\n（六）查询当事人和与被调查事件有关的单位和个人的保证金账户和银行账户以及其他具有支付、托管、结算等功能的账户信息，可以对有关文件和资料进行复制；对有证据证明已经或者可能转移或者隐匿违法资金等涉案财产或者隐匿、伪造、毁损重要证据的，经国务院期货监督管理机构主要负责人或者其授权的其他负责人批准，可以冻结、查封，期限为六个月；因特殊原因需要延长的，每次延长期限不得超过三个月，最长期限不得超过二年；\n（七）在调查操纵期货市场、内幕交易等重大违法行为时，经国务院期货监督管理机构主要负责人或者其授权的其他负责人批准，可以限制被调查事件当事人的交易，但限制的时间不得超过三个月；案情复杂的，可以延长三个月；\n（八）决定并通知出境入境管理机关依法阻止涉嫌违法人员、涉嫌违法单位的主管人员和其他直接责任人员出境。为防范期货市场风险，维护市场秩序，国务院期货监督管理机构可以采取责令改正、监管谈话、出具警示函等措施。"},{"n":107,"label":"第一百零七条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构依法履行职责，进行监督检查或者调查，其监督检查、调查的人员不得少于二人，并应当出示执法证件和检查、调查、查询等相关执法文书。监督检查、调查的人员少于二人或者未出示执法证件和有关执法文书的，被检查、调查的单位或者个人有权拒绝。"},{"n":108,"label":"第一百零八条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构的工作人员，应当依法办事，忠于职守，公正廉洁，保守国家秘密和有关当事人的商业秘密，不得利用职务便利牟取不正当利益。"},{"n":109,"label":"第一百零九条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构依法履行职责，被检查、调查的单位和个人应当配合，如实作出说明或者提供有关文件和资料，不得拒绝、阻碍和隐瞒。国务院期货监督管理机构与其他相关部门，应当建立信息共享等监督管理协调配合机制。国务院期货监督管理机构依法履行职责，进行监督检查或者调查时，有关部门应当予以配合。"},{"n":110,"label":"第一百一十条","chapter":"第十章 监督管理","text":"对涉嫌期货违法、违规行为，任何单位和个人有权向国务院期货监督管理机构举报。对涉嫌重大违法、违规行为的实名举报线索经查证属实的，国务院期货监督管理机构按照规定给予举报人奖励。国务院期货监督管理机构应当对举报人的身份信息保密。"},{"n":111,"label":"第一百一十一条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构制定的规章、规则和监督管理工作制度应当依法公开。国务院期货监督管理机构依据调查结果，对期货违法行为作出的处罚决定，应当依法公开。"},{"n":112,"label":"第一百一十二条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构对涉嫌期货违法的单位或者个人进行调查期间，被调查的当事人书面申请，承诺在国务院期货监督管理机构认可的期限内纠正涉嫌违法行为，赔偿有关交易者损失，消除损害或者不良影响的，国务院期货监督管理机构可以决定中止调查。被调查的当事人履行承诺的，国务院期货监督管理机构可以决定终止调查；被调查的当事人未履行承诺或者有国务院规定的其他情形的，应当恢复调查。具体办法由国务院规定。国务院期货监督管理机构中止或者终止调查的，应当按照规定公开相关信息。"},{"n":113,"label":"第一百一十三条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构依法将有关期货市场主体遵守本法的情况纳入期货市场诚信档案。"},{"n":114,"label":"第一百一十四条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构依法履行职责，发现期货违法行为涉嫌犯罪的，应当依法将案件移送司法机关处理；发现公职人员涉嫌职务违法或者职务犯罪的，应当依法移送监察机关处理。"},{"n":115,"label":"第一百一十五条","chapter":"第十章 监督管理","text":"国务院期货监督管理机构应当建立健全期货市场监测监控制度，通过专门机构加强保证金安全存管监控。"},{"n":116,"label":"第一百一十六条","chapter":"第十章 监督管理","text":"为防范交易及结算的风险，期货经营机构、期货交易场所、期货结算机构和非期货经营机构结算参与人应当从业务收入中按照国务院期货监督管理机构、国务院财政部门的规定提取、管理和使用风险准备金。"},{"n":117,"label":"第一百一十七条","chapter":"第十章 监督管理","text":"期货经营机构、期货交易场所、期货结算机构、期货服务机构和非期货经营机构结算参与人等应当按照规定妥善保存与业务经营相关的资料和信息，任何人不得泄露、隐匿、伪造、篡改或者毁损。期货经营机构、期货交易场所、期货结算机构和非期货经营机构结算参与人的信息和资料的保存期限不得少于二十年；期货服务机构的信息和资料的保存期限不得少于十年。"},{"n":118,"label":"第一百一十八条","chapter":"第十一章 跨境交易与监管协作","text":"境外期货交易场所向境内单位或者个人提供直接接入该交易场所交易系统进行交易服务的，应当向国务院期货监督管理机构申请注册，接受国务院期货监督管理机构的监督管理，国务院期货监督管理机构另有规定的除外。"},{"n":119,"label":"第一百一十九条","chapter":"第十一章 跨境交易与监管协作","text":"境外期货交易场所上市的期货合约、期权合约和衍生品合约，以境内期货交易场所上市的合约价格进行挂钩结算的，应当符合国务院期货监督管理机构的规定。"},{"n":120,"label":"第一百二十条","chapter":"第十一章 跨境交易与监管协作","text":"境内单位或者个人从事境外期货交易，应当委托具有境外期货经纪业务资格的境内期货经营机构进行，国务院另有规定的除外。境内期货经营机构转委托境外期货经营机构从事境外期货交易的，该境外期货经营机构应当向国务院期货监督管理机构申请注册，接受国务院期货监督管理机构的监督管理，国务院期货监督管理机构另有规定的除外。"},{"n":121,"label":"第一百二十一条","chapter":"第十一章 跨境交易与监管协作","text":"境外期货交易场所在境内设立代表机构的，应当向国务院期货监督管理机构备案。境外期货交易场所代表机构及其工作人员，不得从事或者变相从事任何经营活动。"},{"n":122,"label":"第一百二十二条","chapter":"第十一章 跨境交易与监管协作","text":"境外机构在境内从事期货市场营销、推介及招揽活动，应当经国务院期货监督管理机构批准，适用本法的相关规定。境内机构为境外机构在境内从事期货市场营销、推介及招揽活动，应当经国务院期货监督管理机构批准。任何单位或者个人不得从事违反前两款规定的期货市场营销、推介及招揽活动。"},{"n":123,"label":"第一百二十三条","chapter":"第十一章 跨境交易与监管协作","text":"国务院期货监督管理机构可以和境外期货监督管理机构建立监督管理合作机制，或者加入国际组织，实施跨境监督管理。国务院期货监督管理机构应境外期货监督管理机构请求提供协助的，应当遵循国家法律、法规的规定和对等互惠的原则，不得泄露国家秘密，不得损害国家利益和社会公共利益。"},{"n":124,"label":"第一百二十四条","chapter":"第十一章 跨境交易与监管协作","text":"国务院期货监督管理机构可以按照与境外期货监督管理机构达成的监管合作安排，接受境外期货监督管理机构的请求，依照本法规定的职责和程序为其进行调查取证。境外期货监督管理机构应当提供有关案件材料，并说明其正在就被调查当事人涉嫌违反请求方当地期货法律法规的行为进行调查。境外期货监督管理机构不得在中华人民共和国境内直接进行调查取证等活动。未经国务院期货监督管理机构和国务院有关主管部门同意，任何单位和个人不得擅自向境外监督管理机构提供与期货业务活动有关的文件和资料。国务院期货监督管理机构可以依照与境外期货监督管理机构达成的监管合作安排，请求境外期货监督管理机构进行调查取证。"},{"n":125,"label":"第一百二十五条","chapter":"第十二章 法律责任","text":"违反本法第十二条的规定，操纵期货市场或者衍生品市场的，责令改正，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款。单位操纵市场的，还应当对直接负责的主管人员和其他直接责任人员给予警告，并处以五十万元以上五百万元以下的罚款。操纵市场行为给交易者造成损失的，应当依法承担赔偿责任。"},{"n":126,"label":"第一百二十六条","chapter":"第十二章 法律责任","text":"违反本法第十三条的规定从事内幕交易的，责令改正，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。单位从事内幕交易的，还应当对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。国务院期货监督管理机构、国务院授权的部门、期货交易场所、期货结算机构的工作人员从事内幕交易的，从重处罚。内幕交易行为给交易者造成损失的，应当依法承担赔偿责任。"},{"n":127,"label":"第一百二十七条","chapter":"第十二章 法律责任","text":"违反本法第十六条第一款、第三款的规定，编造、传播虚假信息或者误导性信息，扰乱期货市场、衍生品市场的，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足二十万元的，处以二十万元以上二百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。违反本法第十六条第二款的规定，在期货交易、衍生品交易活动中作出虚假陈述或者信息误导的，责令改正，处以二十万元以上二百万元以下的罚款；属于国家工作人员的，还应当依法给予处分。传播媒介及其从事期货市场、衍生品市场信息报道的工作人员违反本法第十六条第三款的规定，从事与其工作职责发生利益冲突的期货交易、衍生品交易的，没收违法所得，并处以违法所得一倍以下的罚款，没有违法所得或者违法所得不足十万元的，处以十万元以下的罚款。编造、传播有关期货交易、衍生品交易的虚假信息，或者在期货交易、衍生品交易中作出信息误导，给交易者造成损失的，应当依法承担赔偿责任。"},{"n":128,"label":"第一百二十八条","chapter":"第十二章 法律责任","text":"违反本法第十八条第二款的规定，出借自己的期货账户或者借用他人的期货账户从事期货交易的，责令改正，给予警告，可以处五十万元以下的罚款。"},{"n":129,"label":"第一百二十九条","chapter":"第十二章 法律责任","text":"违反本法第二十一条的规定，采取程序化交易影响期货交易场所系统安全或者正常交易秩序的，责令改正，并处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":130,"label":"第一百三十条","chapter":"第十二章 法律责任","text":"违反本法第二十七条规定，未报告有关重大事项的，责令改正，给予警告，可以处一百万元以下的罚款。"},{"n":131,"label":"第一百三十一条","chapter":"第十二章 法律责任","text":"法律、行政法规和国务院期货监督管理机构规定禁止参与期货交易的人员，违反本法第五十三条的规定，直接或者以化名、借他人名义参与期货交易的，责令改正，给予警告，没收违法所得，并处以五万元以上五十万元以下的罚款；属于国家工作人员的，还应当依法给予处分。"},{"n":132,"label":"第一百三十二条","chapter":"第十二章 法律责任","text":"非法设立期货公司，或者未经核准从事相关期货业务的，予以取缔，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":133,"label":"第一百三十三条","chapter":"第十二章 法律责任","text":"提交虚假申请文件或者采取其他欺诈手段骗取期货公司设立许可、重大事项变更核准或者期货经营机构期货业务许可的，撤销相关许可，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足二十万元的，处以二十万元以上二百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":134,"label":"第一百三十四条","chapter":"第十二章 法律责任","text":"期货经营机构违反本法第四十条、第六十二条、第六十五条、第六十八条、第七十一条、第七十二条的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足二十万元的，处以二十万元以上二百万元以下的罚款；情节严重的，责令停业整顿或者吊销期货业务许可证。对直接负责的主管人员和其他直接责任人员给予警告，并处以五万元以上五十万元以下的罚款。期货经营机构有前款所列违法情形，给交易者造成损失的，应当依法承担赔偿责任。期货经营机构的主要股东、实际控制人或者其他关联人违反本法第七十一条规定的，依照本条第一款的规定处罚。"},{"n":135,"label":"第一百三十五条","chapter":"第十二章 法律责任","text":"期货经营机构违反本法第五十条交易者适当性管理规定，或者违反本法第六十六条规定从事经纪业务接受交易者全权委托，或者有第七十八条损害交易者利益行为的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款；情节严重的，吊销相关业务许可。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。期货经营机构有本法第七十八条规定的行为，给交易者造成损失的，应当依法承担赔偿责任。"},{"n":136,"label":"第一百三十六条","chapter":"第十二章 法律责任","text":"违反本法第十一条、第八十条、第九十二条规定，非法设立期货交易场所、期货结算机构，或者以其他形式组织期货交易的，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足一百万元的，处以一百万元以上一千万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。非法设立期货交易场所的，由县级以上人民政府予以取缔。违反本法第三十条规定，未经批准组织开展衍生品交易的，或者金融机构违反本法第三十一条规定，未经批准、核准开展衍生品交易的，依照前款规定处罚。"},{"n":137,"label":"第一百三十七条","chapter":"第十二章 法律责任","text":"期货交易场所、期货结算机构违反本法第十七条、第四十条、第八十五条第二款规定的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足二十万元的，处以二十万元以上二百万元以下的罚款；情节严重的，责令停业整顿。对直接负责的主管人员和其他直接责任人员处以五万元以上五十万元以下的罚款。"},{"n":138,"label":"第一百三十八条","chapter":"第十二章 法律责任","text":"期货交易场所、期货结算机构违反本法第八十八条第三款规定发布价格预测信息的，责令改正，给予警告，并处以二十万元以上二百万元以下的罚款。对直接负责的主管人员和其他直接责任人员处以五万元以上五十万元以下的罚款。"},{"n":139,"label":"第一百三十九条","chapter":"第十二章 法律责任","text":"期货服务机构违反本法第九十八条的规定，从事期货服务业务未按照要求提供相关资料的，责令改正，可以处二十万元以下的罚款。"},{"n":140,"label":"第一百四十条","chapter":"第十二章 法律责任","text":"会计师事务所、律师事务所、资产评估机构等期货服务机构违反本法第九十九条的规定，未勤勉尽责，所制作、出具的文件有虚假记载、误导性陈述或者重大遗漏的，责令改正，没收业务收入，并处以业务收入一倍以上十倍以下的罚款；没有业务收入或者业务收入不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。期货服务机构有前款所列违法行为，给他人造成损失的，依法承担赔偿责任。"},{"n":141,"label":"第一百四十一条","chapter":"第十二章 法律责任","text":"交割库有本法第一百条所列行为之一的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足十万元的，处以十万元以上一百万元以下的罚款；情节严重的，责令期货交易场所暂停或者取消其交割库资格。对直接负责的主管人员和其他直接责任人员给予警告，并处以五万元以上五十万元以下的罚款。"},{"n":142,"label":"第一百四十二条","chapter":"第十二章 法律责任","text":"信息技术服务机构违反本法第一百零一条规定未报备案的，责令改正，可以处二十万元以下的罚款。信息技术服务机构违反本法第一百零一条规定，提供的服务不符合国家及期货行业信息安全相关的技术管理规定和标准的，责令改正，没收业务收入，并处以业务收入一倍以上十倍以下的罚款；没有业务收入或者业务收入不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款。"},{"n":143,"label":"第一百四十三条","chapter":"第十二章 法律责任","text":"违反本法第一百一十六条的规定，期货经营机构、期货交易场所、期货结算机构和非期货经营机构结算参与人未按照规定提取、管理和使用风险准备金的，责令改正，给予警告。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":144,"label":"第一百四十四条","chapter":"第十二章 法律责任","text":"违反本法第一百一十七条的规定，期货经营机构、期货交易场所、期货结算机构、期货服务机构和非期货经营机构结算参与人等未按照规定妥善保存与业务经营相关的资料和信息的，责令改正，给予警告，并处以十万元以上一百万元以下的罚款；泄露、隐匿、伪造、篡改或者毁损有关文件资料的，责令改正，给予警告，并处以二十万元以上二百万元以下的罚款；情节严重的，处以五十万元以上五百万元以下的罚款，并暂停、吊销相关业务许可或者禁止从事相关业务。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":145,"label":"第一百四十五条","chapter":"第十二章 法律责任","text":"境外期货交易场所和期货经营机构违反本法第一百一十八条和第一百二十条的规定，未向国务院期货监督管理机构申请注册的，责令改正，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":146,"label":"第一百四十六条","chapter":"第十二章 法律责任","text":"境内单位或者个人违反本法第一百二十条第一款规定的，责令改正，给予警告，没收违法所得，并处以十万元以上一百万元以下的罚款；情节严重的，暂停其境外期货交易。对直接负责的主管人员和其他直接责任人员给予警告，并处以五万元以上五十万元以下的罚款。"},{"n":147,"label":"第一百四十七条","chapter":"第十二章 法律责任","text":"境外期货交易场所在境内设立的代表机构及其工作人员违反本法第一百二十一条的规定，从事或者变相从事任何经营活动的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":148,"label":"第一百四十八条","chapter":"第十二章 法律责任","text":"违反本法第一百二十二条的规定在境内从事市场营销、推介及招揽活动的，责令改正，给予警告，没收违法所得，并处以违法所得一倍以上十倍以下的罚款；没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处以十万元以上一百万元以下的罚款。"},{"n":149,"label":"第一百四十九条","chapter":"第十二章 法律责任","text":"拒绝、阻碍国务院期货监督管理机构或者国务院授权的部门及其工作人员依法行使监督检查、调查职权的，责令改正，处以十万元以上一百万元以下的罚款，并由公安机关依法给予治安管理处罚。"},{"n":150,"label":"第一百五十条","chapter":"第十二章 法律责任","text":"违反法律、行政法规或者国务院期货监督管理机构的有关规定，情节严重的，国务院期货监督管理机构可以对有关责任人员采取期货市场禁入的措施。前款所称期货市场禁入，是指在一定期限内直至终身不得进行期货交易、从事期货业务，不得担任期货经营机构、期货交易场所、期货结算机构的董事、监事、高级管理人员或者负责人的制度。"},{"n":151,"label":"第一百五十一条","chapter":"第十二章 法律责任","text":"本法规定的行政处罚，由国务院期货监督管理机构、国务院授权的部门按照国务院规定的职责分工作出决定；法律、行政法规另有规定的，适用其规定。"},{"n":152,"label":"第一百五十二条","chapter":"第十二章 法律责任","text":"国务院期货监督管理机构或者国务院授权的部门的工作人员，不履行本法规定的职责，滥用职权、玩忽职守，利用职务便利牟取不正当利益，或者泄露所知悉的有关单位和个人的商业秘密的，依法追究法律责任。"},{"n":153,"label":"第一百五十三条","chapter":"第十二章 法律责任","text":"违反本法规定，构成犯罪的，依法追究刑事责任。"},{"n":154,"label":"第一百五十四条","chapter":"第十二章 法律责任","text":"违反本法规定，应当承担民事赔偿责任和缴纳罚款、罚金、违法所得，违法行为人的财产不足以支付的，优先用于承担民事赔偿责任。"},{"n":155,"label":"第一百五十五条","chapter":"第十三章 附则","text":"本法自2022年8月1日起施行。"}],"source":"https://www.csrc.gov.cn/jiangxi/c105769/c7463998/7463998/files/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E6%9C%9F%E8%B4%A7%E5%92%8C%E8%A1%8D%E7%94%9F%E5%93%81%E6%B3%95.pdf","textSource":"https://www.csrc.gov.cn/jiangxi/c105769/c7463998/7463998/files/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E6%9C%9F%E8%B4%A7%E5%92%8C%E8%A1%8D%E7%94%9F%E5%93%81%E6%B3%95.pdf","coverage":"正文全文","checked":"2026-09-23","format":"官方PDF文字提取；删除页码并重排换行，段落版式与PDF可能不同","sha256":"a55571a95d2a90226c014b0288b8821607f8de121dfbca7fedf04c3f11b6d5ff"},{"id":"aml","title":"中华人民共和国反洗钱法","level":"法律","issuer":"全国人大常委会","version":"2024年修订","effective":"2025-01-01","scope":"通用","topics":["客户尽调","受益所有人","记录保存"],"overview":"反洗钱不等于合格投资者审查。先依据机构身份与配套规定判定本机构的义务和报送路径，再确定客户尽调、风险管理、记录保存与合作安排。","practice":"TA流程应区分客户资格、适当性、身份及资金来源核验。不能因为收集了身份证，就认定全部反洗钱义务已完成。","priority":[6,28,30,34,63,64],"articles":[{"n":1,"label":"第一条","chapter":"第一章  总  则","text":"为了预防洗钱活动，遏制洗钱以及相关犯罪，加强和规范反洗钱工作，维护金融秩序、社会公共利益和国家安全，根据宪法，制定本法。"},{"n":2,"label":"第二条","chapter":"第一章  总  则","text":"本法所称反洗钱，是指为了预防通过各种方式掩饰、隐瞒毒品犯罪、黑社会性质的组织犯罪、恐怖活动犯罪、走私犯罪、贪污贿赂犯罪、破坏金融管理秩序犯罪、金融诈骗犯罪和其他犯罪所得及其收益的来源、性质的洗钱活动，依照本法规定采取相关措施的行为。\n预防恐怖主义融资活动适用本法；其他法律另有规定的，适用其规定。"},{"n":3,"label":"第三条","chapter":"第一章  总  则","text":"反洗钱工作应当贯彻落实党和国家路线方针政策、决策部署，坚持总体国家安全观，完善监督管理体制机制，健全风险防控体系。"},{"n":4,"label":"第四条","chapter":"第一章  总  则","text":"反洗钱工作应当依法进行，确保反洗钱措施与洗钱风险相适应，保障正常金融服务和资金流转顺利进行，维护单位和个人的合法权益。"},{"n":5,"label":"第五条","chapter":"第一章  总  则","text":"国务院反洗钱行政主管部门负责全国的反洗钱监督管理工作。国务院有关部门在各自的职责范围内履行反洗钱监督管理职责。\n\n国务院反洗钱行政主管部门、国务院有关部门、监察机关和司法机关在反洗钱工作中应当相互配合。"},{"n":6,"label":"第六条","chapter":"第一章  总  则","text":"在中华人民共和国境内（以下简称境内）设立的金融机构和依照本法规定应当履行反洗钱义务的特定非金融机构，应当依法采取预防、监控措施，建立健全反洗钱内部控制制度，履行客户尽职调查、客户身份资料和交易记录保存、大额交易和可疑交易报告、反洗钱特别预防措施等反洗钱义务。"},{"n":7,"label":"第七条","chapter":"第一章  总  则","text":"对依法履行反洗钱职责或者义务获得的客户身份资料和交易信息、反洗钱调查信息等反洗钱信息，应当予以保密；非依法律规定，不得向任何单位和个人提供。\n反洗钱行政主管部门和其他依法负有反洗钱监督管理职责的部门履行反洗钱职责获得的客户身份资料和交易信息，只能用于反洗钱监督管理和行政调查工作。\n\n司法机关依照本法获得的客户身份资料和交易信息，只能用于反洗钱相关刑事诉讼。\n\n国家有关机关使用反洗钱信息应当依法保护国家秘密、商业秘密和个人隐私、个人信息。"},{"n":8,"label":"第八条","chapter":"第一章  总  则","text":"履行反洗钱义务的机构及其工作人员依法开展提交大额交易和可疑交易报告等工作，受法律保护。"},{"n":9,"label":"第九条","chapter":"第一章  总  则","text":"反洗钱行政主管部门会同国家有关机关通过多种形式开展反洗钱宣传教育活动，向社会公众宣传洗钱活动的违法性、危害性及其表现形式等，增强社会公众对洗钱活动的防范意识和识别能力。"},{"n":10,"label":"第十条","chapter":"第一章  总  则","text":"任何单位和个人不得从事洗钱活动或者为洗钱活动提供便利，并应当配合金融机构和特定非金融机构依法开展的客户尽职调查。"},{"n":11,"label":"第十一条","chapter":"第一章  总  则","text":"任何单位和个人发现洗钱活动，有权向反洗钱行政主管部门、公安机关或者其他有关国家机关举报。接受举报的机关应当对举报人和举报内容保密。\n\n对在反洗钱工作中做出突出贡献的单位和个人，按照国家有关规定给予表彰和奖励。"},{"n":12,"label":"第十二条","chapter":"第一章  总  则","text":"在中华人民共和国境外（以下简称境外）的洗钱和恐怖主义融资活动，危害中华人民共和国主权和安全，侵犯中华人民共和国公民、法人和其他组织合法权益，或者扰乱境内金融秩序的，依照本法以及相关法律规定处理并追究法律责任。"},{"n":13,"label":"第十三条","chapter":"第二章  反洗钱监督管理","text":"国务院反洗钱行政主管部门组织、协调全国的反洗钱工作，负责反洗钱的资金监测，制定或者会同国务院有关金融管理部门制定金融机构反洗钱管理规定，监督检查金融机构履行反洗钱义务的情况，在职责范围内调查可疑交易活动，履行法律和国务院规定的有关反洗钱的其他职责。\n\n国务院反洗钱行政主管部门的派出机构在国务院反洗钱行政主管部门的授权范围内，对金融机构履行反洗钱义务的情况进行监督检查。"},{"n":14,"label":"第十四条","chapter":"第二章  反洗钱监督管理","text":"国务院有关金融管理部门参与制定所监督管理的金融机构反洗钱管理规定，履行法律和国务院规定的有关反洗钱的其他职责。\n\n有关金融管理部门应当在金融机构市场准入中落实反洗钱审查要求，在监督管理工作中发现金融机构违反反洗钱规定的，应当将线索移送反洗钱行政主管部门，并配合其进行处理。"},{"n":15,"label":"第十五条","chapter":"第二章  反洗钱监督管理","text":"国务院有关特定非金融机构主管部门制定或者国务院反洗钱行政主管部门会同其制定特定非金融机构反洗钱管理规定。\n\n有关特定非金融机构主管部门监督检查特定非金融机构履行反洗钱义务的情况，处理反洗钱行政主管部门提出的反洗钱监督管理建议，履行法律和国务院规定的有关反洗钱的其他职责。有关特定非金融机构主管部门根据需要，可以请求反洗钱行政主管部门协助其监督检查。"},{"n":16,"label":"第十六条","chapter":"第二章  反洗钱监督管理","text":"国务院反洗钱行政主管部门设立反洗钱监测分析机构。反洗钱监测分析机构开展反洗钱资金监测，负责接收、分析大额交易和可疑交易报告，移送分析结果，并按照规定向国务院反洗钱行政主管部门报告工作情况，履行国务院反洗钱行政主管部门规定的其他职责。\n\n反洗钱监测分析机构根据依法履行职责的需要，可以要求履行反洗钱义务的机构提供与大额交易和可疑交易相关的补充信息。\n\n反洗钱监测分析机构应当健全监测分析体系，根据洗钱风险状况有针对性地开展监测分析工作，按照规定向履行反洗钱义务的机构反馈可疑交易报告使用情况，不断提高监测分析水平。"},{"n":17,"label":"第十七条","chapter":"第二章  反洗钱监督管理","text":"国务院反洗钱行政主管部门为履行反洗钱职责，可以从国家有关机关获取所必需的信息，国家有关机关应当依法提供。\n国务院反洗钱行政主管部门应当向国家有关机关定期通报反洗钱工作情况，依法向履行与反洗钱相关的监督管理、行政调查、监察调查、刑事诉讼等职责的国家有关机关提供所必需的反洗钱信息。"},{"n":18,"label":"第十八条","chapter":"第二章  反洗钱监督管理","text":"出入境人员携带的现金、无记名支付凭证等超过规定金额的，应当按照规定向海关申报。海关发现个人出入境携带的现金、无记名支付凭证等超过规定金额的，应当及时向反洗钱行政主管部门通报。\n\n前款规定的申报范围、金额标准以及通报机制等，由国务院反洗钱行政主管部门、国务院外汇管理部门按照职责分工会同海关总署规定。"},{"n":19,"label":"第十九条","chapter":"第二章  反洗钱监督管理","text":"国务院反洗钱行政主管部门会同国务院有关部门建立法人、非法人组织受益所有人信息管理制度。\n\n法人、非法人组织应当保存并及时更新受益所有人信息，按照规定向登记机关如实提交并及时更新受益所有人信息。反洗钱行政主管部门、登记机关按照规定管理受益所有人信息。\n\n反洗钱行政主管部门、国家有关机关为履行职责需要，可以依法使用受益所有人信息。金融机构和特定非金融机构在履行反洗钱义务时依法查询核对受益所有人信息；发现受益所有人信息错误、不一致或者不完整的，应当按照规定进行反馈。使用受益所有人信息应当依法保护信息安全。\n本法所称法人、非法人组织的受益所有人，是指最终拥有或者实际控制法人、非法人组织，或者享有法人、非法人组织最终收益的自然人。具体认定标准由国务院反洗钱行政主管部门会同国务院有关部门制定。"},{"n":20,"label":"第二十条","chapter":"第二章  反洗钱监督管理","text":"反洗钱行政主管部门和其他依法负有反洗钱监督管理职责的部门发现涉嫌洗钱以及相关违法犯罪的交易活动，应当将线索和相关证据材料移送有管辖权的机关处理。接受移送的机关应当按照有关规定反馈处理结果。"},{"n":21,"label":"第二十一条","chapter":"第二章  反洗钱监督管理","text":"反洗钱行政主管部门为依法履行监督管理职责，可以要求金融机构报送履行反洗钱义务情况，对金融机构实施风险监测、评估，并就金融机构执行本法以及相关管理规定的情况进行评价。必要时可以按照规定约谈金融机构的董事、监事、高级管理人员以及反洗钱工作直接负责人，要求其就有关事项说明情况；对金融机构履行反洗钱义务存在的问题进行提示。"},{"n":22,"label":"第二十二条","chapter":"第二章  反洗钱监督管理","text":"反洗钱行政主管部门进行监督检查时，可以采取下列措施：\n\n（一）进入金融机构进行检查；\n\n（二）询问金融机构的工作人员，要求其对有关被检查事项作出说明；\n\n（三）查阅、复制金融机构与被检查事项有关的文件、资料，对可能被转移、隐匿或者毁损的文件、资料予以封存；\n（四）检查金融机构的计算机网络与信息系统，调取、保存金融机构的计算机网络与信息系统中的有关数据、信息。\n\n进行前款规定的监督检查，应当经国务院反洗钱行政主管部门或者其设区的市级以上派出机构负责人批准。检查人员不得少于二人，并应当出示执法证件和检查通知书；检查人员少于二人或者未出示执法证件和检查通知书的，金融机构有权拒绝接受检查。"},{"n":23,"label":"第二十三条","chapter":"第二章  反洗钱监督管理","text":"国务院反洗钱行政主管部门会同国家有关机关评估国家、行业面临的洗钱风险，发布洗钱风险指引，加强对履行反洗钱义务的机构指导，支持和鼓励反洗钱领域技术创新，及时监测与新领域、新业态相关的新型洗钱风险，根据洗钱风险状况优化资源配置，完善监督管理措施。"},{"n":24,"label":"第二十四条","chapter":"第二章  反洗钱监督管理","text":"对存在严重洗钱风险的国家或者地区，国务院反洗钱行政主管部门可以在征求国家有关机关意见的基础上，经国务院批准，将其列为洗钱高风险国家或者地区，并采取相应措施。"},{"n":25,"label":"第二十五条","chapter":"第二章  反洗钱监督管理","text":"履行反洗钱义务的机构可以依法成立反洗钱自律组织。反洗钱自律组织与相关行业自律组织协同开展反洗钱领域的自律管理。\n\n反洗钱自律组织接受国务院反洗钱行政主管部门的指导。"},{"n":26,"label":"第二十六条","chapter":"第二章  反洗钱监督管理","text":"提供反洗钱咨询、技术、专业能力评价等服务的机构及其工作人员，应当勤勉尽责、恪尽职守地提供服务；对于因提供服务获得的数据、信息，应当依法妥善处理，确保数据、信息安全。\n\n国务院反洗钱行政主管部门应当加强对上述机构开展反洗钱有关服务工作的指导。"},{"n":27,"label":"第二十七条","chapter":"第三章  反洗钱义务","text":"金融机构应当依照本法规定建立健全反洗钱内部控制制度，设立专门机构或者指定内设机构牵头负责反洗钱工作，根据经营规模和洗钱风险状况配备相应的人员，按照要求开展反洗钱培训和宣传。\n\n金融机构应当定期评估洗钱风险状况并制定相应的风险管理制度和流程，根据需要建立相关信息系统。\n\n金融机构应当通过内部审计或者社会审计等方式，监督反洗钱内部控制制度的有效实施。\n\n金融机构的负责人对反洗钱内部控制制度的有效实施负责。"},{"n":28,"label":"第二十八条","chapter":"第三章  反洗钱义务","text":"金融机构应当按照规定建立客户尽职调查制度。\n\n金融机构不得为身份不明的客户提供服务或者与其进行交易，不得为客户开立匿名账户或者假名账户，不得为冒用他人身份的客户开立账户。"},{"n":29,"label":"第二十九条","chapter":"第三章  反洗钱义务","text":"有下列情形之一的，金融机构应当开展客户尽职调查：\n（一）与客户建立业务关系或者为客户提供规定金额以上的一次性金融服务；\n\n（二）有合理理由怀疑客户及其交易涉嫌洗钱活动；\n\n（三）对先前获得的客户身份资料的真实性、有效性、完整性存在疑问。\n\n客户尽职调查包括识别并采取合理措施核实客户及其受益所有人身份，了解客户建立业务关系和交易的目的，涉及较高洗钱风险的，还应当了解相关资金来源和用途。\n\n金融机构开展客户尽职调查，应当根据客户特征和交易活动的性质、风险状况进行，对于涉及较低洗钱风险的，金融机构应当根据情况简化客户尽职调查。"},{"n":30,"label":"第三十条","chapter":"第三章  反洗钱义务","text":"在业务关系存续期间，金融机构应当持续关注并评估客户整体状况及交易情况，了解客户的洗钱风险。发现客户进行的交易与金融机构所掌握的客户身份、风险状况等不符的，应当进一步核实客户及其交易有关情况；对存在洗钱高风险情形的，必要时可以采取限制交易方式、金额或者频次，限制业务类型，拒绝办理业务，终止业务关系等洗钱风险管理措施。\n金融机构采取洗钱风险管理措施，应当在其业务权限范围内按照有关管理规定的要求和程序进行，平衡好管理洗钱风险与优化金融服务的关系，不得采取与洗钱风险状况明显不相匹配的措施，保障与客户依法享有的医疗、社会保障、公用事业服务等相关的基本的、必需的金融服务。"},{"n":31,"label":"第三十一条","chapter":"第三章  反洗钱义务","text":"客户由他人代理办理业务的，金融机构应当按照规定核实代理关系，识别并核实代理人的身份。\n\n金融机构与客户订立人身保险、信托等合同，合同的受益人不是客户本人的，金融机构应当识别并核实受益人的身份。"},{"n":32,"label":"第三十二条","chapter":"第三章  反洗钱义务","text":"金融机构依托第三方开展客户尽职调查的，应当评估第三方的风险状况及其履行反洗钱义务的能力。第三方具有较高风险情形或者不具备履行反洗钱义务能力的，金融机构不得依托其开展客户尽职调查。\n\n金融机构应当确保第三方已经采取符合本法要求的客户尽职调查措施。第三方未采取符合本法要求的客户尽职调查措施的，由该金融机构承担未履行客户尽职调查义务的法律责任。\n\n第三方应当向金融机构提供必要的客户尽职调查信息，并配合金融机构持续开展客户尽职调查。"},{"n":33,"label":"第三十三条","chapter":"第三章  反洗钱义务","text":"金融机构进行客户尽职调查，可以通过反洗钱行政主管部门以及公安、市场监督管理、民政、税务、移民管理、电信管理等部门依法核实客户身份等有关信息，相关部门应当依法予以支持。\n\n国务院反洗钱行政主管部门应当协调推动相关部门为金融机构开展客户尽职调查提供必要的便利。"},{"n":34,"label":"第三十四条","chapter":"第三章  反洗钱义务","text":"金融机构应当按照规定建立客户身份资料和交易记录保存制度。\n\n在业务关系存续期间，客户身份信息发生变更的，应当及时更新。\n\n客户身份资料在业务关系结束后、客户交易信息在交易结束后，应当至少保存十年。\n\n金融机构解散、被撤销或者被宣告破产时，应当将客户身份资料和客户交易信息移交国务院有关部门指定的机构。"},{"n":35,"label":"第三十五条","chapter":"第三章  反洗钱义务","text":"金融机构应当按照规定执行大额交易报告制度，客户单笔交易或者在一定期限内的累计交易超过规定金额的，应当及时向反洗钱监测分析机构报告。\n\n金融机构应当按照规定执行可疑交易报告制度，制定并不断优化监测标准，有效识别、分析可疑交易活动，及时向反洗钱监测分析机构提交可疑交易报告；提交可疑交易报告的情况应当保密。"},{"n":36,"label":"第三十六条","chapter":"第三章  反洗钱义务","text":"金融机构应当在反洗钱行政主管部门的指导下，关注、评估运用新技术、新产品、新业务等带来的洗钱风险，根据情形采取相应措施，降低洗钱风险。"},{"n":37,"label":"第三十七条","chapter":"第三章  反洗钱义务","text":"在境内外设有分支机构或者控股其他金融机构的金融机构，以及金融控股公司，应当在总部或者集团层面统筹安排反洗钱工作。为履行反洗钱义务在公司内部、集团成员之间共享必要的反洗钱信息的，应当明确信息共享机制和程序。共享反洗钱信息，应当符合有关信息保护的法律规定，并确保相关信息不被用于反洗钱和反恐怖主义融资以外的用途。"},{"n":38,"label":"第三十八条","chapter":"第三章  反洗钱义务","text":"与金融机构存在业务关系的单位和个人应当配合金融机构的客户尽职调查，提供真实有效的身份证件或者其他身份证明文件，准确、完整填报身份信息，如实提供与交易和资金相关的资料。\n\n单位和个人拒不配合金融机构依照本法采取的合理的客户尽职调查措施的，金融机构按照规定的程序，可以采取限制或者拒绝办理业务、终止业务关系等洗钱风险管理措施，并根据情况提交可疑交易报告。"},{"n":39,"label":"第三十九条","chapter":"第三章  反洗钱义务","text":"单位和个人对金融机构采取洗钱风险管理措施有异议的，可以向金融机构提出。金融机构应当在十五日内进行处理，并将结果答复当事人；涉及客户基本的、必需的金融服务的，应当及时处理并答复当事人。相关单位和个人逾期未收到答复，或者对处理结果不满意的，可以向反洗钱行政主管部门投诉。\n\n前款规定的单位和个人对金融机构采取洗钱风险管理措施有异议的，也可以依法直接向人民法院提起诉讼。"},{"n":40,"label":"第四十条","chapter":"第三章  反洗钱义务","text":"任何单位和个人应当按照国家有关机关要求对下列名单所列对象采取反洗钱特别预防措施：\n\n（一）国家反恐怖主义工作领导机构认定并由其办事机构公告的恐怖活动组织和人员名单；\n\n（二）外交部发布的执行联合国安理会决议通知中涉及定向金融制裁的组织和人员名单；\n\n（三）国务院反洗钱行政主管部门认定或者会同国家有关机关认定的，具有重大洗钱风险、不采取措施可能造成严重后果的组织和人员名单。\n对前款第一项规定的名单有异议的，当事人可以依照《中华人民共和国反恐怖主义法》的规定申请复核。对前款第二项规定的名单有异议的，当事人可以按照有关程序提出从名单中除去的申请。对前款第三项规定的名单有异议的，当事人可以向作出认定的部门申请行政复议；对行政复议决定不服的，可以依法提起行政诉讼。\n\n反洗钱特别预防措施包括立即停止向名单所列对象及其代理人、受其指使的组织和人员、其直接或者间接控制的组织提供金融等服务或者资金、资产，立即限制相关资金、资产转移等。\n\n第一款规定的名单所列对象可以按照规定向国家有关机关申请使用被限制的资金、资产用于单位和个人的基本开支及其他必需支付的费用。采取反洗钱特别预防措施应当保护善意第三人合法权益，善意第三人可以依法进行权利救济。"},{"n":41,"label":"第四十一条","chapter":"第三章  反洗钱义务","text":"金融机构应当识别、评估相关风险并制定相应的制度，及时获取本法第四十条第一款规定的名单，对客户及其交易对象进行核查，采取相应措施，并向反洗钱行政主管部门报告。"},{"n":42,"label":"第四十二条","chapter":"第三章  反洗钱义务","text":"特定非金融机构在从事规定的特定业务时，参照本章关于金融机构履行反洗钱义务的相关规定，根据行业特点、经营规模、洗钱风险状况履行反洗钱义务。"},{"n":43,"label":"第四十三条","chapter":"第四章  反洗钱调查","text":"国务院反洗钱行政主管部门或者其设区的市级以上派出机构发现涉嫌洗钱的可疑交易活动或者违反本法规定的其他行为，需要调查核实的，经国务院反洗钱行政主管部门或者其设区的市级以上派出机构负责人批准，可以向金融机构、特定非金融机构发出调查通知书，开展反洗钱调查。\n\n反洗钱行政主管部门开展反洗钱调查，涉及特定非金融机构的，必要时可以请求有关特定非金融机构主管部门予以协助。\n\n金融机构、特定非金融机构应当配合反洗钱调查，在规定时限内如实提供有关文件、资料。\n\n开展反洗钱调查，调查人员不得少于二人，并应当出示执法证件和调查通知书；调查人员少于二人或者未出示执法证件和调查通知书的，金融机构、特定非金融机构有权拒绝接受调查。"},{"n":44,"label":"第四十四条","chapter":"第四章  反洗钱调查","text":"国务院反洗钱行政主管部门或者其设区的市级以上派出机构开展反洗钱调查，可以采取下列措施：\n\n（一）询问金融机构、特定非金融机构有关人员，要求其说明情况；\n\n（二）查阅、复制被调查对象的账户信息、交易记录和其他有关资料；\n\n（三）对可能被转移、隐匿、篡改或者毁损的文件、资料予以封存。\n询问应当制作询问笔录。询问笔录应当交被询问人核对。记载有遗漏或者差错的，被询问人可以要求补充或者更正。被询问人确认笔录无误后，应当签名或者盖章；调查人员也应当在笔录上签名。\n\n调查人员封存文件、资料，应当会同金融机构、特定非金融机构的工作人员查点清楚，当场开列清单一式二份，由调查人员和金融机构、特定非金融机构的工作人员签名或者盖章，一份交金融机构或者特定非金融机构，一份附卷备查。"},{"n":45,"label":"第四十五条","chapter":"第四章  反洗钱调查","text":"经调查仍不能排除洗钱嫌疑或者发现其他违法犯罪线索的，应当及时向有管辖权的机关移送。接受移送的机关应当按照有关规定反馈处理结果。\n\n客户转移调查所涉及的账户资金的，国务院反洗钱行政主管部门认为必要时，经其负责人批准，可以采取临时冻结措施。\n\n接受移送的机关接到线索后，对已依照前款规定临时冻结的资金，应当及时决定是否继续冻结。接受移送的机关认为需要继续冻结的，依照相关法律规定采取冻结措施；认为不需要继续冻结的，应当立即通知国务院反洗钱行政主管部门，国务院反洗钱行政主管部门应当立即通知金融机构解除冻结。\n临时冻结不得超过四十八小时。金融机构在按照国务院反洗钱行政主管部门的要求采取临时冻结措施后四十八小时内，未接到国家有关机关继续冻结通知的，应当立即解除冻结。"},{"n":46,"label":"第四十六条","chapter":"第五章  反洗钱国际合作","text":"中华人民共和国根据缔结或者参加的国际条约，或者按照平等互惠原则，开展反洗钱国际合作。"},{"n":47,"label":"第四十七条","chapter":"第五章  反洗钱国际合作","text":"国务院反洗钱行政主管部门根据国务院授权，负责组织、协调反洗钱国际合作，代表中国政府参与有关国际组织活动，依法与境外相关机构开展反洗钱合作，交换反洗钱信息。\n\n国家有关机关依法在职责范围内开展反洗钱国际合作。"},{"n":48,"label":"第四十八条","chapter":"第五章  反洗钱国际合作","text":"涉及追究洗钱犯罪的司法协助，依照《中华人民共和国国际刑事司法协助法》以及有关法律的规定办理。"},{"n":49,"label":"第四十九条","chapter":"第五章  反洗钱国际合作","text":"国家有关机关在依法调查洗钱和恐怖主义融资活动过程中，按照对等原则或者经与有关国家协商一致，可以要求在境内开立代理行账户或者与我国存在其他密切金融联系的境外金融机构予以配合。"},{"n":50,"label":"第五十条","chapter":"第五章  反洗钱国际合作","text":"外国国家、组织违反对等、协商一致原则直接要求境内金融机构提交客户身份资料、交易信息，扣押、冻结、划转境内资金、资产，或者作出其他行动的，金融机构不得擅自执行，并应当及时向国务院有关金融管理部门报告。\n\n除前款规定外，外国国家、组织基于合规监管的需要，要求境内金融机构提供概要性合规信息、经营信息等信息的，境内金融机构向国务院有关金融管理部门和国家有关机关报告后可以提供或者予以配合。\n\n前两款规定的资料、信息涉及重要数据和个人信息的，还应当符合国家数据安全管理、个人信息保护有关规定。"},{"n":51,"label":"第五十一条","chapter":"第六章  法律责任","text":"反洗钱行政主管部门和其他依法负有反洗钱监督管理职责的部门从事反洗钱工作的人员有下列行为之一的，依法给予处分：\n\n（一）违反规定进行检查、调查或者采取临时冻结措施；\n\n（二）泄露因反洗钱知悉的国家秘密、商业秘密或者个人隐私、个人信息；\n\n（三）违反规定对有关机构和人员实施行政处罚；\n\n（四）其他不依法履行职责的行为。\n\n其他国家机关工作人员有前款第二项行为的，依法给予处分。"},{"n":52,"label":"第五十二条","chapter":"第六章  法律责任","text":"金融机构有下列情形之一的，由国务院反洗钱行政主管部门或者其设区的市级以上派出机构责令限期改正；情节较重的，给予警告或者处二十万元以下罚款；情节严重或者逾期未改正的，处二十万元以上二百万元以下罚款，可以根据情形在职责范围内或者建议有关金融管理部门限制或者禁止其开展相关业务：\n\n（一）未按照规定制定、完善反洗钱内部控制制度规范；\n\n（二）未按照规定设立专门机构或者指定内设机构牵头负责反洗钱工作；\n\n（三）未按照规定根据经营规模和洗钱风险状况配备相应人员；\n\n（四）未按照规定开展洗钱风险评估或者健全相应的风险管理制度；\n\n（五）未按照规定制定、完善可疑交易监测标准；\n\n（六）未按照规定开展反洗钱内部审计或者社会审计；\n\n（七）未按照规定开展反洗钱培训；\n\n（八）应当建立反洗钱相关信息系统而未建立，或者未按照规定完善反洗钱相关信息系统；\n\n（九）金融机构的负责人未能有效履行反洗钱职责。"},{"n":53,"label":"第五十三条","chapter":"第六章  法律责任","text":"金融机构有下列行为之一的，由国务院反洗钱行政主管部门或者其设区的市级以上派出机构责令限期改正，可以给予警告或者处二十万元以下罚款；情节严重或者逾期未改正的，处二十万元以上二百万元以下罚款：\n（一）未按照规定开展客户尽职调查；\n\n（二）未按照规定保存客户身份资料和交易记录；\n\n（三）未按照规定报告大额交易；\n\n（四）未按照规定报告可疑交易。"},{"n":54,"label":"第五十四条","chapter":"第六章  法律责任","text":"金融机构有下列行为之一的，由国务院反洗钱行政主管部门或者其设区的市级以上派出机构责令限期改正，处五十万元以下罚款；情节严重的，处五十万元以上五百万元以下罚款，可以根据情形在职责范围内或者建议有关金融管理部门限制或者禁止其开展相关业务：\n\n（一）为身份不明的客户提供服务、与其进行交易，为客户开立匿名账户、假名账户，或者为冒用他人身份的客户开立账户；\n\n（二）未按照规定对洗钱高风险情形采取相应洗钱风险管理措施；\n\n（三）未按照规定采取反洗钱特别预防措施；\n\n（四）违反保密规定，查询、泄露有关信息；\n\n（五）拒绝、阻碍反洗钱监督管理、调查，或者故意提供虚假材料；\n\n（六）篡改、伪造或者无正当理由删除客户身份资料、交易记录；\n\n（七）自行或者协助客户以拆分交易等方式故意逃避履行反洗钱义务。"},{"n":55,"label":"第五十五条","chapter":"第六章  法律责任","text":"金融机构有本法第五十三条、第五十四条规定的行为，致使犯罪所得及其收益通过本机构得以掩饰、隐瞒的，或者致使恐怖主义融资后果发生的，由国务院反洗钱行政主管部门或者其设区的市级以上派出机构责令限期改正，涉及金额不足一千万元的，处五十万元以上一千万元以下罚款；涉及金额一千万元以上的，处涉及金额百分之二十以上二倍以下罚款；情节严重的，可以根据情形在职责范围内实施或者建议有关金融管理部门实施限制、禁止其开展相关业务，或者责令停业整顿、吊销经营许可证等处罚。"},{"n":56,"label":"第五十六条","chapter":"第六章  法律责任","text":"国务院反洗钱行政主管部门或者其设区的市级以上派出机构依照本法第五十二条至第五十四条规定对金融机构进行处罚的，还可以根据情形对负有责任的董事、监事、高级管理人员或者其他直接责任人员，给予警告或者处二十万元以下罚款；情节严重的，可以根据情形在职责范围内实施或者建议有关金融管理部门实施取消其任职资格、禁止其从事有关金融行业工作等处罚。\n国务院反洗钱行政主管部门或者其设区的市级以上派出机构依照本法第五十五条规定对金融机构进行处罚的，还可以根据情形对负有责任的董事、监事、高级管理人员或者其他直接责任人员，处二十万元以上一百万元以下罚款；情节严重的，可以根据情形在职责范围内实施或者建议有关金融管理部门实施取消其任职资格、禁止其从事有关金融行业工作等处罚。\n\n前两款规定的金融机构董事、监事、高级管理人员或者其他直接责任人员能够证明自己已经勤勉尽责采取反洗钱措施的，可以不予处罚。"},{"n":57,"label":"第五十七条","chapter":"第六章  法律责任","text":"金融机构违反本法第五十条规定擅自采取行动的，由国务院有关金融管理部门处五十万元以下罚款；情节严重的，处五十万元以上五百万元以下罚款；造成损失的，并处所造成直接经济损失一倍以上五倍以下罚款。对负有责任的董事、监事、高级管理人员或者其他直接责任人员，可以由国务院有关金融管理部门给予警告或者处五十万元以下罚款。\n\n境外金融机构违反本法第四十九条规定，对国家有关机关的调查不予配合的，由国务院反洗钱行政主管部门依照本法第五十四条、第五十六条规定进行处罚，并可以根据情形将其列入本法第四十条第一款第三项规定的名单。"},{"n":58,"label":"第五十八条","chapter":"第六章  法律责任","text":"特定非金融机构违反本法规定的，由有关特定非金融机构主管部门责令限期改正；情节较重的，给予警告或者处五万元以下罚款；情节严重或者逾期未改正的，处五万元以上五十万元以下罚款；对有关负责人，可以给予警告或者处五万元以下罚款。"},{"n":59,"label":"第五十九条","chapter":"第六章  法律责任","text":"金融机构、特定非金融机构以外的单位和个人未依照本法第四十条规定履行反洗钱特别预防措施义务的，由国务院反洗钱行政主管部门或者其设区的市级以上派出机构责令限期改正；情节严重的，对单位给予警告或者处二十万元以下罚款，对个人给予警告或者处五万元以下罚款。"},{"n":60,"label":"第六十条","chapter":"第六章  法律责任","text":"法人、非法人组织未按照规定向登记机关提交受益所有人信息的，由登记机关责令限期改正；拒不改正的，处五万元以下罚款。向登记机关提交虚假或者不实的受益所有人信息，或者未按照规定及时更新受益所有人信息的，由国务院反洗钱行政主管部门或者其设区的市级以上派出机构责令限期改正；拒不改正的，处五万元以下罚款。"},{"n":61,"label":"第六十一条","chapter":"第六章  法律责任","text":"国务院反洗钱行政主管部门应当综合考虑金融机构的经营规模、内部控制制度执行情况、勤勉尽责程度、违法行为持续时间、危害程度以及整改情况等因素，制定本法相关行政处罚裁量基准。"},{"n":62,"label":"第六十二条","chapter":"第六章  法律责任","text":"违反本法规定，构成犯罪的，依法追究刑事责任。\n\n利用金融机构、特定非金融机构实施或者通过非法渠道实施洗钱犯罪的，依法追究刑事责任。"},{"n":63,"label":"第六十三条","chapter":"第七章  附  则","text":"在境内设立的下列机构，履行本法规定的金融机构反洗钱义务：\n\n（一）银行业、证券基金期货业、保险业、信托业金融机构；\n\n（二）非银行支付机构；\n\n（三）国务院反洗钱行政主管部门确定并公布的其他从事金融业务的机构。"},{"n":64,"label":"第六十四条","chapter":"第七章  附  则","text":"在境内设立的下列机构，履行本法规定的特定非金融机构反洗钱义务：\n\n（一）提供房屋销售、房屋买卖经纪服务的房地产开发企业或者房地产中介机构；\n\n（二）接受委托为客户办理买卖不动产，代管资金、证券或者其他资产，代管银行账户、证券账户，为成立、运营企业筹措资金以及代理买卖经营性实体业务的会计师事务所、律师事务所、公证机构；\n\n（三）从事规定金额以上贵金属、宝石现货交易的交易商；\n\n（四）国务院反洗钱行政主管部门会同国务院有关部门根据洗钱风险状况确定的其他需要履行反洗钱义务的机构。"},{"n":65,"label":"第六十五条","chapter":"第七章  附  则","text":"本法自2025年1月1日起施行。"}],"source":"https://qspfw.moe.gov.cn/html/sublaws/20241210/22516.html","textSource":"https://qspfw.moe.gov.cn/html/sublaws/20241210/22516.html","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"8f83616ebfeb0cec4eb216246bf061b50f7677161ac3d14a28da7982fc3cf4dd"},{"id":"privacy","title":"中华人民共和国个人信息保护法","level":"法律","issuer":"全国人大常委会","version":"2021年通过","effective":"2021-11-01","scope":"通用","topics":["TA数据","外包","跨境","权限"],"overview":"投资者身份、联系方式与金融账户等信息的处理需要有合法基础并遵守必要性要求。管理人与服务商之间的数据交接也属于需要治理的处理活动。","practice":"画清数据流、处理角色和访问权限；委托处理、提供给其他处理者、向境外提供信息分别判断，不能只靠一份笼统同意书。","priority":[6,13,21,23,28,38,39,51,55],"articles":[{"n":1,"label":"第一条","chapter":"第一章　总　　则","text":"为了保护个人信息权益，规范个人信息处理活动，促进个人信息合理利用，根据宪法，制定本法。"},{"n":2,"label":"第二条","chapter":"第一章　总　　则","text":"自然人的个人信息受法律保护，任何组织、个人不得侵害自然人的个人信息权益。"},{"n":3,"label":"第三条","chapter":"第一章　总　　则","text":"在中华人民共和国境内处理自然人个人信息的活动，适用本法。\n\n在中华人民共和国境外处理中华人民共和国境内自然人个人信息的活动，有下列情形之一的，也适用本法：\n\n（一）以向境内自然人提供产品或者服务为目的；\n\n（二）分析、评估境内自然人的行为；\n\n（三）法律、行政法规规定的其他情形。"},{"n":4,"label":"第四条","chapter":"第一章　总　　则","text":"个人信息是以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息，不包括匿名化处理后的信息。\n\n个人信息的处理包括个人信息的收集、存储、使用、加工、传输、提供、公开、删除等。"},{"n":5,"label":"第五条","chapter":"第一章　总　　则","text":"处理个人信息应当遵循合法、正当、必要和诚信原则，不得通过误导、欺诈、胁迫等方式处理个人信息。"},{"n":6,"label":"第六条","chapter":"第一章　总　　则","text":"处理个人信息应当具有明确、合理的目的，并应当与处理目的直接相关，采取对个人权益影响最小的方式。\n\n收集个人信息，应当限于实现处理目的的最小范围，不得过度收集个人信息。"},{"n":7,"label":"第七条","chapter":"第一章　总　　则","text":"处理个人信息应当遵循公开、透明原则，公开个人信息处理规则，明示处理的目的、方式和范围。"},{"n":8,"label":"第八条","chapter":"第一章　总　　则","text":"处理个人信息应当保证个人信息的质量，避免因个人信息不准确、不完整对个人权益造成不利影响。"},{"n":9,"label":"第九条","chapter":"第一章　总　　则","text":"个人信息处理者应当对其个人信息处理活动负责，并采取必要措施保障所处理的个人信息的安全。"},{"n":10,"label":"第十条","chapter":"第一章　总　　则","text":"任何组织、个人不得非法收集、使用、加工、传输他人个人信息，不得非法买卖、提供或者公开他人个人信息；不得从事危害国家安全、公共利益的个人信息处理活动。"},{"n":11,"label":"第十一条","chapter":"第一章　总　　则","text":"国家建立健全个人信息保护制度，预防和惩治侵害个人信息权益的行为，加强个人信息保护宣传教育，推动形成政府、企业、相关社会组织、公众共同参与个人信息保护的良好环境。"},{"n":12,"label":"第十二条","chapter":"第一章　总　　则","text":"国家积极参与个人信息保护国际规则的制定，促进个人信息保护方面的国际交流与合作，推动与其他国家、地区、国际组织之间的个人信息保护规则、标准等互认。"},{"n":13,"label":"第十三条","chapter":"第二章　个人信息处理规则","text":"符合下列情形之一的，个人信息处理者方可处理个人信息：\n\n（一）取得个人的同意；\n\n（二）为订立、履行个人作为一方当事人的合同所必需，或者按照依法制定的劳动规章制度和依法签订的集体合同实施人力资源管理所必需；\n\n（三）为履行法定职责或者法定义务所必需；\n\n（四）为应对突发公共卫生事件，或者紧急情况下为保护自然人的生命健康和财产安全所必需；\n\n（五）为公共利益实施新闻报道、舆论监督等行为，在合理的范围内处理个人信息；\n\n（六）依照本法规定在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；\n\n（七）法律、行政法规规定的其他情形。\n依照本法其他有关规定，处理个人信息应当取得个人同意，但是有前款第二项至第七项规定情形的，不需取得个人同意。"},{"n":14,"label":"第十四条","chapter":"第二章　个人信息处理规则","text":"基于个人同意处理个人信息的，该同意应当由个人在充分知情的前提下自愿、明确作出。法律、行政法规规定处理个人信息应当取得个人单独同意或者书面同意的，从其规定。\n\n个人信息的处理目的、处理方式和处理的个人信息种类发生变更的，应当重新取得个人同意。"},{"n":15,"label":"第十五条","chapter":"第二章　个人信息处理规则","text":"基于个人同意处理个人信息的，个人有权撤回其同意。个人信息处理者应当提供便捷的撤回同意的方式。\n\n个人撤回同意，不影响撤回前基于个人同意已进行的个人信息处理活动的效力。"},{"n":16,"label":"第十六条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者不得以个人不同意处理其个人信息或者撤回同意为由，拒绝提供产品或者服务；处理个人信息属于提供产品或者服务所必需的除外。"},{"n":17,"label":"第十七条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者在处理个人信息前，应当以显著方式、清晰易懂的语言真实、准确、完整地向个人告知下列事项：\n\n（一）个人信息处理者的名称或者姓名和联系方式；\n\n（二）个人信息的处理目的、处理方式，处理的个人信息种类、保存期限；\n\n（三）个人行使本法规定权利的方式和程序；\n\n（四）法律、行政法规规定应当告知的其他事项。\n前款规定事项发生变更的，应当将变更部分告知个人。\n\n个人信息处理者通过制定个人信息处理规则的方式告知第一款规定事项的，处理规则应当公开，并且便于查阅和保存。"},{"n":18,"label":"第十八条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者处理个人信息，有法律、行政法规规定应当保密或者不需要告知的情形的，可以不向个人告知前条第一款规定的事项。\n\n紧急情况下为保护自然人的生命健康和财产安全无法及时向个人告知的，个人信息处理者应当在紧急情况消除后及时告知。"},{"n":19,"label":"第十九条","chapter":"第二章　个人信息处理规则","text":"除法律、行政法规另有规定外，个人信息的保存期限应当为实现处理目的所必要的最短时间。"},{"n":20,"label":"第二十条","chapter":"第二章　个人信息处理规则","text":"两个以上的个人信息处理者共同决定个人信息的处理目的和处理方式的，应当约定各自的权利和义务。但是，该约定不影响个人向其中任何一个个人信息处理者要求行使本法规定的权利。\n\n个人信息处理者共同处理个人信息，侵害个人信息权益造成损害的，应当依法承担连带责任。"},{"n":21,"label":"第二十一条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者委托处理个人信息的，应当与受托人约定委托处理的目的、期限、处理方式、个人信息的种类、保护措施以及双方的权利和义务等，并对受托人的个人信息处理活动进行监督。\n受托人应当按照约定处理个人信息，不得超出约定的处理目的、处理方式等处理个人信息；委托合同不生效、无效、被撤销或者终止的，受托人应当将个人信息返还个人信息处理者或者予以删除，不得保留。\n\n未经个人信息处理者同意，受托人不得转委托他人处理个人信息。"},{"n":22,"label":"第二十二条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者因合并、分立、解散、被宣告破产等原因需要转移个人信息的，应当向个人告知接收方的名称或者姓名和联系方式。接收方应当继续履行个人信息处理者的义务。接收方变更原先的处理目的、处理方式的，应当依照本法规定重新取得个人同意。"},{"n":23,"label":"第二十三条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者向其他个人信息处理者提供其处理的个人信息的，应当向个人告知接收方的名称或者姓名、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意。接收方应当在上述处理目的、处理方式和个人信息的种类等范围内处理个人信息。接收方变更原先的处理目的、处理方式的，应当依照本法规定重新取得个人同意。"},{"n":24,"label":"第二十四条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇。\n通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，或者向个人提供便捷的拒绝方式。\n\n通过自动化决策方式作出对个人权益有重大影响的决定，个人有权要求个人信息处理者予以说明，并有权拒绝个人信息处理者仅通过自动化决策的方式作出决定。"},{"n":25,"label":"第二十五条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者不得公开其处理的个人信息，取得个人单独同意的除外。"},{"n":26,"label":"第二十六条","chapter":"第二章　个人信息处理规则","text":"在公共场所安装图像采集、个人身份识别设备，应当为维护公共安全所必需，遵守国家有关规定，并设置显著的提示标识。所收集的个人图像、身份识别信息只能用于维护公共安全的目的，不得用于其他目的；取得个人单独同意的除外。"},{"n":27,"label":"第二十七条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者可以在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；个人明确拒绝的除外。个人信息处理者处理已公开的个人信息，对个人权益有重大影响的，应当依照本法规定取得个人同意。\n\n第二节　敏感个人信息的处理规则"},{"n":28,"label":"第二十八条","chapter":"第二章　个人信息处理规则","text":"敏感个人信息是一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。\n\n只有在具有特定的目的和充分的必要性，并采取严格保护措施的情形下，个人信息处理者方可处理敏感个人信息。"},{"n":29,"label":"第二十九条","chapter":"第二章　个人信息处理规则","text":"处理敏感个人信息应当取得个人的单独同意；法律、行政法规规定处理敏感个人信息应当取得书面同意的，从其规定。"},{"n":30,"label":"第三十条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者处理敏感个人信息的，除本法第十七条第一款规定的事项外，还应当向个人告知处理敏感个人信息的必要性以及对个人权益的影响；依照本法规定可以不向个人告知的除外。"},{"n":31,"label":"第三十一条","chapter":"第二章　个人信息处理规则","text":"个人信息处理者处理不满十四周岁未成年人个人信息的，应当取得未成年人的父母或者其他监护人的同意。\n\n个人信息处理者处理不满十四周岁未成年人个人信息的，应当制定专门的个人信息处理规则。"},{"n":32,"label":"第三十二条","chapter":"第二章　个人信息处理规则","text":"法律、行政法规对处理敏感个人信息规定应当取得相关行政许可或者作出其他限制的，从其规定。\n\n第三节　国家机关处理个人信息的特别规定"},{"n":33,"label":"第三十三条","chapter":"第二章　个人信息处理规则","text":"国家机关处理个人信息的活动，适用本法；本节有特别规定的，适用本节规定。"},{"n":34,"label":"第三十四条","chapter":"第二章　个人信息处理规则","text":"国家机关为履行法定职责处理个人信息，应当依照法律、行政法规规定的权限、程序进行，不得超出履行法定职责所必需的范围和限度。"},{"n":35,"label":"第三十五条","chapter":"第二章　个人信息处理规则","text":"国家机关为履行法定职责处理个人信息，应当依照本法规定履行告知义务；有本法第十八条第一款规定的情形，或者告知将妨碍国家机关履行法定职责的除外。"},{"n":36,"label":"第三十六条","chapter":"第二章　个人信息处理规则","text":"国家机关处理的个人信息应当在中华人民共和国境内存储；确需向境外提供的，应当进行安全评估。安全评估可以要求有关部门提供支持与协助。"},{"n":37,"label":"第三十七条","chapter":"第二章　个人信息处理规则","text":"法律、法规授权的具有管理公共事务职能的组织为履行法定职责处理个人信息，适用本法关于国家机关处理个人信息的规定。"},{"n":38,"label":"第三十八条","chapter":"第三章　个人信息跨境提供的规则","text":"个人信息处理者因业务等需要，确需向中华人民共和国境外提供个人信息的，应当具备下列条件之一：\n\n（一）依照本法第四十条的规定通过国家网信部门组织的安全评估；\n\n（二）按照国家网信部门的规定经专业机构进行个人信息保护认证；\n\n（三）按照国家网信部门制定的标准合同与境外接收方订立合同，约定双方的权利和义务；\n（四）法律、行政法规或者国家网信部门规定的其他条件。\n\n中华人民共和国缔结或者参加的国际条约、协定对向中华人民共和国境外提供个人信息的条件等有规定的，可以按照其规定执行。\n\n个人信息处理者应当采取必要措施，保障境外接收方处理个人信息的活动达到本法规定的个人信息保护标准。"},{"n":39,"label":"第三十九条","chapter":"第三章　个人信息跨境提供的规则","text":"个人信息处理者向中华人民共和国境外提供个人信息的，应当向个人告知境外接收方的名称或者姓名、联系方式、处理目的、处理方式、个人信息的种类以及个人向境外接收方行使本法规定权利的方式和程序等事项，并取得个人的单独同意。"},{"n":40,"label":"第四十条","chapter":"第三章　个人信息跨境提供的规则","text":"关键信息基础设施运营者和处理个人信息达到国家网信部门规定数量的个人信息处理者，应当将在中华人民共和国境内收集和产生的个人信息存储在境内。确需向境外提供的，应当通过国家网信部门组织的安全评估；法律、行政法规和国家网信部门规定可以不进行安全评估的，从其规定。"},{"n":41,"label":"第四十一条","chapter":"第三章　个人信息跨境提供的规则","text":"中华人民共和国主管机关根据有关法律和中华人民共和国缔结或者参加的国际条约、协定，或者按照平等互惠原则，处理外国司法或者执法机构关于提供存储于境内个人信息的请求。非经中华人民共和国主管机关批准，个人信息处理者不得向外国司法或者执法机构提供存储于中华人民共和国境内的个人信息。"},{"n":42,"label":"第四十二条","chapter":"第三章　个人信息跨境提供的规则","text":"境外的组织、个人从事侵害中华人民共和国公民的个人信息权益，或者危害中华人民共和国国家安全、公共利益的个人信息处理活动的，国家网信部门可以将其列入限制或者禁止个人信息提供清单，予以公告，并采取限制或者禁止向其提供个人信息等措施。"},{"n":43,"label":"第四十三条","chapter":"第三章　个人信息跨境提供的规则","text":"任何国家或者地区在个人信息保护方面对中华人民共和国采取歧视性的禁止、限制或者其他类似措施的，中华人民共和国可以根据实际情况对该国家或者地区对等采取措施。"},{"n":44,"label":"第四十四条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理；法律、行政法规另有规定的除外。"},{"n":45,"label":"第四十五条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"个人有权向个人信息处理者查阅、复制其个人信息；有本法第十八条第一款、第三十五条规定情形的除外。\n个人请求查阅、复制其个人信息的，个人信息处理者应当及时提供。\n\n个人请求将个人信息转移至其指定的个人信息处理者，符合国家网信部门规定条件的，个人信息处理者应当提供转移的途径。"},{"n":46,"label":"第四十六条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"个人发现其个人信息不准确或者不完整的，有权请求个人信息处理者更正、补充。\n\n个人请求更正、补充其个人信息的，个人信息处理者应当对其个人信息予以核实，并及时更正、补充。"},{"n":47,"label":"第四十七条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"有下列情形之一的，个人信息处理者应当主动删除个人信息；个人信息处理者未删除的，个人有权请求删除：\n\n（一）处理目的已实现、无法实现或者为实现处理目的不再必要；\n\n（二）个人信息处理者停止提供产品或者服务，或者保存期限已届满；\n\n（三）个人撤回同意；\n\n（四）个人信息处理者违反法律、行政法规或者违反约定处理个人信息；\n\n（五）法律、行政法规规定的其他情形。\n\n法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，个人信息处理者应当停止除存储和采取必要的安全保护措施之外的处理。"},{"n":48,"label":"第四十八条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"个人有权要求个人信息处理者对其个人信息处理规则进行解释说明。"},{"n":49,"label":"第四十九条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"自然人死亡的，其近亲属为了自身的合法、正当利益，可以对死者的相关个人信息行使本章规定的查阅、复制、更正、删除等权利；死者生前另有安排的除外。"},{"n":50,"label":"第五十条","chapter":"第四章　个人在个人信息处理活动中的权利","text":"个人信息处理者应当建立便捷的个人行使权利的申请受理和处理机制。拒绝个人行使权利的请求的，应当说明理由。\n\n个人信息处理者拒绝个人行使权利的请求的，个人可以依法向人民法院提起诉讼。"},{"n":51,"label":"第五十一条","chapter":"第五章　个人信息处理者的义务","text":"个人信息处理者应当根据个人信息的处理目的、处理方式、个人信息的种类以及对个人权益的影响、可能存在的安全风险等，采取下列措施确保个人信息处理活动符合法律、行政法规的规定，并防止未经授权的访问以及个人信息泄露、篡改、丢失：\n\n（一）制定内部管理制度和操作规程；\n\n（二）对个人信息实行分类管理；\n\n（三）采取相应的加密、去标识化等安全技术措施；\n\n（四）合理确定个人信息处理的操作权限，并定期对从业人员进行安全教育和培训；\n\n（五）制定并组织实施个人信息安全事件应急预案；\n\n（六）法律、行政法规规定的其他措施。"},{"n":52,"label":"第五十二条","chapter":"第五章　个人信息处理者的义务","text":"处理个人信息达到国家网信部门规定数量的个人信息处理者应当指定个人信息保护负责人，负责对个人信息处理活动以及采取的保护措施等进行监督。\n\n个人信息处理者应当公开个人信息保护负责人的联系方式，并将个人信息保护负责人的姓名、联系方式等报送履行个人信息保护职责的部门。"},{"n":53,"label":"第五十三条","chapter":"第五章　个人信息处理者的义务","text":"本法第三条第二款规定的中华人民共和国境外的个人信息处理者，应当在中华人民共和国境内设立专门机构或者指定代表，负责处理个人信息保护相关事务，并将有关机构的名称或者代表的姓名、联系方式等报送履行个人信息保护职责的部门。"},{"n":54,"label":"第五十四条","chapter":"第五章　个人信息处理者的义务","text":"个人信息处理者应当定期对其处理个人信息遵守法律、行政法规的情况进行合规审计。"},{"n":55,"label":"第五十五条","chapter":"第五章　个人信息处理者的义务","text":"有下列情形之一的，个人信息处理者应当事前进行个人信息保护影响评估，并对处理情况进行记录：\n\n（一）处理敏感个人信息；\n\n（二）利用个人信息进行自动化决策；\n\n（三）委托处理个人信息、向其他个人信息处理者提供个人信息、公开个人信息；\n\n（四）向境外提供个人信息；\n\n（五）其他对个人权益有重大影响的个人信息处理活动。"},{"n":56,"label":"第五十六条","chapter":"第五章　个人信息处理者的义务","text":"个人信息保护影响评估应当包括下列内容：\n（一）个人信息的处理目的、处理方式等是否合法、正当、必要；\n\n（二）对个人权益的影响及安全风险；\n\n（三）所采取的保护措施是否合法、有效并与风险程度相适应。\n\n个人信息保护影响评估报告和处理情况记录应当至少保存三年。"},{"n":57,"label":"第五十七条","chapter":"第五章　个人信息处理者的义务","text":"发生或者可能发生个人信息泄露、篡改、丢失的，个人信息处理者应当立即采取补救措施，并通知履行个人信息保护职责的部门和个人。通知应当包括下列事项：\n\n（一）发生或者可能发生个人信息泄露、篡改、丢失的信息种类、原因和可能造成的危害；\n\n（二）个人信息处理者采取的补救措施和个人可以采取的减轻危害的措施；\n\n（三）个人信息处理者的联系方式。\n\n个人信息处理者采取措施能够有效避免信息泄露、篡改、丢失造成危害的，个人信息处理者可以不通知个人；履行个人信息保护职责的部门认为可能造成危害的，有权要求个人信息处理者通知个人。"},{"n":58,"label":"第五十八条","chapter":"第五章　个人信息处理者的义务","text":"提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当履行下列义务：\n\n（一）按照国家规定建立健全个人信息保护合规制度体系，成立主要由外部成员组成的独立机构对个人信息保护情况进行监督；\n（二）遵循公开、公平、公正的原则，制定平台规则，明确平台内产品或者服务提供者处理个人信息的规范和保护个人信息的义务；\n\n（三）对严重违反法律、行政法规处理个人信息的平台内的产品或者服务提供者，停止提供服务；\n\n（四）定期发布个人信息保护社会责任报告，接受社会监督。"},{"n":59,"label":"第五十九条","chapter":"第五章　个人信息处理者的义务","text":"接受委托处理个人信息的受托人，应当依照本法和有关法律、行政法规的规定，采取必要措施保障所处理的个人信息的安全，并协助个人信息处理者履行本法规定的义务。"},{"n":60,"label":"第六十条","chapter":"第六章　履行个人信息保护职责的部门","text":"国家网信部门负责统筹协调个人信息保护工作和相关监督管理工作。国务院有关部门依照本法和有关法律、行政法规的规定，在各自职责范围内负责个人信息保护和监督管理工作。\n\n县级以上地方人民政府有关部门的个人信息保护和监督管理职责，按照国家有关规定确定。\n\n前两款规定的部门统称为履行个人信息保护职责的部门。"},{"n":61,"label":"第六十一条","chapter":"第六章　履行个人信息保护职责的部门","text":"履行个人信息保护职责的部门履行下列个人信息保护职责：\n\n（一）开展个人信息保护宣传教育，指导、监督个人信息处理者开展个人信息保护工作；\n\n（二）接受、处理与个人信息保护有关的投诉、举报；\n（三）组织对应用程序等个人信息保护情况进行测评，并公布测评结果；\n\n（四）调查、处理违法个人信息处理活动；\n\n（五）法律、行政法规规定的其他职责。"},{"n":62,"label":"第六十二条","chapter":"第六章　履行个人信息保护职责的部门","text":"国家网信部门统筹协调有关部门依据本法推进下列个人信息保护工作：\n\n（一）制定个人信息保护具体规则、标准；\n\n（二）针对小型个人信息处理者、处理敏感个人信息以及人脸识别、人工智能等新技术、新应用，制定专门的个人信息保护规则、标准；\n\n（三）支持研究开发和推广应用安全、方便的电子身份认证技术，推进网络身份认证公共服务建设；\n\n（四）推进个人信息保护社会化服务体系建设，支持有关机构开展个人信息保护评估、认证服务；\n\n（五）完善个人信息保护投诉、举报工作机制。"},{"n":63,"label":"第六十三条","chapter":"第六章　履行个人信息保护职责的部门","text":"履行个人信息保护职责的部门履行个人信息保护职责，可以采取下列措施：\n\n（一）询问有关当事人，调查与个人信息处理活动有关的情况;\n\n（二）查阅、复制当事人与个人信息处理活动有关的合同、记录、账簿以及其他有关资料;\n\n（三）实施现场检查，对涉嫌违法的个人信息处理活动进行调查;\n（四）检查与个人信息处理活动有关的设备、物品;对有证据证明是用于违法个人信息处理活动的设备、物品，向本部门主要负责人书面报告并经批准，可以查封或者扣押。\n\n履行个人信息保护职责的部门依法履行职责，当事人应当予以协助、配合，不得拒绝、阻挠。"},{"n":64,"label":"第六十四条","chapter":"第六章　履行个人信息保护职责的部门","text":"履行个人信息保护职责的部门在履行职责中，发现个人信息处理活动存在较大风险或者发生个人信息安全事件的，可以按照规定的权限和程序对该个人信息处理者的法定代表人或者主要负责人进行约谈，或者要求个人信息处理者委托专业机构对其个人信息处理活动进行合规审计。个人信息处理者应当按照要求采取措施，进行整改，消除隐患。\n\n履行个人信息保护职责的部门在履行职责中，发现违法处理个人信息涉嫌犯罪的，应当及时移送公安机关依法处理。"},{"n":65,"label":"第六十五条","chapter":"第六章　履行个人信息保护职责的部门","text":"任何组织、个人有权对违法个人信息处理活动向履行个人信息保护职责的部门进行投诉、举报。收到投诉、举报的部门应当依法及时处理，并将处理结果告知投诉、举报人。\n\n履行个人信息保护职责的部门应当公布接受投诉、举报的联系方式。"},{"n":66,"label":"第六十六条","chapter":"第七章　法律责任","text":"违反本法规定处理个人信息，或者处理个人信息未履行本法规定的个人信息保护义务的，由履行个人信息保护职责的部门责令改正，给予警告，没收违法所得，对违法处理个人信息的应用程序，责令暂停或者终止提供服务；拒不改正的，并处一百万元以下罚款；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。\n\n有前款规定的违法行为，情节严重的，由省级以上履行个人信息保护职责的部门责令改正，没收违法所得，并处五千万元以下或者上一年度营业额百分之五以下罚款，并可以责令暂停相关业务或者停业整顿、通报有关主管部门吊销相关业务许可或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处十万元以上一百万元以下罚款，并可以决定禁止其在一定期限内担任相关企业的董事、监事、高级管理人员和个人信息保护负责人。"},{"n":67,"label":"第六十七条","chapter":"第七章　法律责任","text":"有本法规定的违法行为的，依照有关法律、行政法规的规定记入信用档案，并予以公示。"},{"n":68,"label":"第六十八条","chapter":"第七章　法律责任","text":"国家机关不履行本法规定的个人信息保护义务的，由其上级机关或者履行个人信息保护职责的部门责令改正；对直接负责的主管人员和其他直接责任人员依法给予处分。\n履行个人信息保护职责的部门的工作人员玩忽职守、滥用职权、徇私舞弊，尚不构成犯罪的，依法给予处分。"},{"n":69,"label":"第六十九条","chapter":"第七章　法律责任","text":"处理个人信息侵害个人信息权益造成损害，个人信息处理者不能证明自己没有过错的，应当承担损害赔偿等侵权责任。\n\n前款规定的损害赔偿责任按照个人因此受到的损失或者个人信息处理者因此获得的利益确定;个人因此受到的损失和个人信息处理者因此获得的利益难以确定的，根据实际情况确定赔偿数额。"},{"n":70,"label":"第七十条","chapter":"第七章　法律责任","text":"个人信息处理者违反本法规定处理个人信息，侵害众多个人的权益的，人民检察院、法律规定的消费者组织和由国家网信部门确定的组织可以依法向人民法院提起诉讼。"},{"n":71,"label":"第七十一条","chapter":"第七章　法律责任","text":"违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"n":72,"label":"第七十二条","chapter":"第八章　附　　则","text":"自然人因个人或者家庭事务处理个人信息的，不适用本法。\n\n法律对各级人民政府及其有关部门组织实施的统计、档案管理活动中的个人信息处理有规定的，适用其规定。"},{"n":73,"label":"第七十三条","chapter":"第八章　附　　则","text":"本法下列用语的含义：\n\n（一）个人信息处理者，是指在个人信息处理活动中自主决定处理目的、处理方式的组织、个人。\n（二）自动化决策，是指通过计算机程序自动分析、评估个人的行为习惯、兴趣爱好或者经济、健康、信用状况等，并进行决策的活动。\n\n（三）去标识化，是指个人信息经过处理，使其在不借助额外信息的情况下无法识别特定自然人的过程。\n\n（四）匿名化，是指个人信息经过处理无法识别特定自然人且不能复原的过程。"},{"n":74,"label":"第七十四条","chapter":"第八章　附　　则","text":"本法自2021年11月1日起施行。"}],"source":"https://jyj.beijing.gov.cn/flfg/flfg/202202/t20220215_2610083.html","textSource":"https://jyj.beijing.gov.cn/flfg/flfg/202202/t20220215_2610083.html","coverage":"正文全文"
