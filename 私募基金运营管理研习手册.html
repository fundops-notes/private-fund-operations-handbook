<script id="course-data" type="application/json">{"sources":{"law":["证券投资基金法 · 官方文本","https://fg.amac.org.cn/governmentrules_3854/flfg/fl/202003/t20200311_24633.html","法规原文"],"ordinance":["私募投资基金监督管理条例","https://www.mee.gov.cn/zcwj/gwywj/202307/t20230710_1035724.shtml","政府转载"],"service":["私募投资基金服务业务管理办法（试行）","https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/zcglcpba/xgzc/201912/t20191222_19887.html","协会规则"],"internal":["私募投资基金管理人内部控制指引","https://www.amac.org.cn/fwdt/wyb/jgdjhcpbeian/smjjglrdjhcpba/xgzc/202001/t20200101_23064.html","协会规则"],"register":["登记备案办法及登记指引1—3号","https://www.amac.org.cn/xwfb/xhyw/202302/t20230224_15636.html","协会公告"],"filing":["私募证券基金备案指引第1号及材料清单","https://www.amac.org.cn/xwfb/tzgg/202309/t20230928_24118.html","协会公告"],"operate":["私募证券投资基金运作指引","https://fg.amac.org.cn/governmentrules_3854/zcgz_zlgz/zlgz_smjj/zlgz_smjj_cpl/202404/t20240430_25509.html","协会公告"],"raise":["私募投资基金募集行为管理办法","https://www.amac.org.cn/xwfb/tzgg/201604/t20160415_18610.html","协会公告"],"fit":["证券期货投资者适当性管理办法 · 2022修正","https://neris.csrc.gov.cn/falvfagui/rdqsHeader/mainbody?navbarId=3&secFutrsLawId=b139ee3b6fea460a818840e0a982cb98","证监会法规库"],"disclosure":["信息披露监督管理办法 · 第233号令","https://www.csrc.gov.cn/csrc/c101953/c7616837/content.shtml","证监会公告"],"templates":["2026信息披露实施细则及模板","https://www.amac.org.cn/xwfb/tzgg/202606/t20260605_27780.html","协会公告"],"policy":["2026私募高质量发展指导意见 · 官方问答","https://www.csrc.gov.cn/csrc/c100028/c7637251/content.shtml","政策解读"],"ningbo":["宁波辖区2026自查通知","https://www.csrc.gov.cn/ningbo/c104115/c7646413/content.shtml","地方正式通知"],"shanghai":["9月6日：上海等地私募自查报道","https://finance.sina.com.cn/roll/2026-09-06/doc-iniqwnky6915752.shtml","媒体线索"],"navnews":["8月19日：部分基金净值专项自查报道","https://finance.eastmoney.com/a/202608193846323112.html","媒体线索"],"agency":["Jensen & Meckling, 1976 · Theory of the Firm","https://josephmahoney.web.illinois.edu/BA549_Fall%202018/Session%205/5_Jensen_Meckling%20%281976%29.pdf","原始论文 · 大学存档"],"star":["Jay Galbraith · Star Model","https://jaygalbraith.com/services/star-model/","作者机构"],"simon":["Herbert Simon, 1978 · Nobel Lecture","https://www.nobelprize.org/uploads/2018/06/simon-lecture.pdf","作者演讲"],"rapid":["Bain · The Five Steps to Better Decisions","https://media.bain.com/Images/BAIN_BRIEF_Decision_Insights_The_five_steps_to_better_decisions.pdf","框架提出机构"],"safety":["Amy Edmondson, 1999 · Psychological Safety","https://dash.harvard.edu/entities/publication/13a7b031-0fdd-45ec-a7e0-2b80e2bc679f","原始研究 · 哈佛"],"loop":["MIT课程：反思假设与双环学习","https://ocw.mit.edu/courses/esd-s51-systems-leadership-and-management-praxis-summer-2014/pages/instructor-insights/refining-the-course/","大学教学资料"],"pdsa":["The Deming Institute · PDSA Cycle","https://deming.org/explore/pdsa/","作者机构"],"kotter":["Kotter · Eight Steps for Leading Change","https://www.kotterinc.com/methodology/8-steps/","框架提出机构"]},"lessons":[{"id":"framework","title":"先读懂监管地图","track":"法规基础","week":1,"minutes":18,"summary":"把法律、行政监管、自律规则和合同放在正确位置。","parts":[["六个层次","法律确立基本权利义务，行政法规建立私募整体边界，证监会规则细化监管要求，中基协自律规则落实登记备案和行业规范。办事指南解释材料与渠道，合同和内部制度规定具体承诺。交易所和结算规则按实际业务横向接入。"],["沿业务阅读","先问“谁负责”，再问“基金处于哪个阶段”，最后找该阶段的义务。不要把公募专属要求、私募股权条款或其他辖区通知直接套入境内私募证券基金。"],["做一张法规卡","记录发文机关、正式标题、生效与废止日期、适用对象、具体条款、业务事件、责任人和证据。法规阅读的终点是能够解释一个控制为什么存在。"]],"example":"收到新规时，先判产品和业务是否适用，再识别合同、报告及系统需要怎样调整。","boundary":"本页是阅读导航，法规基线来自2026-09-14材料，未穷尽后续修订。","task":"画出“投资者—基金—管理人—托管人—外包商”的关系，并标明待核实的责任。","refs":["law","ordinance"],"author":""},{"id":"outsourcing","title":"外包之后，责任在哪里","track":"法规基础","week":1,"minutes":20,"summary":"交付结果可以委托，管理人监督能力需要保留。","parts":[["规则起点","服务业务办法第五条要求建立委托风险管理安排，开展事前尽调、签署书面协议，并持续关注和定期评估服务商。管理人依法承担的责任不因委托而免除。"],["把责任变成动作","服务商资格、能力和财务稳定性要评估；交付标准、差错通报、数据取得和退出迁移要形成约定。管理人需要有人能解释数据、识别例外并推动解决。"],["监督深度","先梳理现有redo的法规、合同或集团制度依据。监督义务本身不能直接推导为所有结果每天人工全量重做；也不能把效率改善当作降低控制的充分理由。"]],"example":"外包商给出NAV，内部取得独立现金、持仓和关键价格证据，重算重要费用，追查不能解释的变动。","boundary":"以下方法是管理建议；具体复核频率和范围需依据实际义务和风险批准。","task":"写出当前最想向服务商提出的五个问题：数据、计算、时点、差错和退出安排。","refs":["service"],"author":""},{"id":"control","title":"内控如何落到岗位","track":"法规基础","week":1,"minutes":18,"summary":"制度、角色、动作和证据需要互相对应。","parts":[["认识控制链","识别风险→设计控制→安排执行与复核→保存证据→检查有效性。仅有制度不证明控制发生；签字也不自动证明检查充分。"],["岗位分离","区分交易指令、资金操作、估值处理、复核和最终授权。人员少时需设计补偿性控制；不能默认业务负责人一人包办所有环节。"],["例外也是流程","明确什么情况停止下游、谁可以作决定、谁需要知会。重要例外要记录原因、临时措施和后续复测，避免长期依赖口头许可。"]],"example":"费用参数由一人按合同录入，另一人核对生效日期；历史参数及变更证据保留，异常由有权人裁定。","boundary":"控制矩阵是本课程的实践组织方式，不是监管统一模板。","task":"选一项费用计算，写出风险、控制、执行人、复核人和证据。","refs":["internal"],"author":""},{"id":"lifecycle","title":"产品全生命周期","track":"法规基础","week":1,"minutes":20,"summary":"把设立、运作、变更和清算连接起来。","parts":[["两种登记事项","管理人登记关注主体与持续经营；基金备案关注产品及合同。重大变更、清算和持续信息更新不能因初始备案完成而被遗忘。"],["建立产品主数据","管理人和产品标识、组织形式、账户、服务商、开放安排、份额类别、费用参数、估值频率和报告要求，应有版本与证据。"],["事件驱动","新产品、新资产、新类别、新服务商和合同变更，都可能影响流程和控制。上线前确认法规适用、系统、操作和服务商准备情况。"]],"example":"新增一个份额类别时，同步评估TA登记、FA费用分摊、披露模板和销售资料。","boundary":"条款、时限与生效条件需查正式文本及本基金合同，不从其他基金照搬。","task":"列出一次产品变更会影响的五类资料及各自负责人。","refs":["register","filing","operate"],"author":""},{"id":"fa","title":"FA：解释一张净值表","track":"运营实务","week":2,"minutes":25,"summary":"从资产负债与份额出发，解释NAV怎样形成。","parts":[["输入与核算","核对交易、现金、持仓、公司行动、价格、利息及费用是否齐备，检查估值日、币种、口径和期间截止。服务商汇总表应能下钻到记录与依据。"],["三种检查","核对资产负债与净资产；核对份额和单位净值；解释净资产与损益变动。独立价格与交易证据检验输入，独立重算检验公式，两者不能互相替代。"],["费用和差错","管理费和业绩报酬要核对合同基数、费率、期间、高水位及份额安排。出现差错，先界定期间、产品和投资者影响，再按制度处理发布、更正及沟通。"]],"example":"净值大涨不一定是价格错误，也可能有公司行动、费用冲回或份额变化；先做变动桥接再判断。","boundary":"简化恒等式不能替代完整估值；多类别、分红和确认时点需分别处理。","task":"写一份NAV复核清单，至少包含完整性、价格、费用、份额和发布授权。","refs":["service","operate"],"author":""},{"id":"ta","title":"TA：资金与份额闭环","track":"运营实务","week":2,"minutes":25,"summary":"让每份申请、每笔资金和每次份额变动能够互相追溯。","parts":[["开放日前","确认申请资格、适当性及KYC接口、有效合同、账户、开放规则和截止时间。销售、合规、TA的职责要明确，不能把全部客户义务笼统交给运营。"],["开放日与确认","逐笔匹配有效申请、到账或付款、适用净值、费用及份额确认。处理迟到资金、撤单、退款、冻结和特殊申请，并明确例外批准权。"],["勾稽与留痕","期初份额加确认申购减确认赎回及其他经批准变化，应与期末登记相符。资金时间和份额确认时间可能不同，需要记录在途项和解决日期。"]],"example":"到账金额正确但投资者身份或申请无效，不能仅因钱已到账便认定可确认份额。","boundary":"具体冷静期、回访及适用豁免须联读公告和规则，不用一套流程覆盖所有投资者。","task":"设计一个迟到认购款的处理流程，写明谁判断、谁批准、何时通知。","refs":["raise","fit","service"],"author":""},{"id":"mo","title":"Middle Office：交易到交收","track":"运营实务","week":2,"minutes":25,"summary":"管理交易后数据、资金时点和未结差异。","parts":[["先确认经济事实","捕获成交，核对分配、标的、数量、方向、价格、对手和结算日期。不同市场的确认、清算和交收安排需分开。"],["多维度对账","成交、持仓、现金和保证金分别核对，并维护未结差异及账龄。可用现金、账面现金、受限资金和待交收现金不能混为一谈。"],["运营与投资的边界","运营提供现金和交收事实、提示限制及升级风险；平仓、对冲和资产处置由有权投资人员决定。紧急情况也需遵守授权。"]],"example":"一笔赎回和追加保证金同日发生，需做时点化现金表，不能只看日终总余额。","boundary":"实际业务可能涉及银行间或场外衍生品，需按真实权限补规则。","task":"列出一个保证金紧张场景的五项信息和三类沟通对象。","refs":["operate","internal"],"author":""},{"id":"redo","title":"Redo：重算与独立验证","track":"运营实务","week":2,"minutes":20,"summary":"把重复劳动分解成有目的的控制。","parts":[["五层检查","源数据是否可信，输入是否完整，业务规则是否正确，计算是否准确，报告是否与批准结果一致。单一重算很难同时证明五层。"],["按风险组合","完整性对账、关键独立重算、变动解释、服务商控制评估和抽样重演可组合。新资产、接口变化、重大人工调整和未解释差异需要加强验证。"],["改变前的证据","记录现有工时及发现问题类型，确认义务，开展平行试点并测试已知错误。不能用“这几天没有差异”证明所有风险已被覆盖。"]],"example":"外包与内部都使用同一错误价格时，两次重算会一致；需要不同证据验证价格。","boundary":"任何减少控制的决定都需适用性评估、有效性证据和有权批准。","task":"列出三种redo发现不了的错误，再为每一种配置补充控制。","refs":["service","internal"],"author":""},{"id":"data","title":"先建立数据交付标准","track":"运营实务","week":2,"minutes":18,"summary":"让文件、字段、版本和重发规则可预测。","parts":[["定义交付契约","每份文件确定发送方、接收方、业务日期、截止时点、字段定义、唯一标识和控制总数。漏文件、重复文件和空字段都应被识别。"],["保留数据来源","原始输入与转换结果分层保存；记录汇率方向、价格单位、正负号、时间区和费用口径。相同列名不代表相同含义。"],["临时工具也要治理","Excel或其他轻量工具需要权限、公式复核、版本、备份和可重跑。先标准化输入，再自动核对，最后把人的注意力放到异常判断。"]],"example":"外包重新发送一份更正文件，应能识别版本并避免旧新文件重复入账。","boundary":"本课程不使用公司数据；未授权时不要把投资者明细写入个人学习笔记。","task":"拟一份交付字段清单，并设计“缺文件”和“重发文件”两个检查。","refs":["internal"],"author":""},{"id":"sla","title":"服务商监督与SLA","track":"运营实务","week":3,"minutes":20,"summary":"既看交付，也看能力、透明度和问题关闭。","parts":[["三个时间点","选择时看能力和资源；运行中看交付和控制；退出时看数据和迁移。采购完成只是监督的开始。"],["指标组合","准时率之外，还看差错严重程度、重发次数、解释质量、响应与解决时间、重复问题及整改有效性。服务承诺应定义开始和结束时间点。"],["共同复盘","例会聚焦未结风险、重复差错和变更，而非逐条念报表。服务商的评价或审计报告需核对覆盖期间、范围和例外，不视为管理人复核的替代。"]],"example":"准时交付100%，但每次交付之后多次更正，应同时反映最终可用时间和数据质量。","boundary":"服务水平目标是双方约定，不是页面给出的监管标准。","task":"写三条SLA指标，各说明怎样避免指标被形式化完成。","refs":["service"],"author":""},{"id":"agency","title":"委托代理：监督为何必要","track":"组织管理","week":1,"minutes":20,"summary":"从目标差异、信息不对称和监督成本理解外包。","parts":[["理论原理","Jensen与Meckling（1976）分析委托代理关系：一方把部分决策或工作交给另一方后，目标可能不同，行为也不能完全被观察。代理成本包括监督支出、代理人的保证支出以及仍然存在的剩余损失。"],["运营中的应用","服务商可能侧重按时交付和控制成本，管理人还需解释风险及承担受托责任。把可观测交付、异常披露、证据访问和激励写入安排，有助于减少偏差。此处是对理论的运营应用，不是原论文的行业结论。"],["管理动作","把“交付完成”拆成准时、准确、可追溯和异常关闭。对高风险事项取得独立证据；对稳定事项评估控制可靠性，比较监督成本和未覆盖风险。"]],"example":"如果只奖励零差错上报，服务商可能延迟暴露问题。增加及时报告和有效纠正的评价，比只统计报错数更有信息。","boundary":"该理论不是对服务商不诚信的预设；过度监督也有成本，法定义务仍是底线。","task":"为一项外包服务分别写出双方目标、不可见信息和可验证的交付标准。","refs":["agency"],"author":"Jensen & Meckling · 1976"},{"id":"star","title":"组织设计：Galbraith星型模型","track":"组织管理","week":1,"minutes":22,"summary":"组织图只说明一部分；五个要素需要相互匹配。","parts":[["五个要素","战略决定要完成什么；结构分配决策权；流程连接信息与协作；激励引导行为；人员提供技能与能力。Galbraith强调这些设计选择需要彼此一致。"],["用法","先确定运营目标，例如可信、及时、能应对多资产复杂度。再检查结构和流程是否支持它，绩效是否奖励了正确行为，团队是否具备数据与判断能力。"],["应用到接管","若目标是管理例外，但岗位只允许机械复算、绩效只按处理数量、培训只教模板，组织就不匹配。改流程时同步调整授权、评价和培训。"]],"example":"把FA和TA合并到一个部门，若数据标准与批准权仍不清晰，并不会自动解决交接问题。","boundary":"星型模型是设计框架，不保证某种固定组织结构最优；需结合规模和控制分离要求。","task":"用五个要素诊断“内部redo太慢”，每个要素写一个待验证问题。","refs":["star"],"author":"Jay Galbraith · Star Model"},{"id":"simon","title":"有限理性：设计可用的授权","track":"组织管理","week":3,"minutes":20,"summary":"人的时间、信息和注意力有限，组织需要帮助决策。","parts":[["理论原理","Herbert Simon的有限理性强调，现实决策者无法穷尽所有信息和备选方案，常在约束下寻找可接受方案。组织的规则、信息和程序影响人们如何作决定。"],["运营中的应用","如果每个小差异都上报负责人，负责人会成为瓶颈，真正重要事项反而被淹没。应把可程序化事项、需要专业判断事项及重大风险分开。"],["授权设计","为每类决定说明必要证据、权限、截止时间和升级条件。授权伴随培训与事后复盘，不等于简单下放责任。重大、不可逆或越权事项保留专门决定路径。"]],"example":"标准舍入差异在经批准规则内处理；新估值方法或潜在投资者损失则按更高权限升级。","boundary":"有限理性不意味着可以忽视已知风险或免除专业判断；示例不是批准具体阈值。","task":"选三类例外，写出执行人可决定、需咨询、必须升级的边界。","refs":["simon"],"author":"Herbert A. Simon · 1978"},{"id":"rapid","title":"决策权：RAPID与职责矩阵","track":"组织管理","week":3,"minutes":22,"summary":"分清参与、建议、同意、执行与最终决定。","parts":[["框架原理","Bain的RAPID区分Recommend提出建议、Agree必要同意、Perform执行、Input提供信息和Decide最终决定。名字的字母顺序不是工作时间顺序。"],["与RACI的区别","RACI通常映射任务职责：执行、最终负责、征询和知会；RAPID侧重一个决定怎样形成。这里介绍RACI作为常见实践工具，不把它归为Bain提出。两者中的A含义不同，不能混用。"],["应用到争议","对估值争议，先明确事实输入、建议方案、必要的合规及合同检查、最终决策权和执行路径。明确权利不等于把其他机构的法定责任转给内部某一个人。"]],"example":"一次会议结束时，不仅记录“大家同意研究”，还记录由谁在何时决定、哪些资料必须先齐备。","boundary":"决策工具不能覆盖公司授权制度，也不能消除托管人等主体的独立职责。","task":"为“是否采纳新价格来源”写一个RAPID草案，明确D和A的实际授权待确认。","refs":["rapid"],"author":"Bain & Company · RAPID"},{"id":"safety","title":"心理安全：让问题更早出现","track":"组织管理","week":3,"minutes":20,"summary":"让团队能够提出疑问、求助和报告错误。","parts":[["研究原理","Edmondson（1999）将团队心理安全描述为成员对承担人际风险是否安全的共同信念。其团队研究发现心理安全与学习行为相关；不应把研究关联理解为所有组织中的必然因果。"],["管理中的应用","新同事能否问“这个价格为什么合理”？操作人员能否及时报告自己的失误？负责人如何回应坏消息，会影响下一次问题是否被及时说出。"],["具体做法","先确认事实和影响，再决定处置与责任；主动邀请不同意见；区分诚实失误、能力不足、制度问题和故意违规。报告渠道与清晰绩效标准同时存在。"]],"example":"员工说发现前一天费用错算，先感谢及时报告并控制影响，再复盘形成机制，避免当众羞辱使下一次错误沉默。","boundary":"心理安全不等于低标准、免责或无限分享；投资者信息和内部敏感信息仍按权限管理。","task":"改写一句“这么简单也会错”，使其能收集事实、保护报告意愿并保持责任要求。","refs":["safety"],"author":"Amy Edmondson · 1999"},{"id":"loop","title":"双环学习：从纠错到改规则","track":"组织管理","week":3,"minutes":20,"summary":"不仅修正行动，也检查背后的假设。","parts":[["理论原理","Argyris与Schön的组织学习思想区分两类改进：在既有目标和规则内调整行动，以及重新审视目标、规则和假设。MIT相关课程把挑战自身心智模型用于教学反思。"],["运营应用","单环：发现公式错误后修公式、加复核。双环：进一步问为什么以复杂手工表承载规则，为什么版本不受控，为什么只考核快而不考核可追溯。"],["复盘顺序","先止损和纠正，再用证据找重复机制；列出可检验的假设和小范围改进，确定负责人和复测。不能用系统原因替代个人应承担的明确责任。"]],"example":"三个月重复发生费用期间错误：提醒员工之外，检查合同版本、参数表和变更入口是否统一。","boundary":"双环反思适合反复或结构性问题；正在发生的交收危机应先控制影响。","task":"写一个重复错误的单环措施，再写一个需要检验的深层假设。","refs":["loop"],"author":"Argyris & Schön · 组织学习"},{"id":"pdsa","title":"PDSA：小范围验证改进","track":"组织管理","week":4,"minutes":20,"summary":"把改进当作有预测、有证据的学习。","parts":[["四个步骤","Plan提出目标、假设与预测；Do在明确范围内实施；Study比较结果和预测，理解差异；Act依据学到的内容调整、扩展或停止。Deming Institute强调Study的学习含义。"],["运营应用","试点前说明预计减少何种重复劳动，同时必须保持哪些错误识别能力。平行运行关注漏检、误报、未解释差异和实际节约，不只看耗时。"],["决定是否推广","验证代表性样本、关键异常、重发文件和输入缺失。记录变更、审批和回退条件。结果不支持假设时调整方案，不把“已经做了”当作继续投入理由。"]],"example":"试点一个基金的现金对账，先统一字段，再验证漏文件和重复文件能否被识别，最后比较处理时间。","boundary":"练习不能用于未获批准的真实控制撤销；短期无错不是完整有效性证据。","task":"写一个两周试点：假设、范围、成功标准、风险控制和停止条件。","refs":["pdsa"],"author":"Deming · Plan–Do–Study–Act"},{"id":"kotter","title":"变革管理：让改进真正落地","track":"组织管理","week":4,"minutes":22,"summary":"让相关人理解目的、参与行动，并持续使用新做法。","parts":[["框架原理","Kotter框架关注改变的动因、推动联盟、方向和参与、消除障碍、短期成果、持续推进及制度化。作者机构现将早期线性八步发展为更迭代的改变方法。"],["运营应用","负责人不能只宣布“以后不做这张表”。应与执行团队、合规、IT及服务商共同确认痛点与控制，选择小范围试点，让结果支持推广。"],["巩固改变","将验证后的流程纳入SOP、权限、培训和备岗；跟踪重复问题、控制覆盖及工作量。负责人离开或关键员工休假后仍能执行，才算组织能力。"]],"example":"先证明一项标准输入能减少返工且不损害控制，再逐步扩展，不以大范围换系统作为第一步。","boundary":"八步不是机械审批清单；不同规模组织不需要同样繁重的项目仪式。","task":"为一个流程改进写出推动者、受影响者、反对理由、试点和巩固措施。","refs":["kotter"],"author":"John Kotter · Leading Change"},{"id":"disclosure","title":"信息披露：从数字到交付","track":"法规基础","week":4,"minutes":20,"summary":"分别管理内容、复核、发送、备份和证据。","parts":[["规则基线","证监会第233号令和协会2026实施细则的正式公告载明2026年9月1日起施行。学习应围绕新报告类型、责任、流程及模板衔接展开。"],["跨团队输出","FA提供估值与财务基础，TA提供投资者及份额相关信息，投资与风险团队提供相应事实，合规及披露责任人确认适用要求。具体分工以内部制度为准。"],["交付闭环","编制、复核、批准、发送、备份分别留痕；对投资者披露与协会信披备份不是同一动作。报告版本应与批准数据一致，发生重大事件还需识别临时报告义务。"]],"example":"文件已上传备份系统，并不能单独证明已按合同向投资者披露。","boundary":"本课不列未经逐条核实的统一截止日，须查正文、过渡安排和基金合同。","task":"列一份季度报告所需数据、提供方、复核方和发送证据清单。","refs":["disclosure","templates"],"author":""},{"id":"selfcheck","title":"自查：每个结论都有证据","track":"法规基础","week":4,"minutes":20,"summary":"把“已检查”变成可追溯的程序和结论。","parts":[["先区分通知","地方辖区自查、协会定向专项、新规衔接和内部检查的对象与时间可能不同。取得原件后再识别检查期间、范围、签署和报送要求。"],["四种结论","符合且有证据、发现差距、资料不足待验证、不适用且有依据。资料不足不能自动写成符合；也不能不经判断就定性违规。"],["形成闭环","通知问题→责任人→检查总体与方法→证据→发现与整改→复核签署→报送回执→复测。运营提供事实，合规解释适用性，负责人按要求组织。"]],"example":"面对净值专项问题，分别解释核算是否准确、变动是否有经济依据、运作是否遵守合同，不能把三者混为一个结论。","boundary":"上海44项及协会定向净值自查在9月14日资料中仍为媒体线索，未取得内部通知。","task":"任选一个问题，写出检查期间、所需证据、责任人和不适用判断依据。","refs":["ningbo","shanghai","navnews"],"author":""},{"id":"maps","title":"用三图三表接管流程","track":"接管实践","week":2,"minutes":22,"summary":"把口头经验转成可以共同确认的业务描述。","parts":[["三张图","主体和服务关系图区分合同、资金及数据；流程泳道图表现交接、截止和异常分支；数据流图显示来源、转换及独立核对。"],["三张表","职责与授权矩阵说明谁做谁决定；风险控制矩阵说明检查什么及如何证明；运营日历说明何时向谁交付。"],["怎样取得真实流程","选一个代表性基金及周期，跟随真实文件走查并访谈执行者。分别记录制度要求、实际做法和建议做法；由相关人员确认后再作为现状。"]],"example":"流程写“托管复核”时，继续追问具体复核数据、反馈时点、未解决差异及管理人的后续动作。","boundary":"现在没有内部材料，页面中的流程都是通用学习模板。","task":"画一条NAV泳道，至少包含一个缺数据或差异未解的分支。","refs":["internal"],"author":""},{"id":"communication","title":"向管理层汇报与处理分歧","track":"接管实践","week":3,"minutes":18,"summary":"用事实、影响和需要的决定组织沟通。","parts":[["一页汇报","先写事件与已核事实，再写影响及未知项，然后列当前措施、方案、建议、需要的决定和下一次更新时间。读者应能快速判断是否需要行动。"],["向上与横向","向管理层说明风险和资源选择；向投资团队说明现金和交收约束；向服务商说明证据与交付要求。不同对象共享同一事实基础，但关注点不同。"],["分歧处理","区分事实分歧、判断分歧和权限分歧。事实用证据解决；判断列假设与方案；权限回到授权。记录决定、理由、异议和复核时点。"]],"example":"不要只说“外包质量不好”，而是说明本月重复差错、未结影响、补偿控制和需要服务商投入的资源。","boundary":"透明必须遵守数据权限；公开讨论不等于公开投资者明细。","task":"用150字写一份“净值可能延迟”的内部简报，明确尚不知道什么。","refs":["rapid","internal"],"author":""},{"id":"capacity","title":"团队容量、备岗与绩效","track":"接管实践","week":3,"minutes":20,"summary":"按业务复杂度和工作峰值配置能力。","parts":[["容量模型","按交易量、产品及份额类别、资产复杂度、开放日和异常量测量工时。日均工作量之外，要看开放日、季末和关键人员休假时的峰值。"],["技能与备岗","列每个流程的主办、复核和备岗人员，记录能否独立执行及最近一次演练。关键知识只在一个人的工作簿里，是组织风险。"],["绩效组合","平衡准时、质量、异常发现与关闭、重复问题及改进贡献。只看处理量可能忽视风险，只看零差错上报可能抑制报告。"]],"example":"团队平时容量足够，但季度报告和集中赎回重合时不足，应提前安排跨岗与升级路径。","boundary":"不要在没有业务量和复杂度数据时承诺固定人数或精确节省比例。","task":"列一个四人团队的技能矩阵草案，找出单点依赖和训练优先级。","refs":["star","internal"],"author":""},{"id":"takeover","title":"接管90天：稳定、理解、改进","track":"接管实践","week":4,"minutes":22,"summary":"先确保业务连续，再用证据推进改变。","parts":[["前30天","前10天确认近期截止事项、关键风险、服务商及授权；随后完成代表性流程走查、现状图、差异清单和工时基线。"],["31—60天","形成控制标准，选择一个小范围改善项目。平行验证输入完整性、计算正确性和异常识别，并明确谁有权批准改变。"],["61—90天","依据结果决定推广、调整或停止；落实SOP、培训、SLA与备岗。用已测量的工作量、风险和数据条件提出系统需求。"]],"example":"如接管即遇监管截止任务，应先按适用通知组织处理，不等到计划中的第四周。","boundary":"时间表是建议节奏，不是自动切换控制的许可。","task":"写出前十天最重要的五个访谈对象和各自要确认的一个事实。","refs":["internal","service"],"author":""}],"quizzes":[{"id":"q1","lesson":"redo","title":"两套计算完全一致","scene":"外包NAV与内部redo一致，但两者使用外包提供的同一价格文件。你首先补哪项验证？","options":["增加同一公式的重算次数","核对价格及持仓的独立来源与完整性","直接认定结果已被双重验证"],"answer":1,"why":"同源输入可能产生一致的错误。独立证据用于检验输入，重算用于检验计算，两个控制目标不同。"},{"id":"q2","lesson":"star","title":"换了组织图，问题还在","scene":"FA和TA合并后交接仍慢，团队只按处理数量考核。星型模型最有帮助的下一步是？","options":["重新命名部门","只增加团队人数","同时检查流程、决策权、激励和技能是否匹配"],"answer":2,"why":"结构只是五要素之一。处理量激励、权限不清和数据交接都可能让新组织延续旧问题。"},{"id":"q3","lesson":"rapid","title":"会议一直没有结论","scene":"所有部门都发表意见，但谁能批准新价格来源并不清楚。应先解决什么？","options":["明确最终决定权、必要同意及证据输入","让参与会议的人投票","把决定自动交给外包商"],"answer":0,"why":"参与和知情不等于有决策权。RAPID帮助显式分配角色，但仍要服从真实授权及独立职责。"},{"id":"q4","lesson":"safety","title":"同事主动报告错误","scene":"一名同事发现自己的费用参数错误并主动报告。更合适的第一反应是？","options":["为保持零差错指标暂不登记","先控制影响、确认事实并保护及时报告，再复盘责任","立即公开批评，以示重视"],"answer":1,"why":"及时报告有助于限制损失。心理安全与清晰责任可以并存，不能用沉默维持表面零错误。"},{"id":"q5","lesson":"loop","title":"同一错误第三次发生","scene":"三个季度都出现费用期间错误，已经培训和提醒多次。双环学习应进一步做什么？","options":["再次发送提醒邮件","只修正本次结果","检查合同版本、参数维护及考核规则背后的假设"],"answer":2,"why":"单次修正属于既有规则内纠错；反复失效时，需要检验规则、数据和组织安排是否促成问题。"},{"id":"q6","lesson":"pdsa","title":"自动对账试点没有报错","scene":"新流程连续三天没有差异，团队希望全面撤销人工复核。你会怎样处理？","options":["核对义务和风险覆盖，验证代表性异常，再按权限决定","三天无差异即可全量推广","以后所有项目都禁止试点"],"answer":0,"why":"短期无差异可能只是样本简单。需要平行结果、异常识别、回退和批准证据，学习结果才支持改变。"},{"id":"q7","lesson":"selfcheck","title":"媒体报道了自查期限","scene":"看到上海私募自查报道后，尚未获得公司正式通知。下一步是？","options":["直接照报道提交所有材料","取得适用通知原件，确认对象、期间、渠道和权限","认为没有原件就一定不适用"],"answer":1,"why":"媒体是发现线索的入口。未取得通知不等于不适用，也不能用报道代替正式要求。"},{"id":"q8","lesson":"mo","title":"现金总额看起来足够","scene":"赎回付款在上午，证券卖出回款在下午，同时可能追加保证金。只看日终现金能否判断？","options":["能，日终总额足够即可","能，等待服务商通知即可","不能，需要按时点、可用性和授权安排现金"],"answer":2,"why":"余额与可用性不是一回事。资金到达时间、受限资金及支付截止会决定实际缺口。"},{"id":"q9","lesson":"agency","caseId":"case-agency","title":"最先应调整什么？","scene":"服务商连续三个月报告零差错，但内部复核发现两次费用版本不一致。合同只考核准时交付率，主动报告问题会扣分。","options":["要求服务商继续保持零报告","核对独立证据，并纠正惩罚主动报告的指标","取消内部监督以减少冲突"],"answer":1,"why":"先确认事实和激励机制。零报告不是零风险，取消监督会扩大信息不对称。"},{"id":"q10","lesson":"agency","caseId":"case-agency","title":"新指标采用“主动报告数量越多越好”是否合理？","scene":"服务商连续三个月报告零差错，但内部复核发现两次费用版本不一致。合同只考核准时交付率，主动报告问题会扣分。","options":["不合理，应结合严重度、及时性、复发与独立抽核","合理，问题数量能完全代表透明度","合理，可以直接识别质量"],"answer":0,"why":"单一数量指标会诱导拆分或重复上报。评价透明度仍需兼顾风险与整改质量。"},{"id":"q11","lesson":"star","caseId":"case-star","title":"最有价值的下一步是？","scene":"团队把FA与TA放在同一主管下，但开放日数据依然晚到。TA只按确认笔数考核，FA拿不到最终份额版本，任何调整都要等主管回复。","options":["增加所有环节的审批人数","再次调整汇报关系","走查一次开放日，定位交付、权限与指标冲突"],"answer":2,"why":"走查能区分瓶颈在结构还是流程、权限与激励，避免把组织图当作全部设计。"},{"id":"q12","lesson":"star","caseId":"case-star","title":"同一主管能否兼任每项操作和复核？","scene":"团队把FA与TA放在同一主管下，但开放日数据依然晚到。TA只按确认笔数考核，FA拿不到最终份额版本，任何调整都要等主管回复。","options":["可以，因为责任更集中","不能仅据此决定，需要保留必要职责分离","可以，只要效率提升"],"answer":1,"why":"协同与制衡需要同时设计；集中汇报关系并不消除不相容职责。"},{"id":"q13","lesson":"simon","caseId":"case-simon","title":"如何减轻注意力负担？","scene":"核对清单每日有三百条，多数是小额舍入。团队按出现顺序处理，一笔异常现金交收直到下午才被发现。","options":["按性质、时效和影响分流，并监控累计与漏检","把所有异常交给新人","只保留金额最高十条"],"answer":0,"why":"金额并非唯一风险维度。非法账户或临近交收截止的异常可能金额不大但性质重要。"},{"id":"q14","lesson":"simon","caseId":"case-simon","title":"试点后出现小额重复错误，应怎样处理？","scene":"核对清单每日有三百条，多数是小额舍入。团队按出现顺序处理，一笔异常现金交收直到下午才被发现。","options":["停止记录全部小额差异","金额小可以永远忽略","增加累计与复发触发条件，复查分类逻辑"],"answer":2,"why":"有限理性框架强调改进决策环境，不是为遗漏建立永久豁免。"},{"id":"q15","lesson":"rapid","caseId":"case-rapid","title":"首先需要澄清什么？","scene":"定价数据缺失，FA提出替代来源，投资团队、风险和服务商都发表意见，但谁批准仍不明确。交付窗口正在缩短。","options":["群里谁最资深","依据有效制度和授权确定最终决定与必要同意","谁最先提出方案就由谁批准"],"answer":1,"why":"决策角色必须建立在有效授权和外部职责上，资历与发言顺序不是授权依据。"},{"id":"q16","lesson":"rapid","caseId":"case-rapid","title":"征询对象逾时未回复，是否视为同意？","scene":"定价数据缺失，FA提出替代来源，投资团队、风险和服务商都发表意见，但谁批准仍不明确。交付窗口正在缩短。","options":["只有制度明确允许且满足条件时才可按约定处理，否则升级","所有人不回复就直接执行","始终可以"],"answer":0,"why":"RAPID不是默示批准机制。应事先定义时限与升级，并保留必要同意。"},{"id":"q17","lesson":"safety","caseId":"case-safety","title":"负责人最合适的回应？","scene":"新人发现费用参数可能错误，但上次同事提出疑问被公开斥责。这次新人准备等资深同事先发现。","options":["既然有人报告，就不必复核","先追问谁应该受罚","感谢及时提出，启动核查并明确处理责任"],"answer":2,"why":"回应影响以后是否有人愿意报告，但积极回应不能取代调查与必要处置。"},{"id":"q18","lesson":"safety","caseId":"case-safety","title":"持续犯同类错误如何处理？","scene":"新人发现费用参数可能错误，但上次同事提出疑问被公开斥责。这次新人准备等资深同事先发现。","options":["心理安全要求不能纠正","提供训练并修复流程，同时按制度处理持续失职","公开嘲讽以形成威慑"],"answer":1,"why":"高标准与安全表达可以同时存在；改进能力、流程和责任应基于事实。"},{"id":"q19","lesson":"loop","caseId":"case-loop","title":"哪个动作体现双环学习？","scene":"团队每月都遇到费率版本冲突。历次整改要求经办人更仔细，却没有指定合同条款解释与参数主版本的负责人。","options":["重审参数版本治理和变更授权规则","每月再加一次相同检查","要求经办人再读一次邮件"],"answer":0,"why":"重审产生错误的管理规则触及第二层；当期纠错仍必须完成。"},{"id":"q20","lesson":"loop","caseId":"case-loop","title":"新规则获批前如何处理当期交付？","scene":"团队每月都遇到费率版本冲突。历次整改要求经办人更仔细，却没有指定合同条款解释与参数主版本的负责人。","options":["直接使用未批准的新规则","等待改革完成再处理","按现行有效流程纠错和升级，同时推进规则改进"],"answer":2,"why":"组织学习与连续运行需要并行，制度反思不自动赋予变更权限。"},{"id":"q21","lesson":"pdsa","caseId":"case-pdsa","title":"现在可否撤销人工控制？","scene":"脚本将核对耗时从两小时降到一分钟。试点只使用完整、正常的历史文件，没有测试缺页、重复记录或错误日期。","options":["运行快就可以","先验证完整性和异常检出，按授权决定控制变更","只要正常样本结果一致就可以"],"answer":1,"why":"正常样本一致只证明有限条件下吻合，不证明关键异常能够被发现。"},{"id":"q22","lesson":"pdsa","caseId":"case-pdsa","title":"Study阶段的关键产出是什么？","scene":"脚本将核对耗时从两小时降到一分钟。试点只使用完整、正常的历史文件，没有测试缺页、重复记录或错误日期。","options":["比较预测与结果，解释偏差并决定调整或扩大试验","仅统计节省工时","宣布项目成功"],"answer":0,"why":"学习需要说明为什么结果符合或偏离预测；节省工时只是其中一个指标。"},{"id":"q23","lesson":"kotter","caseId":"case-kotter","title":"最有用的第一步？","scene":"新异常登记表已经邮件发布，但资深员工仍用旧表，新人两边重复登记。主管只要求“尽快全面上线”。","options":["立即删除旧表","再发一封措辞更强的邮件","访谈使用者，识别重复录入与权责障碍，组织试点"],"answer":2,"why":"需要了解真实阻力并清除障碍；通知送达不能证明工作方式已改变。"},{"id":"q24","lesson":"kotter","caseId":"case-kotter","title":"什么更能说明变革被巩固？","scene":"新异常登记表已经邮件发布，但资深员工仍用旧表，新人两边重复登记。主管只要求“尽快全面上线”。","options":["培训签到率100%","新流程持续执行、质量稳定、备岗演练通过并纳入制度","上线当天领导表扬"],"answer":1,"why":"采用和持续绩效比活动完成更接近变革结果，但仍须监控并根据问题调整。"}],"weeks":[{"title":"建立责任与组织认知","desc":"先知道为什么做，再明确谁来做。","output":"一张主体关系图 + 五个外包监督问题"},{"title":"走通业务与证据","desc":"把FA、TA和MO连接成可解释的链路。","output":"三条流程草图 + 一份复核清单"},{"title":"带团队、作决定","desc":"从亲自完成，走向组织能够稳定完成。","output":"授权草案 + 技能矩阵 + 管理简报"},{"title":"验证改进与接管","desc":"用法规、案例和试点形成90天行动。","output":"模拟自查底稿 + 小范围试点 + 90天计划"}],"tasks":[["d1","1—10天","确认未来30天交付与监管截止事项"],["d2","1—10天","取得授权、关键联系人和备岗安排"],["d3","1—10天","核对自查通知及历史未结风险"],["d4","11—30天","走查一个估值周期、开放日及交收流程"],["d5","11—30天","确认现状版三图三表"],["d6","11—30天","记录redo工时、差错与返工原因"],["d7","31—60天","统一外包输入和数据字典"],["d8","31—60天","选择试点并确定并行验证标准"],["d9","31—60天","验证异常场景、权限和回退"],["d10","61—90天","按验证结果取得变更批准"],["d11","61—90天","更新SOP、培训、备岗和SLA"],["d12","61—90天","提出有成本和风险依据的系统需求"]],"glossary":[["FA","基金会计、估值与行政管理；职责以实际服务范围为准。"],["TA","投资者账户、份额登记与相关资金结算。"],["Middle Office","交易后处理、确认、对账、现金与保证金等运营工作。"],["NAV","基金资产净值；与单位净值和累计单位净值需区分。"],["Redo","对外包结果再计算；需说明输入独立性及控制目的。"],["RACI","Responsible执行、Accountable最终负责、Consulted征询、Informed知会。"],["SLA","服务水平协议；明确交付、时点、质量和例外处置。"],["BCP","业务连续性计划；人员、系统或服务商中断时的应对安排。"],["AMBERS","资产管理业务综合报送平台；具体模块和事项按协会要求。"],["双环学习","除了调整行动，还检验支配行动的目标、规则与假设。"]],"laws":[{"id":"fundlaw","title":"中华人民共和国证券投资基金法","level":"法律","issuer":"全国人大常委会","version":"2015年修正","effective":"2015-04-24修正；正文保留2013-06-01原施行日","scope":"证券","topics":["制度总览","财产独立","投资者保护"],"overview":"这是证券投资基金的基础法律，包含公募与非公开募集基金制度。私募学习优先阅读总则和第十章，不能把公募专属条文直接套到所有私募产品。","practice":"以第87—95条理解合格投资者、募集、托管、合同、备案与信息提供，再向下阅读私募条例和专项规则。","priority":[2,5,9,87,88,92,95,101],"articles":[{"n":1,"label":"第一条","chapter":"第一章　总则","text":"为了规范证券投资基金活动，保护投资人及相关当事人的合法权益，促进证券投资基金和资本市场的健康发展，制定本法。"},{"n":2,"label":"第二条","chapter":"第一章　总则","text":"在中华人民共和国境内，公开或者非公开募集资金设立证券投资基金（以下简称基金），由基金管理人管理，基金托管人托管，为基金份额持有人的利益，进行证券投资活动，适用本法；本法未规定的，适用《中华人民共和国信托法》、《中华人民共和国证券法》和其他有关法律、行政法规的规定。"},{"n":3,"label":"第三条","chapter":"第一章　总则","text":"基金管理人、基金托管人和基金份额持有人的权利、义务，依照本法在基金合同中约定。\n\n基金管理人、基金托管人依照本法和基金合同的约定，履行受托职责。\n通过公开募集方式设立的基金（以下简称公开募集基金）的基金份额持有人按其所持基金份额享受收益和承担风险，通过非公开募集方式设立的基金（以下简称非公开募集基金）的收益分配和风险承担由基金合同约定。"},{"n":4,"label":"第四条","chapter":"第一章　总则","text":"从事证券投资基金活动，应当遵循自愿、公平、诚实信用的原则，不得损害国家利益和社会公共利益。"},{"n":5,"label":"第五条","chapter":"第一章　总则","text":"基金财产的债务由基金财产本身承担，基金份额持有人以其出资为限对基金财产的债务承担责任。但基金合同依照本法另有约定的，从其约定。\n\n基金财产独立于基金管理人、基金托管人的固有财产。基金管理人、基金托管人不得将基金财产归入其固有财产。\n\n基金管理人、基金托管人因基金财产的管理、运用或者其他情形而取得的财产和收益，归入基金财产。\n\n基金管理人、基金托管人因依法解散、被依法撤销或者被依法宣告破产等原因进行清算的，基金财产不属于其清算财产。"},{"n":6,"label":"第六条","chapter":"第一章　总则","text":"基金财产的债权，不得与基金管理人、基金托管人固有财产的债务相抵销；不同基金财产的债权债务，不得相互抵销。"},{"n":7,"label":"第七条","chapter":"第一章　总则","text":"非因基金财产本身承担的债务，不得对基金财产强制执行。"},{"n":8,"label":"第八条","chapter":"第一章　总则","text":"基金财产投资的相关税收，由基金份额持有人承担，基金管理人或者其他扣缴义务人按照国家有关税收征收的规定代扣代缴。"},{"n":9,"label":"第九条","chapter":"第一章　总则","text":"基金管理人、基金托管人管理、运用基金财产，基金服务机构从事基金服务活动，应当恪尽职守，履行诚实信用、谨慎勤勉的义务。\n\n基金管理人运用基金财产进行证券投资，应当遵守审慎经营规则，制定科学合理的投资策略和风险管理制度，有效防范和控制风险。\n\n基金从业人员应当具备基金从业资格，遵守法律、行政法规，恪守职业道德和行为规范。"},{"n":10,"label":"第十条","chapter":"第一章　总则","text":"基金管理人、基金托管人和基金服务机构，应当依照本法成立证券投资基金行业协会（以下简称基金行业协会），进行行业自律，协调行业关系，提供行业服务，促进行业发展。"},{"n":11,"label":"第十一条","chapter":"第一章　总则","text":"国务院证券监督管理机构依法对证券投资基金活动实施监督管理；其派出机构依照授权履行职责。"},{"n":12,"label":"第十二条","chapter":"第二章　基金管理人","text":"基金管理人由依法设立的公司或者合伙企业担任。\n\n公开募集基金的基金管理人，由基金管理公司或者经国务院证券监督管理机构按照规定核准的其他机构担任。"},{"n":13,"label":"第十三条","chapter":"第二章　基金管理人","text":"设立管理公开募集基金的基金管理公司，应当具备下列条件，并经国务院证券监督管理机构批准:\n\n（一）有符合本法和《中华人民共和国公司法》规定的章程；\n\n（二）注册资本不低于一亿元人民币，且必须为实缴货币资本；\n\n（三）主要股东应当具有经营金融业务或者管理金融机构的良好业绩、良好的财务状况和社会信誉，资产规模达到国务院规定的标准，最近三年没有违法记录；\n\n（四）取得基金从业资格的人员达到法定人数；\n\n（五）董事、监事、高级管理人员具备相应的任职条件；\n\n（六）有符合要求的营业场所、安全防范设施和与基金管理业务有关的其他设施；\n\n（七）有良好的内部治理结构、完善的内部稽核监控制度、风险控制制度；\n\n（八）法律、行政法规规定的和经国务院批准的国务院证券监督管理机构规定的其他条件。"},{"n":14,"label":"第十四条","chapter":"第二章　基金管理人","text":"国务院证券监督管理机构应当自受理基金管理公司设立申请之日起六个月内依照本法第十三条规定的条件和审慎监管原则进行审查，作出批准或者不予批准的决定，并通知申请人；不予批准的，应当说明理由。\n基金管理公司变更持有百分之五以上股权的股东，变更公司的实际控制人，或者变更其他重大事项，应当报经国务院证券监督管理机构批准。国务院证券监督管理机构应当自受理申请之日起六十日内作出批准或者不予批准的决定，并通知申请人；不予批准的，应当说明理由。"},{"n":15,"label":"第十五条","chapter":"第二章　基金管理人","text":"有下列情形之一的，不得担任公开募集基金的基金管理人的董事、监事、高级管理人员和其他从业人员:\n\n（一）因犯有贪污贿赂、渎职、侵犯财产罪或者破坏社会主义市场经济秩序罪，被判处刑罚的；\n\n（二）对所任职的公司、企业因经营不善破产清算或者因违法被吊销营业执照负有个人责任的董事、监事、厂长、高级管理人员，自该公司、企业破产清算终结或者被吊销营业执照之日起未逾五年的；\n\n（三）个人所负债务数额较大，到期未清偿的；\n\n（四）因违法行为被开除的基金管理人、基金托管人、证券交易所、证券公司、证券登记结算机构、期货交易所、期货公司及其他机构的从业人员和国家机关工作人员；\n\n（五）因违法行为被吊销执业证书或者被取消资格的律师、注册会计师和资产评估机构、验证机构的从业人员、投资咨询从业人员；\n（六）法律、行政法规规定不得从事基金业务的其他人员。"},{"n":16,"label":"第十六条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人的董事、监事和高级管理人员，应当熟悉证券投资方面的法律、行政法规，具有三年以上与其所任职务相关的工作经历；高级管理人员还应当具备基金从业资格。"},{"n":17,"label":"第十七条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人的董事、监事、高级管理人员和其他从业人员，其本人、配偶、利害关系人进行证券投资，应当事先向基金管理人申报，并不得与基金份额持有人发生利益冲突。\n\n公开募集基金的基金管理人应当建立前款规定人员进行证券投资的申报、登记、审查、处置等管理制度，并报国务院证券监督管理机构备案。"},{"n":18,"label":"第十八条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人的董事、监事、高级管理人员和其他从业人员，不得担任基金托管人或者其他基金管理人的任何职务，不得从事损害基金财产和基金份额持有人利益的证券交易及其他活动。"},{"n":19,"label":"第十九条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人应当履行下列职责:\n\n（一）依法募集资金，办理基金份额的发售和登记事宜；\n\n（二）办理基金备案手续；\n\n（三）对所管理的不同基金财产分别管理、分别记账，进行证券投资；\n（四）按照基金合同的约定确定基金收益分配方案，及时向基金份额持有人分配收益；\n\n（五）进行基金会计核算并编制基金财务会计报告；\n\n（六）编制中期和年度基金报告；\n\n（七）计算并公告基金资产净值，确定基金份额申购、赎回价格；\n\n（八）办理与基金财产管理业务活动有关的信息披露事项；\n\n（九）按照规定召集基金份额持有人大会；\n\n（十）保存基金财产管理业务活动的记录、账册、报表和其他相关资料；\n\n（十一）以基金管理人名义，代表基金份额持有人利益行使诉讼权利或者实施其他法律行为；\n\n（十二）国务院证券监督管理机构规定的其他职责。"},{"n":20,"label":"第二十条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人及其董事、监事、高级管理人员和其他从业人员不得有下列行为:\n\n（一）将其固有财产或者他人财产混同于基金财产从事证券投资；\n\n（二）不公平地对待其管理的不同基金财产；\n\n（三）利用基金财产或者职务之便为基金份额持有人以外的人牟取利益；\n\n（四）向基金份额持有人违规承诺收益或者承担损失；\n\n（五）侵占、挪用基金财产；\n（六）泄露因职务便利获取的未公开信息、利用该信息从事或者明示、暗示他人从事相关的交易活动；\n\n（七）玩忽职守，不按照规定履行职责；\n\n（八）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。"},{"n":21,"label":"第二十一条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人应当建立良好的内部治理结构，明确股东会、董事会、监事会和高级管理人员的职责权限，确保基金管理人独立运作。\n\n公开募集基金的基金管理人可以实行专业人士持股计划，建立长效激励约束机制。\n\n公开募集基金的基金管理人的股东、董事、监事和高级管理人员在行使权利或者履行职责时，应当遵循基金份额持有人利益优先的原则。"},{"n":22,"label":"第二十二条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人应当从管理基金的报酬中计提风险准备金。\n\n公开募集基金的基金管理人因违法违规、违反基金合同等原因给基金财产或者基金份额持有人合法权益造成损失，应当承担赔偿责任的，可以优先使用风险准备金予以赔偿。"},{"n":23,"label":"第二十三条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人的股东、实际控制人应当按照国务院证券监督管理机构的规定及时履行重大事项报告义务，并不得有下列行为:\n\n（一）虚假出资或者抽逃出资；\n（二）未依法经股东会或者董事会决议擅自干预基金管理人的基金经营活动；\n\n（三）要求基金管理人利用基金财产为自己或者他人牟取利益，损害基金份额持有人利益；\n\n（四）国务院证券监督管理机构规定禁止的其他行为。\n\n公开募集基金的基金管理人的股东、实际控制人有前款行为或者股东不再符合法定条件的，国务院证券监督管理机构应当责令其限期改正，并可视情节责令其转让所持有或者控制的基金管理人的股权。\n\n在前款规定的股东、实际控制人按照要求改正违法行为、转让所持有或者控制的基金管理人的股权前，国务院证券监督管理机构可以限制有关股东行使股东权利。"},{"n":24,"label":"第二十四条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人违法违规，或者其内部治理结构、稽核监控和风险控制管理不符合规定的，国务院证券监督管理机构应当责令其限期改正；逾期未改正，或者其行为严重危及该基金管理人的稳健运行、损害基金份额持有人合法权益的，国务院证券监督管理机构可以区别情形，对其采取下列措施:\n\n（一）限制业务活动，责令暂停部分或者全部业务；\n\n（二）限制分配红利，限制向董事、监事、高级管理人员支付报酬、提供福利；\n（三）限制转让固有财产或者在固有财产上设定其他权利；\n\n（四）责令更换董事、监事、高级管理人员或者限制其权利；\n\n（五）责令有关股东转让股权或者限制有关股东行使股东权利。\n\n公开募集基金的基金管理人整改后，应当向国务院证券监督管理机构提交报告。国务院证券监督管理机构经验收，符合有关要求的，应当自验收完毕之日起三日内解除对其采取的有关措施。"},{"n":25,"label":"第二十五条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人的董事、监事、高级管理人员未能勤勉尽责，致使基金管理人存在重大违法违规行为或者重大风险的，国务院证券监督管理机构可以责令更换。"},{"n":26,"label":"第二十六条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人违法经营或者出现重大风险，严重危害证券市场秩序、损害基金份额持有人利益的，国务院证券监督管理机构可以对该基金管理人采取责令停业整顿、指定其他机构托管、接管、取消基金管理资格或者撤销等监管措施。"},{"n":27,"label":"第二十七条","chapter":"第二章　基金管理人","text":"在公开募集基金的基金管理人被责令停业整顿、被依法指定托管、接管或者清算期间，或者出现重大风险时，经国务院证券监督管理机构批准，可以对该基金管理人直接负责的董事、监事、高级管理人员和其他直接责任人员采取下列措施:\n（一）通知出境管理机关依法阻止其出境；\n\n（二）申请司法机关禁止其转移、转让或者以其他方式处分财产，或者在财产上设定其他权利。"},{"n":28,"label":"第二十八条","chapter":"第二章　基金管理人","text":"有下列情形之一的，公开募集基金的基金管理人职责终止:\n\n（一）被依法取消基金管理资格；\n\n（二）被基金份额持有人大会解任；\n\n（三）依法解散、被依法撤销或者被依法宣告破产；\n\n（四）基金合同约定的其他情形。"},{"n":29,"label":"第二十九条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人职责终止的，基金份额持有人大会应当在六个月内选任新基金管理人；新基金管理人产生前，由国务院证券监督管理机构指定临时基金管理人。\n\n公开募集基金的基金管理人职责终止的，应当妥善保管基金管理业务资料，及时办理基金管理业务的移交手续，新基金管理人或者临时基金管理人应当及时接收。"},{"n":30,"label":"第三十条","chapter":"第二章　基金管理人","text":"公开募集基金的基金管理人职责终止的，应当按照规定聘请会计师事务所对基金财产进行审计，并将审计结果予以公告，同时报国务院证券监督管理机构备案。"},{"n":31,"label":"第三十一条","chapter":"第二章　基金管理人","text":"对非公开募集基金的基金管理人进行规范的具体办法，由国务院金融监督管理机构依照本章的原则制定。"},{"n":32,"label":"第三十二条","chapter":"第三章　基金托管人","text":"基金托管人由依法设立的商业银行或者其他金融机构担任。\n\n商业银行担任基金托管人的，由国务院证券监督管理机构会同国务院银行业监督管理机构核准；其他金融机构担任基金托管人的，由国务院证券监督管理机构核准。"},{"n":33,"label":"第三十三条","chapter":"第三章　基金托管人","text":"担任基金托管人，应当具备下列条件:\n\n（一）净资产和风险控制指标符合有关规定；\n\n（二）设有专门的基金托管部门；\n\n（三）取得基金从业资格的专职人员达到法定人数；\n\n（四）有安全保管基金财产的条件；\n\n（五）有安全高效的清算、交割系统；\n\n（六）有符合要求的营业场所、安全防范设施和与基金托管业务有关的其他设施；\n\n（七）有完善的内部稽核监控制度和风险控制制度；\n\n（八）法律、行政法规规定的和经国务院批准的国务院证券监督管理机构、国务院银行业监督管理机构规定的其他条件。"},{"n":34,"label":"第三十四条","chapter":"第三章　基金托管人","text":"本法第十五条、第十七条、第十八条的规定，适用于基金托管人的专门基金托管部门的高级管理人员和其他从业人员。\n\n本法第十六条的规定，适用于基金托管人的专门基金托管部门的高级管理人员。"},{"n":35,"label":"第三十五条","chapter":"第三章　基金托管人","text":"基金托管人与基金管理人不得为同一机构，不得相互出资或者持有股份。"},{"n":36,"label":"第三十六条","chapter":"第三章　基金托管人","text":"基金托管人应当履行下列职责:\n\n（一）安全保管基金财产；\n\n（二）按照规定开设基金财产的资金账户和证券账户；\n\n（三）对所托管的不同基金财产分别设置账户，确保基金财产的完整与独立；\n\n（四）保存基金托管业务活动的记录、账册、报表和其他相关资料；\n\n（五）按照基金合同的约定，根据基金管理人的投资指令，及时办理清算、交割事宜；\n\n（六）办理与基金托管业务活动有关的信息披露事项；\n\n（七）对基金财务会计报告、中期和年度基金报告出具意见；\n\n（八）复核、审查基金管理人计算的基金资产净值和基金份额申购、赎回价格；\n\n（九）按照规定召集基金份额持有人大会；\n\n（十）按照规定监督基金管理人的投资运作；\n\n（十一）国务院证券监督管理机构规定的其他职责。"},{"n":37,"label":"第三十七条","chapter":"第三章　基金托管人","text":"基金托管人发现基金管理人的投资指令违反法律、行政法规和其他有关规定，或者违反基金合同约定的，应当拒绝执行，立即通知基金管理人，并及时向国务院证券监督管理机构报告。\n基金托管人发现基金管理人依据交易程序已经生效的投资指令违反法律、行政法规和其他有关规定，或者违反基金合同约定的，应当立即通知基金管理人，并及时向国务院证券监督管理机构报告。"},{"n":38,"label":"第三十八条","chapter":"第三章　基金托管人","text":"本法第二十条、第二十二条的规定，适用于基金托管人。"},{"n":39,"label":"第三十九条","chapter":"第三章　基金托管人","text":"基金托管人不再具备本法规定的条件，或者未能勤勉尽责，在履行本法规定的职责时存在重大失误的，国务院证券监督管理机构、国务院银行业监督管理机构应当责令其改正；逾期未改正，或者其行为严重影响所托管基金的稳健运行、损害基金份额持有人利益的，国务院证券监督管理机构、国务院银行业监督管理机构可以区别情形，对其采取下列措施:\n\n（一）限制业务活动，责令暂停办理新的基金托管业务；\n\n（二）责令更换负有责任的专门基金托管部门的高级管理人员。\n\n基金托管人整改后，应当向国务院证券监督管理机构、国务院银行业监督管理机构提交报告；经验收，符合有关要求的，应当自验收完毕之日起三日内解除对其采取的有关措施。"},{"n":40,"label":"第四十条","chapter":"第三章　基金托管人","text":"国务院证券监督管理机构、国务院银行业监督管理机构对有下列情形之一的基金托管人，可以取消其基金托管资格:\n（一）连续三年没有开展基金托管业务的；\n\n（二）违反本法规定，情节严重的；\n\n（三）法律、行政法规规定的其他情形。"},{"n":41,"label":"第四十一条","chapter":"第三章　基金托管人","text":"有下列情形之一的，基金托管人职责终止:\n\n（一）被依法取消基金托管资格；\n\n（二）被基金份额持有人大会解任；\n\n（三）依法解散、被依法撤销或者被依法宣告破产；\n\n（四）基金合同约定的其他情形。"},{"n":42,"label":"第四十二条","chapter":"第三章　基金托管人","text":"基金托管人职责终止的，基金份额持有人大会应当在六个月内选任新基金托管人；新基金托管人产生前，由国务院证券监督管理机构指定临时基金托管人。\n\n基金托管人职责终止的，应当妥善保管基金财产和基金托管业务资料，及时办理基金财产和基金托管业务的移交手续，新基金托管人或者临时基金托管人应当及时接收。"},{"n":43,"label":"第四十三条","chapter":"第三章　基金托管人","text":"基金托管人职责终止的，应当按照规定聘请会计师事务所对基金财产进行审计，并将审计结果予以公告，同时报国务院证券监督管理机构备案。"},{"n":44,"label":"第四十四条","chapter":"第四章　基金的运作方式和组织","text":"基金合同应当约定基金的运作方式。"},{"n":45,"label":"第四十五条","chapter":"第四章　基金的运作方式和组织","text":"基金的运作方式可以采用封闭式、开放式或者其他方式。\n采用封闭式运作方式的基金（以下简称封闭式基金），是指基金份额总额在基金合同期限内固定不变，基金份额持有人不得申请赎回的基金；采用开放式运作方式的基金（以下简称开放式基金），是指基金份额总额不固定，基金份额可以在基金合同约定的时间和场所申购或者赎回的基金。\n\n采用其他运作方式的基金的基金份额发售、交易、申购、赎回的办法，由国务院证券监督管理机构另行规定。"},{"n":46,"label":"第四十六条","chapter":"第四章　基金的运作方式和组织","text":"基金份额持有人享有下列权利:\n\n（一）分享基金财产收益；\n\n（二）参与分配清算后的剩余基金财产；\n\n（三）依法转让或者申请赎回其持有的基金份额；\n\n（四）按照规定要求召开基金份额持有人大会或者召集基金份额持有人大会；\n\n（五）对基金份额持有人大会审议事项行使表决权；\n\n（六）对基金管理人、基金托管人、基金服务机构损害其合法权益的行为依法提起诉讼；\n\n（七）基金合同约定的其他权利。\n\n公开募集基金的基金份额持有人有权查阅或者复制公开披露的基金信息资料；非公开募集基金的基金份额持有人对涉及自身利益的情况，有权查阅基金的财务会计账簿等财务资料。"},{"n":47,"label":"第四十七条","chapter":"第四章　基金的运作方式和组织","text":"基金份额持有人大会由全体基金份额持有人组成，行使下列职权:\n\n（一）决定基金扩募或者延长基金合同期限；\n\n（二）决定修改基金合同的重要内容或者提前终止基金合同；\n\n（三）决定更换基金管理人、基金托管人；\n\n（四）决定调整基金管理人、基金托管人的报酬标准；\n\n（五）基金合同约定的其他职权。"},{"n":48,"label":"第四十八条","chapter":"第四章　基金的运作方式和组织","text":"按照基金合同约定，基金份额持有人大会可以设立日常机构，行使下列职权:\n\n（一）召集基金份额持有人大会；\n\n（二）提请更换基金管理人、基金托管人；\n\n（三）监督基金管理人的投资运作、基金托管人的托管活动；\n\n（四）提请调整基金管理人、基金托管人的报酬标准；\n\n（五）基金合同约定的其他职权。\n\n前款规定的日常机构，由基金份额持有人大会选举产生的人员组成；其议事规则，由基金合同约定。"},{"n":49,"label":"第四十九条","chapter":"第四章　基金的运作方式和组织","text":"基金份额持有人大会及其日常机构不得直接参与或者干涉基金的投资管理活动。"},{"n":50,"label":"第五十条","chapter":"第五章　基金的公开募集","text":"公开募集基金，应当经国务院证券监督管理机构注册。未经注册，不得公开或者变相公开募集基金。\n前款所称公开募集基金，包括向不特定对象募集资金、向特定对象募集资金累计超过二百人，以及法律、行政法规规定的其他情形。\n\n公开募集基金应当由基金管理人管理，基金托管人托管。"},{"n":51,"label":"第五十一条","chapter":"第五章　基金的公开募集","text":"注册公开募集基金，由拟任基金管理人向国务院证券监督管理机构提交下列文件:\n\n（一）申请报告；\n\n（二）基金合同草案；\n\n（三）基金托管协议草案；\n\n（四）招募说明书草案；\n\n（五）律师事务所出具的法律意见书；\n\n（六）国务院证券监督管理机构规定提交的其他文件。"},{"n":52,"label":"第五十二条","chapter":"第五章　基金的公开募集","text":"公开募集基金的基金合同应当包括下列内容:\n\n（一）募集基金的目的和基金名称；\n\n（二）基金管理人、基金托管人的名称和住所；\n\n（三）基金的运作方式；\n\n（四）封闭式基金的基金份额总额和基金合同期限，或者开放式基金的最低募集份额总额；\n\n（五）确定基金份额发售日期、价格和费用的原则；\n\n（六）基金份额持有人、基金管理人和基金托管人的权利、义务；\n\n（七）基金份额持有人大会召集、议事及表决的程序和规则；\n（八）基金份额发售、交易、申购、赎回的程序、时间、地点、费用计算方式，以及给付赎回款项的时间和方式；\n\n（九）基金收益分配原则、执行方式；\n\n（十）基金管理人、基金托管人报酬的提取、支付方式与比例；\n\n（十一）与基金财产管理、运用有关的其他费用的提取、支付方式；\n\n（十二）基金财产的投资方向和投资限制；\n\n（十三）基金资产净值的计算方法和公告方式；\n\n（十四）基金募集未达到法定要求的处理方式；\n\n（十五）基金合同解除和终止的事由、程序以及基金财产清算方式；\n\n（十六）争议解决方式；\n\n（十七）当事人约定的其他事项。"},{"n":53,"label":"第五十三条","chapter":"第五章　基金的公开募集","text":"公开募集基金的基金招募说明书应当包括下列内容:\n\n（一）基金募集申请的准予注册文件名称和注册日期；\n\n（二）基金管理人、基金托管人的基本情况；\n\n（三）基金合同和基金托管协议的内容摘要；\n\n（四）基金份额的发售日期、价格、费用和期限；\n\n（五）基金份额的发售方式、发售机构及登记机构名称；\n\n（六）出具法律意见书的律师事务所和审计基金财产的会计师事务所的名称和住所；\n（七）基金管理人、基金托管人报酬及其他有关费用的提取、支付方式与比例；\n\n（八）风险警示内容；\n\n（九）国务院证券监督管理机构规定的其他内容。"},{"n":54,"label":"第五十四条","chapter":"第五章　基金的公开募集","text":"国务院证券监督管理机构应当自受理公开募集基金的募集注册申请之日起六个月内依照法律、行政法规及国务院证券监督管理机构的规定进行审查，作出注册或者不予注册的决定，并通知申请人；不予注册的，应当说明理由。"},{"n":55,"label":"第五十五条","chapter":"第五章　基金的公开募集","text":"基金募集申请经注册后，方可发售基金份额。\n\n基金份额的发售，由基金管理人或者其委托的基金销售机构办理。"},{"n":56,"label":"第五十六条","chapter":"第五章　基金的公开募集","text":"基金管理人应当在基金份额发售的三日前公布招募说明书、基金合同及其他有关文件。\n\n前款规定的文件应当真实、准确、完整。\n\n对基金募集所进行的宣传推介活动，应当符合有关法律、行政法规的规定，不得有本法第七十七条所列行为。"},{"n":57,"label":"第五十七条","chapter":"第五章　基金的公开募集","text":"基金管理人应当自收到准予注册文件之日起六个月内进行基金募集。超过六个月开始募集，原注册的事项未发生实质性变化的，应当报国务院证券监督管理机构备案；发生实质性变化的，应当向国务院证券监督管理机构重新提交注册申请。\n基金募集不得超过国务院证券监督管理机构准予注册的基金募集期限。基金募集期限自基金份额发售之日起计算。"},{"n":58,"label":"第五十八条","chapter":"第五章　基金的公开募集","text":"基金募集期限届满，封闭式基金募集的基金份额总额达到准予注册规模的百分之八十以上，开放式基金募集的基金份额总额超过准予注册的最低募集份额总额，并且基金份额持有人人数符合国务院证券监督管理机构规定的，基金管理人应当自募集期限届满之日起十日内聘请法定验资机构验资，自收到验资报告之日起十日内，向国务院证券监督管理机构提交验资报告，办理基金备案手续，并予以公告。"},{"n":59,"label":"第五十九条","chapter":"第五章　基金的公开募集","text":"基金募集期间募集的资金应当存入专门账户，在基金募集行为结束前，任何人不得动用。"},{"n":60,"label":"第六十条","chapter":"第五章　基金的公开募集","text":"投资人交纳认购的基金份额的款项时，基金合同成立；基金管理人依照本法第五十八条的规定向国务院证券监督管理机构办理基金备案手续，基金合同生效。\n\n基金募集期限届满，不能满足本法第五十八条规定的条件的，基金管理人应当承担下列责任:\n\n（一）以其固有财产承担因募集行为而产生的债务和费用；\n\n（二）在基金募集期限届满后三十日内返还投资人已交纳的款项，并加计银行同期存款利息。"},{"n":61,"label":"第六十一条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"申请基金份额上市交易，基金管理人应当向证券交易所提出申请，证券交易所依法审核同意的，双方应当签订上市协议。"},{"n":62,"label":"第六十二条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金份额上市交易，应当符合下列条件:\n\n（一）基金的募集符合本法规定；\n\n（二）基金合同期限为五年以上；\n\n（三）基金募集金额不低于二亿元人民币；\n\n（四）基金份额持有人不少于一千人；\n\n（五）基金份额上市交易规则规定的其他条件。"},{"n":63,"label":"第六十三条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金份额上市交易规则由证券交易所制定，报国务院证券监督管理机构批准。"},{"n":64,"label":"第六十四条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金份额上市交易后，有下列情形之一的，由证券交易所终止其上市交易，并报国务院证券监督管理机构备案:\n\n（一）不再具备本法第六十二条规定的上市交易条件；\n\n（二）基金合同期限届满；\n\n（三）基金份额持有人大会决定提前终止上市交易；\n\n（四）基金合同约定的或者基金份额上市交易规则规定的终止上市交易的其他情形。"},{"n":65,"label":"第六十五条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"开放式基金的基金份额的申购、赎回、登记，由基金管理人或者其委托的基金服务机构办理。"},{"n":66,"label":"第六十六条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金管理人应当在每个工作日办理基金份额的申购、赎回业务；基金合同另有约定的，从其约定。\n\n投资人交付申购款项，申购成立；基金份额登记机构确认基金份额时，申购生效。\n\n基金份额持有人递交赎回申请，赎回成立；基金份额登记机构确认赎回时，赎回生效。"},{"n":67,"label":"第六十七条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金管理人应当按时支付赎回款项，但是下列情形除外:\n\n（一）因不可抗力导致基金管理人不能支付赎回款项；\n\n（二）证券交易场所依法决定临时停市，导致基金管理人无法计算当日基金资产净值；\n\n（三）基金合同约定的其他特殊情形。\n\n发生上述情形之一的，基金管理人应当在当日报国务院证券监督管理机构备案。\n\n本条第一款规定的情形消失后，基金管理人应当及时支付赎回款项。"},{"n":68,"label":"第六十八条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"开放式基金应当保持足够的现金或者政府债券，以备支付基金份额持有人的赎回款项。基金财产中应当保持的现金或者政府债券的具体比例，由国务院证券监督管理机构规定。"},{"n":69,"label":"第六十九条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金份额的申购、赎回价格，依据申购、赎回日基金份额净值加、减有关费用计算。"},{"n":70,"label":"第七十条","chapter":"第六章　公开募集基金的基金份额的交易、申购与赎回","text":"基金份额净值计价出现错误时，基金管理人应当立即纠正，并采取合理的措施防止损失进一步扩大。计价错误达到基金份额净值百分之零点五时，基金管理人应当公告，并报国务院证券监督管理机构备案。\n\n因基金份额净值计价错误造成基金份额持有人损失的，基金份额持有人有权要求基金管理人、基金托管人予以赔偿。"},{"n":71,"label":"第七十一条","chapter":"第七章　公开募集基金的投资与信息披露","text":"基金管理人运用基金财产进行证券投资，除国务院证券监督管理机构另有规定外，应当采用资产组合的方式。\n\n资产组合的具体方式和投资比例，依照本法和国务院证券监督管理机构的规定在基金合同中约定。"},{"n":72,"label":"第七十二条","chapter":"第七章　公开募集基金的投资与信息披露","text":"基金财产应当用于下列投资:\n\n（一）上市交易的股票、债券；\n\n（二）国务院证券监督管理机构规定的其他证券及其衍生品种。"},{"n":73,"label":"第七十三条","chapter":"第七章　公开募集基金的投资与信息披露","text":"基金财产不得用于下列投资或者活动:\n\n（一）承销证券；\n\n（二）违反规定向他人贷款或者提供担保；\n\n（三）从事承担无限责任的投资；\n\n（四）买卖其他基金份额，但是国务院证券监督管理机构另有规定的除外；\n\n（五）向基金管理人、基金托管人出资；\n（六）从事内幕交易、操纵证券交易价格及其他不正当的证券交易活动；\n\n（七）法律、行政法规和国务院证券监督管理机构规定禁止的其他活动。\n\n运用基金财产买卖基金管理人、基金托管人及其控股股东、实际控制人或者与其有其他重大利害关系的公司发行的证券或承销期内承销的证券，或者从事其他重大关联交易的，应当遵循基金份额持有人利益优先的原则，防范利益冲突，符合国务院证券监督管理机构的规定，并履行信息披露义务。"},{"n":74,"label":"第七十四条","chapter":"第七章　公开募集基金的投资与信息披露","text":"基金管理人、基金托管人和其他基金信息披露义务人应当依法披露基金信息，并保证所披露信息的真实性、准确性和完整性。"},{"n":75,"label":"第七十五条","chapter":"第七章　公开募集基金的投资与信息披露","text":"基金信息披露义务人应当确保应予披露的基金信息在国务院证券监督管理机构规定时间内披露，并保证投资人能够按照基金合同约定的时间和方式查阅或者复制公开披露的信息资料。"},{"n":76,"label":"第七十六条","chapter":"第七章　公开募集基金的投资与信息披露","text":"公开披露的基金信息包括:\n\n（一）基金招募说明书、基金合同、基金托管协议；\n\n（二）基金募集情况；\n\n（三）基金份额上市交易公告书；\n\n（四）基金资产净值、基金份额净值；\n\n（五）基金份额申购、赎回价格；\n（六）基金财产的资产组合季度报告、财务会计报告及中期和年度基金报告；\n\n（七）临时报告；\n\n（八）基金份额持有人大会决议；\n\n（九）基金管理人、基金托管人的专门基金托管部门的重大人事变动；\n\n（十）涉及基金财产、基金管理业务、基金托管业务的诉讼或者仲裁；\n\n（十一）国务院证券监督管理机构规定应予披露的其他信息。"},{"n":77,"label":"第七十七条","chapter":"第七章　公开募集基金的投资与信息披露","text":"公开披露基金信息，不得有下列行为:\n\n（一）虚假记载、误导性陈述或者重大遗漏；\n\n（二）对证券投资业绩进行预测；\n\n（三）违规承诺收益或者承担损失；\n\n（四）诋毁其他基金管理人、基金托管人或者基金销售机构；\n\n（五）法律、行政法规和国务院证券监督管理机构规定禁止的其他行为。"},{"n":78,"label":"第七十八条","chapter":"第八章　公开募集基金的基金合同的变更、终止与基金财产清算","text":"按照基金合同的约定或者基金份额持有人大会的决议，基金可以转换运作方式或者与其他基金合并。"},{"n":79,"label":"第七十九条","chapter":"第八章　公开募集基金的基金合同的变更、终止与基金财产清算","text":"封闭式基金扩募或者延长基金合同期限，应当符合下列条件，并报国务院证券监督管理机构备案:\n\n（一）基金运营业绩良好；\n（二）基金管理人最近二年内没有因违法违规行为受到行政处罚或者刑事处罚；\n\n（三）基金份额持有人大会决议通过；\n\n（四）本法规定的其他条件。"},{"n":80,"label":"第八十条","chapter":"第八章　公开募集基金的基金合同的变更、终止与基金财产清算","text":"有下列情形之一的，基金合同终止:\n\n（一）基金合同期限届满而未延期；\n\n（二）基金份额持有人大会决定终止；\n\n（三）基金管理人、基金托管人职责终止，在六个月内没有新基金管理人、新基金托管人承接；\n\n（四）基金合同约定的其他情形。"},{"n":81,"label":"第八十一条","chapter":"第八章　公开募集基金的基金合同的变更、终止与基金财产清算","text":"基金合同终止时，基金管理人应当组织清算组对基金财产进行清算。\n\n清算组由基金管理人、基金托管人以及相关的中介服务机构组成。\n\n清算组作出的清算报告经会计师事务所审计，律师事务所出具法律意见书后，报国务院证券监督管理机构备案并公告。"},{"n":82,"label":"第八十二条","chapter":"第八章　公开募集基金的基金合同的变更、终止与基金财产清算","text":"清算后的剩余基金财产，应当按照基金份额持有人所持份额比例进行分配。"},{"n":83,"label":"第八十三条","chapter":"第九章　公开募集基金的基金份额持有人权利行使","text":"基金份额持有人大会由基金管理人召集。基金份额持有人大会设立日常机构的，由该日常机构召集；该日常机构未召集的，由基金管理人召集。基金管理人未按规定召集或者不能召集的，由基金托管人召集。\n代表基金份额百分之十以上的基金份额持有人就同一事项要求召开基金份额持有人大会，而基金份额持有人大会的日常机构、基金管理人、基金托管人都不召集的，代表基金份额百分之十以上的基金份额持有人有权自行召集，并报国务院证券监督管理机构备案。"},{"n":84,"label":"第八十四条","chapter":"第九章　公开募集基金的基金份额持有人权利行使","text":"召开基金份额持有人大会，召集人应当至少提前三十日公告基金份额持有人大会的召开时间、会议形式、审议事项、议事程序和表决方式等事项。\n\n基金份额持有人大会不得就未经公告的事项进行表决。"},{"n":85,"label":"第八十五条","chapter":"第九章　公开募集基金的基金份额持有人权利行使","text":"基金份额持有人大会可以采取现场方式召开，也可以采取通讯等方式召开。\n\n每一基金份额具有一票表决权，基金份额持有人可以委托代理人出席基金份额持有人大会并行使表决权。"},{"n":86,"label":"第八十六条","chapter":"第九章　公开募集基金的基金份额持有人权利行使","text":"基金份额持有人大会应当有代表二分之一以上基金份额的持有人参加，方可召开。\n\n参加基金份额持有人大会的持有人的基金份额低于前款规定比例的，召集人可以在原公告的基金份额持有人大会召开时间的三个月以后、六个月以内，就原定审议事项重新召集基金份额持有人大会。重新召集的基金份额持有人大会应当有代表三分之一以上基金份额的持有人参加，方可召开。\n基金份额持有人大会就审议事项作出决定，应当经参加大会的基金份额持有人所持表决权的二分之一以上通过；但是，转换基金的运作方式、更换基金管理人或者基金托管人、提前终止基金合同、与其他基金合并，应当经参加大会的基金份额持有人所持表决权的三分之二以上通过。\n\n基金份额持有人大会决定的事项，应当依法报国务院证券监督管理机构备案，并予以公告。"},{"n":87,"label":"第八十七条","chapter":"第十章　非公开募集基金","text":"非公开募集基金应当向合格投资者募集，合格投资者累计不得超过二百人。\n\n前款所称合格投资者，是指达到规定资产规模或者收入水平，并且具备相应的风险识别能力和风险承担能力、其基金份额认购金额不低于规定限额的单位和个人。\n\n合格投资者的具体标准由国务院证券监督管理机构规定。"},{"n":88,"label":"第八十八条","chapter":"第十章　非公开募集基金","text":"除基金合同另有约定外，非公开募集基金应当由基金托管人托管。"},{"n":89,"label":"第八十九条","chapter":"第十章　非公开募集基金","text":"担任非公开募集基金的基金管理人，应当按照规定向基金行业协会履行登记手续，报送基本情况。"},{"n":90,"label":"第九十条","chapter":"第十章　非公开募集基金","text":"未经登记，任何单位或者个人不得使用“基金”或者“基金管理”字样或者近似名称进行证券投资活动；但是，法律、行政法规另有规定的除外。"},{"n":91,"label":"第九十一条","chapter":"第十章　非公开募集基金","text":"非公开募集基金，不得向合格投资者之外的单位和个人募集资金，不得通过报刊、电台、电视台、互联网等公众传播媒体或者讲座、报告会、分析会等方式向不特定对象宣传推介。"},{"n":92,"label":"第九十二条","chapter":"第十章　非公开募集基金","text":"非公开募集基金，应当制定并签订基金合同。基金合同应当包括下列内容:\n\n（一）基金份额持有人、基金管理人、基金托管人的权利、义务；\n\n（二）基金的运作方式；\n\n（三）基金的出资方式、数额和认缴期限；\n\n（四）基金的投资范围、投资策略和投资限制；\n\n（五）基金收益分配原则、执行方式；\n\n（六）基金承担的有关费用；\n\n（七）基金信息提供的内容、方式；\n\n（八）基金份额的认购、赎回或者转让的程序和方式；\n\n（九）基金合同变更、解除和终止的事由、程序；\n\n（十）基金财产清算方式；\n\n（十一）当事人约定的其他事项。\n\n基金份额持有人转让基金份额的，应当符合本法第八十七条、第九十一条的规定。"},{"n":93,"label":"第九十三条","chapter":"第十章　非公开募集基金","text":"按照基金合同约定，非公开募集基金可以由部分基金份额持有人作为基金管理人负责基金的投资管理活动，并在基金财产不足以清偿其债务时对基金财产的债务承担无限连带责任。\n前款规定的非公开募集基金，其基金合同还应载明:\n\n（一）承担无限连带责任的基金份额持有人和其他基金份额持有人的姓名或者名称、住所；\n\n（二）承担无限连带责任的基金份额持有人的除名条件和更换程序；\n\n（三）基金份额持有人增加、退出的条件、程序以及相关责任；\n\n（四）承担无限连带责任的基金份额持有人和其他基金份额持有人的转换程序。"},{"n":94,"label":"第九十四条","chapter":"第十章　非公开募集基金","text":"非公开募集基金募集完毕，基金管理人应当向基金行业协会备案。对募集的资金总额或者基金份额持有人的人数达到规定标准的基金，基金行业协会应当向国务院证券监督管理机构报告。\n\n非公开募集基金财产的证券投资，包括买卖公开发行的股份有限公司股票、债券、基金份额，以及国务院证券监督管理机构规定的其他证券及其衍生品种。"},{"n":95,"label":"第九十五条","chapter":"第十章　非公开募集基金","text":"基金管理人、基金托管人应当按照基金合同的约定，向基金份额持有人提供基金信息。"},{"n":96,"label":"第九十六条","chapter":"第十章　非公开募集基金","text":"专门从事非公开募集基金管理业务的基金管理人，其股东、高级管理人员、经营期限、管理的基金资产规模等符合规定条件的，经国务院证券监督管理机构核准，可以从事公开募集基金管理业务。"},{"n":97,"label":"第九十七条","chapter":"第十一章　基金服务机构","text":"从事公开募集基金的销售、销售支付、份额登记、估值、投资顾问、评价、信息技术系统服务等基金服务业务的机构，应当按照国务院证券监督管理机构的规定进行注册或者备案。"},{"n":98,"label":"第九十八条","chapter":"第十一章　基金服务机构","text":"基金销售机构应当向投资人充分揭示投资风险，并根据投资人的风险承担能力销售不同风险等级的基金产品。"},{"n":99,"label":"第九十九条","chapter":"第十一章　基金服务机构","text":"基金销售支付机构应当按照规定办理基金销售结算资金的划付，确保基金销售结算资金安全、及时划付。"},{"n":100,"label":"第一百条","chapter":"第十一章　基金服务机构","text":"基金销售结算资金、基金份额独立于基金销售机构、基金销售支付机构或者基金份额登记机构的自有财产。基金销售机构、基金销售支付机构或者基金份额登记机构破产或者清算时，基金销售结算资金、基金份额不属于其破产财产或者清算财产。非因投资人本身的债务或者法律规定的其他情形，不得查封、冻结、扣划或者强制执行基金销售结算资金、基金份额。\n\n基金销售机构、基金销售支付机构、基金份额登记机构应当确保基金销售结算资金、基金份额的安全、独立，禁止任何单位或者个人以任何形式挪用基金销售结算资金、基金份额。"},{"n":101,"label":"第一百零一条","chapter":"第十一章　基金服务机构","text":"基金管理人可以委托基金服务机构代为办理基金的份额登记、核算、估值、投资顾问等事项，基金托管人可以委托基金服务机构代为办理基金的核算、估值、复核等事项，但基金管理人、基金托管人依法应当承担的责任不因委托而免除。"},{"n":102,"label":"第一百零二条","chapter":"第十一章　基金服务机构","text":"基金份额登记机构以电子介质登记的数据，是基金份额持有人权利归属的根据。基金份额持有人以基金份额出质的，质权自基金份额登记机构办理出质登记时设立。\n\n基金份额登记机构应当妥善保存登记数据，并将基金份额持有人名称、身份信息及基金份额明细等数据备份至国务院证券监督管理机构认定的机构。其保存期限自基金账户销户之日起不得少于二十年。\n\n基金份额登记机构应当保证登记数据的真实、准确、完整，不得隐匿、伪造、篡改或者毁损。"},{"n":103,"label":"第一百零三条","chapter":"第十一章　基金服务机构","text":"基金投资顾问机构及其从业人员提供基金投资顾问服务，应当具有合理的依据，对其服务能力和经营业绩进行如实陈述，不得以任何方式承诺或者保证投资收益，不得损害服务对象的合法权益。"},{"n":104,"label":"第一百零四条","chapter":"第十一章　基金服务机构","text":"基金评价机构及其从业人员应当客观公正，按照依法制定的业务规则开展基金评价业务，禁止误导投资人，防范可能发生的利益冲突。"},{"n":105,"label":"第一百零五条","chapter":"第十一章　基金服务机构","text":"基金管理人、基金托管人、基金服务机构的信息技术系统，应当符合规定的要求。国务院证券监督管理机构可以要求信息技术系统服务机构提供该信息技术系统的相关资料。"},{"n":106,"label":"第一百零六条","chapter":"第十一章　基金服务机构","text":"律师事务所、会计师事务所接受基金管理人、基金托管人的委托，为有关基金业务活动出具法律意见书、审计报告、内部控制评价报告等文件，应当勤勉尽责，对所依据的文件资料内容的真实性、准确性、完整性进行核查和验证。其制作、出具的文件有虚假记载、误导性陈述或者重大遗漏，给他人财产造成损失的，应当与委托人承担连带赔偿责任。"},{"n":107,"label":"第一百零七条","chapter":"第十一章　基金服务机构","text":"基金服务机构应当勤勉尽责、恪尽职守，建立应急等风险管理制度和灾难备份系统，不得泄露与基金份额持有人、基金投资运作相关的非公开信息。"},{"n":108,"label":"第一百零八条","chapter":"第十二章　基金行业协会","text":"基金行业协会是证券投资基金行业的自律性组织，是社会团体法人。\n\n基金管理人、基金托管人应当加入基金行业协会，基金服务机构可以加入基金行业协会。"},{"n":109,"label":"第一百零九条","chapter":"第十二章　基金行业协会","text":"基金行业协会的权力机构为全体会员组成的会员大会。\n\n基金行业协会设理事会。理事会成员依章程的规定由选举产生。"},{"n":110,"label":"第一百一十条","chapter":"第十二章　基金行业协会","text":"基金行业协会章程由会员大会制定，并报国务院证券监督管理机构备案。"},{"n":111,"label":"第一百一十一条","chapter":"第十二章　基金行业协会","text":"基金行业协会履行下列职责:\n\n（一）教育和组织会员遵守有关证券投资的法律、行政法规，维护投资人合法权益；\n\n（二）依法维护会员的合法权益，反映会员的建议和要求；\n\n（三）制定和实施行业自律规则，监督、检查会员及其从业人员的执业行为，对违反自律规则和协会章程的，按照规定给予纪律处分；\n\n（四）制定行业执业标准和业务规范，组织基金从业人员的从业考试、资质管理和业务培训；\n\n（五）提供会员服务，组织行业交流，推动行业创新，开展行业宣传和投资人教育活动；\n\n（六）对会员之间、会员与客户之间发生的基金业务纠纷进行调解；\n\n（七）依法办理非公开募集基金的登记、备案；\n\n（八）协会章程规定的其他职责。"},{"n":112,"label":"第一百一十二条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构依法履行下列职责:\n\n（一）制定有关证券投资基金活动监督管理的规章、规则，并行使审批、核准或者注册权；\n\n（二）办理基金备案；\n（三）对基金管理人、基金托管人及其他机构从事证券投资基金活动进行监督管理，对违法行为进行查处，并予以公告；\n\n（四）制定基金从业人员的资格标准和行为准则，并监督实施；\n\n（五）监督检查基金信息的披露情况；\n\n（六）指导和监督基金行业协会的活动；\n\n（七）法律、行政法规规定的其他职责。"},{"n":113,"label":"第一百一十三条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构依法履行职责，有权采取下列措施:\n\n（一）对基金管理人、基金托管人、基金服务机构进行现场检查，并要求其报送有关的业务资料；\n\n（二）进入涉嫌违法行为发生场所调查取证；\n\n（三）询问当事人和与被调查事件有关的单位和个人，要求其对与被调查事件有关的事项作出说明；\n\n（四）查阅、复制与被调查事件有关的财产权登记、通讯记录等资料；\n\n（五）查阅、复制当事人和与被调查事件有关的单位和个人的证券交易记录、登记过户记录、财务会计资料及其他相关文件和资料；对可能被转移、隐匿或者毁损的文件和资料，可以予以封存；\n（六）查询当事人和与被调查事件有关的单位和个人的资金账户、证券账户和银行账户；对有证据证明已经或者可能转移或者隐匿违法资金、证券等涉案财产或者隐匿、伪造、毁损重要证据的，经国务院证券监督管理机构主要负责人批准，可以冻结或者查封；\n\n（七）在调查操纵证券市场、内幕交易等重大证券违法行为时，经国务院证券监督管理机构主要负责人批准，可以限制被调查事件当事人的证券买卖，但限制的期限不得超过十五个交易日；案情复杂的，可以延长十五个交易日。"},{"n":114,"label":"第一百一十四条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构工作人员依法履行职责，进行调查或者检查时，不得少于二人，并应当出示合法证件；对调查或者检查中知悉的商业秘密负有保密的义务。"},{"n":115,"label":"第一百一十五条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构工作人员应当忠于职守，依法办事，公正廉洁，接受监督，不得利用职务牟取私利。"},{"n":116,"label":"第一百一十六条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构依法履行职责时，被调查、检查的单位和个人应当配合，如实提供有关文件和资料，不得拒绝、阻碍和隐瞒。"},{"n":117,"label":"第一百一十七条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构依法履行职责，发现违法行为涉嫌犯罪的，应当将案件移送司法机关处理。"},{"n":118,"label":"第一百一十八条","chapter":"第十三章　监督管理","text":"国务院证券监督管理机构工作人员在任职期间，或者离职后在《中华人民共和国公务员法》规定的期限内，不得在被监管的机构中担任职务。"},{"n":119,"label":"第一百一十九条","chapter":"第十四章　法律责任","text":"违反本法规定，未经批准擅自设立基金管理公司或者未经核准从事公开募集基金管理业务的，由证券监督管理机构予以取缔或者责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上三十万元以下罚款。\n\n基金管理公司违反本法规定，擅自变更持有百分之五以上股权的股东、实际控制人或者其他重大事项的，责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足五十万元的，并处五万元以上五十万元以下罚款。对直接负责的主管人员给予警告，并处三万元以上十万元以下罚款。"},{"n":120,"label":"第一百二十条","chapter":"第十四章　法律责任","text":"基金管理人的董事、监事、高级管理人员和其他从业人员，基金托管人的专门基金托管部门的高级管理人员和其他从业人员，未按照本法第十七条第一款规定申报的，责令改正，处三万元以上十万元以下罚款。\n基金管理人、基金托管人违反本法第十七条第二款规定的，责令改正，处十万元以上一百万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金从业资格，并处三万元以上三十万元以下罚款。"},{"n":121,"label":"第一百二十一条","chapter":"第十四章　法律责任","text":"基金管理人的董事、监事、高级管理人员和其他从业人员，基金托管人的专门基金托管部门的高级管理人员和其他从业人员违反本法第十八条规定的，责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款；情节严重的，撤销基金从业资格。"},{"n":122,"label":"第一百二十二条","chapter":"第十四章　法律责任","text":"基金管理人、基金托管人违反本法规定，未对基金财产实行分别管理或者分账保管，责令改正，处五万元以上五十万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金从业资格，并处三万元以上三十万元以下罚款。"},{"n":123,"label":"第一百二十三条","chapter":"第十四章　法律责任","text":"基金管理人、基金托管人及其董事、监事、高级管理人员和其他从业人员有本法第二十条所列行为之一的，责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款；基金管理人、基金托管人有上述行为的，还应当对其直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金从业资格，并处三万元以上三十万元以下罚款。\n\n基金管理人、基金托管人及其董事、监事、高级管理人员和其他从业人员侵占、挪用基金财产而取得的财产和收益，归入基金财产。但是，法律、行政法规另有规定的，依照其规定。"},{"n":124,"label":"第一百二十四条","chapter":"第十四章　法律责任","text":"基金管理人的股东、实际控制人违反本法第二十三条规定的，责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金或证券从业资格，并处三万元以上三十万元以下罚款。"},{"n":125,"label":"第一百二十五条","chapter":"第十四章　法律责任","text":"未经核准，擅自从事基金托管业务的，责令停止，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上三十万元以下罚款。"},{"n":126,"label":"第一百二十六条","chapter":"第十四章　法律责任","text":"基金管理人、基金托管人违反本法规定，相互出资或者持有股份的，责令改正，可以处十万元以下罚款。"},{"n":127,"label":"第一百二十七条","chapter":"第十四章　法律责任","text":"违反本法规定，擅自公开或者变相公开募集基金的，责令停止，返还所募资金和加计的银行同期存款利息，没收违法所得，并处所募资金金额百分之一以上百分之五以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处五万元以上五十万元以下罚款。"},{"n":128,"label":"第一百二十八条","chapter":"第十四章　法律责任","text":"违反本法第五十九条规定，动用募集的资金的，责令返还，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足五十万元的，并处五万元以上五十万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上三十万元以下罚款。"},{"n":129,"label":"第一百二十九条","chapter":"第十四章　法律责任","text":"基金管理人、基金托管人有本法第七十三条第一款第一项至第五项和第七项所列行为之一，或者违反本法第七十三条第二款规定的，责令改正，处十万元以上一百万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金从业资格，并处三万元以上三十万元以下罚款。\n\n基金管理人、基金托管人有前款行为，运用基金财产而取得的财产和收益，归入基金财产。但是，法律、行政法规另有规定的，依照其规定。"},{"n":130,"label":"第一百三十条","chapter":"第十四章　法律责任","text":"基金管理人、基金托管人有本法第七十三条第一款第六项规定行为的，除依照《中华人民共和国证券法》的有关规定处罚外，对直接负责的主管人员和其他直接责任人员暂停或者撤销基金从业资格。"},{"n":131,"label":"第一百三十一条","chapter":"第十四章　法律责任","text":"基金信息披露义务人不依法披露基金信息或者披露的信息有虚假记载、误导性陈述或者重大遗漏的，责令改正，没收违法所得，并处十万元以上一百万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金从业资格，并处三万元以上三十万元以下罚款。"},{"n":132,"label":"第一百三十二条","chapter":"第十四章　法律责任","text":"基金管理人或者基金托管人不按照规定召集基金份额持有人大会的，责令改正，可以处五万元以下罚款；对直接负责的主管人员和其他直接责任人员给予警告，暂停或者撤销基金从业资格。"},{"n":133,"label":"第一百三十三条","chapter":"第十四章　法律责任","text":"违反本法规定，未经登记，使用“基金”或者“基金管理”字样或者近似名称进行证券投资活动的，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上三十万元以下罚款。"},{"n":134,"label":"第一百三十四条","chapter":"第十四章　法律责任","text":"违反本法规定，非公开募集基金募集完毕，基金管理人未备案的，处十万元以上三十万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上十万元以下罚款。"},{"n":135,"label":"第一百三十五条","chapter":"第十四章　法律责任","text":"违反本法规定，向合格投资者之外的单位或者个人非公开募集资金或者转让基金份额的，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上三十万元以下罚款。"},{"n":136,"label":"第一百三十六条","chapter":"第十四章　法律责任","text":"违反本法规定，擅自从事公开募集基金的基金服务业务的，责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足三十万元的，并处十万元以上三十万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上十万元以下罚款。"},{"n":137,"label":"第一百三十七条","chapter":"第十四章　法律责任","text":"基金销售机构未向投资人充分揭示投资风险并误导其购买与其风险承担能力不相当的基金产品的，处十万元以上三十万元以下罚款；情节严重的，责令其停止基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告，撤销基金从业资格，并处三万元以上十万元以下罚款。"},{"n":138,"label":"第一百三十八条","chapter":"第十四章　法律责任","text":"基金销售支付机构未按照规定划付基金销售结算资金的，处十万元以上三十万元以下罚款；情节严重的，责令其停止基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告，撤销基金从业资格，并处三万元以上十万元以下罚款。"},{"n":139,"label":"第一百三十九条","chapter":"第十四章　法律责任","text":"挪用基金销售结算资金或者基金份额的，责令改正，没收违法所得，并处违法所得一倍以上五倍以下罚款；没有违法所得或者违法所得不足一百万元的，并处十万元以上一百万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上三十万元以下罚款。"},{"n":140,"label":"第一百四十条","chapter":"第十四章　法律责任","text":"基金份额登记机构未妥善保存或者备份基金份额登记数据的，责令改正，给予警告，并处十万元以上三十万元以下罚款；情节严重的，责令其停止基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告，撤销基金从业资格，并处三万元以上十万元以下罚款。\n\n基金份额登记机构隐匿、伪造、篡改、毁损基金份额登记数据的，责令改正，处十万元以上一百万元以下罚款，并责令其停止基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告，撤销基金从业资格，并处三万元以上三十万元以下罚款。"},{"n":141,"label":"第一百四十一条","chapter":"第十四章　法律责任","text":"基金投资顾问机构、基金评价机构及其从业人员违反本法规定开展投资顾问、基金评价服务的，处十万元以上三十万元以下罚款；情节严重的，责令其停止基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告，撤销基金从业资格，并处三万元以上十万元以下罚款。"},{"n":142,"label":"第一百四十二条","chapter":"第十四章　法律责任","text":"信息技术系统服务机构未按照规定向国务院证券监督管理机构提供相关信息技术系统资料，或者提供的信息技术系统资料虚假、有重大遗漏的，责令改正，处三万元以上十万元以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处一万元以上三万元以下罚款。"},{"n":143,"label":"第一百四十三条","chapter":"第十四章　法律责任","text":"会计师事务所、律师事务所未勤勉尽责，所出具的文件有虚假记载、误导性陈述或者重大遗漏的，责令改正，没收业务收入，暂停或者撤销相关业务许可，并处业务收入一倍以上五倍以下罚款。对直接负责的主管人员和其他直接责任人员给予警告，并处三万元以上十万元以下罚款。"},{"n":144,"label":"第一百四十四条","chapter":"第十四章　法律责任","text":"基金服务机构未建立应急等风险管理制度和灾难备份系统，或者泄露与基金份额持有人、基金投资运作相关的非公开信息的，处十万元以上三十万元以下罚款；情节严重的，责令其停止基金服务业务。对直接负责的主管人员和其他直接责任人员给予警告，撤销基金从业资格，并处三万元以上十万元以下罚款。"},{"n":145,"label":"第一百四十五条","chapter":"第十四章　法律责任","text":"违反本法规定，给基金财产、基金份额持有人或者投资人造成损害的，依法承担赔偿责任。\n\n基金管理人、基金托管人在履行各自职责的过程中，违反本法规定或者基金合同约定，给基金财产或者基金份额持有人造成损害的，应当分别对各自的行为依法承担赔偿责任；因共同行为给基金财产或者基金份额持有人造成损害的，应当承担连带赔偿责任。"},{"n":146,"label":"第一百四十六条","chapter":"第十四章　法律责任","text":"证券监督管理机构工作人员玩忽职守、滥用职权、徇私舞弊或者利用职务上的便利索取或者收受他人财物的，依法给予行政处分。"},{"n":147,"label":"第一百四十七条","chapter":"第十四章　法律责任","text":"拒绝、阻碍证券监督管理机构及其工作人员依法行使监督检查、调查职权未使用暴力、威胁方法的，依法给予治安管理处罚。"},{"n":148,"label":"第一百四十八条","chapter":"第十四章　法律责任","text":"违反法律、行政法规或者国务院证券监督管理机构的有关规定，情节严重的，国务院证券监督管理机构可以对有关责任人员采取证券市场禁入的措施。"},{"n":149,"label":"第一百四十九条","chapter":"第十四章　法律责任","text":"违反本法规定，构成犯罪的，依法追究刑事责任。"},{"n":150,"label":"第一百五十条","chapter":"第十四章　法律责任","text":"违反本法规定，应当承担民事赔偿责任和缴纳罚款、罚金，其财产不足以同时支付时，先承担民事赔偿责任。"},{"n":151,"label":"第一百五十一条","chapter":"第十四章　法律责任","text":"依照本法规定，基金管理人、基金托管人、基金服务机构应当承担的民事赔偿责任和缴纳的罚款、罚金，由基金管理人、基金托管人、基金服务机构以其固有财产承担。\n\n依法收缴的罚款、罚金和没收的违法所得，应当全部上缴国库。"},{"n":152,"label":"第一百五十二条","chapter":"第十五章　附则","text":"在中华人民共和国境内募集投资境外证券的基金，以及合格境外投资者在境内进行证券投资，应当经国务院证券监督管理机构批准，具体办法由国务院证券监督管理机构会同国务院有关部门规定，报国务院批准。"},{"n":153,"label":"第一百五十三条","chapter":"第十五章　附则","text":"公开或者非公开募集资金，以进行证券投资活动为目的设立的公司或者合伙企业，资产由基金管理人或者普通合伙人管理的，其证券投资活动适用本法。"},{"n":154,"label":"第一百五十四条","chapter":"第十五章　附则","text":"本法自2013年6月1日起施行。"}],"source":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_f70635e95c74402c878c9f9a0a362c16.html","textSource":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_f70635e95c74402c878c9f9a0a362c16.html","coverage":"正文全文","checked":"2026-09-23","format":"官方网页正文；去除网页导航并重排段落","sha256":"e82c4363552581ae47923e1609891a1ee2049f107126d7842ff1e627c8e26ad1"},{"id":"securities","title":"中华人民共和国证券法","level":"法律","issuer":"全国人大常委会","version":"2019年修订","effective":"2020-03-01","scope":"证券","topics":["交易合规","信息隔离","证券账户"],"overview":"私募基金进入证券市场后，还须识别证券交易、信息披露、内幕交易和操纵市场等制度。基金产品监管与交易行为监管同时存在。","practice":"MO与合规共同界定账户、交易指令、敏感信息及交易异常的控制接口；按参与者身份区分条款。","priority":[2,50,53,55,58],"articles":[{"n":1,"label":"第一条","chapter":"第一章 　总则","text":"为了规范证券发行和交易行为，保护投资者的合法权益，维护社会经济秩序和社会公共利益，促进社会主义市场经济的发展，制定本法。"},{"n":2,"label":"第二条","chapter":"第一章 　总则","text":"在中华人民共和国境内，股票、公司债券、存托凭证和国务院依法认定的其他证券的发行和交易，适用本法；本法未规定的，适用《中华人民共和国公司法》和其他法律、行政法规的规定。政府债券、证券投资基金份额的上市交易，适用本法；其他法律、行政法规另有规定的，适用其规定。资产支持证券、资产管理产品发行、交易的管理办法，由国务院依照本法的原则规定。在中华人民共和国境外的证券发行和交易活动，扰乱中华人民共和国境内市场秩序，损害境内投资者合法权益的，依照本法有关规定处理并追究法律责任。"},{"n":3,"label":"第三条","chapter":"第一章 　总则","text":"证券的发行、交易活动，必须遵循公开、公平、公正的原则。"},{"n":4,"label":"第四条","chapter":"第一章 　总则","text":"证券发行、交易活动的当事人具有平等的法律地位，应当遵守自愿、有偿、诚实信用的原则。"},{"n":5,"label":"第五条","chapter":"第一章 　总则","text":"证券的发行、交易活动，必须遵守法律、行政法规；禁止欺诈、内幕交易和操纵证券市场的行为。"},{"n":6,"label":"第六条","chapter":"第一章 　总则","text":"证券业和银行业、信托业、保险业实行分业经营、分业管理，证券公司与银行、信托、保险业务机构分别设立。国家另有规定的除外。"},{"n":7,"label":"第七条","chapter":"第一章 　总则","text":"国务院证券监督管理机构依法对全国证券市场实行集中统一监督管理。国务院证券监督管理机构根据需要可以设立派出机构，按照授权履行监督管理职责。"},{"n":8,"label":"第八条","chapter":"第一章 　总则","text":"国家审计机关依法对证券交易场所、证券公司、证券登记结算机构、证券监督管理机构进行审计监督。"},{"n":9,"label":"第九条","chapter":"第二章 　证券发行","text":"公开发行证券，必须符合法律、行政法规规定的条件，并依法报经国务院证券监督管理机构或者国务院授权的部门注册。未经依法注册，任何单位和个人不得公开发行证券。证券发行注册制的具体范围、实施步骤，由国务院规定。有下列情形之一的，为公开发行：\n（一）向不特定对象发行证券；\n（二）向特定对象发行证券累计超过二百人，但依法实施员工持股计划的员工人数不计算在内；\n（三）法律、行政法规规定的其他发行行为。非公开发行证券，不得采用广告、公开劝诱和变相公开方式。"},{"n":10,"label":"第十条","chapter":"第二章 　证券发行","text":"发行人申请公开发行股票、可转换为股票的公司债券，依法采取承销方式的，或者公开发行法律、行政法规规定实行保荐制度的其他证券的，应当聘请证券公司担任保荐人。保荐人应当遵守业务规则和行业规范，诚实守信，勤勉尽责，对发行人的申请文件和信息披露资料进行审慎核查，督导发行人规范运作。保荐人的管理办法由国务院证券监督管理机构规定。"},{"n":11,"label":"第十一条","chapter":"第二章 　证券发行","text":"设立股份有限公司公开发行股票，应当符合《中华人民共和国公司法》规定的条件和经国务院批准的国务院证券监督管理机构规定的其他条件，向国务院证券监督管理机构报送募股申请和下列文件：\n（一）公司章程；\n（二）发起人协议；\n（三）发起人姓名或者名称，发起人认购的股份数、出资种类及验资证明；\n（四）招股说明书；\n（五）代收股款银行的名称及地址；\n（六）承销机构名称及有关的协议。依照本法规定聘请保荐人的，还应当报送保荐人出具的发行保荐书。法律、行政法规规定设立公司必须报经批准的，还应当提交相应的批准文件。"},{"n":12,"label":"第十二条","chapter":"第二章 　证券发行","text":"公司首次公开发行新股，应当符合下列条件：\n（一）具备健全且运行良好的组织机构；\n（二）具有持续经营能力；\n（三）最近三年财务会计报告被出具无保留意见审计报告；\n（四）发行人及其控股股东、实际控制人最近三年不存在贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序的刑事犯罪；\n（五）经国务院批准的国务院证券监督管理机构规定的其他条件。上市公司发行新股，应当符合经国务院批准的国务院证券监督管理机构规定的条件，具体管理办法由国务院证券监督管理机构规定。公开发行存托凭证的，应当符合首次公开发行新股的条件以及国务院证券监督管理机构规定的其他条件。"},{"n":13,"label":"第十三条","chapter":"第二章 　证券发行","text":"公司公开发行新股，应当报送募股申请和下列文件：\n（一）公司营业执照；\n（二）公司章程；\n（三）股东大会决议；\n（四）招股说明书或者其他公开发行募集文件；\n（五）财务会计报告；\n（六）代收股款银行的名称及地址。依照本法规定聘请保荐人的，还应当报送保荐人出具的发行保荐书。依照本法规定实行承销的，还应当报送承销机构名称及有关的协议。"},{"n":14,"label":"第十四条","chapter":"第二章 　证券发行","text":"公司对公开发行股票所募集资金，必须按照招股说明书或者其他公开发行募集文件所列资金用途使用；改变资金用途，必须经股东大会作出决议。擅自改变用途，未作纠正的，或者未经股东大会认可的，不得公开发行新股。"},{"n":15,"label":"第十五条","chapter":"第二章 　证券发行","text":"公开发行公司债券，应当符合下列条件：\n（一）具备健全且运行良好的组织机构；\n（二）最近三年平均可分配利润足以支付公司债券一年的利息；\n（三）国务院规定的其他条件。公开发行公司债券筹集的资金，必须按照公司债券募集办法所列资金用途使用；改变资金用途，必须经债券持有人会议作出决议。公开发行公司债券筹集的资金，不得用于弥补亏损和非生产性支出。上市公司发行可转换为股票的公司债券，除应当符合第一款规定的条件外，还应当遵守本法第十二条第二款的规定。但是，按照公司债券募集办法，上市公司通过收购本公司股份的方式进行公司债券转换的除外。"},{"n":16,"label":"第十六条","chapter":"第二章 　证券发行","text":"申请公开发行公司债券，应当向国务院授权的部门或者国务院证券监督管理机构报送下列文件：\n（一）公司营业执照；\n（二）公司章程；\n（三）公司债券募集办法；\n（四）国务院授权的部门或者国务院证券监督管理机构规定的其他文件。依照本法规定聘请保荐人的，还应当报送保荐人出具的发行保荐书。"},{"n":17,"label":"第十七条","chapter":"第二章 　证券发行","text":"有下列情形之一的，不得再次公开发行公司债券：\n（一）对已公开发行的公司债券或者其他债务有违约或者延迟支付本息的事实，仍处于继续状态；\n（二）违反本法规定，改变公开发行公司债券所募资金的用途。"},{"n":18,"label":"第十八条","chapter":"第二章 　证券发行","text":"发行人依法申请公开发行证券所报送的申请文件的格式、报送方式，由依法负责注册的机构或者部门规定。"},{"n":19,"label":"第十九条","chapter":"第二章 　证券发行","text":"发行人报送的证券发行申请文件，应当充分披露投资者作出价值判断和投资决策所必需的信息，内容应当真实、准确、完整。为证券发行出具有关文件的证券服务机构和人员，必须严格履行法定职责，保证所出具文件的真实性、准确性和完整性。"},{"n":20,"label":"第二十条","chapter":"第二章 　证券发行","text":"发行人申请首次公开发行股票的，在提交申请文件后，应当按照国务院证券监督管理机构的规定预先披露有关申请文件。"},{"n":21,"label":"第二十一条","chapter":"第二章 　证券发行","text":"国务院证券监督管理机构或者国务院授权的部门依照法定条件负责证券发行申请的注册。证券公开发行注册的具体办法由国务院规定。按照国务院的规定，证券交易所等可以审核公开发行证券申请，判断发行人是否符合发行条件、信息披露要求，督促发行人完善信息披露内容。依照前两款规定参与证券发行申请注册的人员，不得与发行申请人有利害关系，不得直接或者间接接受发行申请人的馈赠，不得持有所注册的发行申请的证券，不得私下与发行申请人进行接触。"},{"n":22,"label":"第二十二条","chapter":"第二章 　证券发行","text":"国务院证券监督管理机构或者国务院授权的部门应当自受理证券发行申请文件之日起三个月内，依照法定条件和法定程序作出予以注册或者不予注册的决定，发行人根据要求补充、修改发行申请文件的时间不计算在内。不予注册的，应当说明理由。"},{"n":23,"label":"第二十三条","chapter":"第二章 　证券发行","text":"证券发行申请经注册后，发行人应当依照法律、行政法规的规定，在证券公开发行前公告公开发行募集文件，并将该文件置备于指定场所供公众查阅。发行证券的信息依法公开前，任何知情人不得公开或者泄露该信息。发行人不得在公告公开发行募集文件前发行证券。"},{"n":24,"label":"第二十四条","chapter":"第二章 　证券发行","text":"国务院证券监督管理机构或者国务院授权的部门对已作出的证券发行注册的决定，发现不符合法定条件或者法定程序，尚未发行证券的，应当予以撤销，停止发行。已经发行尚未上市的，撤销发行注册决定，发行人应当按照发行价并加算银行同期存款利息返还证券持有人；发行人的控股股东、实际控制人以及保荐人，应当与发行人承担连带责任，但是能够证明自己没有过错的除外。股票的发行人在招股说明书等证券发行文件中隐瞒重要事实或者编造重大虚假内容，已经发行并上市的，国务院证券监督管理机构可以责令发行人回购证券，或者责令负有责任的控股股东、实际控制人买回证券。"},{"n":25,"label":"第二十五条","chapter":"第二章 　证券发行","text":"股票依法发行后，发行人经营与收益的变化，由发行人自行负责；由此变化引致的投资风险，由投资者自行负责。"},{"n":26,"label":"第二十六条","chapter":"第二章 　证券发行","text":"发行人向不特定对象发行的证券，法律、行政法规规定应当由证券公司承销的，发行人应当同证券公司签订承销协议。证券承销业务采取代销或者包销方式。证券代销是指证券公司代发行人发售证券，在承销期结束时，将未售出的证券全部退还给发行人的承销方式。证券包销是指证券公司将发行人的证券按照协议全部购入或者在承销期结束时将售后剩余证券全部自行购入的承销方式。"},{"n":27,"label":"第二十七条","chapter":"第二章 　证券发行","text":"公开发行证券的发行人有权依法自主选择承销的证券公司。"},{"n":28,"label":"第二十八条","chapter":"第二章 　证券发行","text":"证券公司承销证券，应当同发行人签订代销或者包销协议，载明下列事项：\n（一）当事人的名称、住所及法定代表人姓名；\n（二）代销、包销证券的种类、数量、金额及发行价格；\n（三）代销、包销的期限及起止日期；\n（四）代销、包销的付款方式及日期；\n（五）代销、包销的费用和结算办法；\n（六）违约责任；\n（七）国务院证券监督管理机构规定的其他事项。"},{"n":29,"label":"第二十九条","chapter":"第二章 　证券发行","text":"证券公司承销证券，应当对公开发行募集文件的真实性、准确性、完整性进行核查。发现有虚假记载、误导性陈述或者重大遗漏的，不得进行销售活动；已经销售的，必须立即停止销售活动，并采取纠正措施。证券公司承销证券，不得有下列行为：\n（一）进行虚假的或者误导投资者的广告宣传或者其他宣传推介活动；\n（二）以不正当竞争手段招揽承销业务；\n（三）其他违反证券承销业务规定的行为。证券公司有前款所列行为，给其他证券承销机构或者投资者造成损失的，应当依法承担赔偿责任。"},{"n":30,"label":"第三十条","chapter":"第二章 　证券发行","text":"向不特定对象发行证券聘请承销团承销的，承销团应当由主承销和参与承销的证券公司组成。"},{"n":31,"label":"第三十一条","chapter":"第二章 　证券发行","text":"证券的代销、包销期限最长不得超过九十日。证券公司在代销、包销期内，对所代销、包销的证券应当保证先行出售给认购人，证券公司不得为本公司预留所代销的证券和预先购入并留存所包销的证券。"},{"n":32,"label":"第三十二条","chapter":"第二章 　证券发行","text":"股票发行采取溢价发行的，其发行价格由发行人与承销的证券公司协商确定。"},{"n":33,"label":"第三十三条","chapter":"第二章 　证券发行","text":"股票发行采用代销方式，代销期限届满，向投资者出售的股票数量未达到拟公开发行股票数量百分之七十的，为发行失败。发行人应当按照发行价并加算银行同期存款利息返还股票认购人。"},{"n":34,"label":"第三十四条","chapter":"第二章 　证券发行","text":"公开发行股票，代销、包销期限届满，发行人应当在规定的期限内将股票发行情况报国务院证券监督管理机构备案。"},{"n":35,"label":"第三十五条","chapter":"第三章 　证券交易","text":"证券交易当事人依法买卖的证券，必须是依法发行并交付的证券。非依法发行的证券，不得买卖。"},{"n":36,"label":"第三十六条","chapter":"第三章 　证券交易","text":"依法发行的证券，《中华人民共和国公司法》和其他法律对其转让期限有限制性规定的，在限定的期限内不得转让。上市公司持有百分之五以上股份的股东、实际控制人、董事、监事、高级管理人员，以及其他持有发行人首次公开发行前发行的股份或者上市公司向特定对象发行的股份的股东，转让其持有的本公司股份的，不得违反法律、行政法规和国务院证券监督管理机构关于持有期限、卖出时间、卖出数量、卖出方式、信息披露等规定，并应当遵守证券交易所的业务规则。"},{"n":37,"label":"第三十七条","chapter":"第三章 　证券交易","text":"公开发行的证券，应当在依法设立的证券交易所上市交易或者在国务院批准的其他全国性证券交易场所交易。非公开发行的证券，可以在证券交易所、国务院批准的其他全国性证券交易场所、按照国务院规定设立的区域性股权市场转让。"},{"n":38,"label":"第三十八条","chapter":"第三章 　证券交易","text":"证券在证券交易所上市交易，应当采用公开的集中交易方式或者国务院证券监督管理机构批准的其他方式。"},{"n":39,"label":"第三十九条","chapter":"第三章 　证券交易","text":"证券交易当事人买卖的证券可以采用纸面形式或者国务院证券监督管理机构规定的其他形式。"},{"n":40,"label":"第四十条","chapter":"第三章 　证券交易","text":"证券交易场所、证券公司和证券登记结算机构的从业人员，证券监督管理机构的工作人员以及法律、行政法规规定禁止参与股票交易的其他人员，在任期或者法定限期内，不得直接或者以化名、借他人名义持有、买卖股票或者其他具有股权性质的证券，也不得收受他人赠送的股票或者其他具有股权性质的证券。任何人在成为前款所列人员时，其原已持有的股票或者其他具有股权性质的证券，必须依法转让。实施股权激励计划或者员工持股计划的证券公司的从业人员，可以按照国务院证券监督管理机构的规定持有、卖出本公司股票或者其他具有股权性质的证券。"},{"n":41,"label":"第四十一条","chapter":"第三章 　证券交易","text":"证券交易场所、证券公司、证券登记结算机构、证券服务机构及其工作人员应当依法为投资者的信息保密，不得非法买卖、提供或者公开投资者的信息。证券交易场所、证券公司、证券登记结算机构、证券服务机构及其工作人员不得泄露所知悉的商业秘密。"},{"n":42,"label":"第四十二条","chapter":"第三章 　证券交易","text":"为证券发行出具审计报告或者法律意见书等文件的证券服务机构和人员，在该证券承销期内和期满后六个月内，不得买卖该证券。除前款规定外，为发行人及其控股股东、实际控制人，或者收购人、重大资产交易方出具审计报告或者法律意见书等文件的证券服务机构和人员，自接受委托之日起至上述文件公开后五日内，不得买卖该证券。实际开展上述有关工作之日早于接受委托之日的，自实际开展上述有关工作之日起至上述文件公开后五日内，不得买卖该证券。"},{"n":43,"label":"第四十三条","chapter":"第三章 　证券交易","text":"证券交易的收费必须合理，并公开收费项目、收费标准和管理办法。"},{"n":44,"label":"第四十四条","chapter":"第三章 　证券交易","text":"上市公司、股票在国务院批准的其他全国性证券交易场所交易的公司持有百分之五以上股份的股东、董事、监事、高级管理人员，将其持有的该公司的股票或者其他具有股权性质的证券在买入后六个月内卖出，或者在卖出后六个月内又买入，由此所得收益归该公司所有，公司董事会应当收回其所得收益。但是，证券公司因购入包销售后剩余股票而持有百分之五以上股份，以及有国务院证券监督管理机构规定的其他情形的除外。前款所称董事、监事、高级管理人员、自然人股东持有的股票或者其他具有股权性质的证券，包括其配偶、父母、子女持有的及利用他人账户持有的股票或者其他具有股权性质的证券。公司董事会不按照第一款规定执行的，股东有权要求董事会在三十日内执行。公司董事会未在上述期限内执行的，股东有权为了公司的利益以自己的名义直接向人民法院提起诉讼。公司董事会不按照第一款的规定执行的，负有责任的董事依法承担连带责任。"},{"n":45,"label":"第四十五条","chapter":"第三章 　证券交易","text":"通过计算机程序自动生成或者下达交易指令进行程序化交易的，应当符合国务院证券监督管理机构的规定，并向证券交易所报告，不得影响证券交易所系统安全或者正常交易秩序。第二节 　证券上市"},{"n":46,"label":"第四十六条","chapter":"第三章 　证券交易","text":"申请证券上市交易，应当向证券交易所提出申请，由证券交易所依法审核同意，并由双方签订上市协议。证券交易所根据国务院授权的部门的决定安排政府债券上市交易。"},{"n":47,"label":"第四十七条","chapter":"第三章 　证券交易","text":"申请证券上市交易，应当符合证券交易所上市规则规定的上市条件。证券交易所上市规则规定的上市条件，应当对发行人的经营年限、财务状况、最低公开发行比例和公司治理、诚信记录等提出要求。"},{"n":48,"label":"第四十八条","chapter":"第三章 　证券交易","text":"上市交易的证券，有证券交易所规定的终止上市情形的，由证券交易所按照业务规则终止其上市交易。证券交易所决定终止证券上市交易的，应当及时公告，并报国务院证券监督管理机构备案。"},{"n":49,"label":"第四十九条","chapter":"第三章 　证券交易","text":"对证券交易所作出的不予上市交易、终止上市交易决定不服的，可以向证券交易所设立的复核机构申请复核。第三节 　禁止的交易行为"},{"n":50,"label":"第五十条","chapter":"第三章 　证券交易","text":"禁止证券交易内幕信息的知情人和非法获取内幕信息的人利用内幕信息从事证券交易活动。"},{"n":51,"label":"第五十一条","chapter":"第三章 　证券交易","text":"证券交易内幕信息的知情人包括：\n（一）发行人及其董事、监事、高级管理人员；\n（二）持有公司百分之五以上股份的股东及其董事、监事、高级管理人员，公司的实际控制人及其董事、监事、高级管理人员；\n（三）发行人控股或者实际控制的公司及其董事、监事、高级管理人员；\n（四）由于所任公司职务或者因与公司业务往来可以获取公司有关内幕信息的人员；\n（五）上市公司收购人或者重大资产交易方及其控股股东、实际控制人、董事、监事和高级管理人员；\n（六）因职务、工作可以获取内幕信息的证券交易场所、证券公司、证券登记结算机构、证券服务机构的有关人员；\n（七）因职责、工作可以获取内幕信息的证券监督管理机构工作人员；\n（八）因法定职责对证券的发行、交易或者对上市公司及其收购、重大资产交易进行管理可以获取内幕信息的有关主管部门、监管机构的工作人员；\n（九）国务院证券监督管理机构规定的可以获取内幕信息的其他人员。"},{"n":52,"label":"第五十二条","chapter":"第三章 　证券交易","text":"证券交易活动中，涉及发行人的经营、财务或者对该发行人证券的市场价格有重大影响的尚未公开的信息，为内幕信息。本法第八十条第二款、第八十一条第二款所列重大事件属于内幕信息。"},{"n":53,"label":"第五十三条","chapter":"第三章 　证券交易","text":"证券交易内幕信息的知情人和非法获取内幕信息的人，在内幕信息公开前，不得买卖该公司的证券，或者泄露该信息，或者建议他人买卖该证券。持有或者通过协议、其他安排与他人共同持有公司百分之五以上股份的自然人、法人、非法人组织收购上市公司的股份，本法另有规定的，适用其规定。内幕交易行为给投资者造成损失的，应当依法承担赔偿责任。"},{"n":54,"label":"第五十四条","chapter":"第三章 　证券交易","text":"禁止证券交易场所、证券公司、证券登记结算机构、证券服务机构和其他金融机构的从业人员、有关监管部门或者行业协会的工作人员，利用因职务便利获取的内幕信息以外的其他未公开的信息，违反规定，从事与该信息相关的证券交易活动，或者明示、暗示他人从事相关交易活动。利用未公开信息进行交易给投资者造成损失的，应当依法承担赔偿责任。"},{"n":55,"label":"第五十五条","chapter":"第三章 　证券交易","text":"禁止任何人以下列手段操纵证券市场，影响或者意图影响证券交易价格或者证券交易量：\n（一）单独或者通过合谋，集中资金优势、持股优势或者利用信息优势联合或者连续买卖；\n（二）与他人串通，以事先约定的时间、价格和方式相互进行证券交易；\n（三）在自己实际控制的账户之间进行证券交易；\n（四）不以成交为目的，频繁或者大量申报并撤销申报；\n（五）利用虚假或者不确定的重大信息，诱导投资者进行证券交易；\n（六）对证券、发行人公开作出评价、预测或者投资建议，并进行反向证券交易；\n（七）利用在其他相关市场的活动操纵证券市场；\n（八）操纵证券市场的其他手段。操纵证券市场行为给投资者造成损失的，应当依法承担赔偿责任。"},{"n":56,"label":"第五十六条","chapter":"第三章 　证券交易","text":"禁止任何单位和个人编造、传播虚假信息或者误导性信息，扰乱证券市场。禁止证券交易场所、证券公司、证券登记结算机构、证券服务机构及其从业人员，证券业协会、证券监督管理机构及其工作人员，在证券交易活动中作出虚假陈述或者信息误导。各种传播媒介传播证券市场信息必须真实、客观，禁止误导。传播媒介及其从事证券市场信息报道的工作人员不得从事与其工作职责发生利益冲突的证券买卖。编造、传播虚假信息或者误导性信息，扰乱证券市场，给投资者造成损失的，应当依法承担赔偿责任。"},{"n":57,"label":"第五十七条","chapter":"第三章 　证券交易","text":"禁止证券公司及其从业人员从事下列损害客户利益的行为：\n（一）违背客户的委托为其买卖证券；\n（二）不在规定时间内向客户提供交易的确认文件；\n（三）未经客户的委托，擅自为客户买卖证券，或者假借客户的名义买卖证券；\n（四）为牟取佣金收入，诱使客户进行不必要的证券买卖；\n（五）其他违背客户真实意思表示，损害客户利益的行为。违反前款规定给客户造成损失的，应当依法承担赔偿责任。"},{"n":58,"label":"第五十八条","chapter":"第三章 　证券交易","text":"任何单位和个人不得违反规定，出借自己的证券账户或者借用他人的证券账户从事证券交易。"},{"n":59,"label":"第五十九条","chapter":"第三章 　证券交易","text":"依法拓宽资金入市渠道，禁止资金违规流入股市。禁止投资者违规利用财政资金、银行信贷资金买卖证券。"},{"n":60,"label":"第六十条","chapter":"第三章 　证券交易","text":"国有独资企业、国有独资公司、国有资本控股公司买卖上市交易的股票，必须遵守国家有关规定。"},{"n":61,"label":"第六十一条","chapter":"第三章 　证券交易","text":"证券交易场所、证券公司、证券登记结算机构、证券服务机构及其从业人员对证券交易中发现的禁止的交易行为，应当及时向证券监督管理机构报告。"},{"n":62,"label":"第六十二条","chapter":"第四章 　上市公司的收购","text":"投资者可以采取要约收购、协议收购及其他合法方式收购上市公司。"},{"n":63,"label":"第六十三条","chapter":"第四章 　上市公司的收购","text":"通过证券交易所的证券交易，投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到百分之五时，应当在该事实发生之日起三日内，向国务院证券监督管理机构、证券交易所作出书面报告，通知该上市公司，并予公告，在上述期限内不得再行买卖该上市公司的股票，但国务院证券监督管理机构规定的情形除外。投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到百分之五后，其所持该上市公司已发行的有表决权股份比例每增加或者减少百分之五，应当依照前款规定进行报告和公告，在该事实发生之日起至公告后三日内，不得再行买卖该上市公司的股票，但国务院证券监督管理机构规定的情形除外。投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到百分之五后，其所持该上市公司已发行的有表决权股份比例每增加或者减少百分之一，应当在该事实发生的次日通知该上市公司，并予公告。违反第一款、第二款规定买入上市公司有表决权的股份的，在买入后的三十六个月内，对该超过规定比例部分的股份不得行使表决权。"},{"n":64,"label":"第六十四条","chapter":"第四章 　上市公司的收购","text":"依照前条规定所作的公告，应当包括下列内容：\n（一）持股人的名称、住所；\n（二）持有的股票的名称、数额；\n（三）持股达到法定比例或者持股增减变化达到法定比例的日期、增持股份的资金来源；\n（四）在上市公司中拥有有表决权的股份变动的时间及方式。"},{"n":65,"label":"第六十五条","chapter":"第四章 　上市公司的收购","text":"通过证券交易所的证券交易，投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到百分之三十时，继续进行收购的，应当依法向该上市公司所有股东发出收购上市公司全部或者部分股份的要约。收购上市公司部分股份的要约应当约定，被收购公司股东承诺出售的股份数额超过预定收购的股份数额的，收购人按比例进行收购。"},{"n":66,"label":"第六十六条","chapter":"第四章 　上市公司的收购","text":"依照前条规定发出收购要约，收购人必须公告上市公司收购报告书，并载明下列事项：\n（一）收购人的名称、住所；\n（二）收购人关于收购的决定；\n（三）被收购的上市公司名称；\n（四）收购目的；\n（五）收购股份的详细名称和预定收购的股份数额；\n（六）收购期限、收购价格；\n（七）收购所需资金额及资金保证；\n（八）公告上市公司收购报告书时持有被收购公司股份数占该公司已发行的股份总数的比例。"},{"n":67,"label":"第六十七条","chapter":"第四章 　上市公司的收购","text":"收购要约约定的收购期限不得少于三十日，并不得超过六十日。"},{"n":68,"label":"第六十八条","chapter":"第四章 　上市公司的收购","text":"在收购要约确定的承诺期限内，收购人不得撤销其收购要约。收购人需要变更收购要约的，应当及时公告，载明具体变更事项，且不得存在下列情形：\n（一）降低收购价格；\n（二）减少预定收购股份数额；\n（三）缩短收购期限；\n（四）国务院证券监督管理机构规定的其他情形。"},{"n":69,"label":"第六十九条","chapter":"第四章 　上市公司的收购","text":"收购要约提出的各项收购条件，适用于被收购公司的所有股东。上市公司发行不同种类股份的，收购人可以针对不同种类股份提出不同的收购条件。"},{"n":70,"label":"第七十条","chapter":"第四章 　上市公司的收购","text":"采取要约收购方式的，收购人在收购期限内，不得卖出被收购公司的股票，也不得采取要约规定以外的形式和超出要约的条件买入被收购公司的股票。"},{"n":71,"label":"第七十一条","chapter":"第四章 　上市公司的收购","text":"采取协议收购方式的，收购人可以依照法律、行政法规的规定同被收购公司的股东以协议方式进行股份转让。以协议方式收购上市公司时，达成协议后，收购人必须在三日内将该收购协议向国务院证券监督管理机构及证券交易所作出书面报告，并予公告。在公告前不得履行收购协议。"},{"n":72,"label":"第七十二条","chapter":"第四章 　上市公司的收购","text":"采取协议收购方式的，协议双方可以临时委托证券登记结算机构保管协议转让的股票，并将资金存放于指定的银行。"},{"n":73,"label":"第七十三条","chapter":"第四章 　上市公司的收购","text":"采取协议收购方式的，收购人收购或者通过协议、其他安排与他人共同收购一个上市公司已发行的有表决权股份达到百分之三十时，继续进行收购的，应当依法向该上市公司所有股东发出收购上市公司全部或者部分股份的要约。但是，按照国务院证券监督管理机构的规定免除发出要约的除外。收购人依照前款规定以要约方式收购上市公司股份，应当遵守本法第六十五条第二款、第六十六条至第七十条的规定。"},{"n":74,"label":"第七十四条","chapter":"第四章 　上市公司的收购","text":"收购期限届满，被收购公司股权分布不符合证券交易所规定的上市交易要求的，该上市公司的股票应当由证券交易所依法终止上市交易；其余仍持有被收购公司股票的股东，有权向收购人以收购要约的同等条件出售其股票，收购人应当收购。收购行为完成后，被收购公司不再具备股份有限公司条件的，应当依法变更企业形式。"},{"n":75,"label":"第七十五条","chapter":"第四章 　上市公司的收购","text":"在上市公司收购中，收购人持有的被收购的上市公司的股票，在收购行为完成后的十八个月内不得转让。"},{"n":76,"label":"第七十六条","chapter":"第四章 　上市公司的收购","text":"收购行为完成后，收购人与被收购公司合并，并将该公司解散的，被解散公司的原有股票由收购人依法更换。收购行为完成后，收购人应当在十五日内将收购情况报告国务院证券监督管理机构和证券交易所，并予公告。"},{"n":77,"label":"第七十七条","chapter":"第四章 　上市公司的收购","text":"国务院证券监督管理机构依照本法制定上市公司收购的具体办法。上市公司分立或者被其他公司合并，应当向国务院证券监督管理机构报告，并予公告。"},{"n":78,"label":"第七十八条","chapter":"第五章 　信息披露","text":"发行人及法律、行政法规和国务院证券监督管理机构规定的其他信息披露义务人，应当及时依法履行信息披露义务。信息披露义务人披露的信息，应当真实、准确、完整，简明清晰，通俗易懂，不得有虚假记载、误导性陈述或者重大遗漏。证券同时在境内境外公开发行、交易的，其信息披露义务人在境外披露的信息，应当在境内同时披露。"},{"n":79,"label":"第七十九条","chapter":"第五章 　信息披露","text":"上市公司、公司债券上市交易的公司、股票在国务院批准的其他全国性证券交易场所交易的公司，应当按照国务院证券监督管理机构和证券交易场所规定的内容和格式编制定期报告，并按照以下规定报送和公告：\n（一）在每一会计年度结束之日起四个月内，报送并公告年度报告，其中的年度财务会计报告应当经符合本法规定的会计师事务所审计；\n（二）在每一会计年度的上半年结束之日起二个月内，报送并公告中期报告。"},{"n":80,"label":"第八十条","chapter":"第五章 　信息披露","text":"发生可能对上市公司、股票在国务院批准的其他全国性证券交易场所交易的公司的股票交易价格产生较大影响的重大事件，投资者尚未得知时，公司应当立即将有关该重大事件的情况向国务院证券监督管理机构和证券交易场所报送临时报告，并予公告，说明事件的起因、目前的状态和可能产生的法律后果。前款所称重大事件包括：\n（一）公司的经营方针和经营范围的重大变化；\n（二）公司的重大投资行为，公司在一年内购买、出售重大资产超过公司资产总额百分之三十，或者公司营业用主要资产的抵押、质押、出售或者报废一次超过该资产的百分之三十；\n（三）公司订立重要合同、提供重大担保或者从事关联交易，可能对公司的资产、负债、权益和经营成果产生重要影响；\n（四）公司发生重大债务和未能清偿到期重大债务的违约情况；\n（五）公司发生重大亏损或者重大损失；\n（六）公司生产经营的外部条件发生的重大变化；\n（七）公司的董事、三分之一以上监事或者经理发生变动，董事长或者经理无法履行职责；\n（八）持有公司百分之五以上股份的股东或者实际控制人持有股份或者控制公司的情况发生较大变化，公司的实际控制人及其控制的其他企业从事与公司相同或者相似业务的情况发生较大变化；\n（九）公司分配股利、增资的计划，公司股权结构的重要变化，公司减资、合并、分立、解散及申请破产的决定，或者依法进入破产程序、被责令关闭；\n（十）涉及公司的重大诉讼、仲裁，股东大会、董事会决议被依法撤销或者宣告无效；\n（十一）公司涉嫌犯罪被依法立案调查，公司的控股股东、实际控制人、董事、监事、高级管理人员涉嫌犯罪被依法采取强制措施；\n（十二）国务院证券监督管理机构规定的其他事项。公司的控股股东或者实际控制人对重大事件的发生、进展产生较大影响的，应当及时将其知悉的有关情况书面告知公司，并配合公司履行信息披露义务。"},{"n":81,"label":"第八十一条","chapter":"第五章 　信息披露","text":"发生可能对上市交易公司债券的交易价格产生较大影响的重大事件，投资者尚未得知时，公司应当立即将有关该重大事件的情况向国务院证券监督管理机构和证券交易场所报送临时报告，并予公告，说明事件的起因、目前的状态和可能产生的法律后果。前款所称重大事件包括：\n（一）公司股权结构或者生产经营状况发生重大变化；\n（二）公司债券信用评级发生变化；\n（三）公司重大资产抵押、质押、出售、转让、报废；\n（四）公司发生未能清偿到期债务的情况；\n（五）公司新增借款或者对外提供担保超过上年末净资产的百分之二十；\n（六）公司放弃债权或者财产超过上年末净资产的百分之十；\n（七）公司发生超过上年末净资产百分之十的重大损失；\n（八）公司分配股利，作出减资、合并、分立、解散及申请破产的决定，或者依法进入破产程序、被责令关闭；\n（九）涉及公司的重大诉讼、仲裁；\n（十）公司涉嫌犯罪被依法立案调查，公司的控股股东、实际控制人、董事、监事、高级管理人员涉嫌犯罪被依法采取强制措施；\n（十一）国务院证券监督管理机构规定的其他事项。"},{"n":82,"label":"第八十二条","chapter":"第五章 　信息披露","text":"发行人的董事、高级管理人员应当对证券发行文件和定期报告签署书面确认意见。发行人的监事会应当对董事会编制的证券发行文件和定期报告进行审核并提出书面审核意见。监事应当签署书面确认意见。发行人的董事、监事和高级管理人员应当保证发行人及时、公平地披露信息，所披露的信息真实、准确、完整。董事、监事和高级管理人员无法保证证券发行文件和定期报告内容的真实性、准确性、完整性或者有异议的，应当在书面确认意见中发表意见并陈述理由，发行人应当披露。发行人不予披露的，董事、监事和高级管理人员可以直接申请披露。"},{"n":83,"label":"第八十三条","chapter":"第五章 　信息披露","text":"信息披露义务人披露的信息应当同时向所有投资者披露，不得提前向任何单位和个人泄露。但是，法律、行政法规另有规定的除外。任何单位和个人不得非法要求信息披露义务人提供依法需要披露但尚未披露的信息。任何单位和个人提前获知的前述信息，在依法披露前应当保密。"},{"n":84,"label":"第八十四条","chapter":"第五章 　信息披露","text":"除依法需要披露的信息之外，信息披露义务人可以自愿披露与投资者作出价值判断和投资决策有关的信息，但不得与依法披露的信息相冲突，不得误导投资者。发行人及其控股股东、实际控制人、董事、监事、高级管理人员等作出公开承诺的，应当披露。不履行承诺给投资者造成损失的，应当依法承担赔偿责任。"},{"n":85,"label":"第八十五条","chapter":"第五章 　信息披露","text":"信息披露义务人未按照规定披露信息，或者公告的证券发行文件、定期报告、临时报告及其他信息披露资料存在虚假记载、误导性陈述或者重大遗漏，致使投资者在证券交易中遭受损失的，信息披露义务人应当承担赔偿责任；发行人的控股股东、实际控制人、董事、监事、高级管理人员和其他直接责任人员以及保荐人、承销的证券公司及其直接责任人员，应当与发行人承担连带赔偿责任，但是能够证明自己没有过错的除外。"},{"n":86,"label":"第八十六条","chapter":"第五章 　信息披露","text":"依法披露的信息，应当在证券交易场所的网站和符合国务院证券监督管理机构规定条件的媒体发布，同时将其置备于公司住所、证券交易场所，供社会公众查阅。"},{"n":87,"label":"第八十七条","chapter":"第五章 　信息披露","text":"国务院证券监督管理机构对信息披露义务人的信息披露行为进行监督管理。证券交易场所应当对其组织交易的证券的信息披露义务人的信息披露行为进行监督，督促其依法及时、准确地披露信息。"},{"n":88,"label":"第八十八条","chapter":"第六章 　投资者保护","text":"证券公司向投资者销售证券、提供服务时，应当按照规定充分了解投资者的基本情况、财产状况、金融资产状况、投资知识和经验、专业能力等相关信息；如实说明证券、服务的重要内容，充分揭示投资风险；销售、提供与投资者上述状况相匹配的证券、服务。投资者在购买证券或者接受服务时，应当按照证券公司明示的要求提供前款所列真实信息。拒绝提供或者未按照要求提供信息的，证券公司应当告知其后果，并按照规定拒绝向其销售证券、提供服务。证券公司违反第一款规定导致投资者损失的，应当承担相应的赔偿责任。"},{"n":89,"label":"第八十九条","chapter":"第六章 　投资者保护","text":"根据财产状况、金融资产状况、投资知识和经验、专业能力等因素，投资者可以分为普通投资者和专业投资者。专业投资者的标准由国务院证券监督管理机构规定。普通投资者与证券公司发生纠纷的，证券公司应当证明其行为符合法律、行政法规以及国务院证券监督管理机构的规定，不存在误导、欺诈等情形。证券公司不能证明的，应当承担相应的赔偿责任。"},{"n":90,"label":"第九十条","chapter":"第六章 　投资者保护","text":"上市公司董事会、独立董事、持有百分之一以上有表决权股份的股东或者依照法律、行政法规或者国务院证券监督管理机构的规定设立的投资者保护机构（以下简称投资者保护机构），可以作为征集人，自行或者委托证券公司、证券服务机构，公开请求上市公司股东委托其代为出席股东大会，并代为行使提案权、表决权等股东权利。依照前款规定征集股东权利的，征集人应当披露征集文件，上市公司应当予以配合。禁止以有偿或者变相有偿的方式公开征集股东权利。公开征集股东权利违反法律、行政法规或者国务院证券监督管理机构有关规定，导致上市公司或者其股东遭受损失的，应当依法承担赔偿责任。"},{"n":91,"label":"第九十一条","chapter":"第六章 　投资者保护","text":"上市公司应当在章程中明确分配现金股利的具体安排和决策程序，依法保障股东的资产收益权。上市公司当年税后利润，在弥补亏损及提取法定公积金后有盈余的，应当按照公司章程的规定分配现金股利。"},{"n":92,"label":"第九十二条","chapter":"第六章 　投资者保护","text":"公开发行公司债券的，应当设立债券持有人会议，并应当在募集说明书中说明债券持有人会议的召集程序、会议规则和其他重要事项。公开发行公司债券的，发行人应当为债券持有人聘请债券受托管理人，并订立债券受托管理协议。受托管理人应当由本次发行的承销机构或者其他经国务院证券监督管理机构认可的机构担任，债券持有人会议可以决议变更债券受托管理人。债券受托管理人应当勤勉尽责，公正履行受托管理职责，不得损害债券持有人利益。债券发行人未能按期兑付债券本息的，债券受托管理人可以接受全部或者部分债券持有人的委托，以自己名义代表债券持有人提起、参加民事诉讼或者清算程序。"},{"n":93,"label":"第九十三条","chapter":"第六章 　投资者保护","text":"发行人因欺诈发行、虚假陈述或者其他重大违法行为给投资者造成损失的，发行人的控股股东、实际控制人、相关的证券公司可以委托投资者保护机构，就赔偿事宜与受到损失的投资者达成协议，予以先行赔付。先行赔付后，可以依法向发行人以及其他连带责任人追偿。"},{"n":94,"label":"第九十四条","chapter":"第六章 　投资者保护","text":"投资者与发行人、证券公司等发生纠纷的，双方可以向投资者保护机构申请调解。普通投资者与证券公司发生证券业务纠纷，普通投资者提出调解请求的，证券公司不得拒绝。投资者保护机构对损害投资者利益的行为，可以依法支持投资者向人民法院提起诉讼。发行人的董事、监事、高级管理人员执行公司职务时违反法律、行政法规或者公司章程的规定给公司造成损失，发行人的控股股东、实际控制人等侵犯公司合法权益给公司造成损失，投资者保护机构持有该公司股份的，可以为公司的利益以自己的名义向人民法院提起诉讼，持股比例和持股期限不受《中华人民共和国公司法》规定的限制。"},{"n":95,"label":"第九十五条","chapter":"第六章 　投资者保护","text":"投资者提起虚假陈述等证券民事赔偿诉讼时，诉讼标的是同一种类，且当事人一方人数众多的，可以依法推选代表人进行诉讼。对按照前款规定提起的诉讼，可能存在有相同诉讼请求的其他众多投资者的，人民法院可以发出公告，说明该诉讼请求的案件情况，通知投资者在一定期间向人民法院登记。人民法院作出的判决、裁定，对参加登记的投资者发生效力。投资者保护机构受五十名以上投资者委托，可以作为代表人参加诉讼，并为经证券登记结算机构确认的权利人依照前款规定向人民法院登记，但投资者明确表示不愿意参加该诉讼的除外。"},{"n":96,"label":"第九十六条","chapter":"第七章 　证券交易场所","text":"证券交易所、国务院批准的其他全国性证券交易场所为证券集中交易提供场所和设施，组织和监督证券交易，实行自律管理，依法登记，取得法人资格。证券交易所、国务院批准的其他全国性证券交易场所的设立、变更和解散由国务院决定。国务院批准的其他全国性证券交易场所的组织机构、管理办法等，由国务院规定。"},{"n":97,"label":"第九十七条","chapter":"第七章 　证券交易场所","text":"证券交易所、国务院批准的其他全国性证券交易场所可以根据证券品种、行业特点、公司规模等因素设立不同的市场层次。"},{"n":98,"label":"第九十八条","chapter":"第七章 　证券交易场所","text":"按照国务院规定设立的区域性股权市场为非公开发行证券的发行、转让提供场所和设施，具体管理办法由国务院规定。"},{"n":99,"label":"第九十九条","chapter":"第七章 　证券交易场所","text":"证券交易所履行自律管理职能，应当遵守社会公共利益优先原则，维护市场的公平、有序、透明。设立证券交易所必须制定章程。证券交易所章程的制定和修改，必须经国务院证券监督管理机构批准。"},{"n":100,"label":"第一百条","chapter":"第七章 　证券交易场所","text":"证券交易所必须在其名称中标明证券交易所字样。其他任何单位或者个人不得使用证券交易所或者近似的名称。"},{"n":101,"label":"第一百零一条","chapter":"第七章 　证券交易场所","text":"证券交易所可以自行支配的各项费用收入，应当首先用于保证其证券交易场所和设施的正常运行并逐步改善。实行会员制的证券交易所的财产积累归会员所有，其权益由会员共同享有，在其存续期间，不得将其财产积累分配给会员。"},{"n":102,"label":"第一百零二条","chapter":"第七章 　证券交易场所","text":"实行会员制的证券交易所设理事会、监事会。证券交易所设总经理一人，由国务院证券监督管理机构任免。"},{"n":103,"label":"第一百零三条","chapter":"第七章 　证券交易场所","text":"有《中华人民共和国公司法》第一百四十六条规定的情形或者下列情形之一的，不得担任证券交易所的负责人：\n（一）因违法行为或者违纪行为被解除职务的证券交易场所、证券登记结算机构的负责人或者证券公司的董事、监事、高级管理人员，自被解除职务之日起未逾五年；\n（二）因违法行为或者违纪行为被吊销执业证书或者被取消资格的律师、注册会计师或者其他证券服务机构的专业人员，自被吊销执业证书或者被取消资格之日起未逾五年。"},{"n":104,"label":"第一百零四条","chapter":"第七章 　证券交易场所","text":"因违法行为或者违纪行为被开除的证券交易场所、证券公司、证券登记结算机构、证券服务机构的从业人员和被开除的国家机关工作人员，不得招聘为证券交易所的从业人员。"},{"n":105,"label":"第一百零五条","chapter":"第七章 　证券交易场所","text":"进入实行会员制的证券交易所参与集中交易的，必须是证券交易所的会员。证券交易所不得允许非会员直接参与股票的集中交易。"},{"n":106,"label":"第一百零六条","chapter":"第七章 　证券交易场所","text":"投资者应当与证券公司签订证券交易委托协议，并在证券公司实名开立账户，以书面、电话、自助终端、网络等方式，委托该证券公司代其买卖证券。"},{"n":107,"label":"第一百零七条","chapter":"第七章 　证券交易场所","text":"证券公司为投资者开立账户，应当按照规定对投资者提供的身份信息进行核对。证券公司不得将投资者的账户提供给他人使用。投资者应当使用实名开立的账户进行交易。"},{"n":108,"label":"第一百零八条","chapter":"第七章 　证券交易场所","text":"证券公司根据投资者的委托，按照证券交易规则提出交易申报，参与证券交易所场内的集中交易，并根据成交结果承担相应的清算交收责任。证券登记结算机构根据成交结果，按照清算交收规则，与证券公司进行证券和资金的清算交收，并为证券公司客户办理证券的登记过户手续。"},{"n":109,"label":"第一百零九条","chapter":"第七章 　证券交易场所","text":"证券交易所应当为组织公平的集中交易提供保障，实时公布证券交易即时行情，并按交易日制作证券市场行情表，予以公布。证券交易即时行情的权益由证券交易所依法享有。未经证券交易所许可，任何单位和个人不得发布证券交易即时行情。"},{"n":110,"label":"第一百一十条","chapter":"第七章 　证券交易场所","text":"上市公司可以向证券交易所申请其上市交易股票的停牌或者复牌，但不得滥用停牌或者复牌损害投资者的合法权益。证券交易所可以按照业务规则的规定，决定上市交易股票的停牌或者复牌。"},{"n":111,"label":"第一百一十一条","chapter":"第七章 　证券交易场所","text":"因不可抗力、意外事件、重大技术故障、重大人为差错等突发性事件而影响证券交易正常进行时，为维护证券交易正常秩序和市场公平，证券交易所可以按照业务规则采取技术性停牌、临时停市等处置措施，并应当及时向国务院证券监督管理机构报告。因前款规定的突发性事件导致证券交易结果出现重大异常，按交易结果进行交收将对证券交易正常秩序和市场公平造成重大影响的，证券交易所按照业务规则可以采取取消交易、通知证券登记结算机构暂缓交收等措施，并应当及时向国务院证券监督管理机构报告并公告。证券交易所对其依照本条规定采取措施造成的损失，不承担民事赔偿责任，但存在重大过错的除外。"},{"n":112,"label":"第一百一十二条","chapter":"第七章 　证券交易场所","text":"证券交易所对证券交易实行实时监控，并按照国务院证券监督管理机构的要求，对异常的交易情况提出报告。证券交易所根据需要，可以按照业务规则对出现重大异常交易情况的证券账户的投资者限制交易，并及时报告国务院证券监督管理机构。"},{"n":113,"label":"第一百一十三条","chapter":"第七章 　证券交易场所","text":"证券交易所应当加强对证券交易的风险监测，出现重大异常波动的，证券交易所可以按照业务规则采取限制交易、强制停牌等处置措施，并向国务院证券监督管理机构报告；严重影响证券市场稳定的，证券交易所可以按照业务规则采取临时停市等处置措施并公告。证券交易所对其依照本条规定采取措施造成的损失，不承担民事赔偿责任，但存在重大过错的除外。"},{"n":114,"label":"第一百一十四条","chapter":"第七章 　证券交易场所","text":"证券交易所应当从其收取的交易费用和会员费、席位费中提取一定比例的金额设立风险基金。风险基金由证券交易所理事会管理。风险基金提取的具体比例和使用办法，由国务院证券监督管理机构会同国务院财政部门规定。证券交易所应当将收存的风险基金存入开户银行专门账户，不得擅自使用。"},{"n":115,"label":"第一百一十五条","chapter":"第七章 　证券交易场所","text":"证券交易所依照法律、行政法规和国务院证券监督管理机构的规定，制定上市规则、交易规则、会员管理规则和其他有关业务规则，并报国务院证券监督管理机构批准。在证券交易所从事证券交易，应当遵守证券交易所依法制定的业务规则。违反业务规则的，由证券交易所给予纪律处分或者采取其他自律管理措施。"},{"n":116,"label":"第一百一十六条","chapter":"第七章 　证券交易场所","text":"证券交易所的负责人和其他从业人员执行与证券交易有关的职务时，与其本人或者其亲属有利害关系的，应当回避。"},{"n":117,"label":"第一百一十七条","chapter":"第七章 　证券交易场所","text":"按照依法制定的交易规则进行的交易，不得改变其交易结果，但本法第一百一十一条第二款规定的除外。对交易中违规交易者应负的民事责任不得免除；在违规交易中所获利益，依照有关规定处理。"},{"n":118,"label":"第一百一十八条","chapter":"第八章 　证券公司","text":"设立证券公司，应当具备下列条件，并经国务院证券监督管理机构批准：\n（一）有符合法律、行政法规规定的公司章程；\n（二）主要股东及公司的实际控制人具有良好的财务状况和诚信记录，最近三年无重大违法违规记录；\n（三）有符合本法规定的公司注册资本；\n（四）董事、监事、高级管理人员、从业人员符合本法规定的条件；\n（五）有完善的风险管理与内部控制制度；\n（六）有合格的经营场所、业务设施和信息技术系统；\n（七）法律、行政法规和经国务院批准的国务院证券监督管理机构规定的其他条件。未经国务院证券监督管理机构批准，任何单位和个人不得以证券公司名义开展证券业务活动。"},{"n":119,"label":"第一百一十九条","chapter":"第八章 　证券公司","text":"国务院证券监督管理机构应当自受理证券公司设立申请之日起六个月内，依照法定条件和法定程序并根据审慎监管原则进行审查，作出批准或者不予批准的决定，并通知申请人；不予批准的，应当说明理由。证券公司设立申请获得批准的，申请人应当在规定的期限内向公司登记机关申请设立登记，领取营业执照。证券公司应当自领取营业执照之日起十五日内，向国务院证券监督管理机构申请经营证券业务许可证。未取得经营证券业务许可证，证券公司不得经营证券业务。"},{"n":120,"label":"第一百二十条","chapter":"第八章 　证券公司","text":"经国务院证券监督管理机构核准，取得经营证券业务许可证，证券公司可以经营下列部分或者全部证券业务：\n（一）证券经纪；\n（二）证券投资咨询；\n（三）与证券交易、证券投资活动有关的财务顾问；\n（四）证券承销与保荐；\n（五）证券融资融券；\n（六）证券做市交易；\n（七）证券自营；\n（八）其他证券业务。国务院证券监督管理机构应当自受理前款规定事项申请之日起三个月内，依照法定条件和程序进行审查，作出核准或者不予核准的决定，并通知申请人；不予核准的，应当说明理由。证券公司经营证券资产管理业务的，应当符合《中华人民共和国证券投资基金法》等法律、行政法规的规定。除证券公司外，任何单位和个人不得从事证券承销、证券保荐、证券经纪和证券融资融券业务。证券公司从事证券融资融券业务，应当采取措施，严格防范和控制风险，不得违反规定向客户出借资金或者证券。"},{"n":121,"label":"第一百二十一条","chapter":"第八章 　证券公司","text":"证券公司经营本法第一百二十条第一款第（一）项至第（三）项业务的，注册资本最低限额为人民币五千万元；经营第（四）项至第（八）项业务之一的，注册资本最低限额为人民币一亿元；经营第（四）项至第（八）项业务中两项以上的，注册资本最低限额为人民币五亿元。证券公司的注册资本应当是实缴资本。国务院证券监督管理机构根据审慎监管原则和各项业务的风险程度，可以调整注册资本最低限额，但不得少于前款规定的限额。"},{"n":122,"label":"第一百二十二条","chapter":"第八章 　证券公司","text":"证券公司变更证券业务范围，变更主要股东或者公司的实际控制人，合并、分立、停业、解散、破产，应当经国务院证券监督管理机构核准。"},{"n":123,"label":"第一百二十三条","chapter":"第八章 　证券公司","text":"国务院证券监督管理机构应当对证券公司净资本和其他风险控制指标作出规定。证券公司除依照规定为其客户提供融资融券外，不得为其股东或者股东的关联人提供融资或者担保。"},{"n":124,"label":"第一百二十四条","chapter":"第八章 　证券公司","text":"证券公司的董事、监事、高级管理人员，应当正直诚实、品行良好，熟悉证券法律、行政法规，具有履行职责所需的经营管理能力。证券公司任免董事、监事、高级管理人员，应当报国务院证券监督管理机构备案。有《中华人民共和国公司法》第一百四十六条规定的情形或者下列情形之一的，不得担任证券公司的董事、监事、高级管理人员：\n（一）因违法行为或者违纪行为被解除职务的证券交易场所、证券登记结算机构的负责人或者证券公司的董事、监事、高级管理人员，自被解除职务之日起未逾五年；\n（二）因违法行为或者违纪行为被吊销执业证书或者被取消资格的律师、注册会计师或者其他证券服务机构的专业人员，自被吊销执业证书或者被取消资格之日起未逾五年。"},{"n":125,"label":"第一百二十五条","chapter":"第八章 　证券公司","text":"证券公司从事证券业务的人员应当品行良好，具备从事证券业务所需的专业能力。因违法行为或者违纪行为被开除的证券交易场所、证券公司、证券登记结算机构、证券服务机构的从业人员和被开除的国家机关工作人员，不得招聘为证券公司的从业人员。国家机关工作人员和法律、行政法规规定的禁止在公司中兼职的其他人员，不得在证券公司中兼任职务。"},{"n":126,"label":"第一百二十六条","chapter":"第八章 　证券公司","text":"国家设立证券投资者保护基金。证券投资者保护基金由证券公司缴纳的资金及其他依法筹集的资金组成，其规模以及筹集、管理和使用的具体办法由国务院规定。"},{"n":127,"label":"第一百二十七条","chapter":"第八章 　证券公司","text":"证券公司从每年的业务收入中提取交易风险准备金，用于弥补证券经营的损失，其提取的具体比例由国务院证券监督管理机构会同国务院财政部门规定。"},{"n":128,"label":"第一百二十八条","chapter":"第八章 　证券公司","text":"证券公司应当建立健全内部控制制度，采取有效隔离措施，防范公司与客户之间、不同客户之间的利益冲突。证券公司必须将其证券经纪业务、证券承销业务、证券自营业务、证券做市业务和证券资产管理业务分开办理，不得混合操作。"},{"n":129,"label":"第一百二十九条","chapter":"第八章 　证券公司","text":"证券公司的自营业务必须以自己的名义进行，不得假借他人名义或者以个人名义进行。证券公司的自营业务必须使用自有资金和依法筹集的资金。证券公司不得将其自营账户借给他人使用。"},{"n":130,"label":"第一百三十条","chapter":"第八章 　证券公司","text":"证券公司应当依法审慎经营，勤勉尽责，诚实守信。证券公司的业务活动，应当与其治理结构、内部控制、合规管理、风险管理以及风险控制指标、从业人员构成等情况相适应，符合审慎监管和保护投资者合法权益的要求。证券公司依法享有自主经营的权利，其合法经营不受干涉。"},{"n":131,"label":"第一百三十一条","chapter":"第八章 　证券公司","text":"证券公司客户的交易结算资金应当存放在商业银行，以每个客户的名义单独立户管理。证券公司不得将客户的交易结算资金和证券归入其自有财产。禁止任何单位或者个人以任何形式挪用客户的交易结算资金和证券。证券公司破产或者清算时，客户的交易结算资金和证券不属于其破产财产或者清算财产。非因客户本身的债务或者法律规定的其他情形，不得查封、冻结、扣划或者强制执行客户的交易结算资金和证券。"},{"n":132,"label":"第一百三十二条","chapter":"第八章 　证券公司","text":"证券公司办理经纪业务，应当置备统一制定的证券买卖委托书，供委托人使用。采取其他委托方式的，必须作出委托记录。客户的证券买卖委托，不论是否成交，其委托记录应当按照规定的期限，保存于证券公司。"},{"n":133,"label":"第一百三十三条","chapter":"第八章 　证券公司","text":"证券公司接受证券买卖的委托，应当根据委托书载明的证券名称、买卖数量、出价方式、价格幅度等，按照交易规则代理买卖证券，如实进行交易记录；买卖成交后，应当按照规定制作买卖成交报告单交付客户。证券交易中确认交易行为及其交易结果的对账单必须真实，保证账面证券余额与实际持有的证券相一致。"},{"n":134,"label":"第一百三十四条","chapter":"第八章 　证券公司","text":"证券公司办理经纪业务，不得接受客户的全权委托而决定证券买卖、选择证券种类、决定买卖数量或者买卖价格。证券公司不得允许他人以证券公司的名义直接参与证券的集中交易。"},{"n":135,"label":"第一百三十五条","chapter":"第八章 　证券公司","text":"证券公司不得对客户证券买卖的收益或者赔偿证券买卖的损失作出承诺。"},{"n":136,"label":"第一百三十六条","chapter":"第八章 　证券公司","text":"证券公司的从业人员在证券交易活动中，执行所属的证券公司的指
